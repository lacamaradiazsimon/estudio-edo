:root[data-theme="dark"]{--paper:#11141B;--grid:color-mix(in srgb,var(--acc-d) 9%,#11141B);--grid2:color-mix(in srgb,var(--acc-d) 17%,#11141B);--ink:#E7E9EE;--muted:#A3A9B6;--line:#2F3747;--card:#171B24;--head:#1E2431;--shadow:#0A0C11;--acc:var(--acc-d);--acc-soft:color-mix(in srgb,var(--acc-d) 16%,#171B24);--pen:var(--pen-d);--pen-soft:color-mix(in srgb,var(--pen-d) 14%,#171B24);--c2:#5BC293;--c3:#C18BE0;--c4:#9CA3AF}

html,body{height:100%}

a{color:var(--acc)}

.side .lbl{color:var(--side-muted)}

.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;color:var(--side-ink);text-decoration:none;font:500 .95rem var(--sans);border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{color:#fff;border-color:var(--side-line)}.nav.on{background:#fff;color:#111827}

main{max-width:1120px;margin:0 auto;padding:48px 56px 80px;display:flex;flex-direction:column;gap:32px}

.hdr p{margin:0;font-size:1.05rem;color:var(--muted);max-width:820px}
/* hoja: tarjeta con barra superior */
.sheet{background:var(--card);border:1px solid var(--ink)}
.sheet>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ink);background:var(--head)}
.sheet>.sh h3{margin:0;font:600 1.15rem var(--serif)}
.sheet>.sb{padding:18px 22px}

.dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border:1.5px solid var(--acc)}.dots i.f{background:var(--acc)}

.mx{overflow-x:auto;overflow-y:hidden}
p{margin:.4em 0}ul,ol{margin:.35em 0;padding-left:1.3em}li{margin:.2em 0}

.chap{display:block;padding-right:270px}

.nota .lbl{display:block;margin-bottom:4px}
.lapiz{float:right;clear:right;width:240px;margin:0 -275px 12px 0;transform:rotate(-2.5deg)}
.h3{margin:0 0 8px;font:600 1.5rem/1.25 var(--serif)}
.defi{background:var(--card);border:1px solid var(--ink);padding:16px 20px}
.defi .nm{font-family:var(--serif);font-style:italic;font-size:1.05em}
.formula{background:var(--card);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:14px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.formula .num{font:.9rem var(--mono);color:var(--muted)}
.ans{border:2px solid var(--acc);background:var(--card);padding:12px 16px;font-weight:500;overflow-x:auto}
.step{padding:6px 0 6px 14px;border-left:2px solid var(--line);margin:8px 0}.step b.t{font:600 .78rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);display:block}
.qed{text-align:right;font-size:1.2rem}

.code{background:#161A22;color:#E6E8EC;font:.9rem/1.55 var(--mono);padding:16px 18px;overflow-x:auto;white-space:pre;margin:0}
.code+.out{border:1px solid var(--ink);border-top:0;font:.85rem var(--mono);padding:10px 16px;white-space:pre;overflow-x:auto;background:var(--card)}
.gadget .sb{padding:22px}
.g-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}.g-row label{min-width:130px;font-size:.9rem}

.g-out{margin:10px 0;font-size:.95rem}

canvas{max-width:100%;display:block}

td{padding:9px 12px;border-bottom:1px dashed var(--line);vertical-align:top}
.btn{border:1px solid var(--ink);background:var(--card);color:var(--ink);font:500 .92rem var(--sans);min-height:44px;padding:0 18px;cursor:pointer}
.btn:hover{background:var(--head)}.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.hide{display:none!important}
/* autoevaluación */
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font:.85rem var(--mono)}
.opt .tx{flex:1}.opt .tg{font-family:var(--hand);font-size:1.3rem;color:var(--pen)}
.opt.ok{border:2px solid var(--acc)}.opt.ok .bub{background:var(--acc);border-color:var(--acc);color:var(--card)}.opt.ok .tg{color:var(--acc)}
.opt.bad{border:2px solid var(--pen)}.opt.bad .bub{border-color:var(--pen);color:var(--pen)}
.big{font:400 3.6rem/1 var(--serif)}.big small{color:var(--muted);font-size:.6em}
.hbar{height:12px;border:1px solid var(--ink);background:var(--card)}.hbar i{display:block;height:100%;background:var(--acc);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px)}
.freq{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr) 30px;gap:14px;align-items:center;font-size:.9rem;margin:6px 0}

.exam{background:var(--card);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}
.exam .rot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;border-bottom:1px solid var(--ink)}
.exam .rot>div{padding:10px 18px;display:flex;flex-direction:column;gap:2px;font:.88rem var(--mono)}
.exam .rot>div+div{border-left:1px solid var(--ink)}.exam .rot .of{background:var(--acc-soft);color:var(--acc)}.exam .rot .pr{background:var(--pen-soft);color:var(--pen)}
.exam .en{padding:22px 26px 6px;font:1.18rem/1.6 var(--serif)}
.tabs{display:flex;border-bottom:1px solid var(--ink);margin:14px 26px 0;overflow-x:auto}
.tab{min-height:44px;padding:0 18px;font:500 .85rem var(--mono);cursor:pointer;margin-bottom:-1px;border:1px solid transparent;background:none;color:var(--muted);white-space:nowrap}
.tab.on{border-color:var(--ink);border-bottom-color:var(--card);background:var(--card);color:var(--ink)}
.pane{padding:18px 26px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 26px 18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}

@media (max-width:1100px){.chap{padding-right:0}.nota,.lapiz{float:none;width:auto;margin:0 0 16px}.lapiz{transform:none}}
@media (max-width:900px){
.app{display:block}

body.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--side);color:#fff}
.mtop button{background:none;border:1px solid var(--side-line);color:#fff;min-height:42px;padding:0 12px;font:500 .85rem var(--sans)}
.mtop b{font:600 1rem var(--serif);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:26px 16px 70px;gap:24px}
.grid2{grid-template-columns:minmax(0,1fr)}
.exam .rot{grid-template-columns:1fr 1fr}.exam .rot>div:first-child{grid-column:span 2;border-bottom:1px solid var(--ink)}.exam .rot>div:nth-child(2){border-left:0}
.exam .en,.pane{padding-left:16px;padding-right:16px}.tabs{margin:14px 16px 0}.foot{padding:8px 16px 16px}
.big{font-size:2.8rem}.freq{grid-template-columns:minmax(0,1fr) 90px 26px}
}
@media print{.side,.mtop,.btn,.chip,.subnav,.tabs{display:none!important}body{background:#fff!important}.chap{padding-right:0}.sheet,.exam{break-inside:avoid;box-shadow:none}}

<script>
const DATA = {"meta": {"ramo": "Ecuaciones Diferenciales (MAT-208)", "evaluacion": "Prueba 2", "carrera": "Ingeniería · UAI", "semestre": "2026-2", "contenidos": "EDO lineales de orden superior, masa-resorte, sistemas y series (+ Laplace como complemento)", "fuentes": ["Clases 10 a 18", "Guías 3, 4 y 5", "Ayudantías 8 y 9", "3 pautas de Prueba 2 (2 jun 2026, 5 jun y una sin fecha)", "5 pautas de Control 2 (2025-2 y 2026-1)"], "estilo": {"preset": "matematica", "papel": "cuadriculado", "unidad": "Capítulo"}}, "resumen": [{"tema": "t1", "ideas": ["**E. y U.:** coeficientes continuos y $a_n(x)\\neq0$ en $I$ ⇒ el PVI con $n$ condiciones en $x_0$ tiene solución única.", "**Conjunto fundamental** = $n$ soluciones con $W\\neq0$. Entonces $y_h=c_1y_1+\\cdots+c_ny_n$.", "**No homogénea:** $y=y_h+y_p$; si $g$ es suma, suma las $y_p$ de cada parte.", "**Definición de li con puntos:** evalúa la combinación nula en puntos que maten términos ($x=1$ para $\\ln x$, $x=0$ para potencias)."], "formulas": [{"tex": "a_n(x)y^{(n)}+a_{n-1}(x)y^{(n-1)}+\\cdots+a_1(x)y'+a_0(x)y=g(x)", "nota": "Homogénea si $g\\equiv0$. En notación de operador: $L(y)=g(x)$, con $L=a_nD^n+\\cdots+a_1D+a_0$."}, {"tex": "a_i,\\ g\\ \\text{continuas en } I,\\ \\ a_n(x)\\neq0\\ \\forall x\\in I\\ \\Rightarrow\\ \\exists!\\ y \\text{ con } y(x_0)=y_0,\\dots,y^{(n-1)}(x_0)=y_{n-1}", "nota": "Teorema de existencia y unicidad (PVI)."}, {"tex": "L(y_1)=\\cdots=L(y_k)=0\\ \\Rightarrow\\ L\\Big(\\sum_{i=1}^k\\alpha_iy_i\\Big)=0", "nota": "Principio de superposición (homogéneas)."}, {"tex": "W[y_1,\\dots,y_n](x)=\\det\\begin{bmatrix}y_1&\\cdots&y_n\\\\ y_1'&\\cdots&y_n'\\\\ \\vdots&&\\vdots\\\\ y_1^{(n-1)}&\\cdots&y_n^{(n-1)}\\end{bmatrix},\\qquad W[y_1,y_2]=y_1y_2'-y_2y_1'", "nota": "Wronskiano."}, {"tex": "\\{y_1,\\dots,y_n\\}\\ \\text{soluciones LI}\\iff W[y_1,\\dots,y_n](x)\\neq0\\ \\text{en } I", "nota": "Si se cumple: **conjunto fundamental** y la solución general es $y=c_1y_1+\\cdots+c_ny_n$."}, {"tex": "y=y_h+y_p,\\qquad L(y_{p_i})=g_i\\ \\Rightarrow\\ L\\big(y_{p_1}+\\cdots+y_{p_k}\\big)=g_1+\\cdots+g_k", "nota": "No homogénea: solución general y superposición para el lado derecho."}], "ojo": ["$W=0$ en un punto no basta para decir LD si las funciones no son soluciones de la misma EDO.", "Las constantes del PVI se calculan con $y_h+y_p$, nunca solo con $y_h$."]}, {"tema": "t2", "ideas": ["**Normaliza siempre** y lee $a_1$ con su signo.", "**Abel:** $W=c\\,e^{-\\int a_1dx}$; $y_2=y_1\\int \\dfrac{e^{-\\int a_1dx}}{y_1^2}dx$.", "Simplifica $e^{\\pm k\\ln x}=x^{\\pm k}$ antes de integrar; las constantes de integración no hacen falta.", "Si no dan $y_1$, prueba $e^{mx}$ o $x^m$ y fuerza que la identidad valga para todo $x$."], "formulas": [{"tex": "W[y_1,\\dots,y_n](x)=c\\,e^{-\\int a_{n-1}(x)\\,dx}", "nota": "Abel para el Wronskiano (coeficiente de $y^{(n-1)}$ en la forma normalizada)."}, {"tex": "y_2(x)=y_1(x)\\int\\frac{e^{-\\int a_1(x)\\,dx}}{\\big(y_1(x)\\big)^2}\\,dx", "nota": "Segunda solución LI a partir de $y_1$. ⚠️ Primero dividir por el coeficiente de $y''$."}], "ojo": ["Olvidar dividir por $a_2(x)$ antes de leer $P(x)$: es el error que más puntos cuesta.", "El signo: es $e^{-\\int P}$. Con $P=-\\frac{x}{x-1}$ queda $e^{+x}(x-1)$."]}, {"tema": "t3", "ideas": ["Cambia $y^{(k)}\\to m^k$ para la **ecuación auxiliar**; sus raíces deciden todo.", "**Distintas:** $e^{m_1x},e^{m_2x}$ · **Doble:** $e^{mx},xe^{mx}$ · **Complejas:** $e^{\\alpha x}\\cos\\beta x,\\ e^{\\alpha x}\\operatorname{sen}\\beta x$.", "Multiplicidad $k$ → multiplica por $1,x,\\dots,x^{k-1}$. Número de funciones = orden.", "En un PVI, deriva la solución general **antes** de evaluar en $x_0$."], "formulas": [{"tex": "a_nm^n+a_{n-1}m^{n-1}+\\cdots+a_1m+a_0=0", "nota": "Ecuación auxiliar (característica)."}, {"tex": "\\begin{array}{l|l} \\text{raíces} & y_h\\\\ \\hline m_1\\neq m_2\\ \\text{reales} & c_1e^{m_1x}+c_2e^{m_2x}\\\\ m_1=m_2=m & c_1e^{mx}+c_2\\,x\\,e^{mx}\\\\ \\alpha\\pm\\beta i & e^{\\alpha x}\\big(c_1\\cos\\beta x+c_2\\operatorname{sen}\\beta x\\big)\\end{array}", "nota": "Caso $n=2$."}, {"tex": "m \\text{ de multiplicidad } k:\\ \\ e^{mx},\\,xe^{mx},\\,\\dots,\\,x^{k-1}e^{mx}", "nota": "Orden $n\\gt2$. Si $m=\\alpha\\pm\\beta i$ tiene multiplicidad $k$: $x^je^{\\alpha x}\\cos\\beta x,\\ x^je^{\\alpha x}\\operatorname{sen}\\beta x$, $j=0,\\dots,k-1$."}], "ojo": ["Raíz $\\pm 2i$ da $\\cos 2x,\\ \\operatorname{sen} 2x$ (sin exponencial, porque $\\alpha=0$).", "En orden 3 factoriza por agrupación: $r^2(r-3)+4(r-3)$."]}, {"tema": "t4", "ideas": ["Propuesta = misma familia que $h$, con **todos** los términos (polinomio completo; seno **y** coseno).", "**Duplicidad:** si choca con $y_h$, multiplica por $x^s$ ($s$ = multiplicidad de $k+i\\beta$).", "Lado derecho con varios tipos → una propuesta por sumando (superposición).", "Las rúbricas puntúan: homogénea · **forma de $y_p$** · constantes · solución general. Escribe la forma aunque no termines.", "**Normaliza** y usa el $h$ normalizado.", "$c_1'=-\\dfrac{y_2h}{W}$, $c_2'=\\dfrac{y_1h}{W}$; integra sin constantes; $y_p=c_1y_1+c_2y_2$.", "Úsalo cuando $h$ sea $\\tan$, $\\sec$, $\\ln$, potencias negativas, o la EDO tenga coeficientes variables."], "formulas": [{"tex": "\\begin{array}{l|l} h(x) & y_p \\text{ propuesta}\\\\ \\hline x^m & A_mx^m+\\cdots+A_1x+A_0\\\\ x^me^{kx} & e^{kx}(A_mx^m+\\cdots+A_0)\\\\ e^{kx}x^m\\cos\\beta x\\ \\text{o}\\ \\operatorname{sen}\\beta x & e^{kx}\\big[(A_mx^m+\\cdots+A_0)\\cos\\beta x+(B_mx^m+\\cdots+B_0)\\operatorname{sen}\\beta x\\big]\\end{array}", "nota": "Tabla de la Clase 12."}, {"tex": "y_p\\ \\longrightarrow\\ x^s\\,y_p,\\qquad s=\\text{multiplicidad de } k+i\\beta \\text{ como raíz de la ec. auxiliar}", "nota": "Regla de duplicidad usada en todas las pautas: si un término de $y_p$ ya está en $y_h$, multiplica por $x$ (o $x^2$…)."}, {"tex": "\\begin{cases}c_1'y_1+c_2'y_2=0\\\\ c_1'y_1'+c_2'y_2'=h(x)\\end{cases}\\Rightarrow\\ c_1'=\\frac{-y_2\\,h}{W[y_1,y_2]},\\quad c_2'=\\frac{y_1\\,h}{W[y_1,y_2]}", "nota": "$y_p=c_1(x)y_1+c_2(x)y_2$. Orden $n$: $c_k=\\int \\dfrac{V_k\\,h}{W}\\,dx$, con $V_k$ = $W$ con la columna $k$ cambiada por $(0,\\dots,0,1)^T$."}], "ojo": ["Proponer $Ae^{3x}$ cuando $e^{3x}$ ya está en $y_h$: al reemplazar da $0=1$.", "En VP usar $f$ sin dividir por el coeficiente de $y''$."]}, {"tema": "t5", "ideas": ["**Indicial:** $am^2+(b-a)m+c=0$. Raíces → $x^{m}$, $x^m\\ln x$, $x^\\alpha\\cos(\\beta\\ln x)$, $x^\\alpha\\operatorname{sen}(\\beta\\ln x)$.", "**$x=e^t$** la transforma en $aY''+(b-a)Y'+cY=g(e^t)$.", "No homogénea: **normaliza** (divide por $ax^2$) y aplica variación de parámetros.", "\"Existe solución $x^{m_0}\\ln x$\" ⇔ $m_0$ es raíz **doble** de la indicial."], "formulas": [{"tex": "y=x^m\\ \\Rightarrow\\ am^2+(b-a)m+c=0", "nota": "Ecuación indicial (¡no es $am^2+bm+c$!)."}, {"tex": "\\begin{array}{l|l} m_1\\neq m_2 \\text{ reales} & c_1x^{m_1}+c_2x^{m_2}\\\\ m_1=m_2=m & c_1x^m+c_2x^m\\ln x\\\\ \\alpha\\pm\\beta i & x^{\\alpha}\\big(c_1\\cos(\\beta\\ln x)+c_2\\operatorname{sen}(\\beta\\ln x)\\big)\\end{array}", "nota": "Alternativa: $x=e^t$ la transforma en coeficientes constantes: $aY''+(b-a)Y'+cY=g(e^t)$."}], "ojo": ["Escribir $m^2+bm+c$ (olvidar el $-a$): cambia todas las raíces.", "Raíz compleja da $\\cos(\\beta\\ln x)$, no $\\cos(\\beta x)$."]}, {"tema": "t6", "ideas": ["**Modelo:** $mx''+cx'+kx=f(t)$, $x$ desde el equilibrio, **abajo positivo**; $k=mg/s$, $m=W/32$.", "**Libre:** $w=\\sqrt{k/m}$, $T=2\\pi/w$, $A=\\sqrt{c_1^2+c_2^2}$, $x=A\\operatorname{sen}(wt+\\phi)$ (cuidado con el cuadrante).", "**Amortiguado:** $c^2\\gt4mk$ sobre · $=$ crítico · $\\lt$ sub. $\\alpha=c/2m$.", "**Forzado resonante:** frecuencia externa = $w$ y $c=0$ → $t\\operatorname{sen}wt$."], "formulas": [{"tex": "F=ks,\\quad W=mg=ks,\\quad g=32\\ \\tfrac{\\text{pie}}{\\text{s}^2}=9.8\\ \\tfrac{\\text{m}}{\\text{s}^2}", "nota": "Ley de Hooke y equilibrio: $k=\\dfrac{mg}{s}$. Peso en libras $\\Rightarrow m=W/32$ slug."}, {"tex": "x''+w^2x=0,\\ \\ w^2=\\frac km\\ \\Rightarrow\\ x=c_1\\cos wt+c_2\\operatorname{sen}wt=A\\operatorname{sen}(wt+\\phi)", "nota": "$A=\\sqrt{c_1^2+c_2^2}$, $T=\\dfrac{2\\pi}{w}$, $f=\\dfrac{w}{2\\pi}$, $\\operatorname{sen}\\phi=\\dfrac{c_1}{A},\\ \\cos\\phi=\\dfrac{c_2}{A}$ ($\\tan\\phi=c_1/c_2$, cuidar el cuadrante)."}, {"tex": "mx''+cx'+kx=0,\\quad \\lambda=-\\alpha\\pm\\beta,\\quad \\alpha=\\frac{c}{2m},\\ \\beta=\\frac{\\sqrt{c^2-4mk}}{2m}", "nota": "$c^2\\gt4mk$: sobreamortiguado · $c^2=4mk$: crítico $(c_1+c_2t)e^{-\\alpha t}$ · $c^2\\lt4mk$: subamortiguado $e^{-\\alpha t}(c_1\\cos\\omega^*t+c_2\\operatorname{sen}\\omega^*t)$, $\\omega^*=\\frac{\\sqrt{4mk-c^2}}{2m}$."}, {"tex": "mx''+cx'+kx=f(t),\\qquad c=0,\\ f=F_0\\cos wt\\ \\Rightarrow\\ x_p=\\frac{F_0}{2mw}\\,t\\operatorname{sen}wt", "nota": "Movimiento forzado; resonancia pura cuando la frecuencia externa coincide con $w$."}], "ojo": ["“1 pie sobre el equilibrio” con abajo positivo es $x(0)=-1$; “hacia arriba” es velocidad negativa.", "“Se libera desde el reposo” significa $x'(0)=0$."]}, {"tema": "t7", "ideas": ["**Eliminación:** usa $D$, llega a una EDO de orden 2 y obtén la otra variable **despejando** (evita constantes extra).", "**Valores propios:** $\\det(A-\\lambda I)=0$, $(A-\\lambda I)v=0$, $X=\\sum c_iv_ie^{\\lambda_it}$.", "**Complejos** $p\\pm qi$, $v=a+ib$: $e^{pt}(a\\cos qt-b\\operatorname{sen}qt)$ y $e^{pt}(a\\operatorname{sen}qt+b\\cos qt)$.", "**Defectuosa:** $(A-\\lambda I)w=v$ y $X_2=(tv+w)e^{\\lambda t}$."], "formulas": [{"tex": "(D-a)x-by=f(t),\\ \\ -cx+(D-d)y=g(t)\\ \\Rightarrow\\ (D^2+pD+q)y=h(t)", "nota": "Eliminación con $D=\\frac{d}{dt}$."}, {"tex": "\\det(A-\\lambda I)=0,\\quad (A-\\lambda I)v=0,\\quad X=ve^{\\lambda t}", "nota": "Reales distintos: $X=c_1v_1e^{\\lambda_1t}+\\cdots+c_nv_ne^{\\lambda_nt}$."}, {"tex": "\\lambda=p+qi,\\ v=a+ib:\\ \\ X_1=e^{pt}(a\\cos qt-b\\operatorname{sen}qt),\\ \\ X_2=e^{pt}(a\\operatorname{sen}qt+b\\cos qt)", "nota": "Complejos: basta un valor propio del par."}, {"tex": "(A-\\lambda I)v=0,\\ (A-\\lambda I)w=v:\\ \\ X_1=ve^{\\lambda t},\\ \\ X_2=(tv+w)e^{\\lambda t}", "nota": "Repetido sin suficientes vectores propios (matriz defectuosa)."}], "ojo": ["Después de eliminar, relaciona las constantes o despeja la segunda función de una ecuación del sistema.", "Con $\\lambda=p\\pm qi$ basta un vector propio: parte real e imaginaria de $ve^{\\lambda t}$."]}, {"tema": "t8", "ideas": ["**Clasifica** con la forma normal: ordinario ($P,Q$ analíticas) · singular regular ($(x-x_0)P,\\ (x-x_0)^2Q$ analíticas) · irregular.", "**Ordinario:** $y=\\sum a_nx^n$, corre índices, separa términos sueltos, recurrencia. $R\\ge$ distancia al singular más cercano (¡complejos!).", "**Indicial:** $r(r-1)+p_0r+q_0=0$. Diferencia no entera → dos series; igual o entera → posible $\\ln x$.", "Rúbrica: forma de la serie · corrimiento · recurrencia · términos pedidos."], "formulas": [{"tex": "x_0 \\text{ ordinario} \\iff P,Q \\text{ analíticas en } x_0\\ \\Rightarrow\\ y=\\sum_{n\\ge0}a_n(x-x_0)^n,\\ \\ R\\ge \\text{dist. al singular más cercano}", "nota": "Dos soluciones LI; el singular puede ser complejo."}, {"tex": "x_0 \\text{ singular regular} \\iff (x-x_0)P,\\ (x-x_0)^2Q \\text{ analíticas en } x_0", "nota": "Si no, es singular irregular."}, {"tex": "r(r-1)+p_0r+q_0=0,\\quad p_0=\\lim_{x\\to x_0}(x-x_0)P,\\ \\ q_0=\\lim_{x\\to x_0}(x-x_0)^2Q", "nota": "Ecuación indicial. Frobenius: $y=\\sum a_n(x-x_0)^{n+r}$, $a_0\\neq0$."}, {"tex": "\\begin{array}{l|l} r_1-r_2\\notin\\mathbb Z & y_1=\\sum a_nx^{n+r_1},\\ \\ y_2=\\sum b_nx^{n+r_2}\\\\ r_1-r_2\\in\\mathbb N & y_2=C\\,y_1\\ln x+\\sum b_nx^{n+r_2}\\ (C \\text{ puede ser } 0)\\\\ r_1=r_2 & y_2=y_1\\ln x+\\sum b_nx^{n+r_1}\\end{array}", "nota": "Los tres casos de Frobenius ($r_1\\ge r_2$, $x\\gt0$)."}], "ojo": ["El radio mínimo llega hasta el singular más cercano, **incluidos los complejos**.", "Los términos sueltos al correr índices dan condiciones como $a_2=0$."]}, {"tema": "t9", "ideas": ["Definición con límite; tabla + linealidad + traslaciones cubren casi todo.", "PVI: transforma derivadas con $sY-y(0)$ y $s^2Y-sy(0)-y'(0)$, despeja, fracciones parciales, invierte.", "Lados derechos por tramos → escalón $\\mathscr U(t-a)$ y $e^{-as}F(s)$."], "formulas": [{"tex": "\\mathcal L\\{f\\}(s)=\\int_0^{\\infty}e^{-st}f(t)\\,dt", "nota": "Tabla: $t^n\\mapsto \\frac{n!}{s^{n+1}}$, $e^{at}\\mapsto\\frac1{s-a}$, $\\cos at\\mapsto\\frac{s}{s^2+a^2}$, $\\operatorname{sen}at\\mapsto\\frac{a}{s^2+a^2}$."}, {"tex": "\\mathcal L\\{y'\\}=sY-y(0),\\ \\ \\mathcal L\\{y''\\}=s^2Y-sy(0)-y'(0),\\ \\ \\mathcal L\\{e^{at}f\\}=F(s-a),\\ \\ \\mathcal L\\{f(t-a)\\mathscr U(t-a)\\}=e^{-as}F(s)", "nota": "Más: $\\mathcal L\\{f*g\\}=FG$, $\\mathcal L\\{tf\\}=-F'(s)$, $\\mathcal L\\{\\int_0^tf\\}=F/s$."}], "ojo": ["$\\mathcal L\\{y''\\}=s^2Y-sy(0)-y'(0)$: no olvides las condiciones iniciales.", "$\\mathcal L^{-1}\\{e^{-as}F(s)\\}=f(t-a)\\,\\mathscr U(t-a)$."]}], "temas": [{"id": "t1", "titulo": "Teoría de las EDO lineales", "peso": 1, "intro": "Es la base teórica de la prueba: dice cuándo un PVI tiene solución única, cuántas soluciones necesitas y cómo se arma la solución de una no homogénea. Casi nunca es una pregunta completa, pero justifica todas las demás.", "bloques": [{"tipo": "texto", "titulo": "Qué es una EDO lineal de orden n", "md": "Hasta ahora resolvíamos EDO de primer orden. Ahora pasamos a ecuaciones de **orden n**, pero solo **lineales**: la incógnita $y$ y sus derivadas aparecen a la primera potencia y multiplicadas por funciones de $x$. Esa linealidad es la que permite construir todas las soluciones a partir de unas pocas."}, {"tipo": "formula", "tex": "a_n(x)\\frac{d^ny}{dx^n}+a_{n-1}(x)\\frac{d^{n-1}y}{dx^{n-1}}+\\cdots+a_1(x)\\frac{dy}{dx}+a_0(x)y=g(x)\\qquad(1)", "nota": "$a_i,g:I\\subset\\mathbb R\\to\\mathbb R$ continuas. Si $g(x)=0$ la EDO es **homogénea**."}, {"tipo": "texto", "titulo": "Operador diferencial", "md": "Con $D^i=\\dfrac{d^i}{dx^i}$ se define $L=a_n(x)D^n+\\cdots+a_1(x)D+a_0(x)$, una transformación lineal $L:C^n(I)\\to C(I)$. Así (1) se escribe $L(y)=g(x)$ y su homogénea asociada es $L(y)=0$. Que $L$ sea lineal significa $L(\\alpha u+\\beta v)=\\alpha L(u)+\\beta L(v)$: de ahí salen todos los resultados de este módulo."}, {"tipo": "texto", "titulo": "Teorema de existencia y unicidad", "md": "Sean $a_n,\\dots,a_0$ y $g$ continuas en un intervalo $I$ con $a_n(x)\\neq0$ para todo $x\\in I$, y $x_0\\in I$. Entonces el PVI"}, {"tipo": "formula", "tex": "L(y)=g(x),\\qquad y(x_0)=y_0,\\ y'(x_0)=y_1,\\ \\dots,\\ y^{(n-1)}(x_0)=y_{n-1}", "nota": "tiene **una única** solución en $I$. Para orden $n$ se necesitan exactamente $n$ condiciones, todas en el mismo punto $x_0$."}, {"tipo": "texto", "md": "Las dos hipótesis se chequean siempre: coeficientes continuos **y** $a_n(x)\\neq0$. Si $a_n$ se anula (por ejemplo $x^2y''+\\dots$ en $x=0$), el teorema no garantiza nada en un intervalo que contenga ese punto. Consecuencia útil: $3y'''+5y''-y'+7y=0$ con $y(1)=y'(1)=y''(1)=0$ tiene como **única** solución $y\\equiv0$ (la trivial cumple, y es la única)."}, {"tipo": "gadget", "id": "g_intervalo", "titulo": "¿En qué intervalo vale el teorema?", "instrucciones": "Elige una ecuación y mueve $x_0$. Las líneas punteadas son los puntos donde $a_n(x)=0$ (o donde $g$ no es continua). El intervalo sombreado es el mayor $I$ que contiene a $x_0$ donde el teorema garantiza solución única."}, {"tipo": "texto", "titulo": "Principio de superposición", "md": "Si $y_1,\\dots,y_k$ son soluciones de $L(y)=0$, entonces cualquier combinación lineal $\\alpha_1y_1+\\cdots+\\alpha_ky_k$ también lo es, porque $L(\\sum\\alpha_iy_i)=\\sum\\alpha_iL(y_i)=0$. Ejemplo de clase: $e^x$ y $e^{-x}$ resuelven $y''-y=0$, luego $c_1e^x+c_2e^{-x}$ también."}, {"tipo": "texto", "titulo": "Dependencia lineal", "md": "$u_1,\\dots,u_n$ son **linealmente dependientes (ld)** en $I$ si existen constantes **no todas nulas** con"}, {"tipo": "formula", "tex": "c_1u_1(x)+c_2u_2(x)+\\cdots+c_nu_n(x)=0\\quad\\forall x\\in I\\qquad(2)", "nota": "Son **linealmente independientes (li)** si (2) solo se cumple con $c_1=\\cdots=c_n=0$. Para dos funciones: ld $\\iff$ una es múltiplo constante de la otra."}, {"tipo": "texto", "md": "Probar independencia con la definición obliga a razonar \"para todo $x$\". Un truco de la ayudantía: como (2) vale en **todo** $x$, puedes evaluar en puntos convenientes y obtener un sistema para las $c_i$. El **Wronskiano** automatiza esto derivando (2) $n-1$ veces:"}, {"tipo": "formula", "tex": "W[u_1,\\dots,u_n](x)=\\det\\begin{bmatrix}u_1&u_2&\\cdots&u_n\\\\u_1'&u_2'&\\cdots&u_n'\\\\\\vdots&\\vdots&\\ddots&\\vdots\\\\u_1^{(n-1)}&u_2^{(n-1)}&\\cdots&u_n^{(n-1)}\\end{bmatrix}", "nota": "Para dos funciones: $W[y_1,y_2](x)=y_1y_2'-y_2y_1'$."}, {"tipo": "texto", "titulo": "Criterio para soluciones", "md": "Sean $y_1,\\dots,y_n$ soluciones de la homogénea $L(y)=0$ en $I$. Entonces $\\{y_1,\\dots,y_n\\}$ es li en $I$ **si y solo si** $W[y_1,\\dots,y_n](x)\\neq0$ en $I$. En ese caso es un **conjunto fundamental de soluciones** y la solución general de la homogénea es"}, {"tipo": "formula", "tex": "y_h(x)=c_1y_1(x)+c_2y_2(x)+\\cdots+c_ny_n(x),\\qquad c_i\\in\\mathbb R", "nota": "Una EDO lineal homogénea de orden $n$ tiene exactamente $n$ soluciones li: ni más ni menos."}, {"tipo": "nota", "md": "Para **soluciones** de una misma EDO (con coeficientes continuos y $a_n\\neq0$) el Wronskiano es o **siempre** cero o **nunca** cero en $I$ (lo verás con la fórmula de Abel). Para funciones cualesquiera eso falla: $x^2$ y $x|x|$ tienen $W\\equiv0$ y aun así son li en $\\mathbb R$. Revísalo en el widget."}, {"tipo": "lapiz", "texto": "W ≠ 0 → LI → conjunto fundamental"}, {"tipo": "gadget", "id": "g_wronskiano", "titulo": "Calculadora de wronskianos", "instrucciones": "Elige un par de funciones. Verás $y_1$, $y_2$ y el gráfico de $W(x)$. Si $W$ nunca se anula en el intervalo, el par sirve como conjunto fundamental.", "figura": "Curva morada: $W(x)$. Las otras dos: $y_1$ y $y_2$."}, {"tipo": "texto", "titulo": "Ecuaciones no homogéneas", "md": "Si $y_p$ es **una** solución particular de $L(y)=g$, la solución general es $y=y_h+y_p$: la diferencia de dos soluciones de $L(y)=g$ resuelve $L(y)=0$. Y si el lado derecho es una suma, se resuelve por partes (**superposición no homogénea**):"}, {"tipo": "formula", "tex": "L(y_{p_i})=g_i(x),\\ i=1,\\dots,k\\ \\ \\Rightarrow\\ \\ L\\big(y_{p_1}+\\cdots+y_{p_k}\\big)=g_1(x)+\\cdots+g_k(x)", "nota": "Así lo hacen las pautas: para $e^{2x}+12x$ se busca una $y_p$ para $e^{2x}$ y otra para $12x$, y se suman."}, {"tipo": "ejemplo", "titulo": "Conjunto fundamental de $y''-y=0$", "enunciado": "Ejemplo de la Clase 10: con $y_1=e^x$ e $y_2=e^{-x}$ armar la solución general justificando cada paso.", "pasos": [{"titulo": "Verifica que $y_1=e^x$ e $y_2=e^{-x}$ son soluciones.", "md": "$$(e^{x})''-e^{x}=0,\\qquad (e^{-x})''-e^{-x}=e^{-x}-e^{-x}=0$$\nAmbas cumplen la EDO."}, {"titulo": "Calcula el Wronskiano $W[e^x,e^{-x}](x)$.", "md": "$$W=e^{x}(-e^{-x})-e^{-x}e^{x}=-2$$\nEs una constante distinta de cero."}, {"titulo": "¿Qué concluyes sobre la independencia y la solución general?", "md": "$$W=-2\\neq0\\ \\Rightarrow\\ \\{e^x,e^{-x}\\}\\ \\text{fundamental},\\quad y=c_1e^x+c_2e^{-x}$$\nDos soluciones li de una EDO de orden 2 bastan para generar todas."}]}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "Demuestre con la **definición** que $y_1=x$ e $y_2=x\\ln x$ son li en $(0,\\infty)$, eligiendo puntos convenientes.", "pasos": [{"titulo": "Plantea la combinación lineal nula.", "md": "$$c_1x+c_2x\\ln x=0\\quad\\forall x\\gt0$$"}, {"titulo": "Evalúa en un punto que anule el logaritmo.", "md": "$$x=1:\\ c_1\\cdot1+c_2\\cdot0=0\\ \\Rightarrow\\ c_1=0$$"}, {"titulo": "Evalúa en otro punto para obtener $c_2$.", "md": "$$x=e:\\ c_2\\,e\\ln e=c_2e=0\\ \\Rightarrow\\ c_2=0$$\nLa única combinación nula es la trivial."}], "respuesta": "$$c_1=c_2=0\\ \\Rightarrow\\ \\{x,\\ x\\ln x\\}\\ \\text{es li en }(0,\\infty)$$"}, {"tipo": "ejemplo", "titulo": "Guía 3, n°12", "enunciado": "¿Es $\\{1,\\cos 2x,\\cos^2x\\}$ linealmente independiente en $\\mathbb R$?", "pasos": [{"titulo": "Busca una identidad que relacione las tres funciones.", "md": "$$\\cos^2x=\\frac{1+\\cos2x}{2}$$"}, {"titulo": "Escribe una combinación nula con constantes no todas cero.", "md": "$$1\\cdot1+1\\cdot\\cos2x-2\\cos^2x=0\\quad\\forall x$$"}], "respuesta": "$$\\text{No: es linealmente dependiente } (c_1,c_2,c_3)=(1,1,-2)$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "Sean $y_1=x^n$ ($n\\in\\mathbb N,\\ n\\ge2$) e $y_2=e^{ax}$ ($a\\neq0$). (a) Calcule $W[y_1,y_2]$. (b) ¿Dónde se anula? (c) Explique por qué no existe $y''+P(x)y'+Q(x)y=0$ con $P,Q$ continuas en $\\mathbb R$ que tenga a $\\{y_1,y_2\\}$ como conjunto fundamental.", "pasos": [{"titulo": "Calcula el Wronskiano.", "md": "$$W=x^n\\cdot ae^{ax}-e^{ax}\\cdot nx^{n-1}=x^{n-1}e^{ax}(ax-n)$$"}, {"titulo": "Encuentra los ceros.", "md": "$$W=0\\iff x=0\\ \\ \\text{o}\\ \\ x=\\frac{n}{a}$$"}, {"titulo": "Usa Abel: ¿cómo debería comportarse $W$ si fueran soluciones fundamentales de una EDO con $P$ continua en $\\mathbb R$?", "md": "$$W=c\\,e^{-\\int P\\,dx}:\\ \\ c=0\\Rightarrow W\\equiv0,\\quad c\\neq0\\Rightarrow W(x)\\neq0\\ \\forall x$$\nNuestro $W$ se anula en puntos aislados sin ser idénticamente nulo: contradicción."}], "respuesta": "$$W=x^{n-1}e^{ax}(ax-n)\\ \\text{se anula solo en } x=0,\\ x=n/a\\ \\Rightarrow\\ \\text{imposible por Abel y E. y U.}$$"}, {"tipo": "ojo", "items": ["Decir \"$W(0)=0$, entonces son LD\" con funciones que **no** son soluciones de una misma EDO regular: $x$ y $x^2$ tienen $W=x^2$, que se anula en 0, y aun así son LI.", "Aplicar el teorema en un punto donde $a_n(x_0)=0$: ahí no garantiza nada.", "Calcular $c_1, c_2$ del PVI con $y_h$ en vez de $y_h+y_p$.", "Contar mal: una EDO de orden $n$ necesita exactamente $n$ funciones LI en $y_h$."]}]}, {"id": "t2", "titulo": "Reducción de orden y fórmula de Abel", "peso": 2, "intro": "Cuando te dan una solución $y_1$ (o te piden mostrar que algo es solución), la segunda sale con la fórmula de Abel. Fue pregunta completa en el Control 2 y explica de dónde salen $xe^{mx}$ y $x^m\\ln x$.", "bloques": [{"tipo": "texto", "titulo": "La idea", "md": "Para coeficientes variables no hay un método general para hallar soluciones. Pero si **ya conoces una** solución $y_1$ (te la dan, o la adivinas con $e^{mx}$ o $x^m$), la segunda sale sola. Esa es la idea de la **reducción de orden**: proponer $y_2=u(x)\\,y_1(x)$ convierte la EDO de orden 2 en una de orden 1 para $u'$."}, {"tipo": "nota", "md": "Todo lo de este módulo usa la EDO **normalizada** $y''+a_1(x)y'+a_0(x)y=0$. Si viene como $(x-1)y''-xy'+y=0$, primero divide por $(x-1)$: $a_1=-\\dfrac{x}{x-1}$. Usar $-x$ como $a_1$ es el error más caro de este tema (la pauta da 4 de 20 puntos solo por normalizar e identificar $P(x)$)."}, {"tipo": "lapiz", "texto": "¡primero normalizar! (4 pts)"}, {"tipo": "texto", "titulo": "Fórmula de Abel para el Wronskiano", "md": "Si $\\{y_1,\\dots,y_n\\}$ es un conjunto fundamental de la EDO normalizada $y^{(n)}+a_{n-1}(x)y^{(n-1)}+\\cdots+a_0(x)y=0$, existe $c\\in\\mathbb R$ tal que"}, {"tipo": "formula", "tex": "W[y_1,\\dots,y_n](x)=c\\,e^{-\\int a_{n-1}(x)\\,dx}", "nota": "Solo depende del coeficiente que acompaña a $y^{(n-1)}$. Para orden 2: $W[y_1,y_2]=c\\,e^{-\\int a_1(x)\\,dx}$."}, {"tipo": "texto", "md": "Interpretación: puedes conocer el Wronskiano **sin conocer las soluciones**. Y como una exponencial nunca es cero, $W$ es idénticamente nulo ($c=0$) o no se anula nunca ($c\\neq0$). Esto es lo que justifica el criterio de independencia del módulo anterior."}, {"tipo": "texto", "titulo": "Segunda solución", "md": "Si $W=y_1y_2'-y_2y_1'$, entonces $\\left(\\dfrac{y_2}{y_1}\\right)'=\\dfrac{W}{y_1^2}$. Integrando y usando Abel con $c=1$ se obtiene la fórmula de la clase:"}, {"tipo": "formula", "tex": "\\boxed{\\,y_2(x)=y_1(x)\\int\\frac{e^{-\\int a_1(x)\\,dx}}{\\big(y_1(x)\\big)^2}\\,dx\\,}", "nota": "Fórmula de Abel (o Abel-Liouville) para una segunda solución li con $y_1$. Las constantes de integración se omiten: solo reescalan $y_2$ o le suman un múltiplo de $y_1$."}, {"tipo": "texto", "titulo": "Receta de prueba", "md": "(1) normalizar e identificar $a_1(x)$; (2) calcular $e^{-\\int a_1dx}$ (simplifica $e^{\\ln(\\cdot)}$); (3) dividir por $y_1^2$ e integrar; (4) multiplicar por $y_1$; (5) escribir $y=c_1y_1+c_2y_2$."}, {"tipo": "texto", "titulo": "Cómo adivinar $y_1$", "md": "Si no te la dan, el enunciado suele sugerir la forma. Clase 10: para $xy''-2(x+1)y'+(x+2)y=0$ se propone $y=e^{mx}$; al reemplazar queda $x(m-1)^2-2(m-1)=0$ para todo $x$, luego $m=1$ e $y_1=e^x$. Con Abel: $e^{-\\int a_1}=x^2e^{2x}$ y $y_2=e^x\\int x^2dx=\\tfrac{x^3}{3}e^x$."}, {"tipo": "nota", "md": "Este mismo método explica dos resultados que usarás todo el tiempo: con raíz doble $m$ en coeficientes constantes, $y_2=xe^{mx}$; y con raíz doble en Cauchy-Euler, $y_2=x^m\\ln x$. Ambos salen de aplicar la fórmula de Abel a $y_1$."}, {"tipo": "gadget", "id": "g_abel", "titulo": "Reducción de orden paso a paso", "instrucciones": "Elige un ejercicio (clases, guía y controles). Antes de apretar \"Siguiente paso\", intenta escribir tú el paso en tu hoja; después compara."}, {"tipo": "ejemplo", "titulo": "Deducción de la fórmula de reducción de orden", "enunciado": "Propón $y=u(x)y_1(x)$ en $y''+a_1y'+a_0y=0$, sabiendo que $y_1$ es solución.", "pasos": [{"titulo": "Calcula $y'$ e $y''$ para $y=uy_1$.", "md": "$$y'=u'y_1+uy_1',\\qquad y''=u''y_1+2u'y_1'+uy_1''$$"}, {"titulo": "Reemplaza y agrupa por $u''$, $u'$ y $u$.", "md": "$$u''y_1+u'(2y_1'+a_1y_1)+u\\underbrace{(y_1''+a_1y_1'+a_0y_1)}_{=0}=0$$\nDesaparece $u$: queda una EDO de primer orden en $w=u'$."}, {"titulo": "Resuelve para $w=u'$ (separable).", "md": "$$\\ln w=-2\\ln|y_1|-\\int a_1\\,dx\\ \\Rightarrow\\ w=\\frac{e^{-\\int a_1dx}}{y_1^2}$$"}, {"titulo": "Integra y concluye.", "md": "$$u=\\int\\frac{e^{-\\int a_1dx}}{y_1^2}dx\\ \\Rightarrow\\ y_2=y_1\\int\\frac{e^{-\\int a_1dx}}{y_1^2}dx$$\nAsí lo resuelve también la pauta del Control 2 ($v=u'$)."}]}, {"tipo": "ejemplo", "titulo": "Clase 10", "enunciado": "Halle la solución general de $x^2y''-xy'+y=0,\\ x\\gt0$, sabiendo que $y_1=x$.", "pasos": [{"titulo": "Normaliza y obtén $a_1$.", "md": "$$y''-\\frac1xy'+\\frac1{x^2}y=0,\\qquad a_1=-\\frac1x$$"}, {"titulo": "Calcula $e^{-\\int a_1}$ y aplica la fórmula.", "md": "$$e^{-\\int a_1}=x,\\qquad y_2=x\\int\\frac{x}{x^2}dx=x\\ln x$$"}], "respuesta": "$$y=c_1x+c_2x\\ln x$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "$(x+1)y''-(x+2)y'+y=0$ en $x\\gt-1$, con $y_1=e^x$. Use Abel-Liouville para hallar $y_2$.", "pasos": [{"titulo": "Forma estándar y $P(x)$.", "md": "$$P(x)=-\\frac{x+2}{x+1}=-\\Big(1+\\frac{1}{x+1}\\Big)$$"}, {"titulo": "$e^{-\\int P\\,dx}$.", "md": "$$-\\int P\\,dx=x+\\ln(x+1)\\ \\Rightarrow\\ e^{-\\int P}=(x+1)e^{x}$$"}, {"titulo": "Integra $\\dfrac{(x+1)e^x}{e^{2x}}$.", "md": "$$\\int(x+1)e^{-x}dx=-(x+1)e^{-x}-e^{-x}=-(x+2)e^{-x}$$"}, {"titulo": "Multiplica por $y_1$.", "md": "$$y_2=e^{x}\\cdot\\big(-(x+2)e^{-x}\\big)=-(x+2)$$\nEl signo se absorbe en la constante: $y_2=x+2$. Verifica: $0-(x+2)\\cdot1+(x+2)=0$."}], "respuesta": "$$y=c_1e^{x}+c_2(x+2)$$"}, {"tipo": "ejemplo", "titulo": "Guía 3, n°1", "enunciado": "$xy''+3y'=0$, sabiendo que $y_1=1$.", "pasos": [{"titulo": "Normaliza y calcula $e^{-\\int a_1}$.", "md": "$$a_1=\\frac3x,\\qquad e^{-\\int a_1}=x^{-3}$$"}, {"titulo": "Aplica la fórmula con $y_1=1$.", "md": "$$y_2=1\\cdot\\int x^{-3}dx=-\\frac{1}{2x^2}$$"}], "respuesta": "$$y=C_1+\\frac{C_2}{x^2}$$"}, {"tipo": "ojo", "items": ["Leer $P(x)$ sin normalizar: en $(x-1)y''-xy'+y=0$ el $P$ es $-\\frac{x}{x-1}$, no $-x$.", "Equivocarse en el signo del exponente: es $e^{-\\int P}$.", "Olvidar el $y_1$ de afuera de la integral: $y_2=y_1\\int\\cdots$.", "Dejar la respuesta como solo $y_2$: piden la solución general $C_1y_1+C_2y_2$ (4 pts en 2025).", "Si la integral tiene la forma $\\int\\frac{d}{dx}\\big(\\tfrac{e^x}{x}\\big)dx$, reconócela: $\\frac{e^x}{x}-\\frac{e^x}{x^2}$ es la derivada de $\\frac{e^x}{x}$ (pauta 2025)."]}]}, {"id": "t3", "titulo": "Coeficientes constantes: ecuación auxiliar", "peso": 2, "intro": "Es el primer paso de casi todo: homogénea, coeficientes indeterminados, variación de parámetros, masa-resorte y sistemas por eliminación. Tiene que salirte automático.", "bloques": [{"tipo": "texto", "titulo": "Probar con una exponencial", "md": "Cuando todos los coeficientes son **constantes**, $a_ny^{(n)}+\\cdots+a_1y'+a_0y=0$, la homogénea se resuelve completa con álgebra. La razón: la exponencial $e^{mx}$ se reproduce al derivar ($D e^{mx}=me^{mx}$), así que al reemplazar todo queda como $e^{mx}$ por un polinomio en $m$."}, {"tipo": "formula", "tex": "L=a_nD^n+a_{n-1}D^{n-1}+\\cdots+a_1D+a_0,\\qquad L(e^{mx})=\\big(a_nm^n+\\cdots+a_1m+a_0\\big)e^{mx}", "nota": "El operador se comporta como un polinomio en $D$; factorizarlo es componer operadores."}, {"tipo": "texto", "md": "Como $e^{mx}\\neq0$, $e^{mx}$ es solución exactamente cuando $m$ es raíz de la **ecuación auxiliar o característica**:"}, {"tipo": "formula", "tex": "a_nm^n+a_{n-1}m^{n-1}+\\cdots+a_1m+a_0=0", "nota": "Es la misma EDO cambiando $y^{(k)}$ por $m^k$."}, {"tipo": "texto", "titulo": "Caso $n=2$", "md": "$a_2y''+a_1y'+a_0y=0$ con raíces $\\alpha_1,\\alpha_2$ de $a_2m^2+a_1m+a_0=0$. Hay tres posibilidades, según el discriminante."}, {"tipo": "formula", "tex": "\\text{Caso 1: } \\alpha_1\\neq\\alpha_2\\in\\mathbb R\\ \\Rightarrow\\ y=c_1e^{\\alpha_1x}+c_2e^{\\alpha_2x}", "nota": "Dos exponenciales distintas: siempre li."}, {"tipo": "formula", "tex": "\\text{Caso 2: } \\alpha_1=\\alpha_2=\\alpha\\ \\Rightarrow\\ y=c_1e^{\\alpha x}+c_2\\,x\\,e^{\\alpha x}", "nota": "Con una sola raíz solo tienes $e^{\\alpha x}$; la segunda la da Abel (ver deducción guiada)."}, {"tipo": "formula", "tex": "\\text{Caso 3: } \\alpha\\pm\\beta i\\ \\Rightarrow\\ y=c_1e^{\\alpha x}\\cos(\\beta x)+c_2e^{\\alpha x}\\operatorname{sen}(\\beta x)", "nota": "Viene de $e^{(\\alpha\\pm\\beta i)x}=e^{\\alpha x}(\\cos\\beta x\\pm i\\operatorname{sen}\\beta x)$ y de tomar combinaciones reales."}, {"tipo": "texto", "md": "Interpretación del caso 3: $\\alpha$ controla el crecimiento o decaimiento (envolvente $e^{\\alpha x}$) y $\\beta$ la frecuencia de oscilación. Esto reaparece en masa-resorte subamortiguado."}, {"tipo": "gadget", "id": "g_raices", "titulo": "Mueve a, b, c y mira qué caso te toca", "instrucciones": "Ajusta los coeficientes de $ay''+by'+cy=0$. Se muestran el discriminante, las raíces, la $y_h$ y la solución con $y(0)=1$, $y'(0)=0$. Busca: ¿qué pasa en el gráfico cuando las raíces son complejas? ¿Y cuando son positivas?"}, {"tipo": "texto", "titulo": "Caso $n\\gt2$", "md": "Si todas las raíces son reales y distintas, $y=c_1e^{\\alpha_1x}+\\cdots+c_ne^{\\alpha_nx}$. Si hay repeticiones, cada raíz aporta según su multiplicidad:"}, {"tipo": "formula", "tex": "m_1 \\text{ de multiplicidad } k:\\quad c_1e^{m_1x}+c_2xe^{m_1x}+c_3x^2e^{m_1x}+\\cdots+c_kx^{k-1}e^{m_1x}", "nota": "Si $m_1=\\alpha+\\beta i$ tiene multiplicidad $k$, su conjugada también, y se agregan $x^je^{\\alpha x}\\cos\\beta x$ y $x^je^{\\alpha x}\\operatorname{sen}\\beta x$, $j=0,\\dots,k-1$ ($2k$ funciones)."}, {"tipo": "gadget", "id": "g_constructor", "titulo": "Constructor de $y_h$ a partir de las raíces", "instrucciones": "Agrega raíces con su multiplicidad (o usa un ejemplo de clase o control) y mira cómo se arma $y_h$. Revisa que el número de funciones coincida con el orden."}, {"tipo": "nota", "md": "Para factorizar polinomios de grado 3 o más: busca raíces racionales (divisores del término libre), **agrupa** ($r^3-3r^2+4r-12=r^2(r-3)+4(r-3)$) o saca factor común $m^k$. Cuenta siempre: el total de funciones en $y_h$ debe ser igual al orden."}, {"tipo": "ejemplo", "titulo": "¿Por qué $xe^{\\alpha x}$ con raíz doble?", "enunciado": "Clase 11: con raíz doble $\\alpha$, la ecuación es $y''-2\\alpha y'+\\alpha^2y=0$ y conocemos $y_1=e^{\\alpha x}$.", "pasos": [{"titulo": "Identifica $a_1$ y calcula $e^{-\\int a_1dx}$.", "md": "$$a_1=-2\\alpha\\ \\Rightarrow\\ e^{-\\int a_1dx}=e^{2\\alpha x}$$"}, {"titulo": "Aplica la fórmula de Abel.", "md": "$$y_2=e^{\\alpha x}\\int\\frac{e^{2\\alpha x}}{e^{2\\alpha x}}dx=e^{\\alpha x}\\int1\\,dx=xe^{\\alpha x}$$"}, {"titulo": "Escribe la solución general.", "md": "$$y=c_1e^{\\alpha x}+c_2xe^{\\alpha x}$$"}]}, {"tipo": "ejemplo", "titulo": "Clase 11", "enunciado": "Resuelva el PVI $y''-2\\sqrt5\\,y'+5y=0,\\ y(0)=0,\\ y'(0)=3$.", "pasos": [{"titulo": "Ecuación auxiliar y raíces.", "md": "$$m^2-2\\sqrt5m+5=(m-\\sqrt5)^2=0\\ \\Rightarrow\\ m=\\sqrt5\\ \\text{doble}$$"}, {"titulo": "Solución general.", "md": "$$y=(c_1+c_2x)e^{\\sqrt5x}$$"}, {"titulo": "Aplica las condiciones iniciales.", "md": "$$y(0)=c_1=0,\\qquad y'(0)=c_2+\\sqrt5c_1=3\\Rightarrow c_2=3$$"}], "respuesta": "$$y=3xe^{\\sqrt5x}$$"}, {"tipo": "ejemplo", "titulo": "Clase 11", "enunciado": "Solución general de $y^{(7)}-2y^{(5)}+y'''=0$.", "pasos": [{"titulo": "Factoriza la ecuación auxiliar.", "md": "$$m^7-2m^5+m^3=m^3(m^2-1)^2=m^3(m-1)^2(m+1)^2$$"}, {"titulo": "Raíces y multiplicidades.", "md": "$$m=0\\ (\\times3),\\quad m=1\\ (\\times2),\\quad m=-1\\ (\\times2)$$\n3+2+2 = 7 funciones, igual al orden."}], "respuesta": "$$y=c_1+c_2x+c_3x^2+(c_4+c_5x)e^{x}+(c_6+c_7x)e^{-x}$$"}, {"tipo": "ejemplo", "titulo": "Clase 11", "enunciado": "Solución general de $y'''+y=0$.", "pasos": [{"titulo": "Factoriza $m^3+1$.", "md": "$$m^3+1=(m+1)(m^2-m+1)$$"}, {"titulo": "Raíces.", "md": "$$m=-1,\\qquad m=\\frac12\\pm\\frac{\\sqrt3}{2}i$$"}], "respuesta": "$$y=c_1e^{-x}+e^{x/2}\\Big(c_2\\cos\\tfrac{\\sqrt3}{2}x+c_3\\operatorname{sen}\\tfrac{\\sqrt3}{2}x\\Big)$$"}, {"tipo": "ejemplo", "titulo": "Guía 3, n°15", "enunciado": "PVI $4y''-4y'-3y=0,\\ y(0)=1,\\ y'(0)=5$.", "pasos": [{"titulo": "Raíces.", "md": "$$4m^2-4m-3=(2m-3)(2m+1)=0\\ \\Rightarrow\\ m=\\tfrac32,\\ -\\tfrac12$$"}, {"titulo": "Sistema para las constantes.", "md": "$$c_1+c_2=1,\\qquad \\tfrac32c_1-\\tfrac12c_2=5\\ \\Rightarrow\\ c_1=\\tfrac{11}{4},\\ c_2=-\\tfrac74$$"}], "respuesta": "$$y=\\frac{11}{4}e^{3x/2}-\\frac74e^{-x/2}$$"}, {"tipo": "ojo", "items": ["Con raíces $\\pm\\beta i$ (sin parte real) poner $e^{x}$: si $\\alpha=0$ la exponencial es $e^{0}=1$.", "En la raíz doble escribir $c_1e^{mx}+c_2e^{mx}$ (son la misma función: falta la $x$).", "Usar $\\cos(\\beta x)$ con el $\\beta$ mal: para $r=-\\frac12\\pm\\frac{\\sqrt3}{2}i$ es $\\cos\\frac{\\sqrt3}{2}x$.", "En orden 3 o más, no revisar que el número de funciones sea igual al orden."]}]}, {"id": "t4", "titulo": "Coef. indeterminados y variación de parámetros", "peso": 3, "intro": "El tema con más puntos entre Control 2 y Prueba 2: casi siempre hay que encontrar una $y_p$. La clave es reconocer **qué método** usar y escribir bien la propuesta, sobre todo cuando choca con $y_h$ (raíz doble ⇒ multiplicar por $x^2$).", "bloques": [{"tipo": "texto", "titulo": "Coeficientes indeterminados", "md": "Para la no homogénea con coeficientes constantes $L(y)=h(x)$ sabemos que $y=y_h+y_p$. El método de **coeficientes indeterminados** encuentra $y_p$ cuando $h$ es de una familia que se **cierra al derivar**: polinomios, exponenciales, senos y cosenos, y productos de ellos. Derivar una de esas funciones da otra del mismo tipo, así que una propuesta con coeficientes desconocidos puede igualar a $h$."}, {"tipo": "formula", "tex": "a_ny^{(n)}+\\cdots+a_1y'+a_0y=\\sum_{i=1}^{m}e^{r_ix}\\big[P_i(x)\\cos(q_ix)+Q_i(x)\\operatorname{sen}(q_ix)\\big]", "nota": "Forma general de $h$ admisible (Clase 12): $a_i,r_i,q_i\\in\\mathbb R$, $P_i,Q_i$ polinomios."}, {"tipo": "texto", "titulo": "Tabla de propuestas (Clase 12)", "md": "Se conjetura $y_p$ con la misma estructura que $h$, pero con **todos** los coeficientes libres:"}, {"tipo": "formula", "tex": "\\text{i) } h=x^m:\\quad y_p=A_mx^m+A_{m-1}x^{m-1}+\\cdots+A_1x+A_0", "nota": "Aunque $h=12x$ solo tenga el término en $x$, la propuesta es $Ax+B$: derivar baja de grado."}, {"tipo": "formula", "tex": "\\text{ii) } h=x^me^{kx}:\\quad y_p=e^{kx}\\big(A_mx^m+\\cdots+A_1x+A_0\\big)"}, {"tipo": "formula", "tex": "\\text{iii) } h=e^{kx}x^m\\cos\\beta x\\ \\text{o}\\ e^{kx}x^m\\operatorname{sen}\\beta x:\\quad y_p=e^{kx}(A_mx^m+\\cdots+A_0)\\cos\\beta x+e^{kx}(B_mx^m+\\cdots+B_0)\\operatorname{sen}\\beta x", "nota": "Aunque $h$ tenga solo seno, se proponen **seno y coseno**."}, {"tipo": "lapiz", "texto": "seno Y coseno, aunque g tenga solo uno"}, {"tipo": "texto", "titulo": "Pasos (Clase 12)", "md": "1) resolver $L(y)=0$; 2) proponer $y_p$ según i), ii) o iii); 3) sustituir en $L(y)=h$ e igualar coeficientes de cada función; 4) $y=y_h+y_p$. Si $h$ es una suma de tipos distintos, se aplica la superposición: una propuesta por sumando."}, {"tipo": "texto", "titulo": "Regla de duplicidad (la que más se evalúa)", "md": "Si algún término de la propuesta **ya es solución de la homogénea**, al reemplazarlo da cero y no puede producir $h$. La corrección es multiplicar la propuesta por $x^s$, con $s$ la menor potencia que elimina la coincidencia:"}, {"tipo": "formula", "tex": "y_p\\ \\to\\ x^s\\,y_p,\\qquad s=\\text{multiplicidad de } k+i\\beta \\text{ como raíz de la ecuación auxiliar}", "nota": "Ej. (Prueba 2): $y''-4y'+4y=e^{2x}$ con $m=2$ doble: $Ae^{2x}$ y $Axe^{2x}$ están en $y_h$, luego $y_p=Ax^2e^{2x}$."}, {"tipo": "nota", "md": "Un atajo verificable: para $h=e^{kx}$ y $p(m)$ la ecuación auxiliar, si $p(k)\\neq0$ entonces $y_p=\\dfrac{e^{kx}}{p(k)}$; si $k$ es raíz simple, $y_p=\\dfrac{xe^{kx}}{p'(k)}$; si es doble, $y_p=\\dfrac{x^2e^{kx}}{p''(k)}$. Úsalo para **chequear**; en la prueba muestra la sustitución (es lo que puntúa)."}, {"tipo": "nota", "md": "**Cuándo NO sirve:** si $h$ es $\\tan x$, $\\sec x$, $\\ln x$, $1/x$, $\\frac{e^x}{x}$… sus derivadas generan infinitas funciones distintas y ninguna propuesta finita cierra. Ahí se usa variación de parámetros. Tampoco aplica (directamente) a coeficientes variables."}, {"tipo": "gadget", "id": "g_propuesta", "titulo": "Generador de propuestas $y_p$", "instrucciones": "Elige la parte homogénea (cada una sale de un control o clase) y arma $g(x)=x^m e^{kx}\\cos\\beta x$ o con seno. El gadget te dice el número de prueba, si choca con las raíces y la propuesta correcta. Practica: piensa la respuesta antes de mirar."}, {"tipo": "ejemplo", "titulo": "Clase 12", "enunciado": "Resuelva $y''-10y'+25y=30x+3$.", "pasos": [{"titulo": "Homogénea.", "md": "$$(m-5)^2=0\\Rightarrow y_h=(c_1+c_2x)e^{5x}$$"}, {"titulo": "Propuesta y sustitución.", "md": "$$-10A+25(Ax+B)=30x+3\\ \\Rightarrow\\ A=\\tfrac65,\\ \\ -12+25B=3\\Rightarrow B=\\tfrac35$$"}], "respuesta": "$$y=(c_1+c_2x)e^{5x}+\\frac65x+\\frac35$$"}, {"tipo": "ejemplo", "titulo": "Clase 12", "enunciado": "Resuelva $y''-3y'+2y=2xe^{3x}+3\\operatorname{sen}x$.", "pasos": [{"titulo": "Homogénea.", "md": "$$(m-1)(m-2)=0\\Rightarrow y_h=c_1e^{x}+c_2e^{2x}$$"}, {"titulo": "Para $2xe^{3x}$: propón $(Ax+B)e^{3x}$ y reemplaza.", "md": "$$2A=2,\\ 3A+2B=0\\ \\Rightarrow\\ A=1,\\ B=-\\tfrac32$$"}, {"titulo": "Para $3\\operatorname{sen}x$: propón $C\\cos x+D\\operatorname{sen}x$.", "md": "$$C-3D=0,\\ 3C+D=3\\ \\Rightarrow\\ C=\\tfrac{9}{10},\\ D=\\tfrac{3}{10}$$"}], "respuesta": "$$y=c_1e^{x}+c_2e^{2x}+\\Big(x-\\frac32\\Big)e^{3x}+\\frac{9}{10}\\cos x+\\frac{3}{10}\\operatorname{sen}x$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "$y'''-4y''=12x+8e^{4x}$, analizando los casos de duplicidad.", "pasos": [{"titulo": "Homogénea.", "md": "$$m^2(m-4)=0\\Rightarrow y_h=c_1+c_2x+c_3e^{4x}$$"}, {"titulo": "Para $12x$: $m=0$ es raíz doble → $x^2(Ax+B)$.", "md": "$$6A-4(6Ax+2B)=12x\\Rightarrow A=-\\tfrac12,\\ B=-\\tfrac38$$"}, {"titulo": "Para $8e^{4x}$: $m=4$ es raíz simple → $Cxe^{4x}$.", "md": "$$16C=8\\Rightarrow C=\\tfrac12$$"}], "respuesta": "$$y=c_1+c_2x+c_3e^{4x}-\\frac{x^3}{2}-\\frac{3x^2}{8}+\\frac{x}{2}e^{4x}$$"}, {"tipo": "texto", "titulo": "Variación de parámetros", "md": "Coeficientes indeterminados es rápido pero limitado. **Variación de parámetros** funciona para cualquier $h$ continua y también con coeficientes variables, siempre que conozcas un conjunto fundamental $\\{y_1,y_2\\}$ de la homogénea. La idea: en $y_h=c_1y_1+c_2y_2$ se cambian las constantes por **funciones** $c_1(x),c_2(x)$."}, {"tipo": "nota", "md": "Hipótesis de la clase: la EDO debe estar **normalizada**, $y''+a_1(x)y'+a_0(x)y=h(x)$. El $h$ de las fórmulas es el lado derecho **después** de dividir por el coeficiente de $y''$. En Cauchy-Euler $x^2y''-4xy'+6y=2\\ln x$, se usa $h=\\dfrac{2\\ln x}{x^2}$, no $2\\ln x$."}, {"tipo": "lapiz", "texto": "h = lado derecho DESPUÉS de dividir por a₂(x)"}, {"tipo": "formula", "tex": "y_p(x)=c_1(x)y_1(x)+c_2(x)y_2(x)", "nota": "Sea $y_h=c_1y_1+c_2y_2$ la solución general de $y''+a_1y'+a_0y=0$."}, {"tipo": "texto", "md": "Al reemplazar en la EDO aparecen dos incógnitas $c_1',c_2'$ y una ecuación; se impone la condición extra $c_1'y_1+c_2'y_2=0$ (simplifica $y_p'$). Queda el sistema de la Clase 12:"}, {"tipo": "formula", "tex": "\\begin{cases}c_1'(x)y_1(x)+c_2'(x)y_2(x)=0\\\\ c_1'(x)y_1'(x)+c_2'(x)y_2'(x)=h(x)\\end{cases}", "nota": "Su determinante es $W[y_1,y_2]\\neq0$ (soluciones li), así que siempre tiene solución."}, {"tipo": "formula", "tex": "c_1'(x)=\\frac{-y_2(x)h(x)}{W[y_1,y_2](x)},\\qquad c_2'(x)=\\frac{y_1(x)h(x)}{W[y_1,y_2](x)}", "nota": "Regla de Cramer. Las pautas lo escriben como $u_1'=W_1/W$, $u_2'=W_2/W$ con $W_1=\\begin{vmatrix}0&y_2\\\\h&y_2'\\end{vmatrix}$, $W_2=\\begin{vmatrix}y_1&0\\\\y_1'&h\\end{vmatrix}$."}, {"tipo": "formula", "tex": "c_1(x)=\\int\\frac{-y_2h}{W}\\,dx,\\qquad c_2(x)=\\int\\frac{y_1h}{W}\\,dx,\\qquad y=y_h+y_p", "nota": "No hace falta constante de integración: se absorbe en $y_h$."}, {"tipo": "texto", "titulo": "Orden $n$", "md": "Con $y_p=\\sum c_k(x)y_k$, un proceso análogo da $c_k(x)=\\displaystyle\\int\\frac{V_k(x)\\,h(x)}{W[y_1,\\dots,y_n](x)}dx$, donde $V_k$ es el Wronskiano con la columna $k$ reemplazada por $(0,\\dots,0,1)^T$. Para $n=2$: $V_1=-y_2$, $V_2=y_1$."}, {"tipo": "nota", "md": "Es normal que $y_p$ salga con términos que ya están en $y_h$ (ej.: $-xe^x$ cuando $xe^x\\in y_h$). Se pueden **absorber** en las constantes. Ambas respuestas son correctas; la pauta suele simplificar."}, {"tipo": "gadget", "id": "g_vp", "titulo": "Variación de parámetros paso a paso", "instrucciones": "Elige un ejercicio y avanza paso a paso. La secuencia es siempre la misma: normalizar → $y_1,y_2$ → $W,W_1,W_2$ → $u_1',u_2'$ → integrar → $y_p$."}, {"tipo": "ejemplo", "titulo": "Clase 12: $y''+y=\\tan x$", "enunciado": "Ejemplo clásico donde coeficientes indeterminados no funciona.", "pasos": [{"titulo": "Conjunto fundamental y Wronskiano.", "md": "$$y_1=\\cos x,\\ y_2=\\operatorname{sen}x,\\quad W=\\cos^2x+\\operatorname{sen}^2x=1$$"}, {"titulo": "Calcula $c_1'$ y simplifícalo.", "md": "$$c_1'=-\\operatorname{sen}x\\tan x=-\\frac{\\operatorname{sen}^2x}{\\cos x}=\\cos x-\\sec x$$"}, {"titulo": "Integra $c_1'$ y $c_2'=\\cos x\\tan x=\\operatorname{sen}x$.", "md": "$$c_1=\\operatorname{sen}x-\\ln|\\sec x+\\tan x|,\\qquad c_2=-\\cos x$$"}, {"titulo": "Arma $y_p$.", "md": "$$y_p=\\cos x\\,(\\operatorname{sen}x-\\ln|\\sec x+\\tan x|)-\\operatorname{sen}x\\cos x=-\\cos x\\ln|\\sec x+\\tan x|$$"}, {"titulo": "Solución general.", "md": "$$y=c_1\\cos x+c_2\\operatorname{sen}x-\\cos x\\ln|\\sec x+\\tan x|$$"}]}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "$y''-2y'+y=\\dfrac{e^x}{x},\\ x\\gt0$.", "pasos": [{"titulo": "Homogénea y $W$.", "md": "$$y_1=e^{x},\\ y_2=xe^{x},\\quad W=e^{2x}$$"}, {"titulo": "$c_1'$ y $c_2'$.", "md": "$$c_1'=-\\frac{xe^{x}\\cdot e^x/x}{e^{2x}}=-1,\\qquad c_2'=\\frac{e^{x}\\cdot e^x/x}{e^{2x}}=\\frac1x$$"}, {"titulo": "Integra y arma $y_p$.", "md": "$$c_1=-x,\\ c_2=\\ln x\\ \\Rightarrow\\ y_p=-xe^{x}+xe^{x}\\ln x$$\n$-xe^x$ se absorbe en $c_2xe^x$."}], "respuesta": "$$y=c_1e^{x}+c_2xe^{x}+xe^{x}\\ln x$$"}, {"tipo": "ojo", "items": ["Proponer $Ae^{3x}$ cuando $e^{3x}\\in y_h$: al reemplazar da $0=1$ (hay que usar $Axe^{3x}$).", "Raíz doble y $g=e^{rx}$ con esa misma $r$: se multiplica por $x^2$, no por $x$ (control 60 min: $Dt^2e^t$).", "Polinomio incompleto: para $g=t^2+1$ se propone $At^2+Bt+C$, no $At^2+C$.", "En VP olvidar normalizar: en $x^2y''-2xy'+2y=x^2\\ln x$ la $f$ es $\\ln x$, no $x^2\\ln x$.", "Confundir el orden de $W_1$ y el signo: $u_1'=-y_2f/W$."]}]}, {"id": "t5", "titulo": "Ecuación de Cauchy-Euler", "peso": 3, "intro": "Salió en las tres pautas de Prueba 2 (10 a 15 pts) y en todos los Control 2. Se reconoce porque la potencia de $x$ coincide con el orden de la derivada: $x^2y''$, $xy'$, $y$.", "bloques": [{"tipo": "texto", "titulo": "Cómo se reconoce", "md": "En una Cauchy-Euler cada derivada viene multiplicada por la **misma potencia** de $x$ que su orden. Esa simetría hace que $x^m$ se reproduzca: $x^k\\dfrac{d^k}{dx^k}x^m$ vuelve a ser un múltiplo de $x^m$. Es el análogo de $e^{mx}$ en coeficientes constantes."}, {"tipo": "formula", "tex": "a_nx^n\\frac{d^ny}{dx^n}+a_{n-1}x^{n-1}\\frac{d^{n-1}y}{dx^{n-1}}+\\cdots+a_1x\\frac{dy}{dx}+a_0y=g(x),\\qquad a_i\\in\\mathbb R", "nota": "Definición (Clase 13). Se trabaja en $x\\gt0$, donde el coeficiente principal no se anula."}, {"tipo": "texto", "titulo": "Caso $n=2$", "md": "$ax^2y''+bxy'+cy=g(x)$. Para la homogénea se prueba $y=x^m$:"}, {"tipo": "formula", "tex": "ax^2\\,m(m-1)x^{m-2}+bx\\,mx^{m-1}+c\\,x^m=\\big[am^2+(b-a)m+c\\big]x^m=0", "nota": "$y=x^m$ es solución $\\iff$ $m$ resuelve la **ecuación indicial** $am^2+(b-a)m+c=0$."}, {"tipo": "lapiz", "texto": "am² + (b − a)m + c, no am² + bm + c"}, {"tipo": "nota", "md": "El error clásico: escribir $am^2+bm+c=0$ copiando los coeficientes. El término $m(m-1)$ aporta un $-am$. Para $x^2y''-3xy'+3y$: $m^2-4m+3$, no $m^2-3m+3$."}, {"tipo": "formula", "tex": "\\text{Caso 1: } m_1\\neq m_2\\in\\mathbb R\\ \\Rightarrow\\ y=c_1x^{m_1}+c_2x^{m_2}"}, {"tipo": "formula", "tex": "\\text{Caso 2: } m_1=m_2=m\\ \\Rightarrow\\ y=c_1x^m+c_2x^m\\ln x", "nota": "La segunda sale de Abel: $y_2=x^m\\int\\dfrac{e^{-\\int\\frac{b}{ax}dx}}{x^{2m}}dx=x^m\\ln x$ (con raíz doble, $b/a=1-2m$)."}, {"tipo": "formula", "tex": "\\text{Caso 3: } m=\\alpha\\pm\\beta i\\ \\Rightarrow\\ y=c_1x^{\\alpha}\\cos(\\beta\\ln x)+c_2x^{\\alpha}\\operatorname{sen}(\\beta\\ln x)", "nota": "Viene de $x^{i\\beta}=e^{i\\beta\\ln x}=\\cos(\\beta\\ln x)+i\\operatorname{sen}(\\beta\\ln x)$."}, {"tipo": "gadget", "id": "g_euler", "titulo": "Laboratorio Cauchy-Euler", "instrucciones": "Mueve $a$, $b$, $c$ de $ax^2y''+bxy'+cy=0$. Mira la indicial, las raíces y la $y_h$, junto con la EDO equivalente en $t=\\ln x$. El botón \"Control 29/04\" carga $x^2y''-3xy'+\\alpha y$: busca el valor de $\\alpha$ que da raíz doble $m=2$."}, {"tipo": "texto", "titulo": "Cambio de variable $x=e^t$ ($t=\\ln x$)", "md": "Convierte la Cauchy-Euler en coeficientes constantes, que ya sabes resolver. Con $y(x)=Y(t)$:"}, {"tipo": "formula", "tex": "\\frac{dy}{dx}=\\frac1x\\frac{dY}{dt},\\qquad \\frac{d^2y}{dx^2}=\\frac1{x^2}\\Big(\\frac{d^2Y}{dt^2}-\\frac{dY}{dt}\\Big)\\ \\Rightarrow\\ aY''+(b-a)Y'+cY=g(e^t)", "nota": "La ecuación característica en $t$ es exactamente la indicial. Útil cuando $g$ tiene $\\ln x$ o potencias: en $t$ se vuelven polinomios y exponenciales."}, {"tipo": "texto", "titulo": "No homogénea, dos caminos", "md": "(1) **Variación de parámetros** con $y_1=x^{m_1}$, $y_2=x^{m_2}$ (o $x^m\\ln x$), **previa normalización** (dividir por $ax^2$). Es lo que usan las pautas de Prueba 2. (2) Cambio $x=e^t$ y coeficientes indeterminados en $t$. Si $g=x^k$ y $k$ no es raíz indicial, también sirve proponer directamente $y_p=Ax^k$."}, {"tipo": "nota", "md": "Para que exista una solución del tipo $x^{m_0}\\ln x$, $m_0$ debe ser **raíz doble** de la indicial: $p(m_0)=0$ y $p'(m_0)=0$. Esa pregunta (hallar el parámetro) apareció en Control 2 y Prueba 2."}, {"tipo": "ejemplo", "titulo": "Clase 13", "enunciado": "Resuelva $x^2y''+xy'+y=0$.", "pasos": [{"titulo": "Indicial.", "md": "$$m^2+1=0\\Rightarrow m=\\pm i\\ (\\alpha=0,\\ \\beta=1)$$"}], "respuesta": "$$y=c_1\\cos(\\ln x)+c_2\\operatorname{sen}(\\ln x)$$"}, {"tipo": "ejemplo", "titulo": "Clase 13", "enunciado": "Solución general de $x^2y''+5xy'+4y=x^2+16(\\ln x)^2$.", "pasos": [{"titulo": "Indicial y $y_h$.", "md": "$$m^2+4m+4=(m+2)^2\\Rightarrow y_h=c_1x^{-2}+c_2x^{-2}\\ln x$$"}, {"titulo": "Pasa a $t=\\ln x$.", "md": "$$Y''+4Y'+4Y=e^{2t}+16t^2$$"}, {"titulo": "Particular para $e^{2t}$.", "md": "$$Ae^{2t}:\\ (4+8+4)A=1\\Rightarrow A=\\tfrac1{16}$$"}, {"titulo": "Particular para $16t^2$.", "md": "$$4B=16,\\ 8B+4C=0,\\ 2B+4C+4D=0\\Rightarrow B=4,\\ C=-8,\\ D=6$$"}], "respuesta": "$$y=c_1x^{-2}+c_2x^{-2}\\ln x+\\frac{x^2}{16}+4\\ln^2x-8\\ln x+6$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "$(x-2)^2y''-3(x-2)y'+4y=0$, $x\\gt2$.", "pasos": [{"titulo": "Con $t=x-2$ queda una Cauchy-Euler estándar. Indicial.", "md": "$$t^2y''-3ty'+4y=0,\\quad m^2-4m+4=(m-2)^2$$"}], "respuesta": "$$y=c_1(x-2)^2+c_2(x-2)^2\\ln(x-2)$$"}, {"tipo": "ojo", "items": ["Indicial mal: $am^2+bm+c$ en vez de $am^2+(b-a)m+c$. Para $x^2y''-2xy'+2y$ es $m^2-3m+2$, no $m^2-2m+2$.", "Complejas con $\\cos(\\beta x)$: en Cauchy-Euler el argumento es $\\beta\\ln x$ (Guía 3, 6a es **falso** por eso).", "Raíz doble con $x\\cdot x^m$: lo correcto es $x^m\\ln x$.", "En VP no dividir por $x^2$: $f$ debe ser el lado derecho de $y''+\\frac bax y'+\\dots$", "Un término de $y_p$ que ya está en $y_h$ (como el $x^2$ de la pauta 30/04) se absorbe en $C_2$."]}]}, {"id": "t6", "titulo": "Sistemas masa-resorte", "peso": 3, "intro": "La aplicación: 12 a 20 pts en dos de las tres pruebas. Los puntos están en plantear bien el PVI (Hooke, signos de las condiciones iniciales) y en interpretar el resultado (tipo de movimiento, cruces por el equilibrio).", "bloques": [{"tipo": "texto", "titulo": "Ley de Hooke", "md": "Un resorte colgado de un soporte rígido con una masa $m$ en su extremo es el ejemplo físico central de las EDO de segundo orden con coeficientes constantes. Todo lo que viste de raíces reales, dobles y complejas se traduce aquí en \"no oscila\", \"apenas no oscila\" y \"oscila\"."}, {"tipo": "formula", "tex": "F=ks\\qquad(\\text{ley de Hooke})", "nota": "La fuerza restauradora es opuesta y proporcional a la elongación $s$. $k$ es la constante del resorte. Ej. de clase: 10 lb que alargan 0.5 pie dan $k=20$ lb/pie."}, {"tipo": "formula", "tex": "W=mg=ks\\ \\Rightarrow\\ k=\\frac{mg}{s}", "nota": "Equilibrio estático. $g=32$ pie/s² (slug), $9.8$ m/s² (kg), $980$ cm/s² (g). Si te dan el **peso** en libras: $m=W/32$ slug."}, {"tipo": "texto", "titulo": "Convención (Clase 14)", "md": "$x$ se mide desde la posición de **equilibrio**, y los desplazamientos **hacia abajo son positivos**. \"2 m sobre el equilibrio\" es $x(0)=-2$; \"velocidad hacia arriba de 10\" es $x'(0)=-10$; \"se libera del reposo\" es $x'(0)=0$."}, {"tipo": "lapiz", "texto": "condiciones iniciales: 2 a 5 pts por pregunta"}, {"tipo": "gadget", "id": "g_signos", "titulo": "Traductor de condiciones iniciales", "instrucciones": "Lee el enunciado generado al azar, escribe $x(0)$ y $x'(0)$ con la convención indicada y revisa. Repite hasta que no te equivoques nunca."}, {"tipo": "texto", "titulo": "Movimiento libre no amortiguado", "md": "Por Newton, $mx''=-k(s+x)+mg=-kx$ (el peso se cancela con $ks$). Dividiendo por $m$:"}, {"tipo": "formula", "tex": "x''+w^2x=0,\\quad w^2=\\frac km\\ \\Rightarrow\\ x(t)=c_1\\cos(wt)+c_2\\operatorname{sen}(wt)", "nota": "Movimiento armónico simple. $w=\\sqrt{k/m}$ es la **frecuencia circular** (rad/s)."}, {"tipo": "formula", "tex": "T=\\frac{2\\pi}{w},\\qquad f=\\frac1T=\\frac{w}{2\\pi},\\qquad A=\\sqrt{c_1^2+c_2^2}", "nota": "Período, frecuencia (ciclos/s) y amplitud."}, {"tipo": "formula", "tex": "x(t)=A\\operatorname{sen}(wt+\\phi),\\qquad \\operatorname{sen}\\phi=\\frac{c_1}{A},\\ \\ \\cos\\phi=\\frac{c_2}{A}\\ \\ \\Big(\\tan\\phi=\\frac{c_1}{c_2}\\Big)", "nota": "**Forma sinusoidal.** Al expandir $A\\operatorname{sen}(wt+\\phi)=A\\cos\\phi\\operatorname{sen}wt+A\\operatorname{sen}\\phi\\cos wt$ se identifica $c_2=A\\cos\\phi$, $c_1=A\\operatorname{sen}\\phi$."}, {"tipo": "nota", "md": "$\\arctan(c_1/c_2)$ solo da ángulos en $(-\\pi/2,\\pi/2)$. Si $c_2\\lt0$, suma $\\pi$: el signo de $c_1$ da el de $\\operatorname{sen}\\phi$ y el de $c_2$ el de $\\cos\\phi$. Con $c_1=-1,\\ c_2=-\\frac52$ (tercer cuadrante): $\\phi=\\pi+\\arctan\\frac25\\approx3.52$ rad."}, {"tipo": "gadget", "id": "g_fase", "titulo": "Amplitud y ángulo de fase", "instrucciones": "Mueve $c_1$ y $c_2$. La curva morada es $c_1\\cos\\omega t+c_2\\sin\\omega t$ y la punteada en verde es $A\\sin(\\omega t+\\varphi)$ con el $\\varphi$ correcto (deben coincidir). Si usas solo $\\arctan(c_1/c_2)$ con $c_2<0$, aparece en rojo la curva equivocada."}, {"tipo": "texto", "titulo": "Movimiento libre amortiguado (Clase 15)", "md": "Si el medio es viscoso aparece una fuerza de roce proporcional a la velocidad, $F_{roce}=c\\,x'$ con $c\\gt0$: $mx''=-kx-cx'$."}, {"tipo": "formula", "tex": "x''+\\frac cm x'+\\frac km x=0,\\qquad \\lambda_{1,2}=-\\frac{c}{2m}\\pm\\frac{1}{2m}\\sqrt{c^2-4mk}=-\\alpha\\pm\\beta", "nota": "$\\alpha=\\dfrac{c}{2m}$, $\\beta=\\dfrac{\\sqrt{c^2-4mk}}{2m}$. El signo de $c^2-4mk$ decide el caso."}, {"tipo": "formula", "tex": "c^2\\gt4mk:\\quad x(t)=c_1e^{-(\\alpha-\\beta)t}+c_2e^{-(\\alpha+\\beta)t}", "nota": "**Sobreamortiguado.** Ambos exponentes son negativos ($\\beta\\lt\\alpha$): vuelve al equilibrio sin oscilar."}, {"tipo": "formula", "tex": "c^2=4mk:\\quad x(t)=(c_1+c_2t)e^{-\\alpha t}", "nota": "**Críticamente amortiguado.** $c_1+c_2t$ tiene a lo más un cero: pasa **a lo más una vez** por el equilibrio."}, {"tipo": "formula", "tex": "c^2\\lt4mk:\\quad x(t)=e^{-\\alpha t}\\big[c_1\\cos(\\omega^*t)+c_2\\operatorname{sen}(\\omega^*t)\\big]=Ae^{-\\alpha t}\\operatorname{sen}(\\omega^*t+\\varphi),\\quad \\omega^*=\\frac{\\sqrt{4mk-c^2}}{2m}", "nota": "**Subamortiguado.** Oscila con amplitud que decae entre $\\pm Ae^{-\\alpha t}$; $\\tan\\varphi=c_1/c_2$."}, {"tipo": "gadget", "id": "g_resorte", "titulo": "Simulador masa-resorte", "instrucciones": "Ajusta $m$, $c$, $k$, las condiciones iniciales y la fuerza externa $F_0\\cos\\gamma t$ (abajo positivo). Se clasifica el caso con $c^2$ vs $4mk$ y se cuentan los cruces por el equilibrio. Prueba los botones con los problemas de controles y busca la **resonancia** ($c=0$, $\\gamma=\\omega$)."}, {"tipo": "texto", "titulo": "Movimiento forzado", "md": "Si una fuerza externa $f(t)$ actúa sobre la masa (p. ej. el soporte oscila):"}, {"tipo": "formula", "tex": "m\\frac{d^2x}{dt^2}+c\\frac{dx}{dt}+kx=f(t)", "nota": "Se resuelve con $x=x_h+x_p$ (coeficientes indeterminados o variación de parámetros). Con $c\\gt0$, $x_h\\to0$ (transitorio) y $x_p$ es el estado estacionario."}, {"tipo": "nota", "md": "**Resonancia pura:** sin amortiguación y con $f=F_0\\cos wt$ de la **misma** frecuencia que $w=\\sqrt{k/m}$, la propuesta $A\\cos wt+B\\operatorname{sen}wt$ choca con $x_h$ y hay que usar $t(A\\cos wt+B\\operatorname{sen}wt)$. Resultado: $x_p=\\dfrac{F_0}{2mw}t\\operatorname{sen}wt$, cuya amplitud crece sin cota."}, {"tipo": "ejemplo", "titulo": "Del resorte a $x''+w^2x=0$", "enunciado": "Clase 14: deducir el modelo a partir de Hooke y Newton.", "pasos": [{"titulo": "En el equilibrio, ¿qué relación hay entre el peso y la fuerza del resorte?", "md": "$$mg=ks\\iff mg-ks=0$$"}, {"titulo": "Si la masa está $x$ bajo el equilibrio, escribe la segunda ley de Newton.", "md": "$$m\\frac{d^2x}{dt^2}=-k(s+x)+mg=-kx+\\underbrace{mg-ks}_{=0}=-kx$$"}, {"titulo": "Divide por $m$ y define $w$.", "md": "$$\\frac{d^2x}{dt^2}+w^2x=0,\\qquad w^2=\\frac km$$\nEcuación auxiliar $m^2+w^2=0\\Rightarrow \\pm wi$: solución $c_1\\cos wt+c_2\\operatorname{sen}wt$."}]}, {"tipo": "ejemplo", "titulo": "Clase 15, Ej. 1 · Guía 3 n°18", "enunciado": "Masa de 1 kg, resorte de 16 N/m, en un líquido con fuerza amortiguadora 10 veces la velocidad. Se libera 1 m bajo el equilibrio con velocidad **ascendente** de 12 m/s.", "pasos": [{"titulo": "PVI y clasificación.", "md": "$$x''+10x'+16x=0,\\ x(0)=1,\\ x'(0)=-12;\\quad c^2=100\\gt64\\ \\Rightarrow\\ \\text{sobreamortiguado}$$"}, {"titulo": "Raíces y solución general.", "md": "$$\\lambda^2+10\\lambda+16=0\\Rightarrow\\lambda=-2,-8;\\quad x=c_1e^{-2t}+c_2e^{-8t}$$"}, {"titulo": "Constantes.", "md": "$$c_1+c_2=1,\\ -2c_1-8c_2=-12\\ \\Rightarrow\\ c_1=-\\tfrac23,\\ c_2=\\tfrac53$$"}], "respuesta": "$$x(t)=-\\tfrac23e^{-2t}+\\tfrac53e^{-8t}$$"}, {"tipo": "ejemplo", "titulo": "Clase 15, Ej. 3", "enunciado": "Un peso de 16 lb se cuelga de un resorte de 5 pie; en equilibrio mide 8.2 pie. Se libera del reposo 2 pie **sobre** el equilibrio. Resistencia igual a la velocidad instantánea.", "pasos": [{"titulo": "Datos: $s$, $k$, $m$, $c$.", "md": "$$s=3.2,\\ k=\\frac{16}{3.2}=5,\\ m=\\frac{16}{32}=\\frac12,\\ c=1$$"}, {"titulo": "EDO y raíces.", "md": "$$x''+2x'+10x=0\\Rightarrow\\lambda=-1\\pm3i\\ (\\text{subamortiguado})$$"}, {"titulo": "Condiciones $x(0)=-2,\\ x'(0)=0$.", "md": "$$c_1=-2,\\quad 2+3c_2=0\\Rightarrow c_2=-\\tfrac23$$"}], "respuesta": "$$x(t)=e^{-t}\\big(-2\\cos3t-\\tfrac23\\operatorname{sen}3t\\big),\\quad A=\\tfrac{2\\sqrt{10}}{3}$$"}, {"tipo": "ejemplo", "titulo": "Clase 15, Ej. 4", "enunciado": "Objeto de 32 lb que alarga $\\tfrac{32}{9}$ pie un resorte; en $t=0$ se sumerge en un líquido con resistencia 6 lb por pie/s y se aplica $f(t)=\\operatorname{sen}4t$. $x(0)=x'(0)=0$.", "pasos": [{"titulo": "Modelo.", "md": "$$x''+6x'+9x=\\operatorname{sen}4t,\\qquad \\lambda=-3\\ \\text{doble (crítico)}$$"}, {"titulo": "Particular $A\\cos4t+B\\operatorname{sen}4t$.", "md": "$$A=-\\tfrac{24}{625},\\qquad B=-\\tfrac{7}{625}$$"}, {"titulo": "Constantes de $x_h=(c_1+c_2t)e^{-3t}$.", "md": "$$c_1=\\tfrac{24}{625},\\qquad c_2=3c_1-4B=\\tfrac{4}{25}$$"}], "respuesta": "$$x(t)=\\Big(\\tfrac{24}{625}+\\tfrac{4}{25}t\\Big)e^{-3t}-\\tfrac{24}{625}\\cos4t-\\tfrac{7}{625}\\operatorname{sen}4t$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 8", "enunciado": "Sistema no amortiguado $m=1$ kg, $k=4$ N/m, en reposo en el equilibrio, con fuerza $F(t)=3\\cos2t$. Resuelva y explique la resonancia.", "pasos": [{"titulo": "PVI y homogénea.", "md": "$$x''+4x=3\\cos2t,\\ x(0)=x'(0)=0;\\quad x_h=c_1\\cos2t+c_2\\operatorname{sen}2t$$"}, {"titulo": "Propuesta con duplicidad y sustitución.", "md": "$$4B=3,\\ A=0\\Rightarrow x_p=\\tfrac34t\\operatorname{sen}2t$$"}, {"titulo": "Condiciones iniciales.", "md": "$$c_1=0,\\qquad 2c_2=0\\Rightarrow c_2=0$$"}], "respuesta": "$$x(t)=\\tfrac34\\,t\\operatorname{sen}2t\\quad(\\text{amplitud }\\tfrac34t\\to\\infty)$$"}, {"tipo": "ojo", "items": ["Usar el peso (lb) como si fuera masa: 8 lb ⇒ $m=8/32$ slug.", "Signo de las condiciones iniciales: \"sobre\" y \"hacia arriba\" son negativos con abajo positivo.", "Contar cruces por el equilibrio con $t<0$: en $(2+4t)e^{-2t}=0$ la raíz $t=-\\frac12$ no cuenta → 0 cruces.", "Ángulo de fase en el cuadrante equivocado (revisa los signos de $c_1$ y $c_2$).", "Clasificar con $c^2$ vs $4k$ olvidando la $m$: es $c^2$ vs $4mk$."]}]}, {"id": "t7", "titulo": "Sistemas de EDO: eliminación y valores propios", "peso": 3, "intro": "Tema nuevo de la Prueba 2: 10 a 15 pts en dos de las tres pautas. Hay dos caminos, eliminación y valores propios, y las pautas aceptan ambos (a veces piden los dos).", "bloques": [{"tipo": "texto", "titulo": "Por qué sistemas", "md": "Muchos modelos tienen varias funciones incógnita acopladas (dos tanques, dos poblaciones, dos masas). Un sistema lineal de primer orden con coeficientes constantes se resuelve de dos maneras: **eliminando** una variable para llegar a una EDO de orden superior, o con **valores y vectores propios** de la matriz del sistema."}, {"tipo": "texto", "titulo": "Método de eliminación (Clase 16)", "md": "Con $D=\\frac{d}{dt}$, el sistema se escribe como un sistema algebraico en operadores:"}, {"tipo": "formula", "tex": "\\begin{cases}x'=ax+by+f(t)\\\\ y'=cx+dy+g(t)\\end{cases}\\iff\\begin{cases}(D-a)x-by=f(t)\\\\ -cx+(D-d)y=g(t)\\end{cases}", "nota": "Los operadores con coeficientes constantes se multiplican como polinomios."}, {"tipo": "texto", "md": "Para eliminar $x$: multiplica la primera por $-c$, aplica $(D-a)$ a la segunda y resta. Queda $(D^2+pD+q)\\,y=h(t)$, una EDO de coeficientes constantes que ya sabes resolver. Alternativa (Clase 16): **despejar** una variable de una ecuación y sustituir en la otra, por ejemplo $y=t-x'$."}, {"tipo": "nota", "md": "Al eliminar aparecen **4 constantes** ($C_1..C_4$) para un sistema de dos ecuaciones de primer orden, pero solo 2 son libres. Reemplaza en una ecuación original para relacionarlas (la rúbrica de la Prueba 2 da 2 de los 10 puntos por esto). Despejando la segunda variable de la primera ecuación te ahorras el paso."}, {"tipo": "lapiz", "texto": "4 constantes → relaciónalas (pauta 5 jun)"}, {"tipo": "texto", "titulo": "Forma matricial (Clase 17)", "md": "$X'=AX$, con $X=(x_1,\\dots,x_n)^T$ y $A=[a_{ij}]$ real constante. La superposición sigue valiendo: combinaciones de soluciones son soluciones. Si $X_1,\\dots,X_n$ son soluciones, se forma $\\Phi(t)=[X_1\\ \\cdots\\ X_n]$ y su Wronskiano $W(t)=\\det\\Phi(t)$; si $W(t_0)\\neq0$ forman un conjunto fundamental y $X=c_1X_1+\\cdots+c_nX_n$."}, {"tipo": "texto", "titulo": "Idea del método", "md": "Probamos $X=v\\,e^{\\lambda t}$ con $v\\neq0$ constante. Entonces $X'=\\lambda ve^{\\lambda t}$ y $AX=Av\\,e^{\\lambda t}$, así que:"}, {"tipo": "formula", "tex": "Av=\\lambda v\\iff(A-\\lambda I)v=0,\\qquad \\det(A-\\lambda I)=0", "nota": "**Teorema:** si $\\lambda$ es valor propio de $A$ y $v$ un vector propio asociado, $X=ve^{\\lambda t}$ es solución de $X'=AX$."}, {"tipo": "texto", "titulo": "Algoritmo", "md": "1) $p(\\lambda)=\\det(A-\\lambda I)$; 2) raíces; 3) vectores propios de cada $\\lambda$; 4) soluciones asociadas; 5) verificar que hay $n$ li; 6) combinación lineal; 7) constantes si hay dato inicial."}, {"tipo": "formula", "tex": "\\text{Reales distintos: }\\ X(t)=c_1v_1e^{\\lambda_1t}+c_2v_2e^{\\lambda_2t}+\\cdots+c_nv_ne^{\\lambda_nt}", "nota": "Valores propios distintos ⇒ vectores propios li."}, {"tipo": "texto", "titulo": "Repetido y diagonalizable", "md": "Si $\\lambda$ tiene multiplicidad $m$ y $\\dim\\ker(A-\\lambda I)=m$, hay $m$ vectores propios li y no hay dificultad: $c_1v_1e^{\\lambda t}+\\cdots+c_mv_me^{\\lambda t}$ (ejemplo 3×3 de clase con $\\lambda=-1$ doble y $\\lambda=5$)."}, {"tipo": "formula", "tex": "\\text{Repetido sin suficientes vectores: } (A-\\lambda I)v=0,\\ (A-\\lambda I)w=v\\ \\Rightarrow\\ X_1=ve^{\\lambda t},\\ X_2=(tv+w)e^{\\lambda t}", "nota": "$w$ es un **vector propio generalizado** (la ayudantía lo llama $P$). La matriz se dice **defectuosa**."}, {"tipo": "formula", "tex": "\\lambda=p+qi,\\ v=a+ib:\\quad X_1=e^{pt}\\big(a\\cos qt-b\\operatorname{sen}qt\\big),\\quad X_2=e^{pt}\\big(a\\operatorname{sen}qt+b\\cos qt\\big)", "nota": "**Complejos:** partes real e imaginaria de $ve^{\\lambda t}$. Con un valor propio del par basta; el conjugado no da soluciones nuevas."}, {"tipo": "nota", "md": "**Plano de fase (Ayudantía 9).** El origen es punto de equilibrio. Reales del mismo signo: nodo (estable si $\\lambda\\lt0$); signos opuestos: silla (inestable); complejos: espiral (estable si $p\\lt0$) o centro si $p=0$; repetido defectuoso: nodo impropio. Explóralo en el widget."}, {"tipo": "gadget", "id": "g_plano", "titulo": "Plano de fase de $X'=AX$", "instrucciones": "Mueve las entradas de $A$ o usa los botones con los sistemas de las pruebas y la Ayudantía 9. Fíjate en cómo el signo de los valores propios decide si las trayectorias entran, salen o giran."}, {"tipo": "ejemplo", "titulo": "Clase 17: $X'=\\begin{pmatrix}4&-3\\\\3&4\\end{pmatrix}X$", "enunciado": "El ejemplo complejo de la clase, paso a paso.", "pasos": [{"titulo": "Ecuación característica y valores propios.", "md": "$$(4-\\lambda)^2+9=0\\Rightarrow\\lambda=4\\pm3i\\quad(p=4,\\ q=3)$$"}, {"titulo": "Vector propio para $\\lambda=4+3i$ y su descomposición $a+ib$.", "md": "$$v=\\begin{pmatrix}1\\\\-i\\end{pmatrix}=\\underbrace{\\begin{pmatrix}1\\\\0\\end{pmatrix}}_{a}+i\\underbrace{\\begin{pmatrix}0\\\\-1\\end{pmatrix}}_{b}$$"}, {"titulo": "Aplica las fórmulas de $X_1$ y $X_2$.", "md": "$$X_1=e^{4t}\\begin{pmatrix}\\cos3t\\\\ \\operatorname{sen}3t\\end{pmatrix},\\qquad X_2=e^{4t}\\begin{pmatrix}-\\operatorname{sen}3t\\\\ \\cos3t\\end{pmatrix}$$"}, {"titulo": "Verifica independencia con el Wronskiano.", "md": "$$W(t)=\\det\\Phi=e^{8t}(\\cos^23t+\\operatorname{sen}^23t)=e^{8t}\\neq0$$"}]}, {"tipo": "ejemplo", "titulo": "Ayudantía 9", "enunciado": "PVI $X'=\\begin{pmatrix}1&2\\\\2&1\\end{pmatrix}X,\\ X(0)=\\begin{pmatrix}3\\\\1\\end{pmatrix}$.", "pasos": [{"titulo": "Valores propios.", "md": "$$(1-\\lambda)^2-4=0\\Rightarrow\\lambda=3,\\ -1$$"}, {"titulo": "Vectores propios.", "md": "$$\\lambda=3:\\ v_1=\\begin{pmatrix}1\\\\1\\end{pmatrix},\\qquad \\lambda=-1:\\ v_2=\\begin{pmatrix}1\\\\-1\\end{pmatrix}$$"}, {"titulo": "Constantes.", "md": "$$c_1+c_2=3,\\ c_1-c_2=1\\Rightarrow c_1=2,\\ c_2=1$$"}], "respuesta": "$$X(t)=2\\begin{pmatrix}1\\\\1\\end{pmatrix}e^{3t}+\\begin{pmatrix}1\\\\-1\\end{pmatrix}e^{-t}$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 9", "enunciado": "Solución general de $X'=\\begin{pmatrix}2&1\\\\-5&0\\end{pmatrix}X$.", "pasos": [{"titulo": "Valores propios.", "md": "$$\\lambda^2-2\\lambda+5=0\\Rightarrow\\lambda=1\\pm2i$$"}, {"titulo": "Vector propio de $1+2i$ y partes $a,b$.", "md": "$$v=\\begin{pmatrix}1\\\\-1+2i\\end{pmatrix},\\quad a=\\begin{pmatrix}1\\\\-1\\end{pmatrix},\\ b=\\begin{pmatrix}0\\\\2\\end{pmatrix}$$"}], "respuesta": "$$X=c_1e^{t}\\begin{pmatrix}\\cos2t\\\\-\\cos2t-2\\operatorname{sen}2t\\end{pmatrix}+c_2e^{t}\\begin{pmatrix}\\operatorname{sen}2t\\\\2\\cos2t-\\operatorname{sen}2t\\end{pmatrix}$$"}, {"tipo": "ejemplo", "titulo": "Ayudantía 9", "enunciado": "$A=\\begin{pmatrix}3&1\\\\0&3\\end{pmatrix}$: valores propios, vector generalizado $P$ y solución general.", "pasos": [{"titulo": "Valor propio y espacio propio.", "md": "$$\\lambda=3\\ \\text{doble},\\quad (A-3I)v=0\\Rightarrow v_1=\\begin{pmatrix}1\\\\0\\end{pmatrix}\\ (\\dim=1)$$"}, {"titulo": "Resuelve $(A-3I)P=v_1$.", "md": "$$P=\\begin{pmatrix}0\\\\1\\end{pmatrix}$$"}], "respuesta": "$$X=c_1\\begin{pmatrix}1\\\\0\\end{pmatrix}e^{3t}+c_2\\Big[t\\begin{pmatrix}1\\\\0\\end{pmatrix}+\\begin{pmatrix}0\\\\1\\end{pmatrix}\\Big]e^{3t}\\quad(\\text{nodo inestable})$$"}, {"tipo": "ojo", "items": ["Dejar 4 constantes libres después de eliminar: hay que relacionarlas reemplazando en una ecuación del sistema (o despejar la segunda función directamente).", "Valor propio doble con un solo vector propio y escribir $c_1ve^{\\lambda t}+c_2ve^{\\lambda t}$: falta el generalizado, $X_2=(vt+w)e^{\\lambda t}$ con $(A-\\lambda I)w=v$.", "En el caso complejo usar las dos raíces conjugadas: basta la parte real y la imaginaria de $ve^{\\lambda t}$ con **un** valor propio.", "Equivocarse en $\\det(A-\\lambda I)$: es $\\lambda^2-(\\operatorname{tr}A)\\lambda+\\det A$."]}]}, {"id": "t8", "titulo": "Series de potencias y Frobenius", "peso": 2, "intro": "Para EDO con coeficientes variables que no son Cauchy-Euler. En la prueba del 2 de junio valió 15 pts: dos series independientes en un punto ordinario, con corrimiento de índices.", "bloques": [{"tipo": "texto", "titulo": "Por qué series", "md": "Con coeficientes constantes sabemos resolver todo. Pero ecuaciones como Bessel $x^2y''+xy'+(x^2-\\nu^2)y=0$, Legendre $(1-x^2)y''-2xy'+n(n+1)y=0$ o Airy $y''-xy=0$ tienen soluciones que **no son funciones elementales**. La idea es buscarlas como series de potencias y determinar los coeficientes con una **relación de recurrencia**: el mismo espíritu de coeficientes indeterminados, pero con infinitos coeficientes."}, {"tipo": "texto", "titulo": "Función analítica", "md": "$f$ es analítica en $c$ si se representa con una serie $\\sum a_n(x-c)^n$ de radio de convergencia positivo. Se escribe la EDO $a_2(x)y''+a_1(x)y'+a_0(x)y=0$ en forma normalizada $y''+P(x)y'+Q(x)y=0$."}, {"tipo": "formula", "tex": "x_0\\ \\text{es punto ordinario}\\iff P(x)\\ \\text{y}\\ Q(x)\\ \\text{son analíticas en } x_0", "nota": "Si no, $x_0$ es **punto singular**. Con $P=p_1/p_2$, $Q=q_1/q_2$ racionales: $x$ es singular $\\iff p_2(x)=0$ o $q_2(x)=0$ (tras simplificar)."}, {"tipo": "texto", "titulo": "Teorema (punto ordinario)", "md": "Si $x_0$ es ordinario, siempre hay **dos soluciones li** de la forma $y=\\sum_{n\\ge0}a_n(x-x_0)^n$, que convergen por lo menos en $|x-x_0|\\lt R$, donde $R$ es la distancia de $x_0$ al punto singular más cercano, **real o complejo**."}, {"tipo": "nota", "md": "Ejemplos de clase: $(x^2+1)y''+y=0$ no tiene singulares reales, pero $\\pm i$ están a distancia 1 de 0: $R\\ge1$. Para $(x^2-4)y''+3xy'+y=0$: $R\\ge2$. Para $(x^2+4)y''+\\dots$ en $x_0=1$: $R\\ge|1-2i|=\\sqrt5$."}, {"tipo": "lapiz", "texto": "radio ≥ distancia al singular más cercano, también complejo"}, {"tipo": "texto", "titulo": "Método en punto ordinario ($x_0=0$)", "md": "1) Propón $y=\\sum a_nx^n$, $y'=\\sum na_nx^{n-1}$, $y''=\\sum n(n-1)a_nx^{n-2}$. 2) Reemplaza y **multiplica** las potencias de $x$ de los coeficientes. 3) **Corre índices** para que todas las series tengan $x^k$. 4) Separa los primeros términos sueltos e iguala cada coeficiente a 0. 5) Despeja la **recurrencia** y escribe $y=a_0y_1+a_1y_2$."}, {"tipo": "formula", "tex": "\\sum_{n\\ge2}n(n-1)a_nx^{n-2}=\\sum_{k\\ge0}(k+2)(k+1)a_{k+2}x^k,\\qquad \\sum_{n\\ge0}a_nx^{n+2}=\\sum_{k\\ge2}a_{k-2}x^k", "nota": "Los dos corrimientos de índice más usados ($k=n-2$ y $k=n+2$)."}, {"tipo": "gadget", "id": "g_series", "titulo": "Sumas parciales de una solución en serie", "instrucciones": "Elige una ecuación y sube el grado $N$. Dentro del radio de convergencia la suma parcial se va pegando a la solución exacta; fuera de él, no."}, {"tipo": "formula", "tex": "x_0\\ \\text{singular regular}\\iff p(x)=(x-x_0)P(x)\\ \\text{y}\\ q(x)=(x-x_0)^2Q(x)\\ \\text{analíticas en } x_0", "nota": "Un singular que no es regular es **irregular**. Ej.: en $(x^2-4)^2y''+3(x-2)y'+5y=0$, $x=2$ es regular y $x=-2$ irregular."}, {"tipo": "formula", "tex": "r(r-1)+p_0r+q_0=0,\\qquad p_0=\\lim_{x\\to x_0}(x-x_0)P(x),\\quad q_0=\\lim_{x\\to x_0}(x-x_0)^2Q(x)", "nota": "**Ecuación indicial.** Sus raíces son los exponentes de la singularidad. Es lo que sale al igualar a 0 el coeficiente de la **menor potencia** tras reemplazar la serie de Frobenius (condición para $a_0\\neq0$)."}, {"tipo": "formula", "tex": "\\text{Frobenius: } y=(x-x_0)^r\\sum_{n\\ge0}a_n(x-x_0)^n=\\sum_{n\\ge0}a_n(x-x_0)^{n+r},\\quad a_0\\neq0", "nota": "Si $x_0$ es singular regular existe **al menos una** solución así, con $r$ raíz indicial; converge al menos en $0\\lt x-x_0\\lt R$."}, {"tipo": "formula", "tex": "\\begin{array}{l|l} r_1-r_2\\notin\\mathbb Z & y_1=\\sum a_nx^{n+r_1},\\quad y_2=\\sum b_nx^{n+r_2}\\\\ r_1-r_2\\in\\mathbb N & y_1=\\sum a_nx^{n+r_1},\\quad y_2=C\\,y_1\\ln x+\\sum b_nx^{n+r_2}\\\\ r_1=r_2 & y_1=\\sum a_nx^{n+r_1},\\quad y_2=y_1\\ln x+\\sum b_nx^{n+r_1}\\end{array}", "nota": "Los tres casos ($x_0=0$, raíces reales $r_1\\ge r_2$, $x\\gt0$). En el caso 2 la constante $C$ podría ser 0."}, {"tipo": "ejemplo", "titulo": "Clase 18: $y''+y=0$ por series", "enunciado": "Comprobar que el método recupera $\\cos x$ y $\\operatorname{sen}x$.", "pasos": [{"titulo": "Reemplaza $y=\\sum a_nx^n$ y lleva todo a $x^k$.", "md": "$$\\sum_{k\\ge0}\\big[(k+2)(k+1)a_{k+2}+a_k\\big]x^k=0$$"}, {"titulo": "Recurrencia.", "md": "$$a_{k+2}=-\\frac{a_k}{(k+2)(k+1)},\\quad k\\ge0$$"}, {"titulo": "Coeficientes pares en función de $a_0$.", "md": "$$a_2=-\\frac{a_0}{2!},\\ a_4
