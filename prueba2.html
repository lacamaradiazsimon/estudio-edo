=\\frac{a_0}{4!},\\ a_6=-\\frac{a_0}{6!},\\ \\dots\\ \\ a_{2k}=\\frac{(-1)^ka_0}{(2k)!}$$"}, {"titulo": "Coeficientes impares en función de $a_1$ y solución.", "md": "$$a_{2k+1}=\\frac{(-1)^ka_1}{(2k+1)!}\\ \\Rightarrow\\ y=a_0\\cos x+a_1\\operatorname{sen}x$$\nSin puntos singulares: $R=\\infty$. Mira el widget."}]}, {"tipo": "ejemplo", "titulo": "Ayudantía 9", "enunciado": "$y''+2xy'+2y=0$: recurrencia y primeros cuatro términos no nulos de $y_1$ e $y_2$.", "pasos": [{"titulo": "Todas las series ya pueden escribirse con $x^n$. Recurrencia.", "md": "$$(n+2)(n+1)a_{n+2}+2(n+1)a_n=0\\ \\Rightarrow\\ a_{n+2}=-\\frac{2a_n}{n+2}$$"}, {"titulo": "Con $a_0=1,a_1=0$.", "md": "$$a_2=-1,\\ a_4=\\tfrac12,\\ a_6=-\\tfrac16$$"}, {"titulo": "Con $a_0=0,a_1=1$.", "md": "$$a_3=-\\tfrac23,\\ a_5=\\tfrac4{15},\\ a_7=-\\tfrac{8}{105}$$"}], "respuesta": "$$y_1=1-x^2+\\tfrac{x^4}{2}-\\tfrac{x^6}{6}+\\cdots\\ (=e^{-x^2}),\\qquad y_2=x-\\tfrac23x^3+\\tfrac4{15}x^5-\\tfrac8{105}x^7+\\cdots$$"}, {"tipo": "ejemplo", "titulo": "Guía 5, n°3", "enunciado": "$2xy''-y'+2y=0$. (a) $x=0$ es singular regular. (b) Indicial y raíces. (c) Serie de la raíz mayor.", "pasos": [{"titulo": "(a) Forma normal, $p$ y $q$.", "md": "$$P=-\\frac{1}{2x},\\ Q=\\frac1x;\\quad xP=-\\tfrac12,\\ x^2Q=x\\ \\text{analíticas}$$"}, {"titulo": "(b) Indicial.", "md": "$$r(r-1)-\\tfrac12r=r^2-\\tfrac32r=0\\Rightarrow r=0,\\ \\tfrac32\\ (\\text{diferencia no entera})$$"}, {"titulo": "(c) Recurrencia general con $y=\\sum a_nx^{n+r}$.", "md": "$$(n+r)(2n+2r-3)a_n=-2a_{n-1}$$"}, {"titulo": "Con $r=\\tfrac32$.", "md": "$$a_n=-\\frac{2a_{n-1}}{n(2n+3)}:\\ a_1=-\\tfrac25,\\ a_2=\\tfrac{2}{35},\\ a_3=-\\tfrac{4}{945}$$"}], "respuesta": "$$y_1=x^{3/2}\\Big(1-\\tfrac25x+\\tfrac{2}{35}x^2-\\tfrac{4}{945}x^3+\\cdots\\Big)$$"}, {"tipo": "ejemplo", "titulo": "Clase 18", "enunciado": "Solución general de $3xy''+y'-y=0$ por Frobenius.", "pasos": [{"titulo": "Indicial.", "md": "$$p_0=\\tfrac13,\\ q_0=0:\\ r^2-\\tfrac23r=0\\Rightarrow r=\\tfrac23,\\ 0$$"}, {"titulo": "Recurrencia.", "md": "$$(n+r)(3n+3r-2)a_n=a_{n-1}$$"}, {"titulo": "Raíz $r=\\tfrac23$ y raíz $r=0$.", "md": "$$r=\\tfrac23:\\ a_n=\\frac{a_{n-1}}{n(3n+2)};\\qquad r=0:\\ b_n=\\frac{b_{n-1}}{n(3n-2)}$$"}], "respuesta": "$$y=C_1x^{2/3}\\Big(1+\\tfrac{x}{5}+\\tfrac{x^2}{80}+\\cdots\\Big)+C_2\\Big(1+x+\\tfrac{x^2}{8}+\\tfrac{x^3}{168}+\\cdots\\Big)$$"}, {"tipo": "ojo", "items": ["Clasificar el punto sin normalizar: $P$ y $Q$ son los coeficientes **después** de dividir por el de $y''$.", "Olvidar los puntos singulares complejos al dar el radio mínimo de convergencia.", "Correr índices mal: al pasar $x^{n-2}$ a $x^k$ también cambia el índice inicial ($n=2\\to k=0$).", "En Frobenius con raíces que difieren en un entero, asumir dos series sin revisar: la segunda solución puede llevar $\\ln x$."]}]}, {"id": "t9", "titulo": "Transformada de Laplace (complemento)", "peso": 1, "intro": "**Fuera de tu temario** (viene de la Guía 4). Pero ojo: en dos de las tres pautas de Prueba 2 valió 20 a 24 pts, así que conviene confirmar con el profesor si entra.", "bloques": [{"tipo": "texto", "titulo": "La idea", "md": "La transformada de Laplace convierte una EDO lineal con coeficientes constantes y condiciones iniciales en una **ecuación algebraica** en $s$. Se despeja $Y(s)$ y se vuelve atrás con la inversa. Es especialmente útil con lados derechos por tramos (escalón) o convoluciones."}, {"tipo": "formula", "tex": "\\mathcal L\\{f(t)\\}=F(s)=\\int_0^{\\infty}e^{-st}f(t)\\,dt=\\lim_{b\\to\\infty}\\int_0^{b}e^{-st}f(t)\\,dt", "nota": "Existe si $f$ es continua por tramos en $[0,\\infty)$ y de orden exponencial. En una prueba \"por definición\", escribe el límite (la rúbrica lo exige)."}, {"tipo": "lapiz", "texto": "impropia → escribir el límite (4 pts)"}, {"tipo": "formula", "tex": "\\mathcal L\\{t^n\\}=\\frac{n!}{s^{n+1}},\\quad \\mathcal L\\{e^{at}\\}=\\frac{1}{s-a},\\quad \\mathcal L\\{\\cos at\\}=\\frac{s}{s^2+a^2},\\quad \\mathcal L\\{\\operatorname{sen}at\\}=\\frac{a}{s^2+a^2}", "nota": "Tabla que se entregó en la Prueba 2. Linealidad: $\\mathcal L\\{\\alpha f+\\beta g\\}=\\alpha F+\\beta G$."}, {"tipo": "formula", "tex": "\\mathcal L\\{e^{at}f(t)\\}=F(s-a)", "nota": "Primer teorema de traslación: la exponencial corre la variable $s$."}, {"tipo": "formula", "tex": "\\mathcal L\\{y'\\}=sY-y(0),\\qquad \\mathcal L\\{y''\\}=s^2Y-sy(0)-y'(0)", "nota": "Transformada de derivadas: incorpora las condiciones iniciales."}, {"tipo": "formula", "tex": "\\mathcal L\\{\\mathscr U(t-a)\\}=\\frac{e^{-as}}{s},\\qquad \\mathcal L\\{f(t-a)\\mathscr U(t-a)\\}=e^{-as}F(s)", "nota": "Escalón unitario (Heaviside) y segundo teorema de traslación."}, {"tipo": "formula", "tex": "(f*g)(t)=\\int_0^tf(\\tau)g(t-\\tau)\\,d\\tau,\\qquad \\mathcal L\\{f*g\\}=F(s)G(s)", "nota": "Convolución: resuelve ecuaciones integrales como $y=t^3+\\int_0^ty(z)\\operatorname{sen}(t-z)dz$."}, {"tipo": "formula", "tex": "\\mathcal L\\{t\\,f(t)\\}=-F'(s),\\qquad \\mathcal L\\Big\\{\\int_0^tf(\\tau)d\\tau\\Big\\}=\\frac{F(s)}{s},\\qquad \\mathcal L\\Big\\{\\frac{f(t)}{t}\\Big\\}=\\int_s^{\\infty}F(u)\\,du", "nota": "Propiedades usadas en la Guía 4 (n°11, 14, 17)."}, {"tipo": "texto", "titulo": "Inversas", "md": "casi siempre por **fracciones parciales** hasta llegar a formas de la tabla. Completa cuadrados para $\\frac{s+b}{(s+a)^2+k^2}$ y usa la traslación. Ej. (Guía 4): $\\frac{1}{s^3+5s}=\\frac15\\Big(\\frac1s-\\frac{s}{s^2+5}\\Big)\\Rightarrow\\frac15-\\frac15\\cos\\sqrt5t$."}, {"tipo": "gadget", "id": "g_laplace", "titulo": "Fracciones parciales para la inversa", "instrucciones": "Calcula $A$ y $B$ en tu hoja, escríbelos y revisa. El primer caso es la pregunta 3c de la Prueba 2 del 5 de junio; después genera ejercicios nuevos."}, {"tipo": "nota", "md": "Una $F(s)$ que no tiende a 0 cuando $s\\to\\infty$ no es transformada de ninguna función de orden exponencial. Por eso (Guía 4, n°4) no existe $f$ con $\\mathcal L\\{f\\}=\\frac{s}{s+4}$."}, {"tipo": "ejemplo", "titulo": "Guía 4, n°7", "enunciado": "PVI $y''+y=\\sqrt2\\operatorname{sen}(\\sqrt2t),\\ y(0)=10,\\ y'(0)=0$.", "pasos": [{"titulo": "Transforma.", "md": "$$s^2Y-10s+Y=\\frac{2}{s^2+2}$$"}, {"titulo": "Despeja y separa.", "md": "$$Y=\\frac{10s}{s^2+1}+\\frac{2}{s^2+1}-\\frac{2}{s^2+2}$$"}], "respuesta": "$$y(t)=10\\cos t+2\\operatorname{sen}t-\\sqrt2\\operatorname{sen}(\\sqrt2t)$$"}, {"tipo": "ojo", "items": ["Por definición con una función por tramos: la integral impropia se escribe como **límite** (la pauta da puntos solo por eso).", "Fracciones parciales con un factor repetido $(s-a)^2$: lleva dos fracciones, $\\frac{A}{s-a}+\\frac{B}{(s-a)^2}$.", "Olvidar las condiciones iniciales al transformar $y'$ e $y''$.", "Con el escalón, trasladar solo una parte: $\\mathcal L^{-1}\\{e^{-as}F(s)\\}=f(t-a)\\,\\mathscr U(t-a)$ traslada **toda** la función."]}]}], "quiz": [{"tema": "t1", "dif": 1, "q": "¿Cuál de estas EDO es lineal?", "op": ["$x^2y''+e^xy'-y=\\operatorname{sen} x$", "$yy''+y'=0$", "$y''+\\operatorname{sen} y=0$", "$(y')^2+y=x$"], "ok": 0, "exp": "Es lineal si $y$ y sus derivadas aparecen a la primera potencia, multiplicadas solo por funciones de $x$. $yy''$, $\\operatorname{sen} y$ y $(y')^2$ rompen la linealidad."}, {"tema": "t1", "dif": 2, "q": "Para $(x-1)y''-xy'+y=0$ con $y(3)=1$, $y'(3)=0$, ¿en qué intervalo garantiza el teorema una solución única?", "op": ["$(1,\\infty)$", "$\\mathbb R$", "$(-\\infty,1)$", "$(0,\\infty)$"], "ok": 0, "exp": "$a_2(x)=x-1$ se anula en $x=1$. El intervalo más grande que contiene a $x_0=3$ sin ese punto es $(1,\\infty)$."}, {"tema": "t1", "dif": 1, "q": "$W[e^x,xe^x]$ es:", "op": ["$e^{2x}$", "$0$", "$xe^{2x}$", "$-e^{2x}$"], "ok": 0, "exp": "$W=e^x(1+x)e^x-e^x\\cdot xe^x=e^{2x}$. El error típico es derivar $xe^x$ como $e^x$ (olvidar la regla del producto)."}, {"tema": "t1", "dif": 2, "q": "El conjunto $\\{1,\\cos 2x,\\cos^2x\\}$ en $\\mathbb R$ es:", "op": ["LD, porque $\\cos^2x=\\frac{1+\\cos2x}{2}$", "LI, porque son tres funciones distintas", "LI, porque su wronskiano es 1", "LD, porque $\\cos 2x$ se anula en algunos puntos"], "ok": 0, "exp": "Basta mostrar una combinación nula con constantes no todas cero: $\\frac12\\cdot1+\\frac12\\cos2x-\\cos^2x=0$. Ser \"distintas\" no implica LI."}, {"tema": "t1", "dif": 2, "q": "Si $y_1$, $y_2$ son soluciones de $y''+P(x)y'+Q(x)y=0$ en $I$ (con $P,Q$ continuas) y $W[y_1,y_2](x_0)=0$ para algún $x_0\\in I$, entonces:", "op": ["Son LD en $I$ (por Abel, $W\\equiv0$)", "Son LI en $I$", "No se puede concluir nada", "$y_1=y_2$"], "ok": 0, "exp": "Por la fórmula de Abel $W=ce^{-\\int P}$: si se anula en un punto, $c=0$ y $W\\equiv0$, así que son LD (Guía 3, ej. 7). Ser LD no significa que sean iguales: pueden ser múltiplos."}, {"tema": "t1", "dif": 1, "q": "Si $y_h=c_1e^x+c_2e^{2x}$ y $y_p=3x$ es una solución particular, la solución general de la no homogénea es:", "op": ["$c_1e^x+c_2e^{2x}+3x$", "$3x$", "$c_1e^x+c_2e^{2x}$", "$c_1(e^x+3x)+c_2e^{2x}$"], "ok": 0, "exp": "Siempre $y=y_h+y_p$. La particular no lleva constante."}, {"tema": "t1", "dif": 2, "q": "Si $y_{p1}$ resuelve $L(y)=t^2+1$ y $y_{p2}$ resuelve $L(y)=e^t$, ¿qué resuelve $y_{p1}-y_{p2}$?", "op": ["$L(y)=t^2+1-e^t$", "$L(y)=t^2+1+e^t$", "$L(y)=0$", "Nada: no se pueden restar"], "ok": 0, "exp": "Por linealidad $L(y_{p1}-y_{p2})=L(y_{p1})-L(y_{p2})$. Es el principio de superposición para no homogéneas."}, {"tema": "t1", "dif": 3, "q": "¿Cuántas condiciones iniciales necesita un PVI de $y'''-3y''+4y'-12y=e^{3x}$ para tener solución única?", "op": ["3, todas en el mismo $x_0$", "2", "1", "3, en puntos distintos"], "ok": 0, "exp": "Orden $n=3$ ⇒ $y(x_0)$, $y'(x_0)$ e $y''(x_0)$. Si son en puntos distintos ya es un problema de frontera, no un PVI."}, {"tema": "t2", "dif": 1, "q": "En la fórmula $y_2=y_1\\int\\frac{e^{-\\int P\\,dx}}{y_1^2}dx$, $P(x)$ es:", "op": ["El coeficiente de $y'$ después de dividir por el de $y''$", "El coeficiente de $y'$ en la ecuación original", "El coeficiente de $y$", "El lado derecho"], "ok": 0, "exp": "La fórmula vale para la forma normalizada $y''+P(x)y'+Q(x)y=0$. Leer $P$ sin normalizar es el error más común."}, {"tema": "t2", "dif": 2, "q": "Para $(x-1)y''-xy'+y=0$, $e^{-\\int P\\,dx}$ es:", "op": ["$e^x(x-1)$", "$e^{-x}(x-1)$", "$e^{x^2/2}$", "$\\frac{e^x}{x-1}$"], "ok": 0, "exp": "$P=-\\frac{x}{x-1}=-1-\\frac1{x-1}$, así $\\int P=-x-\\ln|x-1|$ y $e^{-\\int P}=e^{x}(x-1)$ (pauta 2025-2)."}, {"tema": "t2", "dif": 2, "q": "Sabiendo que $y_1=x$ resuelve $x^2y''-xy'+y=0$, la segunda solución es:", "op": ["$x\\ln x$", "$x^2$", "$\\ln x$", "$\\frac1x$"], "ok": 0, "exp": "$P=-\\frac1x$, $e^{-\\int P}=x$, $y_2=x\\int\\frac{x}{x^2}dx=x\\ln x$. Coincide con Cauchy-Euler de raíz doble $m=1$."}, {"tema": "t2", "dif": 2, "q": "Para $xy''+3y'=0$ con $y_1=1$, la solución general es:", "op": ["$C_1+\\dfrac{C_2}{x^2}$", "$C_1+C_2x^3$", "$C_1+C_2\\ln x$", "$C_1+C_2e^{-3x}$"], "ok": 0, "exp": "$P=\\frac3x$ ⇒ $e^{-\\int P}=x^{-3}$ ⇒ $y_2=\\int x^{-3}dx=-\\frac1{2x^2}$; la constante se absorbe (Guía 3, ej. 1)."}, {"tema": "t2", "dif": 3, "q": "Sea $y''+a_1(x)y'+a_0(x)y=0$ con $a_1(x)=\\frac2x$. Por la fórmula de Abel, el wronskiano de dos soluciones es:", "op": ["$\\dfrac{c}{x^2}$", "$cx^2$", "$c\\,e^{2x}$", "$c\\ln x$"], "ok": 0, "exp": "$W=ce^{-\\int\\frac2x dx}=ce^{-2\\ln x}=cx^{-2}$."}, {"tema": "t2", "dif": 2, "q": "En la vía \"$y_2=u\\,y_1$\" para $xy''-(x+1)y'+y=0$ con $y_1=e^x$, ¿qué ecuación resulta para $v=u'$?", "op": ["$v'+\\left(1-\\frac1x\\right)v=0$", "$v'-v=0$", "$xv''+v=0$", "$v'+\\frac{v}{x}=x$"], "ok": 0, "exp": "Al reemplazar se cancelan los términos en $u$ y queda $xu''e^x+(x-1)u'e^x=0$ ⇒ $v'+(1-\\frac1x)v=0$, separable: $v=xe^{-x}$ (pauta abril 2026)."}, {"tema": "t2", "dif": 1, "q": "Si $y_1=x^4$ resuelve $x^2y''-7xy'+16y=0$, la segunda solución es:", "op": ["$x^4\\ln x$", "$x^{-4}$", "$x^8$", "$x^3$"], "ok": 0, "exp": "$P=-\\frac7x$, $e^{-\\int P}=x^7$, $y_2=x^4\\int\\frac{x^7}{x^8}dx=x^4\\ln x$ (Guía 3, ej. 13a). Es Cauchy-Euler con raíz doble $m=4$."}, {"tema": "t3", "dif": 1, "q": "La solución general de $y''+y'-6y=0$ es:", "op": ["$C_1e^{-3x}+C_2e^{2x}$", "$C_1e^{3x}+C_2e^{-2x}$", "$e^{-x/2}(C_1\\cos x+C_2\\operatorname{sen} x)$", "$(C_1+C_2x)e^{2x}$"], "ok": 0, "exp": "$m^2+m-6=(m+3)(m-2)$ ⇒ $m=-3,\\,2$. El distractor con signos cambiados es leer las raíces de los factores al revés."}, {"tema": "t3", "dif": 1, "q": "La solución general de $y''-2y'+y=0$ es:", "op": ["$C_1e^x+C_2xe^x$", "$C_1e^x+C_2e^x$", "$C_1e^x+C_2e^{-x}$", "$C_1\\cos x+C_2\\operatorname{sen} x$"], "ok": 0, "exp": "$(r-1)^2=0$: raíz doble $r=1$. La segunda función lleva una $x$ (pauta 29/04: 2 pts por reconocer la raíz doble)."}, {"tema": "t3", "dif": 2, "q": "La solución general de $2y''-4y'+8y=0$ es:", "op": ["$e^x(C_1\\cos\\sqrt3x+C_2\\operatorname{sen}\\sqrt3x)$", "$e^{2x}(C_1\\cos2x+C_2\\operatorname{sen}2x)$", "$C_1e^{x}+C_2e^{\\sqrt3x}$", "$e^x(C_1\\cos3x+C_2\\operatorname{sen}3x)$"], "ok": 0, "exp": "Divide por 2: $m^2-2m+4=0$ ⇒ $m=1\\pm\\sqrt3\\,i$ (Guía 3, ej. 3b). El $\\beta$ es $\\sqrt3$, no $3$."}, {"tema": "t3", "dif": 2, "q": "La ecuación $y'''-3y''+4y'-12y=0$ tiene solución general:", "op": ["$C_1e^{3x}+C_2\\cos2x+C_3\\operatorname{sen}2x$", "$C_1e^{3x}+C_2e^{2x}+C_3e^{-2x}$", "$C_1e^{-3x}+C_2\\cos2x+C_3\\operatorname{sen}2x$", "$C_1e^{3x}+e^{2x}(C_2\\cos x+C_3\\operatorname{sen} x)$"], "ok": 0, "exp": "$(r^2+4)(r-3)=0$ ⇒ $r=3$ y $r=\\pm2i$. $r^2+4$ da raíces imaginarias, no $\\pm2$ (pauta 30/04)."}, {"tema": "t3", "dif": 3, "q": "¿Cuál es la menor orden de una EDO lineal homogénea de coeficientes constantes reales que tenga a $e^x$ y $\\operatorname{sen} x$ como soluciones?", "op": ["3", "2", "4", "1"], "ok": 0, "exp": "Necesita las raíces $1$ y $\\pm i$ ($\\operatorname{sen} x$ arrastra a $\\cos x$): $(r-1)(r^2+1)$, grado 3. Por eso el V/F del Control 29/04 es **falso** para orden 2."}, {"tema": "t3", "dif": 2, "q": "Si la auxiliar es $m^3(m-1)^2(m+1)^2=0$, ¿cuántas constantes tiene $y_h$?", "op": ["7", "3", "5", "6"], "ok": 0, "exp": "La suma de multiplicidades es $3+2+2=7$, igual al orden (Clase 11)."}, {"tema": "t3", "dif": 2, "q": "La solución general de $y'''+y=0$ es:", "op": ["$C_1e^{-x}+e^{x/2}\\left(C_2\\cos\\frac{\\sqrt3}2x+C_3\\operatorname{sen}\\frac{\\sqrt3}2x\\right)$", "$C_1e^{-x}+C_2\\cos x+C_3\\operatorname{sen} x$", "$C_1e^{x}+e^{-x/2}\\left(C_2\\cos\\frac{\\sqrt3}2x+C_3\\operatorname{sen}\\frac{\\sqrt3}2x\\right)$", "$(C_1+C_2x+C_3x^2)e^{-x}$"], "ok": 0, "exp": "$m^3+1=(m+1)(m^2-m+1)$ ⇒ $m=-1$ y $m=\\frac12\\pm\\frac{\\sqrt3}2i$ (Clase 11)."}, {"tema": "t3", "dif": 3, "tipo": "num", "q": "Resuelve $y''-6y'+5y=0$, $y(0)=3$, $y'(0)=11$. ¿Cuánto vale el coeficiente de $e^{5x}$?", "ok": 2, "tol": 0.001, "exp": "$y=C_1e^x+C_2e^{5x}$: $C_1+C_2=3$, $C_1+5C_2=11$ ⇒ $C_2=2$, $C_1=1$ (Guía 3, ej. 4a)."}, {"tema": "t4", "dif": 1, "q": "Para $y''-2y'+y=\\operatorname{sen} x$ la propuesta correcta es:", "op": ["$A\\operatorname{sen} x+B\\cos x$", "$A\\operatorname{sen} x$", "$Ax\\operatorname{sen} x+Bx\\cos x$", "$Ae^x\\operatorname{sen} x$"], "ok": 0, "exp": "El número de prueba es $i$, que no es raíz de $(r-1)^2$. Hay que poner seno **y** coseno: al derivar se mezclan (pauta 29/04)."}, {"tema": "t4", "dif": 2, "q": "Para $y'''-3y''+4y'-12y=e^{3x}$, la propuesta es:", "op": ["$Axe^{3x}$", "$Ae^{3x}$", "$Ax^2e^{3x}$", "$(Ax+B)e^{3x}$"], "ok": 0, "exp": "$3$ es raíz simple de la auxiliar, así que se multiplica por $x^1$. Con $Ae^{3x}$ se obtiene $0=1$ (pauta 30/04, 3 pts)."}, {"tema": "t4", "dif": 2, "q": "Para $y''-2y'+y=-e^t$ (variable $t$), la propuesta es:", "op": ["$Dt^2e^t$", "$Dte^t$", "$De^t$", "$(Dt+E)e^t$"], "ok": 0, "exp": "$r=1$ es raíz **doble**: $s=2$ ⇒ $Dt^2e^t$. Así lo hace la pauta del control de 60 min."}, {"tema": "t4", "dif": 2, "q": "Para $y''+2y'+y=x+\\cos x$, ¿cuál es la forma de $y_p$?", "op": ["$a+bx+c\\operatorname{sen} x+d\\cos x$", "$bx+d\\cos x$", "$x(a+bx)+c\\operatorname{sen} x+d\\cos x$", "$(a+bx)e^{-x}+c\\cos x$"], "ok": 0, "exp": "Polinomio de grado 1 completo (número 0, no es raíz) más seno y coseno (número $i$, no es raíz). La forma vale 8 de 15 pts en esa pauta."}, {"tema": "t4", "dif": 1, "q": "¿Para cuál de estas EDO **no** sirve coeficientes indeterminados?", "op": ["$y''+y=\\tan x$", "$y''+y=x^2e^x$", "$y''-4y=\\cos 3x$", "$y''+y'=10x^4+2$"], "ok": 0, "exp": "$\\tan x$ no es de la familia polinomio·exponencial·seno/coseno: sus derivadas no se \"cierran\". Hay que usar variación de parámetros."}, {"tema": "t4", "dif": 2, "q": "En variación de parámetros, para $x^2y''-2xy'+2y=x^2\\ln x$ la función $f$ que va en $W_1,W_2$ es:", "op": ["$\\ln x$", "$x^2\\ln x$", "$\\frac{\\ln x}{x^2}$", "$x\\ln x$"], "ok": 0, "exp": "Primero se normaliza dividiendo por $x^2$: $y''-\\frac2xy'+\\frac2{x^2}y=\\ln x$ (2 pts en la pauta 30/04)."}, {"tema": "t4", "dif": 2, "q": "Con $y_1=e^{3t}$, $y_2=te^{3t}$, el wronskiano vale:", "op": ["$e^{6t}$", "$te^{6t}$", "$3e^{6t}$", "$0$"], "ok": 0, "exp": "$W=e^{3t}(1+3t)e^{3t}-3e^{3t}\\cdot te^{3t}=e^{6t}$ (control de 60 min, P2)."}, {"tema": "t4", "dif": 3, "q": "Una solución particular de $y''-6y'+9y=t^{-3}e^{3t}$ es:", "op": ["$\\dfrac{e^{3t}}{2t}$", "$\\dfrac{e^{3t}}{t}$", "$-\\dfrac{e^{3t}}{2t^2}$", "$At^{-3}e^{3t}$"], "ok": 0, "exp": "$u_1'=-t^{-2}$ ⇒ $u_1=\\frac1t$; $u_2'=t^{-3}$ ⇒ $u_2=-\\frac1{2t^2}$; $y_p=\\frac{e^{3t}}t-\\frac{e^{3t}}{2t}=\\frac{e^{3t}}{2t}$."}, {"tema": "t4", "dif": 2, "tipo": "num", "q": "En $y'''-3y''+4y'-12y=e^{3x}$ con $y_p=Axe^{3x}$, ¿cuánto vale $A$? (usa coma o punto)", "ok": 0.0769231, "tol": 0.001, "exp": "Al reemplazar queda $13Ae^{3x}=e^{3x}$ ⇒ $A=\\frac1{13}\\approx0{,}0769$. Truco: $L(xe^{rx})=p'(r)e^{rx}$ con $p'(3)=27-18+4=13$."}, {"tema": "t4", "dif": 3, "tipo": "num", "q": "Para $y''-10y'+25y=30x+3$ con $y_p=Ax+B$, ¿cuánto vale $B$?", "ok": 0.6, "tol": 0.001, "exp": "$-10A+25(Ax+B)=30x+3$ ⇒ $A=\\frac65$ y $25B-12=3$ ⇒ $B=\\frac35=0{,}6$ (Clase 12)."}, {"tema": "t5", "dif": 1, "q": "La ecuación indicial de $x^2y''-2xy'+2y=0$ es:", "op": ["$m^2-3m+2=0$", "$m^2-2m+2=0$", "$m^2+2m+2=0$", "$m^2-m+2=0$"], "ok": 0, "exp": "$am^2+(b-a)m+c$ con $a=1$, $b=-2$, $c=2$: $m^2-3m+2$. Olvidar el $-a$ da el distractor $m^2-2m+2$."}, {"tema": "t5", "dif": 2, "q": "La solución general de $x^2y''-xy'+2y=0$ ($x>0$) es:", "op": ["$x[C_1\\cos(\\ln x)+C_2\\operatorname{sen}(\\ln x)]$", "$e^x(C_1\\cos x+C_2\\operatorname{sen} x)$", "$e^{-x}(C_1\\cos x+C_2\\operatorname{sen} x)$", "$C_1x+C_2x\\ln x$"], "ok": 0, "exp": "$m^2-2m+2=0$ ⇒ $m=1\\pm i$ ⇒ $x^1[\\cos(1\\cdot\\ln x),\\ \\operatorname{sen}(\\ln x)]$ (Control 2025-2 P2; la opción con $e^{-x}$ es la de la Guía 3, 6a, que es falsa)."}, {"tema": "t5", "dif": 1, "q": "La solución general de $x^2y''+3xy'+y=0$ es:", "op": ["$\\alpha x^{-1}+\\beta x^{-1}\\ln x$", "$\\alpha x^{-1}+\\beta x$", "$(\\alpha+\\beta x)e^{-x}$", "$\\alpha x^{-1}+\\beta x^{-2}$"], "ok": 0, "exp": "$m^2+2m+1=(m+1)^2$ ⇒ $m=-1$ doble ⇒ $x^{-1}$ y $x^{-1}\\ln x$ (pauta abril 2026, P3)."}, {"tema": "t5", "dif": 3, "tipo": "num", "q": "En $x^2y''-3xy'+ay=0$, ¿para qué valor de $a$ existe una solución del tipo $x^2\\ln x$?", "ok": 4, "tol": 0.001, "exp": "Indicial $m^2-4m+a=0$; $x^2\\ln x$ requiere $m=2$ raíz doble: $p(2)=a-4=0$ y $p'(2)=0$ ⇒ $a=4$ (pauta 29/04, P2b)."}, {"tema": "t5", "dif": 2, "q": "Con el cambio $x=e^t$, la ecuación $x^2y''+10xy'+8y=0$ se transforma en:", "op": ["$Y''+9Y'+8Y=0$", "$Y''+10Y'+8Y=0$", "$Y''+11Y'+8Y=0$", "$Y''-9Y'+8Y=0$"], "ok": 0, "exp": "$aY''+(b-a)Y'+cY=0$ con $a=1$, $b=10$, $c=8$ (Guía 3, ej. 5)."}, {"tema": "t5", "dif": 2, "q": "Para $x^2y''-3xy'+3y=x^2$, ¿qué propuesta directa funciona?", "op": ["$y_p=Ax^2$, y da $A=-1$", "$y_p=Ax^2\\ln x$", "$y_p=Ae^{2x}$", "$y_p=Ax^2$, y da $A=1$"], "ok": 0, "exp": "Raíces $m=1,3$; $2$ no es raíz, así que $Ax^2$ sirve: $2A-6A+3A=-A=1$ ⇒ $A=-1$ (pauta 29/04)."}, {"tema": "t5", "dif": 2, "q": "La derivada $\\frac{d^2y}{dx^2}$ con $t=\\ln x$ es:", "op": ["$\\frac1{x^2}\\left(Y''-Y'\\right)$", "$\\frac1{x^2}Y''$", "$\\frac1xY''$", "$\\frac1{x^2}\\left(Y''+Y'\\right)$"], "ok": 0, "exp": "$\\frac{dy}{dx}=\\frac1xY'$ y derivando de nuevo (regla del producto) aparece $-\\frac1{x^2}Y'$. Vale 12 pts en la segunda vía de la pauta 2025-2."}, {"tema": "t5", "dif": 3, "q": "La solución de $x^2y''+xy'+9y=0$ es:", "op": ["$C_1\\cos(3\\ln x)+C_2\\operatorname{sen}(3\\ln x)$", "$C_1\\cos3x+C_2\\operatorname{sen}3x$", "$x^3(C_1+C_2\\ln x)$", "$C_1x^3+C_2x^{-3}$"], "ok": 0, "exp": "$m^2+9=0$ ⇒ $m=\\pm3i$ ($\\alpha=0$): $\\cos(3\\ln x)$, $\\operatorname{sen}(3\\ln x)$ (Guía 3, 3l)."}, {"tema": "t6", "dif": 1, "q": "Una masa que pesa 8 lb alarga un resorte 2 pies. ¿Cuánto valen $m$ y $k$?", "op": ["$m=\\frac14$ slug, $k=4$ lb/pie", "$m=8$ slug, $k=4$ lb/pie", "$m=\\frac14$ slug, $k=16$ lb/pie", "$m=8$ slug, $k=16$ lb/pie"], "ok": 0, "exp": "8 lb es **peso**: $m=8/32$. Hooke: $k=W/s=8/2=4$ (Clase 15, ej. 2)."}, {"tema": "t6", "dif": 1, "q": "Con abajo positivo, \"se libera 2 m arriba del equilibrio, desde el reposo\" se traduce como:", "op": ["$x(0)=-2$, $x'(0)=0$", "$x(0)=2$, $x'(0)=0$", "$x(0)=0$, $x'(0)=-2$", "$x(0)=-2$, $x'(0)=-2$"], "ok": 0, "exp": "Arriba es negativo y \"reposo\" significa velocidad inicial cero."}, {"tema": "t6", "dif": 2, "q": "$m=1$, $k=4$ y $c=4$. El movimiento es:", "op": ["Críticamente amortiguado", "Sobreamortiguado", "Subamortiguado", "Armónico simple"], "ok": 0, "exp": "$c^2=16=4mk=16$ ⇒ crítico, $r=-2$ doble (pauta 29/04, P3b)."}, {"tema": "t6", "dif": 2, "q": "$x(t)=-\\cos4t-\\frac52\\operatorname{sen}4t$. La amplitud es:", "op": ["$\\frac{\\sqrt{29}}2\\approx2{,}69$", "$\\frac72$", "$\\frac32$", "$\\sqrt{29}$"], "ok": 0, "exp": "$A=\\sqrt{(-1)^2+(-\\frac52)^2}=\\sqrt{\\frac{29}4}$ (pauta 30/04). Sumar los coeficientes no da la amplitud."}, {"tema": "t6", "dif": 3, "tipo": "num", "q": "Para $x(t)=-\\cos4t-\\frac52\\operatorname{sen}4t=A\\operatorname{sen}(4t+\\varphi)$, ¿cuánto vale $\\varphi$ en $(0,2\\pi)$? (en radianes, 2 decimales)", "ok": 3.522, "tol": 0.01, "exp": "$\\operatorname{sen}\\varphi=c_1/A<0$ y $\\cos\\varphi=c_2/A<0$: tercer cuadrante. $\\varphi=\\pi+\\arctan\\frac{c_1}{c_2}=\\pi+\\arctan0{,}4\\approx3{,}52$. Solo $\\arctan0{,}4\\approx0{,}38$ es el cuadrante equivocado."}, {"tema": "t6", "dif": 2, "q": "¿Cuántas veces puede pasar por el equilibrio una masa críticamente amortiguada?", "op": ["A lo más una vez", "Nunca", "Infinitas veces", "Exactamente dos veces"], "ok": 0, "exp": "$x=(c_1+c_2t)e^{-\\alpha t}$ y $c_1+c_2t$ tiene a lo más un cero (Clase 15). En el control 29/04 ese cero estaba en $t<0$, así que fueron 0 veces."}, {"tema": "t6", "dif": 2, "q": "Un sistema sin amortiguamiento $x''+x=2\\cos t$ presenta:", "op": ["Resonancia: $x_p=t\\operatorname{sen} t$ crece sin límite", "Amortiguamiento crítico", "Movimiento acotado de amplitud 2", "Pulsaciones que decaen"], "ok": 0, "exp": "$\\omega=1$ coincide con la frecuencia de la fuerza: el número $i$ es raíz y $x_p=t(\\dots)$ (Control 2025-2, P3)."}, {"tema": "t6", "dif": 1, "tipo": "num", "q": "Una masa de 2 slug estira un resorte 2 pies ($g=32$). ¿Cuánto vale $k$ en lb/pie?", "ok": 32, "tol": 0.001, "exp": "$mg=ks$ ⇒ $2\\cdot32=k\\cdot2$ ⇒ $k=32$ (pauta 30/04, 3 pts)."}, {"tema": "t6", "dif": 2, "tipo": "num", "q": "$m=0{,}25$ kg y $k=36$ N/m sin roce. ¿Cuál es el periodo $T$ en segundos? (3 decimales)", "ok": 0.5236, "tol": 0.002, "exp": "$\\omega=\\sqrt{36/0{,}25}=12$ ⇒ $T=\\frac{2\\pi}{12}=\\frac\\pi6\\approx0{,}524$ s (Guía 3, ej. 9)."}, {"tema": "t6", "dif": 3, "q": "$x''+2x'+2x=0$, $x(0)=3$, $x'(0)=0$ da $x=3e^{-t}(\\cos t+\\operatorname{sen} t)$. ¿Cuándo pasa por primera vez por el equilibrio?", "op": ["$t=\\frac{3\\pi}{4}$", "$t=\\frac\\pi4$", "$t=\\frac\\pi2$", "Nunca"], "ok": 0, "exp": "$\\cos t+\\operatorname{sen} t=0$ ⇒ $\\tan t=-1$; el primer $t>0$ es $\\frac{3\\pi}4$ (Guía 3, ej. 8). $\\frac\\pi4$ es donde $\\tan t=+1$."}, {"tema": "t1", "dif": 2, "q": "¿Qué hipótesis del teorema de existencia y unicidad **falla** para $x^2y''+xy'+y=0$, $y(0)=1,\\ y'(0)=0$?", "op": ["$a_2(x)=x^2$ se anula en $x_0=0$.", "Los coeficientes no son continuos.", "Faltan condiciones iniciales."], "ok": 0, "exp": "Correcto: el teorema exige $a_n(x)\\neq0$ en todo el intervalo, incluido $x_0$. Las ecuaciones de Cauchy-Euler se estudian en $x\\gt0$ (o $x\\lt0$) justamente porque $a_2=ax^2$ se anula en 0. Si elegiste «Los coeficientes no son continuos.»: $x^2$, $x$ y $1$ son polinomios: continuos en todo $\\mathbb R$."}, {"tema": "t1", "dif": 2, "q": "$y_1,y_2$ son soluciones de $y''+P(x)y'+Q(x)y=0$ en $I$ y $W[y_1,y_2](x_0)=0$ para un $x_0\\in I$. Entonces:", "op": ["Son ld: $W\\equiv0$ en todo $I$.", "No se puede concluir nada, hay que revisar otros puntos.", "Son li porque $W$ no es cero en todos los puntos."], "ok": 0, "exp": "Exacto: para soluciones, $W$ es siempre nulo o nunca nulo (Abel). Por eso la Guía 3 (n°7) pide probar que dos soluciones con un cero común son ld: en ese punto $W=y_1y_2'-y_2y_1'=0$. Si elegiste «No se puede concluir nada, hay que revisar otros puntos.»: Eso pasa con funciones arbitrarias, no con soluciones de la misma EDO."}, {"tema": "t1", "dif": 2, "q": "Si $y_{p_1}$ resuelve $L(y)=x$ e $y_{p_2}$ resuelve $L(y)=\\cos x$, ¿qué resuelve $3y_{p_1}-y_{p_2}$?", "op": ["$L(y)=3x-\\cos x$", "$L(y)=x+\\cos x$", "$L(y)=0$"], "ok": 0, "exp": "Linealidad: $L(3y_{p_1}-y_{p_2})=3x-\\cos x$. Superposición para no homogéneas: separa el lado derecho en sumandos simples. Si elegiste «$L(y)=x+\\cos x$»: Los coeficientes de la combinación pasan al lado derecho."}, {"tema": "t2", "dif": 2, "q": "En $x^2y''-7xy'+16y=0$ con $y_1=x^4$, ¿cuál es $e^{-\\int a_1dx}$?", "op": ["$x^7$", "$e^{7x}$", "$x^{-7}$"], "ok": 0, "exp": "Normalizada: $a_1=-7/x$, así $e^{7\\ln x}=x^7$. Luego $y_2=x^4\\int x^7/x^8\\,dx=x^4\\ln x$. Guía 3, n°13a: $y_2=x^4\\ln|x|$. Si elegiste «$e^{7x}$»: Usaste $a_1=-7$ sin dividir por $x^2$ (ni siquiera por $x$)."}, {"tema": "t2", "dif": 2, "q": "Según Abel, para $y''+\\frac{2}{x}y'+q(x)y=0$ el Wronskiano de dos soluciones es:", "op": ["$W=\\dfrac{c}{x^2}$", "Depende de $q(x)$.", "$W=c\\,x^2$"], "ok": 0, "exp": "$e^{-\\int 2/x\\,dx}=e^{-2\\ln x}=x^{-2}$. No depende de $q$. Fórmula de Abel: $W=c\\,e^{-\\int a_1dx}$. Si elegiste «Depende de $q(x)$.»: Abel solo usa el coeficiente de $y'$."}, {"tema": "t3", "dif": 2, "q": "(Control 2, 2026) ¿Existe una EDO lineal homogénea de **orden 2** con coeficientes constantes que tenga como soluciones li a $e^x$ y $\\operatorname{sen}x$?", "op": ["No: necesitaría las raíces $1$ y $\\pm i$, es decir grado $\\ge3$.", "Sí: $(m-1)(m-i)=0$.", "Sí, porque $W[e^x,\\operatorname{sen}x]\\neq0$."], "ok": 0, "exp": "Exacto. Con coeficientes reales, $\\operatorname{sen}x$ viene del par $\\pm i$ (factor $m^2+1$), que ya usa las 2 raíces. La pauta asigna puntos a: $e^x\\Rightarrow r=1$; $\\operatorname{sen}x\\Rightarrow \\pm i$; grado 2 no alcanza para tres raíces. Si elegiste «Sí: $(m-1)(m-i)=0$.»: Ese polinomio tiene coeficientes complejos; con coeficientes reales las raíces complejas vienen en pares conjugados."}, {"tema": "t3", "dif": 2, "q": "La ecuación auxiliar tiene raíces $2,\\ 2,\\ -1\\pm 3i$. ¿Cuál es el orden de la EDO y la forma de $y_h$?", "op": ["Orden 4: $(c_1+c_2x)e^{2x}+e^{-x}(c_3\\cos3x+c_4\\operatorname{sen}3x)$", "Orden 3: $c_1e^{2x}+e^{-x}(c_2\\cos3x+c_3\\operatorname{sen}3x)$", "Orden 4: $c_1e^{2x}+c_2e^{2x}+\\dots$"], "ok": 0, "exp": "Cuatro raíces contando multiplicidad → cuatro funciones. Cada raíz de multiplicidad $k$ aporta $k$ funciones multiplicando por $1,x,\\dots,x^{k-1}$. Si elegiste «Orden 3: $c_1e^{2x}+e^{-x}(c_2\\cos3x+c_3\\operatorname{sen}3x)$»: Olvidaste la multiplicidad de $m=2$: falta $xe^{2x}$."}, {"tema": "t4", "dif": 2, "q": "(Guía 3, n°6b) Una solución particular de $y''+4y=\\cos 2t$ es de la forma $A\\cos2t+B\\operatorname{sen}2t$. ¿V o F?", "op": ["Falso: $\\pm2i$ son raíces, hay que usar $t(A\\cos2t+B\\operatorname{sen}2t)$.", "Verdadero: es la forma de la tabla iii)."], "ok": 0, "exp": "Correcto. $\\cos2t$ y $\\operatorname{sen}2t$ están en $y_h$: reemplazarlos da 0. Este es el caso de **resonancia** que reaparece en masa-resorte forzado. Si elegiste «Verdadero: es la forma de la tabla iii).»: La tabla da la forma base; falta la regla de duplicidad."}, {"tema": "t4", "dif": 2, "q": "(Ayudantía 8) ¿Por qué no sirve coeficientes indeterminados para $y''+k^2y=\\tan(kx)$?", "op": ["Las derivadas de $\\tan(kx)$ generan infinitas funciones li ($\\sec^2,\\ \\sec^2\\tan,\\dots$): ninguna propuesta finita cierra.", "Porque hay resonancia.", "Porque $k$ es un parámetro."], "ok": 0, "exp": "Exacto: la familia no es cerrada bajo derivación. Para $\\tan$, $\\sec$, $\\ln$, $1/x$: **variación de parámetros**. Si elegiste «Porque hay resonancia.»: La resonancia se arregla con $x^s$; el problema aquí es el tipo de función."}, {"tema": "t4", "dif": 2, "q": "Para $y''-2y'+2y=e^x\\operatorname{sen}x$ (Guía 3, 3h), la propuesta correcta es:", "op": ["$xe^{x}(A\\cos x+B\\operatorname{sen}x)$", "$e^{x}(A\\cos x+B\\operatorname{sen}x)$", "$Ae^{x}\\operatorname{sen}x$"], "ok": 0, "exp": "$1\\pm i$ son raíces simples: $s=1$. Resultado: $y_p=-\\tfrac x2e^x\\cos x$. El número asociado a $e^{kx}\\operatorname{sen}\\beta x$ es $k+i\\beta=1+i$. Si elegiste «$e^{x}(A\\cos x+B\\operatorname{sen}x)$»: Eso es exactamente $y_h$: daría 0."}, {"tema": "t4", "dif": 2, "q": "Para $x^2y''-2xy'+2y=x^2\\ln x$ con $y_1=x,\\ y_2=x^2$, ¿qué $h$ va en las fórmulas?", "op": ["$h=\\ln x$", "$h=x^2\\ln x$", "$h=\\ln x/x^2$"], "ok": 0, "exp": "Al dividir por $x^2$: $y''-\\frac2xy'+\\frac2{x^2}y=\\ln x$. (Pauta Control 2: 2 pts por la forma estándar.) Resultado de la pauta: $y=C_1x+C_2x^2-x^2\\ln x+\\tfrac12x^2\\ln^2x$. Si elegiste «$h=x^2\\ln x$»: Ese es el lado derecho sin normalizar: $y_p$ saldría multiplicado por $x^2$ de más."}, {"tema": "t4", "dif": 2, "q": "¿Por qué el sistema de variación de parámetros siempre tiene solución única?", "op": ["Su determinante es $W[y_1,y_2]\\neq0$, porque $y_1,y_2$ son li.", "Porque $h$ es continua."], "ok": 0, "exp": "Exacto (Clase 12). Matriz del sistema: $\\begin{pmatrix}y_1&y_2\\\\y_1'&y_2'\\end{pmatrix}$. Si elegiste «Porque $h$ es continua.»: La continuidad hace integrable; la unicidad del sistema viene del Wronskiano."}, {"tema": "t5", "dif": 2, "q": "(Ayudantía 8) ¿Para qué $k$ la ecuación $x^2y''-5xy'+ky=0$ admite $y=x^3\\ln x$?", "op": ["$k=9$", "$k=6$", "$k=15$"], "ok": 0, "exp": "Indicial $m^2-6m+k$; $m=3$ doble exige $(m-3)^2=m^2-6m+9$. Mismo tipo de pregunta en Control 2 (2026) y Prueba 2: $x^2y''-3xy'+ay=0$ con $x^2\\ln x$ da $a=4$. Si elegiste «$k=6$»: Usaste $m^2-5m+k$ (olvidaste el $-a m$); además $m=3$ no sería doble."}, {"tema": "t5", "dif": 2, "q": "(Guía 3, n°6a) La solución general de $x^2y''-xy'+2y=0$ es $y=e^{-x}(c_1\\cos x+c_2\\operatorname{sen}x)$. ¿V o F?", "op": ["Falso: es $y=x\\,(c_1\\cos(\\ln x)+c_2\\operatorname{sen}(\\ln x))$.", "Verdadero."], "ok": 0, "exp": "Indicial $m^2-2m+2=0\\Rightarrow m=1\\pm i$. En Cauchy-Euler aparecen $x^\\alpha$ y $\\ln x$, no $e^{\\alpha x}$. El Control 2 (2025) pidió exactamente esta EDO; se aceptaba $y=x^m$ o el cambio $z=\\ln x$. Si elegiste «Verdadero.»: Esa forma corresponde a coeficientes constantes con raíces $-1\\pm i$."}, {"tema": "t6", "dif": 2, "q": "(Ayudantía 8) $m=1,\\ k=16,\\ c=10$, $x(0)=1$, $x'(0)=0$: $x=\\tfrac43e^{-2t}-\\tfrac13e^{-8t}$. ¿Cruza el equilibrio para $t\\ge0$?", "op": ["No: $x=0\\Rightarrow e^{6t}=\\tfrac14\\Rightarrow t=-\\tfrac{\\ln4}{6}\\lt0$.", "Sí, una vez, porque hay dos exponenciales de signos opuestos.", "Sí, infinitas veces."], "ok": 0, "exp": "Correcto: sobreamortiguado, el único cero está en el pasado. Misma idea en la Prueba 2: $c=4$, $k=4$, $m=1$ (crítico) con $x(0)=-2$ da $x=(-2-4t)e^{-2t}$, cero en $t=-\\tfrac12$: 0 cruces. Si elegiste «Sí, una vez, porque hay dos exponenciales de signos opuestos.»: Hay que resolver $x=0$: el cero existe pero con $t\\lt0$."}, {"tema": "t6", "dif": 2, "q": "Un peso de 8 lb estira un resorte 2 pie. ¿Cuánto valen $m$ y $k$?", "op": ["$m=\\tfrac14$ slug, $k=4$ lb/pie", "$m=8,\\ k=4$", "$m=\\tfrac14,\\ k=16$"], "ok": 0, "exp": "$m=W/g=8/32$, $k=W/s=8/2$. Clase 15, Ej. 2: con amortiguación $c=2$ queda $x''+8x'+16x=0$, crítico. Si elegiste «$m=8,\\ k=4$»: 8 lb es un **peso**, no una masa: divide por $g=32$."}, {"tema": "t6", "dif": 2, "q": "Para $m=1,\\ k=5$: ¿qué $c$ hace el movimiento **críticamente** amortiguado?", "op": ["$c=2\\sqrt5$", "$c=5$", "$c=\\sqrt5$"], "ok": 0, "exp": "$c^2=4mk=20$. Compara siempre $c^2$ con $4mk$. Si elegiste «$c=5$»: $25\\gt20$: sobreamortiguado."}, {"tema": "t7", "dif": 2, "q": "Una matriz 2×2 tiene $\\lambda=2$ doble y solo un vector propio $v$ (li). La solución general es:", "op": ["$c_1ve^{2t}+c_2(tv+w)e^{2t}$, con $(A-2I)w=v$", "$c_1ve^{2t}+c_2tve^{2t}$", "$c_1ve^{2t}+c_2ve^{2t}$"], "ok": 0, "exp": "Caso defectuoso de la Clase 17. A diferencia de una EDO escalar, en sistemas no basta multiplicar por $t$. Si elegiste «$c_1ve^{2t}+c_2tve^{2t}$»: $tve^{2t}$ sola **no** es solución del sistema: falta el vector generalizado $w$."}, {"tema": "t7", "dif": 2, "q": "Con $\\lambda=1\\pm2i$, ¿cuántos vectores propios hay que calcular?", "op": ["Uno, para $1+2i$: sus partes real e imaginaria dan las 2 soluciones reales.", "Dos, uno por cada valor propio, y se suman."], "ok": 0, "exp": "Exacto. $X_1=\\operatorname{Re}(ve^{\\lambda t})$, $X_2=\\operatorname{Im}(ve^{\\lambda t})$. Si elegiste «Dos, uno por cada valor propio, y se suman.»: El del conjugado es el conjugado del vector: no aporta soluciones reales nuevas."}, {"tema": "t8", "dif": 2, "q": "(Ayudantía 9) Para $(x^2+4)y''+xy'-y=0$, ¿qué radio mínimo garantiza el teorema en $x_0=0$?", "op": ["$R=2$", "$R=\\infty$, no hay singulares reales.", "$R=4$"], "ok": 0, "exp": "Singulares en $\\pm2i$, a distancia 2 del origen. En $x_0=1$: $R\\ge|1-2i|=\\sqrt5$. Recurrencia: $a_{n+2}=-\\frac{(n-1)a_n}{4(n+2)}$. Si elegiste «$R=\\infty$, no hay singulares reales.»: Los singulares **complejos** también cuentan."}, {"tema": "t8", "dif": 2, "q": "En $x=0$ para $x^2y''+xy'+(x^2-\\tfrac49)y=0$ (Bessel), ¿qué caso de Frobenius aplica?", "op": ["$r=\\pm\\tfrac23$: diferencia $\\tfrac43\\notin\\mathbb Z$, dos series de Frobenius.", "Raíces iguales: aparece $\\ln x$.", "$x=0$ es punto ordinario."], "ok": 0, "exp": "$p_0=1,\\ q_0=-\\tfrac49$: $r^2-\\tfrac49=0$. Corresponde a la Guía 5, n°5b (con $25x^2$): $y=c_1J_{2/3}(5x)+c_2J_{-2/3}(5x)$. Si elegiste «Raíces iguales: aparece $\\ln x$.»: Eso ocurre con $\\nu=0$ (Guía 5, 5a), no aquí."}, {"tema": "t8", "dif": 2, "q": "Si $x_0$ es singular regular, el teorema de Frobenius garantiza:", "op": ["Al menos una solución $\\sum a_n(x-x_0)^{n+r}$, con $r$ raíz indicial.", "Dos soluciones en serie de potencias ordinaria.", "Nada: solo funciona en puntos ordinarios."], "ok": 0, "exp": "La segunda puede requerir $\\ln x$. En singulares irregulares no hay garantía. Si elegiste «Dos soluciones en serie de potencias ordinaria.»: Eso es en punto ordinario."}, {"tema": "t9", "dif": 2, "q": "$\\mathcal L\\{te^{2t}\\operatorname{sen}6t\\}$ (Guía 4, n°11) se calcula con:", "op": ["$-\\dfrac{d}{ds}$ de $\\dfrac{6}{(s-2)^2+36}$", "$\\dfrac{1}{s^2}\\cdot\\dfrac{6}{s^2+36}$"], "ok": 0, "exp": "Traslación por $e^{2t}$ y derivada por el factor $t$: resultado $\\frac{12s-24}{((s-2)^2+36)^2}$. $\\mathcal L\\{tf\\}=-F'(s)$ y $\\mathcal L\\{e^{at}f\\}=F(s-a)$. Si elegiste «$\\dfrac{1}{s^2}\\cdot\\dfrac{6}{s^2+36}$»: El producto de transformadas corresponde a la convolución, no al producto de funciones."}, {"tema": "t5", "dif": 3, "q": "¿Cuál es la ecuación indicial de $2x^2y''+3xy'-y=0$?", "op": ["$2m^2+m-1=0$", "$2m^2+3m-1=0$", "$m^2+3m-1=0$"], "ok": 0, "exp": "$am^2+(b-a)m+c$ con $a=2,b=3,c=-1$. Raíces $\\tfrac12,-1$. Solución: $y=c_1x^{1/2}+c_2x^{-1}$. Si elegiste «$2m^2+3m-1=0$»: Falta restar $a$ al coeficiente de $m$."}, {"tema": "t4", "dif": 3, "q": "Para $y''-y=\\dfrac{1}{1+e^x}$, el método adecuado es:", "op": ["Variación de parámetros", "Coeficientes indeterminados con $y_p=\\frac{A}{1+e^x}$", "Reducción de orden"], "ok": 0, "exp": "$1/(1+e^x)$ no es de la familia cerrada bajo derivación. Coeficientes indeterminados solo para polinomios · exponenciales · senos/cosenos. Si elegiste «Coeficientes indeterminados con $y_p=\\frac{A}{1+e^x}$»: Al derivar aparecen funciones nuevas; no cierra."}, {"tema": "t2", "dif": 3, "q": "Si $W[y_1,y_2](x)=c\\,x^{-2}$ por Abel, ¿cuál es el coeficiente $a_1(x)$ de la EDO normalizada?", "op": ["$a_1=\\dfrac{2}{x}$", "$a_1=-\\dfrac{2}{x}$", "$a_1=x^{-2}$"], "ok": 0, "exp": "$e^{-\\int 2/x}=x^{-2}$. $W=c\\,e^{-\\int a_1dx}$. Si elegiste «$a_1=-\\dfrac{2}{x}$»: Daría $W=cx^2$."}, {"tema": "t6", "dif": 3, "q": "$c^2=4mk$. ¿Cuál afirmación es correcta?", "op": ["La masa pasa a lo más una vez por el equilibrio.", "Oscila con amplitud decreciente.", "Hay resonancia."], "ok": 0, "exp": "$x=(c_1+c_2t)e^{-\\alpha t}$ tiene a lo más un cero. Críticamente amortiguado (Clase 15). Si elegiste «Oscila con amplitud decreciente.»: Eso es subamortiguado."}, {"tema": "t8", "dif": 3, "q": "En $x_0=0$, $x^2y''+xy'+x^2y=0$ (Clase 18) tiene indicial:", "op": ["$r^2=0$: raíz doble, $y_2$ lleva $y_1\\ln x$.", "$r=\\pm1$: diferencia entera.", "No tiene: $x=0$ es ordinario."], "ok": 0, "exp": "$p_0=1$, $q_0=0$: $r(r-1)+r=r^2$. Es Bessel de orden 0 (caso 3). Guía 5, n°5a: $y=c_1J_0(x)+c_2Y_0(x)$. Si elegiste «$r=\\pm1$: diferencia entera.»: $q_0=\\lim x^2\\cdot1=0$, no $-1$."}, {"tema": "t7", "dif": 1, "q": "El sistema $x'=2x+y,\\ y'=x+2y$ escrito como $X'=AX$ tiene", "op": ["$A=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$", "$A=\\begin{pmatrix}1&2\\\\2&1\\end{pmatrix}$", "$A=\\begin{pmatrix}2&1\\\\2&1\\end{pmatrix}$", "$A=\\begin{pmatrix}2&2\\\\1&1\\end{pmatrix}$"], "ok": 0, "exp": "Cada fila de $A$ son los coeficientes de una ecuación: la primera fila es $(2,1)$ por $x'=2x+y$. El error típico es leer por columnas."}, {"tema": "t7", "dif": 2, "q": "¿Cuáles son los valores propios de $A=\\begin{pmatrix}1&2\\\\2&1\\end{pmatrix}$?", "op": ["$3$ y $-1$", "$1$ y $2$", "$-3$ y $1$", "$1\\pm2i$"], "ok": 0, "exp": "$\\det(A-\\lambda I)=(1-\\lambda)^2-4=0\\Rightarrow 1-\\lambda=\\pm2$, es decir $\\lambda=-1$ o $\\lambda=3$. Los números de la diagonal **no** son los valores propios salvo que la matriz sea triangular."}, {"tema": "t7", "dif": 2, "tipo": "num", "q": "Para $A=\\begin{pmatrix}4&-3\\\\3&4\\end{pmatrix}$ (Clase 17) los valores propios son $p\\pm qi$. ¿Cuánto vale $q$?", "ok": 3, "tol": 0.001, "exp": "$(4-\\lambda)^2+9=0\\Rightarrow\\lambda=4\\pm3i$, así que $p=4$ y $q=3$."}, {"tema": "t7", "dif": 2, "q": "Al eliminar $y$ en $x'=-y+t,\\ y'=x-t$ (Prueba 2, 2 jun) se obtiene", "op": ["$x''+x=t+1$", "$x''-x=t+1$", "$x''+x=t-1$", "$x''+x=1$"], "ok": 0, "exp": "Derivando la primera: $x''=-y'+1=-(x-t)+1$, o sea $x''+x=t+1$. El error típico es olvidar el $+1$ que viene de derivar $t$."}, {"tema": "t7", "dif": 3, "q": "Al resolver $x'=x+2y,\\ y'=x-y$ por eliminación salen $y=C_1e^{\\sqrt3t}+C_2e^{-\\sqrt3t}$ y $x=C_3e^{\\sqrt3t}+C_4e^{-\\sqrt3t}$. ¿Qué exige la pauta?", "op": ["Reemplazar en una ecuación del sistema para escribir $C_3$ y $C_4$ en función de $C_1$ y $C_2$", "Nada: las cuatro constantes son libres", "Poner $C_3=C_1$ y $C_4=C_2$", "Anular $C_3$ y $C_4$"], "ok": 0, "exp": "Un sistema 2×2 de primer orden tiene solo **2** constantes libres. La pauta del 5 de junio da el último nivel por expresar $C_3=C_1(1+\\sqrt3)$ y $C_4=C_2(1-\\sqrt3)$."}, {"tema": "t7", "dif": 2, "q": "Si los valores propios de $A$ son $-1$ y $-3$, el origen del plano de fase es", "op": ["un nodo estable", "un punto silla", "un centro", "una espiral inestable"], "ok": 0, "exp": "Reales, distintos y ambos negativos: todas las trayectorias entran al origen. Silla sería con signos opuestos; centro, con $\\lambda=\\pm qi$."}, {"tema": "t7", "dif": 2, "tipo": "num", "q": "Si $X(t)=c_1\\begin{pmatrix}1\\\\1\\end{pmatrix}e^{3t}+c_2\\begin{pmatrix}1\\\\-1\\end{pmatrix}e^{-t}$ y $X(0)=\\begin{pmatrix}3\\\\1\\end{pmatrix}$, ¿cuánto vale $c_1$?", "ok": 2, "tol": 0.001, "exp": "En $t=0$: $c_1+c_2=3$ y $c_1-c_2=1$, luego $c_1=2$ y $c_2=1$."}, {"tema": "t8", "dif": 1, "q": "En $y''+xy=0$, el punto $x_0=0$ es", "op": ["ordinario", "singular regular", "singular irregular", "no se puede saber sin resolver"], "ok": 0, "exp": "En forma normal $P=0$ y $Q=x$: ambos son polinomios, por lo tanto analíticos en todo punto."}, {"tema": "t8", "dif": 2, "q": "Al reemplazar $y=\\sum a_nx^n$ en $y''-y=0$ la recurrencia es", "op": ["$a_{n+2}=\\dfrac{a_n}{(n+2)(n+1)}$", "$a_{n+2}=-\\dfrac{a_n}{(n+2)(n+1)}$", "$a_{n+2}=\\dfrac{a_n}{n(n-1)}$", "$a_{n+2}=\\dfrac{a_{n-2}}{(n+2)(n+1)}$"], "ok": 0, "exp": "$y''=\\sum(n+2)(n+1)a_{n+2}x^n$ y hay que igualar a $\\sum a_nx^n$. El signo menos es de $y''+y=0$ (Clase 18), no de esta."}, {"tema": "t8", "dif": 2, "tipo": "num", "q": "Para $y''+xy=0$ la recurrencia es $a_{n+2}=-\\dfrac{a_{n-1}}{(n+2)(n+1)}$ con $a_2=0$. Si $a_0=1$, ¿cuánto vale $a_3$? (con decimales)", "ok": -0.1667, "tol": 0.002, "exp": "Con $n=1$: $a_3=-\\dfrac{a_0}{3\\cdot2}=-\\dfrac16\\approx-0{,}1667$."}, {"tema": "t8", "dif": 2, "q": "Para $x^2y''+xy'+(x^2-\\tfrac14)y=0$ en $x_0=0$, ¿cuánto valen $p_0$ y $q_0$?", "op": ["$p_0=1,\\ q_0=-\\tfrac14$", "$p_0=0,\\ q_0=-\\tfrac14$", "$p_0=1,\\ q_0=\\tfrac14$", "$p_0=1,\\ q_0=0$"], "ok": 0, "exp": "$P=\\frac1x$ y $Q=\\frac{x^2-1/4}{x^2}$, así que $p_0=\\lim xP=1$ y $q_0=\\lim x^2Q=-\\frac14$. La indicial queda $r^2-\\frac14=0$."}, {"tema": "t8", "dif": 3, "q": "Las raíces indiciales son $r_1=\\tfrac12$ y $r_2=0$. ¿Cómo son las dos soluciones?", "op": ["Dos series de Frobenius: $\\sum a_nx^{n+1/2}$ y $\\sum b_nx^{n}$", "La segunda lleva obligatoriamente $y_1\\ln x$", "Solo existe una solución en serie", "$y_2=x^{1/2}y_1$"], "ok": 0, "exp": "La diferencia $\\frac12$ no es entera: es el caso 1 de Frobenius y salen dos series independientes. El $\\ln x$ aparece con raíz doble (y a veces con diferencia entera)."}, {"tema": "t8", "dif": 3, "tipo": "num", "q": "¿Cuál es el radio mínimo de convergencia garantizado en $x_0=0$ para $(x^2-2x+5)y''+y=0$? (con decimales)", "ok": 2.236, "tol": 0.01, "exp": "Los singulares son las raíces de $x^2-2x+5$: $x=1\\pm2i$. La distancia de $0$ a $1+2i$ es $\\sqrt{1+4}=\\sqrt5\\approx2{,}236$. No hay singulares reales, pero el radio no es infinito."}, {"tema": "t9", "dif": 1, "q": "$\\mathcal L\\{e^{3t}\\}$ es", "op": ["$\\dfrac{1}{s-3}$, con $s\\gt3$", "$\\dfrac{1}{s+3}$", "$\\dfrac{3}{s}$", "$\\dfrac{s}{s^2+9}$"], "ok": 0, "exp": "$\\mathcal L\\{e^{at}\\}=\\frac{1}{s-a}$ para $s\\gt a$."}, {"tema": "t9", "dif": 1, "q": "$\\mathcal L\\{\\operatorname{sen}2t\\}$ es", "op": ["$\\dfrac{2}{s^2+4}$", "$\\dfrac{s}{s^2+4}$", "$\\dfrac{2}{s^2-4}$", "$\\dfrac{1}{s^2+4}$"], "ok": 0, "exp": "$\\mathcal L\\{\\operatorname{sen}at\\}=\\frac{a}{s^2+a^2}$; el $\\frac{s}{s^2+a^2}$ es el del coseno."}, {"tema": "t9", "dif": 2, "q": "Si $y(0)=0$ e $y'(0)=1$, entonces $\\mathcal L\\{y''\\}$ es", "op": ["$s^2Y-1$", "$s^2Y-s$", "$s^2Y+1$", "$s^2Y-s-1$"], "ok": 0, "exp": "$\\mathcal L\\{y''\\}=s^2Y-sy(0)-y'(0)=s^2Y-0-1$. Es el PVI de la pregunta 5 de una de las pautas."}, {"tema": "t9", "dif": 2, "q": "$\\mathcal L^{-1}\\Big\\{\\dfrac{e^{-2s}}{s}\\Big\\}$ es", "op": ["$\\mathscr U(t-2)$", "$e^{-2t}$", "$t-2$", "$e^{2t}$"], "ok": 0, "exp": "$\\mathcal L\\{\\mathscr U(t-a)\\}=\\frac{e^{-as}}{s}$. La exponencial $e^{-as}$ en $s$ indica un **retraso** en $t$, no una exponencial en $t$."}, {"tema": "t9", "dif": 2, "q": "$\\mathcal L\\{te^{2t}\\}$ es", "op": ["$\\dfrac{1}{(s-2)^2}$", "$\\dfrac{2}{(s-2)^2}$", "$\\dfrac{1}{s(s-2)}$", "$\\dfrac{e^2}{s^2}$"], "ok": 0, "exp": "Primera traslación: $\\mathcal L\\{t\\}=\\frac1{s^2}$ y al multiplicar por $e^{2t}$ se cambia $s\\to s-2$."}, {"tema": "t9", "dif": 3, "tipo": "num", "q": "Si $Y(s)=\\dfrac{1}{s(s+3)}$, ¿cuánto vale $y(1)$? (con decimales)", "ok": 0.3167, "tol": 0.002, "exp": "$\\frac{1}{s(s+3)}=\\frac{1/3}{s}-\\frac{1/3}{s+3}$, así que $y(t)=\\frac13(1-e^{-3t})$ e $y(1)=\\frac13(1-e^{-3})\\approx0{,}3167$."}, {"tema": "t9", "dif": 3, "q": "En $y(t)=t^3+\\int_0^ty(z)\\operatorname{sen}(t-z)\\,dz$, la integral se transforma en", "op": ["$\\dfrac{Y(s)}{s^2+1}$", "$Y(s)\\dfrac{s}{s^2+1}$", "$\\dfrac{Y(s)}{s}$", "$Y(s)+\\dfrac{1}{s^2+1}$"], "ok": 0, "exp": "Es la convolución $y*\\operatorname{sen}$, y $\\mathcal L\\{f*g\\}=F(s)G(s)$ con $G=\\frac1{s^2+1}$. Reconocerla vale el nivel 1 de la pauta."}], "evaluaciones": [{"fuente": "Prueba 2 · 2 jun 2026", "pregunta": "P1", "tema": "t4", "puntaje": "15 pts", "enunciado": "Determine la solución general de la ecuación $y''-4y'+4y=e^{2x}+12x$.", "estrategia": "Coeficientes constantes con lado derecho de dos tipos: una propuesta por sumando. Ojo: $m=2$ es raíz **doble**, así que la propuesta para $e^{2x}$ se multiplica por $x^2$. La pauta acepta también variación de parámetros.", "pasos": [{"titulo": "Resuelve la homogénea.", "md": "$$(m-2)^2=0\\Rightarrow y_h=C_1e^{2x}+C_2xe^{2x}$$"}, {"titulo": "Propón $y_p$ para cada sumando.", "md": "$$y_p=Ax^2e^{2x}+Bx+C$$"}, {"titulo": "Sustituye la parte exponencial.", "md": "$$A(2+8x+4x^2)e^{2x}-4A(2x+2x^2)e^{2x}+4Ax^2e^{2x}=2Ae^{2x}=e^{2x}\\Rightarrow A=\\tfrac12$$"}, {"titulo": "Sustituye la parte polinomial.", "md": "$$0-4B+4(Bx+C)=12x\\ \\Rightarrow\\ 4B=12,\\ -4B+4C=0\\ \\Rightarrow\\ B=C=3$$"}, {"titulo": "Solución general.", "md": "$$y=C_1e^{2x}+C_2xe^{2x}+\\tfrac{x^2}{2}e^{2x}+3x+3$$"}], "respuesta": "$$y=C_1e^{2x}+C_2xe^{2x}+\\frac{x^2}{2}e^{2x}+3x+3$$", "tiempo": "15 min", "puntaje_max": ["Ecuación característica y raíz doble $m=2$", "Homogénea $y_h=C_1e^{2x}+C_2xe^{2x}$", "Propuesta $Ax^2e^{2x}+Bx+C$, justificando el $x^2$", "Constantes $A=\\frac12$, $B=C=3$ y solución general"], "confianza": "pauta", "variantes": ["Prueba 2 · pauta sin fecha P1 (sin el 12x)"]}, {"fuente": "Prueba 2 · 2 jun 2026", "pregunta": "P2", "tema": "t5", "puntaje": "5 + 10 pts", "enunciado": "Considere $x^2y''+(1-2\\beta)xy'+9y=f(x)$, $x\\gt0$. **a)** ¿Para qué valores de $\\beta\\in\\mathbb R$ la homogénea admite $y_h=C_1x^{m_1}+C_2x^{m_2}$, con $m_1\\neq m_2$ reales? **b)** Encuentre la solución general para $\\beta=-3$ y $f(x)=\\frac{1}{x^2}$.", "estrategia": "Es Cauchy-Euler: la indicial es $m^2+(b-a)m+c=m^2-2\\beta m+9=0$. En a) se pide discriminante positivo. En b) sale raíz doble $m=-3$ y la no homogénea va por variación de parámetros **normalizando** (dividir por $x^2$).", "pasos": [{"titulo": "(a) Indicial y condición.", "md": "$$m^2-2\\beta m+9=0,\\quad 4\\beta^2-36\\gt0\\Rightarrow \\beta\\in\\,]-\\infty,-3[\\,\\cup\\,]3,\\infty[$$"}, {"titulo": "(b) Con $\\beta=-3$: indicial y $y_h$.", "md": "$$x^2y''+7xy'+9y=x^{-2},\\quad (m+3)^2=0\\Rightarrow y_h=C_1x^{-3}+C_2x^{-3}\\ln x$$"}, {"titulo": "Normaliza y calcula $W,W_1,W_2$.", "md": "$$W=x^{-7},\\quad W_1=-x^{-7}\\ln x,\\quad W_2=x^{-7}$$"}, {"titulo": "Integra y arma $y_p$.", "md": "$$u_1=\\int-\\ln x\\,dx=x-x\\ln x,\\quad u_2=x\\ \\Rightarrow\\ y_p=x^{-2}$$"}], "respuesta": "a) $\\beta\\lt-3$ o $\\beta\\gt3$. b) $y=C_1x^{-3}+C_2x^{-3}\\ln x+x^{-2}$", "tiempo": "15 min", "puntaje_max": ["a) Indicial $m^2-2\\beta m+9=0$ y condición $4\\beta^2-36\\gt0$", "b) Raíz doble $m=-3$: $y_h=C_1x^{-3}+C_2x^{-3}\\ln x$", "b) Normalizar ($f=x^{-4}$) y wronskianos $W=x^{-7}$, $W_1=-x^{-7}\\ln x$, $W_2=x^{-7}$", "b) $u_1=-x\\ln x+x$, $u_2=x$, de donde $y_p=x^{-2}$"], "descuentos": ["Usar $f=x^{-2}$ sin normalizar: el lado derecho correcto es $x^{-4}$."], "confianza": "pauta"}, {"fuente": "Prueba 2 · 2 jun 2026", "pregunta": "P3.1", "tema": "t7", "puntaje": "7 pts", "enunciado": "Encuentre la solución general del sistema $\\dfrac{dx}{dt}=-y+t,\\quad \\dfrac{dy}{dt}=x-t$.", "estrategia": "Sistema 2×2 no homogéneo. Lo más corto es eliminar: derivar la primera ecuación y reemplazar $y'$. La pauta también lo resuelve con valores propios $\\lambda=\\pm i$ más una $X_p$ lineal.", "pasos": [{"titulo": "Deriva la primera y usa la I correcto, $y''+y=2\\cos t$, $y(0)=y'(0)=0$", "pts": "5"}, {"criterio": "b) Nivel 1: homogénea correcta", "pts": "5"}, {"criterio": "b) Nivel 2: además, una solución particular", "pts": "10"}, {"criterio": "b) Nivel 3: además, la única solución del PVI", "pts": "15"}], "confianza": "pauta"}, {"fuente": "Prueba 2 · 5 jun", "pregunta": "P3 a)", "tema": "t7", "puntaje": "10 pts", "enunciado": "Determine la solución general del sistema $x'(t)=x(t)+2y(t)$, $y'(t)=x(t)-y(t)$.", "estrategia": "La pauta lo resuelve de dos formas (eliminación con el operador $D$ y valores propios) y da el puntaje completo por cualquiera. Los valores propios son $\\pm\\sqrt3$.", "pasos": [{"titulo": "Con operadores, elimina $x$.", "md": "$$\\big[(D-1)(D+1)-2\\big]y=0\\iff y''-3y=0\\Rightarrow y=C_1e^{\\sqrt3t}+C_2e^{-\\sqrt3t}$$"}, {"titulo": "Obtén $x$ despejando de $y'=x-y$.", "md": "$$x=y'+y=C_1(1+\\sqrt3)e^{\\sqrt3t}+C_2(1-\\sqrt3)e^{-\\sqrt3t}$$"}, {"titulo": "Verificación con valores propios.", "md": "$$\\lambda^2-3=0,\\quad v_1=\\begin{pmatrix}1+\\sqrt3\\\\1\\end{pmatrix},\\ v_2=\\begin{pmatrix}1-\\sqrt3\\\\1\\end{pmatrix}$$"}], "respuesta": "$$X=C_1\\begin{pmatrix}1+\\sqrt3\\\\1\\end{pmatrix}e^{\\sqrt3t}+C_2\\begin{pmatrix}1-\\sqrt3\\\\1\\end{pmatrix}e^{-\\sqrt3t}$$", "tiempo": "12 min", "rubrica": [{"criterio": "Eliminación · N1: ordena y aplica el operador para una ecuación en una sola función", "pts": "3"}, {"criterio": "Eliminación · N2: resuelve esa ecuación ($m=\\pm\\sqrt3$)", "pts": "5"}, {"criterio": "Eliminación · N3: obtiene la otra función", "pts": "8"}, {"criterio": "Eliminación · N4: expresa $C_3,C_4$ en función de $C_1,C_2$ y escribe la solución", "pts": "10"}, {"criterio": "Valores propios · N1: forma matricial y valores propios", "pts": "3"}, {"criterio": "Valores propios · N2: vectores propios", "pts": "7"}, {"criterio": "Valores propios · N3: solución general", "pts": "10"}], "descuentos": ["Dejar cuatro constantes libres. (No hace falta si la segunda función se obtiene reemplazando la primera en una ecuación del sistema.)"], "confianza": "pauta"}, {"fuente": "Prueba 2 · 5 jun", "pregunta": "P3 b)", "tema": "t9", "puntaje": "10 pts", "enunciado": "Sea $f:[0,\\infty)\\to\\mathbb R$ con $f(t)=-1$ si $t\\in[0,1[$ y $f(t)=1$ si $t\\in[1,\\infty[$. Determine la transformada de Laplace de $f$ usando la definición.", "estrategia": "Función por tramos y piden **por definición**: parte la integral en $[0,1]$ y $[1,\\infty)$ y escribe la segunda como $\\lim_{b\\to\\infty}$ (eso solo ya vale puntos).", "pasos": [{"titulo": "Separa la integral (la segunda como límite).", "md": "$$\\int_0^1-e^{-st}dt+\\lim_{b\\to\\infty}\\int_1^be^{-st}dt$$"}, {"titulo": "Integra.", "md": "$$\\frac{e^{-s}-1}{s}+\\frac{e^{-s}}{s}$$"}], "respuesta": "$$\\mathcal L\\{f\\}(s)=\\frac{2e^{-s}-1}{s},\\quad s\\gt0$$", "tiempo": "10 min", "rubrica": [{"criterio": "Nivel 1: dos integrales según el tramo, la impropia escrita como límite", "pts": "4"}, {"criterio": "Nivel 2: integra bien la primera", "pts": "6"}, {"criterio": "Nivel 3: integra bien la impropia y escribe $F(s)$", "pts": "10"}], "confianza": "pauta"}, {"fuente": "Prueba 2 · 5 jun", "pregunta": "P3 c)", "tema": "t9", "puntaje": "10 pts", "enunciado": "Determine la transformada de Laplace inversa de $F(s)=\\dfrac{s+1}{s^2+3s}$.", "estrategia": "Factoriza el denominador, $s(s+3)$, descompón en fracciones parciales y usa la tabla: $\\mathcal L^{-1}\\{\\frac1s\\}=1$, $\\mathcal L^{-1}\\{\\frac1{s+3}\\}=e^{-3t}$.", "pasos": [{"titulo": "Fracciones parciales.", "md": "$$\\frac{s+1}{s(s+3)}=\\frac{1/3}{s}+\\frac{2/3}{s+3}$$"}], "respuesta": "$$f(t)=\\tfrac13+\\tfrac23e^{-3t}$$", "tiempo": "8 min", "rubrica": [{"criterio": "Nivel 1: descompone en fracciones parciales", "pts": "4"}, {"criterio": "Nivel 2: invierte cada fracción", "pts": "10"}], "confianza": "pauta"}, {"fuente": "Prueba 2 · pauta sin fecha", "pregunta": "P1", "tema": "t4", "puntaje": "12 pts", "enunciado": "Resuelva la ecuación diferencial $y''-4y'+4y=e^{2x}$.", "estrategia": "Raíz doble $m=2$ y el lado derecho es justo $e^{2x}$: la propuesta es $Ax^2e^{2x}$ (con $Ae^{2x}$ o $Axe^{2x}$ se obtiene $0$ al reemplazar). La pauta muestra también variación de parámetros.", "pasos": [{"titulo": "Homogénea", "md": "$$m^2-4m+4=0\\Rightarrow m_1=m_2=2\\Rightarrow y_h=c_1e^{2x}+c_2xe^{2x}$$"}, {"titulo": "Forma 1: coeficientes indeterminados", "md": "Como $e^{2x}$ y $xe^{2x}$ ya están en $y_h$, se propone $y_p=Ax^2e^{2x}$:\n$$y_p'=A(2xe^{2x}+2x^2e^{2x}),\\qquad y_p''=A(2e^{2x}+8xe^{2x}+4x^2e^{2x})$$"}, {"titulo": "Reemplazar", "md": "$$A(2e^{2x}+8xe^{2x}+4x^2e^{2x})-4A(2xe^{2x}+2x^2e^{2x})+4Ax^2e^{2x}=2Ae^{2x}=e^{2x}\\Rightarrow A=\\tfrac12$$"}, {"titulo": "Forma 2: variación de parámetros", "md": "Con $y_1=e^{2x}$, $y_2=xe^{2x}$ y $W=e^{4x}$: $c_1'=-x$, $c_2'=1$, luego $c_1=-\\frac{x^2}{2}$, $c_2=x$ e $y_p=-\\frac{x^2}{2}e^{2x}+x^2e^{2x}=\\frac12x^2e^{2x}$."}], "respuesta": "$$y(x)=c_1e^{2x}+c_2xe^{2x}+\\tfrac12x^2e^{2x}$$", "tiempo": "12 min", "rubrica": [{"criterio": "Nivel 1: ecuación característica correcta y sus raíces", "pts": "4"}, {"criterio": "Nivel 2: solución general de la homogénea", "pts": "6"}, {"criterio": "Nivel 3: propone una forma adecuada de $y_p$, con errores menores en el desarrollo", "pts": "8"}, {"criterio": "Nivel 4: resuelve completamente, con justificación clara", "pts": "12"}], "confianza": "pauta", "variantes": ["Prueba 2 · 2 jun 2026 P1 (con + 12x)"]}, {"fuente": "Prueba 2 · pauta sin fecha", "pregunta": "P2", "tema": "t5", "puntaje": "6 + 6 pts", "enunciado": "Considere la ecuación de Cauchy-Euler $x^2y''-3xy'+ay=0$. **a)** Resuelva para $a=3$. **b)** ¿Para qué valores de $a$ la ecuación admite una solución del tipo $x^2\\ln(x)$?", "estrategia": "Todo sale de la indicial. El $\\ln x$ aparece **solo** con raíz doble, así que b) se reduce a pedir que la indicial sea $(m-2)^2$.", "pasos": [{"titulo": "Indicial", "md": "Con $y=x^m$: $$m(m-1)-3m+a=0\\iff m^2-4m+a=0$$"}, {"titulo": "a) a = 3", entemente VP)", "pts": "7"}, {"criterio": "Nivel 2: plantea y resuelve los parámetros con errores", "pts": "17"}, {"criterio": "Nivel 4: obtiene la particular correcta", "pts": "25"}], "confianza": "pauta"}, {"fuente": "Simulacro · propio", "pregunta": "P1 (coeficientes indeterminados)", "tema": "t4", "puntaje": "12 pts", "enunciado": "Resuelva el PVI $y''+4y=8x+4\\cos2x,\\ y(0)=1,\\ y'(0)=0$.", "estrategia": "$8x$ no choca con $y_h$, pero $\\cos2x$ sí (raíces $\\pm2i$): solo esa parte de la propuesta se multiplica por $x$.", "pasos": [{"titulo": "Homogénea.", "md": "$$m^2+4=0\\Rightarrow y_h=c_1\\cos2x+c_2\\operatorname{sen}2x$$"}, {"titulo": "Propuestas (¿hay duplicidad?).", "md": "$$y_p=Ax+B+x(C\\cos2x+D\\operatorname{sen}2x)$$"}, {"titulo": "Constantes.", "md": "$$A=2,\\ B=0,\\ C=0,\\ D=1\\ \\Rightarrow\\ y_p=2x+x\\operatorname{sen}2x$$"}, {"titulo": "Condiciones iniciales.", "md": "$$c_1=1,\\qquad c_2=-1$$"}], "respuesta": "$$y=\\cos2x-\\operatorname{sen}2x+2x+x\\operatorname{sen}2x$$", "tiempo": "20 min", "puntaje_max": ["Escribir cada etapa aunque no termines: las rúbricas son por niveles (homogénea → propuesta o wronskianos → constantes → solución final)."], "confianza": "propuesta"}, {"fuente": "Simulacro · propio", "pregunta": "P2 (Abel + variación de parámetros)", "tema": "t2", "puntaje": "12 pts", "enunciado": "(a) Verifique que $y_1=x^2$ resuelve $x^2y''-3xy'+4y=0$ ($x\\gt0$) y obtenga $y_2$ con la fórmula de Abel. (b) Resuelva $x^2y''-3xy'+4y=x^2$.", "estrategia": "Primero Abel con la $y_1$ dada; después variación de parámetros con la EDO normalizada ($h=1$).", "pasos": [{"titulo": "(a) Normaliza y aplica Abel.", "md": "$$y_2=x^2\\int\\frac{x^3}{x^4}dx=x^2\\ln x$$"}, {"titulo": "(b) Normaliza: $h$ y $W$.", "md": "$$h=1,\\qquad W=x^2(2x\\ln x+x)-x^2\\ln x\\cdot2x=x^3$$"}, {"titulo": "Parámetros.", "md": "$$c_1'=-\\frac{\\ln x}{x}\\Rightarrow c_1=-\\tfrac12\\ln^2x;\\qquad c_2'=\\frac1x\\Rightarrow c_2=\\ln x$$"}], "respuesta": "$$y=C_1x^2+C_2x^2\\ln x+\\ <script>
/* ===== utilidades compartidas ===== */
const TX = (v, d = 3) => U.fmt(v, d).replace(",", "{,}");           // número con coma decimal para LaTeX
const sgn = (v, d = 3) => (v < 0 ? "-" : "+") + TX(Math.abs(v), d);   // " + 3" / " - 3"
const near = (a, b, e = 1e-9) => Math.abs(a - b) < e;
const limpia = s => s.replace(/e\^\{1x\}/g, "e^{x}").replace(/e\^\{-1x\}/g, "e^{-x}").replace(/e\^\{0x\}/g, "").replace(/x\^\{1\}/g, "x").replace(/x\^\{0\}/g, "")
  .replace(/\\(cos|sin) 1([xt])/g, "\\$1 $2").replace(/\((1)\\ln x\)/g, "(\\ln x)").replace(/\\pm1(\\,)?i/g, "\\pm i");   // 1x → x, x^{1} → x, ±1i → ±i
const lead = (v, d = 2) => near(v, 1) ? "" : near(v, -1) ? "-" : TX(v, d);                      // coeficiente líder
const term = (v, s, d = 2) => near(v, 0) ? "" : (v < 0 ? "-" : "+") + (near(Math.abs(v), 1) && s ? "" : TX(Math.abs(v), d)) + s; // término intermedio
function rk4(f, y0, t0, t1, h) {                                     // y' = f(t, y), y vector
  const out = [{t: t0, y: y0.slice()}]; let y = y0.slice(), t = t0; const n = Math.round((t1 - t0) / h);
  for (let i = 0; i < n; i++) {
    const k1 = f(t, y), k2 = f(t + h / 2, y.map((v, j) => v + h / 2 * k1[j])), k3 = f(t + h / 2, y.map((v, j) => v + h / 2 * k2[j])), k4 = f(t + h, y.map((v, j) => v + h * k3[j]));
    y = y.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j])); t += h; out.push({t, y: y.slice()});
  }
  return out;
}
function interp(arr, t) {                                            // arr ordenado por t
  if (t <= arr[0].t) return arr[0].y[0];
  if (t >= arr[arr.length - 1].t) return arr[arr.length - 1].y[0];
  const h = arr[1].t - arr[0].t, i = Math.floor((t - arr[0].t) / h), a = arr[i], b = arr[i + 1] || a, w = (t - a.t) / h;
  return a.y[0] * (1 - w) + b.y[0] * w;
}
function stepper(el, U, problemas) {                                 // ejercicio con pasos revelables

/* ===== T1: intervalo del teorema ===== */

    {n: "xy'' − (x+1)y' + y = x²", tex: "xy''-(x+1)y'+y=x^2", s: [0], why: "a_2(x)=x"},

  U.slider(el, {label: "Punto inicial x₀", min: -5, max: 5, step: 0.1, value: 2, onInput: v => { x0 = v; upd(); }});
  const plot = U.plot(el, {xmin: -5, xmax: 5, ymin: -1, ymax: 1, height: 110});
  el.append(out);
  function upd() {
    const s = eq.s;
    if (s.some(p => Math.abs(p - x0) < 0.05)) {

    out.innerHTML = `Para $${eq.tex}$ con $x_0=${TX(x0, 2)}$: solución única garantizada en $I=(${f(L)},\\ ${f(R)})$` + (s.length ? `, porque ahí $${eq.why}$ no da problemas.` : `, porque $${eq.why}$ en todo $\\mathbb R$.`);
    U.tex(out);
  }
};

};


/* ===================== Prueba 2: gadgets nuevos (T7–T9) ===================== */

/* ===== T7: plano de fase de X' = AX ===== */
GADGETS["g_plano"] = (el, U) => {
  const A = [[1, 2], [1, -1]], sl = [];
  const out = U.el("div", {class: "g-out"});
  [["a₁₁", 0, 0], ["a₁₂", 0, 1], ["a₂₁", 1, 0], ["a₂₂", 1, 1]].forEach(([lab, i, j]) =>
    sl.push(U.slider(el, {label: lab, min: -5, max: 5, step: 0.5, value: A[i][j], onInput: v => { A[i][j] = v; upd(); }})));
  const row = U.el("div", {class: "g-row"}); el.append(row);
  const set = M => { [M[0][0], M[0][1], M[1][0], M[1][1]].forEach((v, k) => { sl[k].value = v; sl[k].dispatchEvent(new Event("input")); }); };
  U.button(row, "5 jun: x′=x+2y, y′=x−y", () => set([[1, 2], [1, -1]]));
  U.button(row, "2 jun: x′=−y, y′=x", () => set([[0, -1], [1, 0]]));
  U.button(row, "Ayud. 9: espiral", () => set([[2, 1], [-5, 0]]));
  U.button(row, "Ayud. 9: defectuosa", () => set([[3, 1], [0, 3]]));

  let pend = false;
  function upd() { if (pend) return; pend = true; setTimeout(() => { pend = false; dibuja(); }, 0); }
  function dibuja() {

    const segments = [];
    for (let x = -XM + 0.25; x < XM; x += 0.5) for (let y = -YM + 0.25; y < YM; y += 0.5) {
      const d = f(x, y), n = Math.hypot(d[0], d[1]); if (n < 1e-9) continue;
      const ux = d[0] / n * 0.17, uy = d[1] / n * 0.17; segments.push({x1: x - ux, y1: y - uy, x2: x + ux, y2: y + uy, c: 4});
    }
    const tr = A[0][0] + A[1][1], det = A[0][0] * A[1][1] - A[0][1] * A[1][0], D = tr * tr - 4 * det;
    let vecs = [];
    if (D >= -1e-12) {
      const s = Math.sqrt(Math.max(D, 0)), ls = D > 1e-12 ? [(tr + s) / 2, (tr - s) / 2] : [tr / 2];

      else ls.forEach(l => vecs.push({l, v: !near(A[1][0], 0) ? [l - A[1][1], A[1][0]] : [A[0][1], l - A[0][0]]}));
      vecs.forEach((e, i) => { const n = Math.hypot(...e.v), ux = e.v[0] / n * 9, uy = e.v[1] / n * 9;
        for (let k = -12; k < 12; k++) if (k % 2 === 0) segments.push({x1: ux * k / 12, y1: uy * k / 12, x2: ux * (k + 1) / 12, y2: uy * (k + 1) / 12, c: i ? 2 : 1}); });
    }
    const seeds = [];
    for (let i = 0; i < 16; i++) { const th = 2 * Math.PI * i / 16; seeds.push([2.6 * Math.cos(th), 2.6 * Math.sin(th)]); }
    for (let i = 0; i < 8; i++) { const th = 2 * Math.PI * i / 8 + 0.2; seeds.push([0.7 * Math.cos(th), 0.7 * Math.sin(th)]); }
    seeds.forEach(s0 => [1, -1].forEach(dir => {
      let x = s0[0], y = s0[1]; const h = 0.02 * dir;
      for (let i = 0; i < 260; i++) {
        const k1 = f(x, y), k2 = f(x + h / 2 * k1[0], y + h / 2 * k1[1]), k3 = f(x + h / 2 * k2[0], y + h / 2 * k2[1]), k4 = f(x + h * k3[0], y + h * k3[1]);
        const nx = x + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), ny = y + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
        if (!isFinite(nx) || Math.abs(nx) > XM || Math.abs(ny) > YM) break;

/* ===== T8: sumas parciales de la serie ===== */
GADGETS["g_series"] = (el, U) => {
  const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
  const modos = {
    "y″+2x²y=0, y₁ (Prueba 2, 2 jun)": {xr: [-2.6, 2.6], yr: [-2, 2], ode: (x, y, yp) => -2 * x * x * y, y0: [1, 0],
      coef: N => { const a = [1, 0, 0, 0]; for (let k = 2; k + 2 <= N; k++) a[k + 2] = -2 * a[k - 2] / ((k + 2) * (k + 1)); return a; },
      txt: "$a_2=a_3=0$ y $a_{k+2}=-\\dfrac{2a_{k-2}}{(k+2)(k+1)}$. Con $a_0=1,\\ a_1=0$: $y_1=1-\\frac{x^4}{6}+\\frac{x^8}{168}-\\cdots$. La curva gris es la solución calculada numéricamente."},

      coef: N => { const a = [0, 1, 0, 0]; for (let k = 2; k + 2 <= N; k++) a[k + 2] = -2 * a[k - 2] / ((k + 2) * (k + 1)); return a; },
      txt: "Misma recurrencia con $a_0=0,\\ a_1=1$: $y_2=x-\\frac{x^5}{10}+\\frac{x^9}{360}-\\cdots$."},
    "y″+y=0 (Clase 18)": {xr: [-9, 9], yr: [-2.2, 2.2], exact: Math.cos,
      coef: N => { const a = []; for (let n = 0; n <= N; n++) a[n] = n % 2 ? 0 : (-1) ** (n / 2) / fact(n); return a; },
      txt: "$a_{n+2}=-\\dfrac{a_n}{(n+2)(n+1)}$ con $a_0=1,\\ a_1=0$ da $y=\\sum\\frac{(-1)^kx^{2k}}{(2k)!}=\\cos x$. Sin puntos singulares: converge en todo $\\mathbb R$."},
    "y″+2xy′+2y=0 (Ayud. 9)": {xr: [-3.5, 3.5], yr: [-1.5, 2], exact: x => Math.exp(-x * x),
      coef: N => { const a = []; for (let n = 0; n <= N; n++) a[n] = n % 2 ? 0 : (-1) ** (n / 2) / fact(n / 2); return a; },
      txt: "$a_{n+2}=-\\dfrac{2a_n}{n+2}$ con $a_0=1,\\ a_1=0$ da $y=\\sum\\frac{(-1)^kx^{2k}}{k!}=e^{-x^2}$."},
    "(1−x)y′−y=0: radio R=1": {xr: [-2, 2], yr: [-3, 6], exact: x => 1 / (1 - x), R: 1,
      coef: N => Array(N + 1).fill(1),
      txt: "$a_{n+1}=a_n$ da $y=\\sum x^n=\\frac1{1-x}$. Hay un punto singular en $x=1$, así que la serie solo sirve en $|x|\\lt1$: fuera de las líneas punteadas no converge por más que subas $N$."}
  };
  let modo = Object.keys(modos)[0], N = 8;
  const out = U.el("div", {class: "g-out"});
  U.select(el, {label: "Ecuación", options: Object.keys(modos), onChange: v => { modo = v; upd(); }});
  U.slider(el, {label: "grado N", min: 1, max: 30, step: 1, value: N, onInput: v => { N = v; upd(); }});
  const box = U.el("div"); el.append(box, out); let plot = null, xr = null;
  function upd() {
    const m = modos[modo];
    if (!plot || xr !== m.xr) { box.innerHTML = ""; plot = U.plot(box, {xmin: m.xr[0], xmax: m.xr[1], ymin: m.yr[0], ymax: m.yr[1], height: 260}); xr = m.xr; }
    const a = m.coef(N), S = x => { let s = 0, p = 1; for (let n = 0; n <= N; n++) { s += (a[n] || 0) * p; p *= x; } return s; };
    let exacta = m.exact;
    if (!exacta) {
      const F = (t, y) => [y[1], m.ode(t, y[0], y[1])];
      // u(t) = y(−t) cumple u'' = ode(−t, u, −u'), con u(0) = y(0), u'(0) = −y'(0)
      const der = rk4(F, m.y0, 0, m.xr[1], 0.005), izq = rk4((t, v) => [v[1], m.ode(-t, v[0], -v[1])], [m.y0[0], -m.y0[1]], 0, -m.xr[0], 0.005);
      exacta = x => x >= 0 ? interp(der, x) : interp(izq, -x);
    }
    plot.draw({fns: [{f: exacta, c: 4}, {f: x => { const v = S(x); return Math.abs(v) > 50 ? NaN : v; }, c: 0}],
      vlines: m.R ? [{x: -m.R, label: "−R", c: 3}, {x: m.R, label: "R", c: 3}] : []});
    const nz = a.slice(0, N + 1).filter(c => c && Math.abs(c) > 1e-14).length;
    out.innerHTML = m.txt + `<br>Curva gris: solución exacta. Curva de color: suma parcial hasta $x^{${N}}$ (${nz} términos no nulos).`;
    U.tex(out);
  }
};

/* ===== T9: práctica de fracciones parciales e inversa ===== */
GADGETS["g_laplace"] = (el, U) => {
  const box = U.el("div"); const row = U.el("div", {class: "g-row"}); el.append(row, box);
  const fr = (p, q) => { if (q < 0) { p = -p; q = -q; } const g = (x, y) => y ? g(y, x % y) : Math.abs(x); const d = g(p, q) || 1; p /= d; q /= d; return q === 1 ? `${p}` : `${p < 0 ? "-" : ""}\\tfrac{${Math.abs(p)}}{${q}}`; };
  const fac = r => r === 0 ? "s" : `(s${r < 0 ? "+" + (-r) : "-" + r})`;
  const ex = r => r === 0 ? "" : `e^{${r === 1 ? "" : r === -1 ? "-" : r}t}`;
  function nuevo(a, b, c) {
    if (a == null) { do { a = U.rand(-4, 4); b = U.rand(-4, 4); c = U.rand(-4, 4); } while (a === b || a + c === 0 || b + c === 0); }
    const A = (a + c) / (a - b), B = (b + c) / (b - a);
    const num = c === 0 ? "s" : `s${c > 0 ? "+" + c : c}`;
    box.innerHTML = "";
    box.append(U.el("div", {class: "g-out", html: `$F(s)=\\dfrac{${num}}{${fac(a)}${fac(b)}}=\\dfrac{A}{${a === 0 ? "s" : fac(a).slice(1, -1)}}+\\dfrac{B}{${b === 0 ? "s" : fac(b).slice(1, -1)}}$. Calcula $A$ y $B$ (tapando el factor y evaluando en su raíz) y luego $f(t)=\\mathcal L^{-1}\\{F\\}$.`}));
    U.numInput(box, {label: "A =", ok: A, tol: 0.01, exp: `Evalúa $\\frac{${num}}{${fac(b)}}$ en $s=${a}$: $A=${fr(a + c, a - b)}$.`});
    U.numInput(box, {label: "B =", ok: B, tol: 0.01, exp: `Evalúa $\\frac{${num}}{${fac(a)}}$ en $s=${b}$: $B=${fr(b + c, b - a)}$.`});
    const sol = U.el("div", {class: "g-out", style: "display:none", html: `$f(t)=${fr(a + c, a - b)}${ex(a)}${(b + c) * (b - a) >= 0 ? "+" : ""}${fr(b + c, b - a)}${ex(b)}$ &nbsp; (porque $\\mathcal L^{-1}\\{\\frac1{s-a}\\}=e^{at}$ y $\\mathcal L^{-1}\\{\\frac1s\\}=1$).`});
    U.button(box, "Ver f(t)", () => { sol.style.display = ""; U.tex(sol); });
    box.append(sol); U.tex(box);
  }
  U.button(row, "Prueba 2 (5 jun): (s+1)/(s²+3s)", () => nuevo(0, -3, 1));
  U.button(row, "Nuevo ejercicio al azar", () => nuevo());
  nuevo(0, -3, 1);
};

  const show = () => {
    main.innerHTML = "";
    if (k >= qs.length) { main.append(hdr("Autoevaluación · Resultado", "Hoja de resultados", "")); main.append(hoja("Esta ronda", ses));
      const r = node(`<div class="row"></div>`); r.append(btn("Otra ronda", () => go("quiz"), true), btn("Ir a evaluaciones anteriores", () => go("evals"))); main.append(r); side(); tex(main); return; }
    const q = qs[k], dif = "●".repeat(q.dif || 1) + "○".repeat(3 - (q.dif || 1));
    const c = node(`<section class="sheet">${sh(`<span class="mono" style="font-size:.9rem">Pregunta ${k + 1} de ${qs.length} <span style="color:var(--muted);font-weight:400">· §${idx(q.tema)} · Dificultad ${dif}</span></span>`, q.pts ? `<span class="mono">(${esc(q.pts)} pts)</span>` : "")}<div class="sb"><div class="serif" style="font-size:1.35rem;line-height:1.45;margin-bottom:10px">${md(q.q)}</div><div class="ops"></div><div class="fb"></div><div class="row sp" style="margin-top:14px"><span></span></div></div></section>`);
    const fb = c.querySelector(".fb"), ops = c.querySelector(".ops"), foot = c.querySelector(".row.sp");
    const next = btn(k + 1 < qs.length ? "Siguiente pregunta →" : "Ver hoja de resultados", () => { k++; show(); }, true); next.classList.add("hide"); foot.append(next);
    const mark = ok => {
      for (const o of [ses, hist]) { o[q.tema] = o[q.tema] || {ok: 0, n: 0}; o[q.tema].n++; if (ok) o[q.tema].ok++; }
      ok ? fall.delete(q.i) : fall.add(q.i); store.set("hist", hist); store.set("fallidas", [...fall]);
      fb.innerHTML = `<div style="border-top:1px solid var(--ink);padding-top:12px;margin-top:10px"><span class="serif" style="font-style:italic;font-size:1.15rem">${ok ? "Correcto." : "Incorrecto."}</span> ${md(q.exp)}</div>`;
      next.classList.remove("hide"); side(); tex(fb);
    };
    if (q.tipo === "num") {
      const r = node(`<div class="g-row"><label>Tu respuesta</label><input type="text" inputmode="decimal" placeholder="ej. 4,2"></div>`), i = r.querySelector("input");
      const b = btn("Responder", () => { const x = U.num(i.value); if (isNaN(x)) return; b.disabled = i.disabled = true; const ok = Math.abs(x - q.ok) <= (q.tol ?? 1e-6);
        if (!ok) r.append(node(`<span class="pen">esperado: ${U.fmt(q.ok, 4)}</span>`)); mark(ok); });
      i.addEventListener("keydown", e => e.key === "Enter" && b.click()); r.append(b); ops.append(r);
    } else {
      (q.op || []).map((t, j) => ({t, j})).sort(() => Math.random() - .5).forEach((o, pos) => {
        const b = node(`<button class="opt"><span class="bub">${"abcdefgh"[pos]})</span><span class="tx">${inl(o.t)}</span><span class="tg"></span></button>`);
        b.onclick = () => { ops.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.j === q.ok) { x.classList.add("ok"); x.querySelector(".tg").textContent = "✓ correcta"; } });
          if (o.j !== q.ok) { b.classList.add("bad"); b.querySelector(".tg").textContent = "✗ tu respuesta"; } mark(o.j === q.ok); };
        b.dataset.j = o.j; ops.append(b);
      });
    }
    main.append(c); tex(main);
  };
  show();
}

/* ---------- evaluaciones anteriores ---------- */
function vEvals(pre) {
  const hechas = new Set(store.get("hechas", [])); let ft = pre?.tema || "todos", ff = "todas";
  const fuentes = [...new Set(E.map(e => e.fuente))];
  main.append(hdr(`Evaluaciones anteriores · ${E.length} preguntas${fuentes.length ? ` de ${fuentes.length} evaluaciones` : ""}`, "Banco de preguntas anteriores", "Intenta cada pregunta antes de abrir la solución. Después revisa la rúbrica: ahí está lo que separa un 5 de un 7."));
  const freq = {}; E.forEach(e => freq[e.tema] = (freq[e.tema] || 0) + 1); const mx = Math.max(1, ...Object.values(freq));
  const top = node(`<section style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end"><div><div class="lbl" style="margin-bottom:6px">Frecuencia por ${esc(UNI.toLowerCase())}</div>${Object.entries(freq).sort((a, b) => b[1] - a[1]).map(([id, n]) => `<div class="freq"><span><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</span><div class="hbar"><i style="width:${100 * n / mx}%"></i></div><span class="mono" style="text-align:right">${n}</span></div>`).join("")}</div>
    <div class="sheet" style="padding:14px 20px"><div class="lbl">Resueltas</div><div class="big" id="prog"></div></div></section>`);
  main.append(top);
  const fil = node(`<div class="row"></div>`);
  [["todos", "Todos"], ...Object.keys(freq).map(id => [id, `§${idx(id)} ${tituloTema(id)}`])].forEach(([id, l]) => { const b = node(`<button class="chip${id === ft ? " on" : ""}">${esc(l)}</button>`); b.onclick = () => { ft = id; fil.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); lista(); }; fil.append(b); });
  if (fuentes.length > 1) { const s = node(`<select aria-label="Filtrar por evaluación"><option value="todas">Todas las evaluaciones</option>${fuentes.map(f => `<option>${esc(f)}</option>`).join("")}</select>`); s.onchange = () => { ff = s.value; lista(); }; fil.append(s); }
  main.append(fil);
  const cont = node(`<div style="display:flex;flex-direction:column;gap:30px"></div>`); main.append(cont);
  const prog = () => $("#prog").innerHTML = `${hechas.size}<small>/${E.length}</small>`;
  function lista() {
    cont.innerHTML = ""; prog();
    E.map((e, i) => ({...e, i})).filter(e => (ft === "todos" || e.tema === ft) && (ff === "todas" || e.fuente === ff)).forEach(e => {
      const of = e.confianza === "pauta";
      const rub = (e.rubrica || []).length ? `<div class="tbl"><table><tr><th>Criterio de la pauta</th><th style="text-align:right">Pts</th></tr>${e.rubrica.map(r => `<tr><td>${inl(r.criterio)}</td><td class="mono" style="text-align:right">${esc(r.pts)}</td></tr>`).join("")}</table></div>`
        : (e.puntaje_max || []).length ? `<div class="lbl" style="color:var(--acc)">Lo que suma puntos</div>${md(e.puntaje_max.map(x => "- " + x).join("\n"))}` : "";
      const desc = [...(e.descuentos || []), ...(e.errores || [])];
      const panes = [
        ["I · Estrategia", (e.estrategia ? md(e.estrategia) : "") + (e.tiempo ? `<div class="pen">tiempo sugerido: ${esc(e.tiempo)}</div>` : "")],
        ["II · Solución", pasosHTML(e.pasos) + (e.respuesta ? `<div class="ans">${md(e.respuesta)}</div>` : "") + `<div class="qed">∎</div>`],
        ["III · Rúbrica de puntaje", rub + (desc.length ? `<div style="margin-top:12px"><div class="lbl" style="color:var(--pen)">Descuentos frecuentes</div>${desc.map(d => `<div class="pen">${inl(d)}</div>`).join("")}</div>` : "") + ((e.variantes || []).length ? `<p class="lbl" style="margin-top:12px">También apareció en: ${e.variantes.map(esc).join(" · ")}</p>` : "")]
      ].filter(p => p[1].replace(/<[^>]+>|∎/g, "").trim());
      const k = node(`<article class="exam"><div class="rot"><div><span class="lbl">Fuente</span>${esc(e.fuente)}${e.pregunta ? " — " + esc(e.pregunta) : ""}</div><div><span class="lbl">Puntaje</span>${esc(e.puntaje || "—")}</div><div class="${of ? "of" : "pr"}"><span class="lbl" style="color:inherit">Solución</span>${of ? "Pauta oficial" : "Propuesta"}</div></div>
        <div class="en"><div class="lbl" style="margin-bottom:6px">§${idx(e.tema)} · ${esc(tituloTema(e.tema))}</div>${md(e.enunciado)}</div><div class="tabs"></div><div class="pane"><p class="lbl">Intenta resolverla antes de abrir la solución.</p></div>
        <div class="foot"><span></span><label class="chk"><input type="checkbox"${hechas.has(e.i) ? " checked" : ""}> La resolví</label></div></article>`);
      const tabs = k.querySelector(".tabs"), pane = k.querySelector(".pane");
      panes.forEach(([l, h]) => { const b = node(`<button class="tab">${l}</button>`); b.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); pane.innerHTML = h; tex(pane); }; tabs.append(b); });
      k.querySelector("input").onchange = ev => { ev.target.checked ? hechas.add(e.i) : hechas.delete(e.i); store.set("hechas", [...hechas]); prog(); };
      cont.append(k);
    });
    if (!cont.children.length) cont.append(node(`<p class="lbl">No hay preguntas con ese filtro.</p>`));
    tex(cont);
  }
  lista();
}

go(store.get("tab", "resumen"));
})();
</script>
