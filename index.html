<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EDO · Control 1</title>

window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
  svg: { fontCache: 'global', scale: 1.0 },
  options: { enableMenu: false },
  startup: {
    typeset: false,
    ready: () => {
      window.MathJax.startup.defaultReady();
      window.__mjReady = true;
      if (window.__retypeset) window.__retypeset();
    }

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1220; --bg2:#090b14; --surf:#141828; --card:#161b2c; --card2:#1c2236; --elev:#202741;
  --txt:#eef0f8; --txt2:#c4cade; --muted:#8b93b0; --faint:#5c6485;
  --accent:#6ea8fe; --accent2:#5ce2c0; --accent3:#c9a6ff;
  --ok:#36d399; --bad:#fb7185; --warn:#fbbf24;
  --border:#242b45; --hair:#1c2338; --edge:rgba(255,255,255,.06);
  --shadow:rgba(0,0,0,.5);
  --font-ui:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f4f6fc; --bg2:#e7ebf6; --surf:#ffffff; --card:#ffffff; --card2:#f3f5fc; --elev:#ffffff;
  --txt:#141a30; --txt2:#2c344f; --muted:#5a6485; --faint:#8a93b2;
  --accent:#2f6bdd; --accent2:#0ea98a; --accent3:#7c4ddb;
  --ok:#0f9d63; --bad:#d63a52; --warn:#b8780a;
  --border:#dde2f0; --hair:#eef1f8; --edge:rgba(20,26,48,.04);
  --shadow:rgba(30,40,80,.14);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1300px 900px at 82% -12%, rgba(110,168,254,.14), transparent 58%),
             radial-gradient(1000px 800px at -12% 112%, rgba(92,226,192,.10), transparent 55%),
             radial-gradient(700px 600px at 50% 40%, rgba(201,166,255,.05), transparent 60%),
             var(--bg);
  color:var(--txt);
  font-family:var(--font-ui);
  font-size:16.5px; line-height:1.64; -webkit-text-size-adjust:100%;
  font-feature-settings:"ss01","cv01"; letter-spacing:-.005em;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent);text-decoration:none}
a:hover{color:color-mix(in srgb,var(--accent) 78%, var(--txt))}
::selection{background:color-mix(in srgb,var(--accent) 32%, transparent)}
/* ---------- Scrollbars ---------- */
html{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--faint) 55%,transparent) transparent}
::-webkit-scrollbar{width:12px;height:12px;background:transparent}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--faint) 55%,transparent);border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--faint) 85%,transparent);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
/* ---------- Top bar ---------- */
#topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:12px;
  padding:calc(11px + env(safe-area-inset-top)) 20px 11px;
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter:saturate(180%) blur(18px); -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 0 var(--edge);
}
#menuBtn{
  display:none; border:1px solid var(--border); background:var(--card);
  color:var(--txt); width:40px; height:40px; border-radius:11px; font-size:18px; cursor:pointer;
  align-items:center; justify-content:center;
}
#brand{font-weight:600; font-size:15px; letter-spacing:-.01em; display:flex; align-items:center; gap:11px}
#brand .logo{
  width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#4f7ee6 60%,var(--accent2));
  box-shadow:0 4px 14px -4px color-mix(in srgb,var(--accent) 60%,transparent), inset 0 1px 0 rgba(255,255,255,.35);
  color:#0a1024;font-family:var(--font-mono);font-weight:600;font-size:15px;
}
#brand .wm{display:flex;flex-direction:column;line-height:1.12}
#brand .wm b{font-weight:600;font-size:14.5px;color:var(--txt);letter-spacing:-.01em}
#brand small{color:var(--faint); font-weight:500; font-size:11px; letter-spacing:.02em; font-family:var(--font-mono)}
#brand .dot{color:var(--accent2)}
#topRight{margin-left:auto; display:flex; align-items:center; gap:12px}
#themeBtn{border:1px solid var(--border); background:var(--card); color:var(--txt); width:40px;height:40px;border-radius:11px;font-size:16px;cursor:pointer;transition:background .15s,border .15s}
#themeBtn:hover{background:var(--card2);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
#progWrap{display:flex;align-items:center;gap:9px;min-width:120px;padding:6px 12px 6px 13px;border:1px solid var(--border);border-radius:99px;background:color-mix(in srgb,var(--card) 60%,transparent)}
#progBar{flex:1;height:6px;background:color-mix(in srgb,var(--faint) 25%,transparent);border-radius:99px;overflow:hidden;min-width:56px}
#progFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.1,1);box-shadow:0 0 10px color-mix(in srgb,var(--accent2) 60%,transparent)}
#progTxt{font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-weight:500}
/* ---------- Layout ---------- */
#layout{display:flex; max-width:1200px; margin:0 auto; gap:0}
#sidebar{
  width:296px; flex:none; padding:22px 16px 60px; position:sticky; top:65px; align-self:flex-start;
  max-height:calc(100vh - 65px); overflow-y:auto;
}
#sidebar h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--faint);margin:4px 10px 12px;font-family:var(--font-mono);font-weight:500}
.navItem{
  display:flex; align-items:center; gap:12px; padding:9px 11px; border-radius:12px; cursor:pointer;
  color:var(--txt2); border:1px solid transparent; margin-bottom:3px; position:relative;
  transition:background .16s,border .16s,color .16s;
}
.navItem:hover{background:var(--card);color:var(--txt)}
.navItem.active{background:linear-gradient(180deg,var(--card2),var(--card));border-color:var(--border);color:var(--txt);box-shadow:0 6px 20px -14px var(--shadow)}
.navItem.active::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2))}
.navItem .ic{font-size:16px; width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:9px; background:var(--card2); border:1px solid var(--border); transition:background .16s}
.navItem.active .ic{background:color-mix(in srgb,var(--accent) 16%, var(--card2));border-color:color-mix(in srgb,var(--accent) 34%,var(--border))}
.navItem .nm{font-size:13.5px; font-weight:600; line-height:1.25; letter-spacing:-.01em}
.navItem .nm small{display:block;color:var(--faint);font-weight:450;font-size:11px;margin-top:2px;letter-spacing:0}
.navItem .chk{margin-left:auto; color:var(--ok); font-size:12px; opacity:0; flex:none; width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--ok) 18%,transparent);display:grid;place-items:center;transition:opacity .2s}
.navItem.done .chk{opacity:1}
.navItem.done .ic{opacity:.6}
#scrim{display:none; position:fixed; inset:0; background:rgba(4,6,14,.62); backdrop-filter:blur(3px); z-index:35}
/* ---------- Content ---------- */
#main{flex:1; min-width:0; padding:28px 26px 130px; border-left:1px solid var(--hair)}
.mhead{margin:6px 0 26px;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
.mhead .kick{color:var(--accent2);font-weight:500;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--font-mono);display:inline-flex;align-items:center;gap:8px}
.mhead .kick::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
.mhead h1{font-size:32px;line-height:1.12;margin:11px 0 7px;font-weight:700;letter-spacing:-.025em}
.mhead h1 .e{margin-right:12px;font-size:.9em}
.mhead p{color:var(--muted);margin:0;font-size:16px;max-width:70ch}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section{margin:36px 0}
.section > .stitle{
  display:flex;align-items:center;gap:11px;font-size:11.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 16px;font-family:var(--font-mono);
}
.section > .stitle .sdot{width:7px;height:7px;border-radius:2px;background:var(--accent);flex:none}
.section > .stitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 45%,var(--card)),var(--card));border:1px solid var(--border);border-radius:16px;padding:22px 22px;box-shadow:0 1px 0 var(--edge) inset,0 18px 40px -30px var(--shadow);margin-bottom:14px}
.para{margin:0 0 14px}
.para:last-child{margin-bottom:0}
.formula{
  background:radial-gradient(120% 120% at 0% 0%, color-mix(in srgb,var(--accent) 6%,var(--card2)), var(--card2));
  border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin:16px 0;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; text-align:center;
  box-shadow:0 1px 0 var(--edge) inset;
}
.formula .cap{display:block;color:var(--muted);font-size:13px;margin-top:9px;text-align:center;line-height:1.5;font-family:var(--font-ui)}
.callout{
  position:relative;border:1px solid color-mix(in srgb,var(--accent) 30%, var(--border));
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 11%, var(--card)), color-mix(in srgb,var(--accent) 4%, var(--card)));
  border-radius:13px;padding:14px 16px 14px 46px;margin:16px 0;box-shadow:0 1px 0 var(--edge) inset;
}
.callout::before{content:"💡";position:absolute;left:13px;top:13px;font-size:15px;width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
strong{color:var(--txt);font-weight:600}
code{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:1.5px 6px;font-size:.9em;font-family:var(--font-mono)}
/* ---------- Interactive bits ---------- */
.btn{
  appearance:none;border:1px solid var(--border);background:var(--card2);color:var(--txt);
  border-radius:11px;padding:10px 15px;font-size:14px;font-weight:500;cursor:pointer;letter-spacing:-.01em;
  min-height:44px; transition:background .15s,border .15s,transform .06s,box-shadow .15s; touch-action:manipulation;
}
.btn:hover{background:var(--elev);border-color:color-mix(in srgb,var(--accent) 34%,var(--border))}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(180deg,#7fb2ff,var(--accent) 55%,#5b93ee);border-color:transparent;color:#08101f;font-weight:600;box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--card2)}
.btn.sm{padding:7px 13px;font-size:12.5px;min-height:36px;border-radius:9px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* steps (guided derivation + exercise) */
.step{border:1px solid var(--border);border-radius:14px;padding:16px 17px;margin-bottom:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 40%,var(--card)),var(--card));transition:border .15s}
.step:hover{border-color:color-mix(in srgb,var(--accent) 22%,var(--border))}
.step .qn{display:flex;gap:12px;align-items:flex-start}
.step .badge{flex:none;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--accent2) 14%,var(--card2));border:1px solid color-mix(in srgb,var(--accent2) 30%,var(--border));
  display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--accent2);font-family:var(--font-mono)}
.step .prompt{font-weight:500;margin:3px 0 0}
.hintbox{margin-top:11px}
.hint{background:color-mix(in srgb,var(--warn) 7%,var(--card2));border:1px solid color-mix(in srgb,var(--warn) 28%,var(--border));border-radius:10px;padding:10px 13px;margin-top:8px;font-size:15px;color:var(--txt2)}
.hint .lab{color:var(--warn);font-weight:500;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:3px;font-family:var(--font-mono)}
.reveal{margin-top:12px;border-top:1px solid var(--hair);padding-top:12px;display:none}
.reveal.show{display:block;animation:fade .32s cubic-bezier(.2,.7,.2,1)}
.reveal .ans{background:color-mix(in srgb,var(--ok) 11%, transparent);border:1px solid color-mix(in srgb,var(--ok) 34%, var(--border));border-radius:11px;padding:10px 12px;margin-bottom:8px}
.reveal .exp{color:var(--muted);font-size:15px}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.finalans{margin-top:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent2) 13%, transparent),color-mix(in srgb,var(--accent2) 6%,transparent));border:1px solid color-mix(in srgb,var(--accent2) 36%, var(--border));border-radius:12px;padding:13px 15px}
.finalans .lab{color:var(--accent2);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px;font-family:var(--font-mono)}
/* quiz */
.quiz{border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:13px;background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 40%,var(--card)),var(--card))}
.quiz .q{font-weight:500;margin:0 0 14px;font-size:15.5px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:9px;cursor:pointer;background:var(--card2);transition:border .16s,background .16s,transform .06s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));background:var(--elev)}
.opt:active{transform:scale(.995)}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px;transition:border .16s,background .16s}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#04130c}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .mk{border-color:var(--bad);background:var(--bad);color:#1a0408}
.opt.locked{cursor:default}
.opt.locked:hover{background:var(--card2)}
.opt.locked:not(.correct):not(.wrong){opacity:.55}
.opt.correct.locked,.opt.wrong.locked{opacity:1}
.fb{font-size:13.5px;color:var(--muted);margin:4px 0 0;display:none;line-height:1.5}
.opt.show-fb .fb{display:block}
.qexp{margin-top:8px;background:color-mix(in srgb,var(--accent) 6%,var(--card2));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:11px;padding:12px 14px;font-size:14.5px;display:none;color:var(--txt2)}
.qexp.show{display:block;animation:fade .32s cubic-bezier(.2,.7,.2,1)}
.qexp .lab{color:var(--accent);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px;font-family:var(--font-mono)}
/* takeaways */
.takeaways{list-style:none;padding:0;margin:0}
.takeaways li{position:relative;padding:13px 15px 13px 46px;background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 40%,var(--card)),var(--card));border:1px solid var(--border);border-radius:12px;margin-bottom:9px;line-height:1.55;transition:border .15s}
.takeaways li:hover{border-color:color-mix(in srgb,var(--accent3) 30%,var(--border))}
.takeaways li::before{content:"";position:absolute;left:15px;top:16px;width:16px;height:16px;border-radius:5px;background:linear-gradient(145deg,var(--accent3),var(--accent));box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent3) 60%,transparent)}
/* widget shell */
.widget{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:16px;padding:16px;margin:6px 0 4px;overflow:hidden;box-shadow:0 1px 0 var(--edge) inset,0 18px 40px -30px var(--shadow)}
.widget .whead{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;margin:0 2px 12px;letter-spacing:-.01em}
.widget .whead::before{content:"";width:8px;height:8px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent2));flex:none}
.widget .whead .tag{margin-left:auto;font-size:10px;color:var(--faint);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-mono);background:var(--card2);border:1px solid var(--border);padding:4px 9px;border-radius:99px}
.wcanvas{display:block;width:100%;border-radius:12px;background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--accent) 5%,var(--bg2)),var(--bg2));border:1px solid var(--border);touch-action:none}
.wctrls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:13px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card2);padding:2px}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;min-height:38px;border-radius:8px;transition:background .15s,color .15s;font-family:var(--font-ui)}
.seg button.on{background:var(--accent);color:#08101f;font-weight:600}
.field{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;font-family:var(--font-mono);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px 12px}
.field input[type=range]{accent-color:var(--accent);height:28px}
.field b{color:var(--accent2);font-weight:600}
.readout{font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--accent) 4%,var(--card2));border:1px solid var(--border);border-radius:11px;padding:11px 14px;font-size:14px;line-height:1.5;margin-top:11px;color:var(--txt2)}
.readout b{color:var(--accent2);font-weight:600}
.readout .big{font-size:20px;font-weight:700;color:var(--txt)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:5px 10px;font-family:var(--font-mono)}
/* footer nav */
.fnav{display:flex;gap:10px;margin-top:38px;padding-top:20px;border-top:1px solid var(--hair)}
.fnav .btn{flex:1;justify-content:center;display:flex;align-items:center;gap:7px}
.markdone{width:100%;margin-top:16px;min-height:48px;font-size:14.5px}
.bignote{color:var(--faint);font-size:12.5px;text-align:center;margin-top:28px;line-height:1.6;padding:14px 10px;border-top:1px solid var(--hair)}
.bignote a{cursor:pointer}
@media (max-width:860px){
  body{font-size:15.5px}
  #menuBtn{display:flex}
  #sidebar{
    position:fixed; top:0; left:0; bottom:0; width:300px; max-width:86vw; z-index:36;
    background:var(--surf); transform:translateX(-104%); transition:transform .28s cubic-bezier(.3,.7,.2,1);
    padding-top:calc(20px + env(safe-area-inset-top)); max-height:none; box-shadow:0 0 60px var(--shadow);
    border-right:1px solid var(--border);
  }
  #sidebar.open{transform:none}
  #scrim.open{display:block}
  #main{padding:20px 16px 120px;border-left:none}
  .mhead h1{font-size:25px}
  #brand .wm small,#brand small{display:none}
  #progWrap{min-width:auto;padding:5px 10px}
  #progTxt{display:none}
}
@media (max-width:420px){
  .mhead h1{font-size:22px}
  .card,.widget{border-radius:14px;padding:16px}
  #topbar{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div id="topbar">

const MODULES = (window.MODULES_DATA && window.MODULES_DATA.length) ? window.MODULES_DATA : [];
const APP_ID='edo-control1';
const LS_PROG='estudio_'+APP_ID+'_prog', LS_THEME='estudio_'+APP_ID+'_theme', LS_LAST='estudio_'+APP_ID+'_last';
let progress = new Set();
try{ progress = new Set(JSON.parse(localStorage.getItem(LS_PROG)||'[]')); }catch(e){}
let current = 0;
try{ const l=parseInt(localStorage.getItem(LS_LAST)); if(!isNaN(l)) current=l; }catch(e){}
function saveProg(){ try{localStorage.setItem(LS_PROG, JSON.stringify([...progress]));}catch(e){} }

const contentEl = $('#content'), navList = $('#navList');
window.__retypeset = ()=> typeset(contentEl);

/* ============================================================ nav */
function renderNav(){
  navList.innerHTML='';
  MODULES.forEach((m,i)=>{
    const it = el('div','navItem'+(i===current?' active':'')+(progress.has(m.id)?' done':''));
    it.innerHTML = `<span class="ic">${m.icon||'•'}</span><span class="nm">${escapeHTML(m.title)}<small>${escapeHTML(m.subtitle||'')}</small></span><span class="chk">✓</span>`;
    it.onclick=()=>{ go(i); closeDrawer(); };
    navList.appendChild(it);
  });
  const pct = MODULES.length? Math.round(100*progress.size/MODULES.length):0;
  $('#progFill').style.width=pct+'%'; $('#progTxt').textContent=pct+'%';
}

/* ============================================================ render module */
function go(i){ current=Math.max(0,Math.min(MODULES.length-1,i)); try{localStorage.setItem(LS_LAST,current);}catch(e){} renderModule(); renderNav(); window.scrollTo({top:0,behavior:'smooth'}); }

function sectionWrap(titleHTML){
  const s=el('section','section'); const t=el('div','stitle'); t.innerHTML='<span class="sdot"></span>'+titleHTML; s.appendChild(t); return s;
}

function renderModule(){
  const m=MODULES[current]; if(!m){ contentEl.innerHTML='<p style="color:var(--muted)">Cargando contenido…</p>'; return; }
  contentEl.innerHTML='';
  // head
  const head=el('div','mhead');
  head.innerHTML=`<div class="kick">Módulo ${current+1} de ${MODULES.length}</div>
    <h1><span class="e">${m.icon||''}</span>${escapeHTML(m.title)}</h1><p>${escapeHTML(m.subtitle||'')}</p>`;
  contentEl.appendChild(head);

  // theory
  if(m.theory && m.theory.length){
    const s=sectionWrap('Teoría'); const card=el('div','card');
    m.theory.forEach(b=>{
      if(b.type==='formula'){ card.appendChild(dispLatex(b.content)); if(b.caption){const c=el('span','cap');c.innerHTML=md(b.caption);card.lastChild.appendChild(c);} }
      else if(b.type==='callout'){ const c=el('div','callout'); c.innerHTML=md(b.content); card.appendChild(c); }
      else { const p=el('div','para'); p.innerHTML=md(b.content); card.appendChild(p); }
    });
    s.appendChild(card); contentEl.appendChild(s);
  }

  // widget
  if(m.widget && m.widget!=='none' && WIDGETS[m.widget]){
    const s=sectionWrap('Explora'); const w=el('div','widget');
    s.appendChild(w); contentEl.appendChild(s);
    try{ WIDGETS[m.widget](w); }catch(e){ w.innerHTML='<p style="color:var(--muted)">Widget no disponible.</p>'; console.error(e); }
  }

  // guided derivation
  if(m.guidedDerivation){
    const gd=m.guidedDerivation;
    const s=sectionWrap(escapeHTML(gd.title||'Deducción guiada'));
    if(gd.intro){ const p=el('div','card'); p.innerHTML=md(gd.intro); s.appendChild(p); }
    (gd.steps||[]).forEach((st,idx)=> s.appendChild(stepCard(st,idx,'deriv')) );
    contentEl.appendChild(s);
  }

  // exercises
  if(m.exercises && m.exercises.length){
    const s=sectionWrap('Ejercicios paso a paso');
    m.exercises.forEach((ex,ei)=>{
      const card=el('div','card');
      const stm=el('div','para'); stm.innerHTML='<strong>Ejercicio '+(ei+1)+'.</strong> '+md(ex.statement); card.appendChild(stm);
      (ex.steps||[]).forEach((st,si)=> card.appendChild(stepCard(st,si,'ex')) );
      if(ex.finalAnswerLatex){
        const fa=el('div','finalans'); fa.innerHTML='<span class="lab">✅ Resultado</span>';
        fa.appendChild(dispLatex(ex.finalAnswerLatex)); card.appendChild(fa);
      }
      s.appendChild(card);
    });
    contentEl.appendChild(s);
  }

  // conceptual
  if(m.conceptual && m.conceptual.length){
    const s=sectionWrap('Preguntas conceptuales');
    m.conceptual.forEach((q,qi)=> s.appendChild(quizCard(q,qi)) );
    contentEl.appendChild(s);
  }

  // takeaways
  if(m.keyTakeaways && m.keyTakeaways.length){
    const s=sectionWrap('Ideas clave'); const ul=el('ul','takeaways');
    m.keyTakeaways.forEach(t=>{ const li=el('li'); li.innerHTML=md(t); ul.appendChild(li); });
    s.appendChild(ul); contentEl.appendChild(s);
  }

  // mark done + footer nav
  const done=progress.has(m.id);
  const mk=el('button','btn primary markdone', done?'✓ Repasado — ¡bien!':'Marcar este módulo como repasado');
  mk.onclick=()=>{ if(progress.has(m.id))progress.delete(m.id); else progress.add(m.id); saveProg(); renderNav(); renderModule(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); };
  contentEl.appendChild(mk);

  const fn=el('div','fnav');
  const prev=el('button','btn ghost','← Anterior'); prev.disabled=current===0; prev.onclick=()=>go(current-1);
  const next=el('button','btn','Siguiente →'); next.disabled=current===MODULES.length-1; next.onclick=()=>go(current+1);
  fn.appendChild(prev); fn.appendChild(next); contentEl.appendChild(fn);

  typeset(contentEl);
}

/* ---- step card (guided + exercise) with progressive hints + reveal ---- */
function stepCard(st,idx,kind){
  const c=el('div','step');
  const qn=el('div','qn');
  qn.appendChild(el('div','badge', String(idx+1)));
  const pr=el('div'); pr.className='prompt'; pr.innerHTML=md(st.prompt); qn.appendChild(pr);
  c.appendChild(qn);

  const hints=st.hints||[]; let shown=0;
  const hb=el('div','hintbox');
  const ctrls=el('div','row'); ctrls.style.marginTop='10px';
  const hintBtn=el('button','btn sm ghost', hints.length?'💡 Pista':'');
  const revBtn=el('button','btn sm', kind==='ex'?'Ver solución del paso':'Ver paso');
  if(hints.length) ctrls.appendChild(hintBtn); ctrls.appendChild(revBtn);
  c.appendChild(ctrls); c.appendChild(hb);

  hintBtn.onclick=()=>{
    if(shown>=hints.length) return;
    const h=el('div','hint'); h.innerHTML='<span class="lab">Pista '+(shown+1)+'</span>'+md(hints[shown]); hb.appendChild(h); typeset(h);
    shown++;
    if(shown>=hints.length){ hintBtn.textContent='No hay más pistas'; hintBtn.disabled=true; }
  };

  const rev=el('div','reveal');
  const ans=el('div','ans'); ans.appendChild(dispLatex(st.revealLatex!=null?st.revealLatex:st.answerLatex||''));
  rev.appendChild(ans);
  if(st.explanation){ const ex=el('div','exp'); ex.innerHTML=md(st.explanation); rev.appendChild(ex); }
  c.appendChild(rev);
  revBtn.onclick=()=>{ const open=rev.classList.toggle('show'); revBtn.textContent= open?'Ocultar':(kind==='ex'?'Ver solución del paso':'Ver paso'); if(open) typeset(rev); };
  return c;
}

/* ---- quiz card ---- */
function quizCard(q,qi){
  const c=el('div','quiz');
  const qq=el('div','q'); qq.innerHTML='<strong>'+(qi+1)+'.</strong> '+md(q.question); c.appendChild(qq);
  const exp=el('div','qexp'); exp.innerHTML='<span class="lab">Explicación</span>'+md(q.explanation||'');
  let answered=false;
  (q.options||[]).forEach(o=>{
    const op=el('div','opt');
    op.innerHTML='<span class="mk"></span><div><div class="otext"></div><div class="fb"></div></div>';
    $('.otext',op).innerHTML=md(o.text); $('.fb',op).innerHTML=md(o.feedback||'');
    op.onclick=()=>{
      if(answered && o.correct===false) { return; }
      // allow exploring: lock only the act of marking; we lock after first pick
      if(answered) return;
      answered=true;
      [...c.querySelectorAll('.opt')].forEach(x=>x.classList.add('locked'));
      // mark all correct ones
      (q.options||[]).forEach((oo,k)=>{ const node=c.querySelectorAll('.opt')[k];
        if(oo.correct){ node.classList.add('correct'); node.querySelector('.mk').textContent='✓'; }
      });
      if(!o.correct){ op.classList.add('wrong'); op.querySelector('.mk').textContent='✕'; }
      op.classList.add('show-fb');
      // also show feedback of the correct one
      (q.options||[]).forEach((oo,k)=>{ if(oo.correct){ c.querySelectorAll('.opt')[k].classList.add('show-fb'); }});
      exp.classList.add('show'); typeset(c);
    };
    c.appendChild(op);
  });
  c.appendChild(exp);
  return c;
}

/* ============================================================ canvas util */
function setupCanvas(host,height){
  const cv=el('canvas','wcanvas'); cv.style.height=height+'px'; host.appendChild(cv);
  const ctx=cv.getContext('2d');
  function size(){ const dpr=window.devicePixelRatio||1; const w=cv.clientWidth||300, h=cv.clientHeight||height;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); return {w,h,ctx}; }
  return {cv,ctx,size};
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'; }
function whead(host,title,tag){ const h=el('div','whead'); h.innerHTML=`<span>${title}</span>`+(tag?`<span class="tag">${tag}</span>`:''); host.appendChild(h); }
function ctrlRow(host){ const r=el('div','wctrls'); host.appendChild(r); return r; }
function rangeField(label, min,max,val,step,oninput){
  const f=el('label','field'); const sp=el('span'); sp.textContent=label;
  const inp=el('input'); inp.type='range'; inp.min=min;inp.max=max;inp.value=val;inp.step=step;
  const out=el('b'); out.textContent=(+val).toFixed(step<1?2:0);
  inp.oninput=()=>{ out.textContent=(+inp.value).toFixed(step<1?2:0); oninput(+inp.value); };
  f.appendChild(sp); f.appendChild(inp); f.appendChild(out); return {f,inp,out};
}
function segmented(host,opts,initial,onpick){
  const s=el('div','seg'); opts.forEach((o,i)=>{ const b=el('button',i===initial?'on':'',o.label);
    b.onclick=()=>{ [...s.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); onpick(o.value,i); };
    s.appendChild(b); }); host.appendChild(s); return s;
}

/* ============================================================ WIDGETS */
const WIDGETS={};
/* ============================================================
   COMO ANADIR UN WIDGET (visualizacion interactiva):
   1) En el modulo pon  "widget": "mi-clave"  (en MODULES_DATA).
   2) Registra aqui:    WIDGETS['mi-clave'] = function(host){ ... };
   Si el modulo no necesita widget, usa  "widget": "none".

   Helpers disponibles (definidos arriba, NO los borres):
     setupCanvas(host, altoPx) -> {cv, ctx, size};  size() -> {w,h}  (maneja DPR)
     cssVar('--accent') -> color del tema (se adapta a claro/oscuro). Colores:
        --accent --accent2 --accent3 --ok --bad --warn --muted --border --bg2 --txt
     whead(host, titulo, etiqueta)              cabecera del widget
     ctrlRow(host) -> fila para controles
     rangeField(label,min,max,val,step,oninput) -> {f,inp,out}   (deslizador)
     segmented(host, [{label,value}], idxInicial, (value,i)=>{}) (toggle)
     el(tag,clase,texto)   $('selector')   typeset(nodo)  (re-render de MathJax)
   Para dibujo tactil: usa pointerdown/pointermove/pointerup sobre cv y
   cv.getBoundingClientRect(). Llama draw() en cada cambio y en 'resize'.
   Los widgets de abajo usan los helpers de dibujo comunes (mkView, frame,
   traceSol, contour, slopeField) definidos justo despues de este bloque.
   ============================================================ */
/* ============================================================
   Utilidades comunes de dibujo para los widgets de EDO
   ============================================================ */
function mkView(px0,py0,pw,ph,x0,x1,y0,y1){
  return { x0:x0,x1:x1,y0:y0,y1:y1,px0:px0,py0:py0,pw:pw,ph:ph,
    X:function(x){ return px0+(x-x0)/(x1-x0)*pw; },
    Y:function(y){ return py0+ph-(y-y0)/(y1-y0)*ph; },
    ix:function(px){ return x0+(px-px0)/pw*(x1-x0); },
    iy:function(py){ return y0+(py0+ph-py)/ph*(y1-y0); } };
}
function frame(ctx,V,stepX,stepY){
  ctx.save();
  ctx.beginPath(); ctx.rect(V.px0,V.py0,V.pw,V.ph); ctx.clip();
  ctx.lineWidth=1; ctx.strokeStyle=cssVar('--border'); ctx.globalAlpha=.45;
  ctx.beginPath();
  for(var gx=Math.ceil(V.x0/stepX)*stepX; gx<=V.x1; gx+=stepX){ ctx.moveTo(V.X(gx),V.py0); ctx.lineTo(V.X(gx),V.py0+V.ph); }
  for(var gy=Math.ceil(V.y0/stepY)*stepY; gy<=V.y1; gy+=stepY){ ctx.moveTo(V.px0,V.Y(gy)); ctx.lineTo(V.px0+V.pw,V.Y(gy)); }
  ctx.stroke();
  ctx.globalAlpha=1; ctx.strokeStyle=cssVar('--muted'); ctx.lineWidth=1.2;
  ctx.beginPath();
  if(V.y0<0&&V.y1>0){ ctx.moveTo(V.px0,V.Y(0)); ctx.lineTo(V.px0+V.pw,V.Y(0)); }
  if(V.x0<0&&V.x1>0){ ctx.moveTo(V.X(0),V.py0); ctx.lineTo(V.X(0),V.py0+V.ph); }
  ctx.stroke();
  ctx.restore();
}
function clipBox(ctx,V){ ctx.save(); ctx.beginPath(); ctx.rect(V.px0,V.py0,V.pw,V.ph); ctx.clip(); }
function rk4(f,x,y,h){
  var k1=f(x,y), k2=f(x+h/2,y+h*k1/2), k3=f(x+h/2,y+h*k2/2), k4=f(x+h,y+h*k3);
  return y+h*(k1+2*k2+2*k3+k4)/6;
}
/* traza la curva solucion de y'=f(x,y) desde (x0,y0) en ambos sentidos */
function traceSol(ctx,V,f,x0,y0,color,width){
  ctx.strokeStyle=color; ctx.lineWidth=width||2.4;
  [1,-1].forEach(function(dir){
    var h=dir*(V.x1-V.x0)/900, x=x0, y=y0, first=true;
    ctx.beginPath();
    for(var i=0;i<900;i++){
      if(first){ ctx.moveTo(V.X(x),V.Y(y)); first=false; }
      var ny=rk4(f,x,y,h);
      if(!isFinite(ny)||Math.abs(ny)>1e4) break;
      x+=h; y=ny;
      if(x<V.x0-0.1||x>V.x1+0.1) break;
      if(y<V.y0-(V.y1-V.y0)||y>V.y1+(V.y1-V.y0)) { ctx.lineTo(V.X(x),V.Y(y)); break; }
      ctx.lineTo(V.X(x),V.Y(y));
    }
    ctx.stroke();
  });
}
function dot(ctx,V,x,y,color,r){
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(V.X(x),V.Y(y),r||4.5,0,6.284); ctx.fill();
}
function lbl(ctx,text,px,py,color,align){
  ctx.fillStyle=color; ctx.font='500 11px ui-monospace, monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(text,px,py);
  ctx.textAlign='left';
}
/* curvas de nivel de F(x,y)=level por marching squares */
function contour(ctx,V,F,level,color,width,N){
  N=N||100;
  var dx=(V.x1-V.x0)/N, dy=(V.y1-V.y0)/N;
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
  for(var i=0;i<N;i++) for(var j=0;j<N;j++){
    var x=V.x0+i*dx, y=V.y0+j*dy;
    var P=[[x,y],[x+dx,y],[x+dx,y+dy],[x,y+dy]], val=[], k;
    for(k=0;k<4;k++) val.push(F(P[k][0],P[k][1])-level);
    var pts=[];
    for(k=0;k<4;k++){
      var a=val[k], b=val[(k+1)%4];
      if(!isFinite(a)||!isFinite(b)) continue;
      if((a>0)!==(b>0)){
        var t=a/(a-b), A=P[k], B=P[(k+1)%4];
        pts.push([A[0]+t*(B[0]-A[0]), A[1]+t*(B[1]-A[1])]);
      }
    }
    if(pts.length>=2){ ctx.moveTo(V.X(pts[0][0]),V.Y(pts[0][1])); ctx.lineTo(V.X(pts[1][0]),V.Y(pts[1][1])); }
    if(pts.length===4){ ctx.moveTo(V.X(pts[2][0]),V.Y(pts[2][1])); ctx.lineTo(V.X(pts[3][0]),V.Y(pts[3][1])); }
  }
  ctx.stroke();
}
/* campo de pendientes: segmentos de largo fijo con pendiente f(x,y) */
function slopeField(ctx,V,f,nx,ny,color,alpha){
  ctx.save(); ctx.strokeStyle=color; ctx.globalAlpha=alpha||.75; ctx.lineWidth=1.5;
  var L=Math.min(V.pw/nx,V.ph/ny)*0.42;
  ctx.beginPath();
  for(var i=0;i<=nx;i++) for(var j=0;j<=ny;j++){
    var x=V.x0+(V.x1-V.x0)*i/nx, y=V.y0+(V.y1-V.y0)*j/ny, m=f(x,y);
    if(!isFinite(m)) continue;
    var sx=V.X(x), sy=V.Y(y);
    var scaleX=V.pw/(V.x1-V.x0), scaleY=V.ph/(V.y1-V.y0);
    var vx=1, vy=-m*scaleY/scaleX;
    var n=Math.hypot(vx,vy); vx=vx/n*L; vy=vy/n*L;
    ctx.moveTo(sx-vx,sy-vy); ctx.lineTo(sx+vx,sy+vy);
  }
  ctx.stroke(); ctx.restore();
}

/* ============================================================ WIDGETS */

/* 1) Campo direccional + curva solucion (toca el grafico) */
WIDGETS['campo-dir']=function(host){
  whead(host,'Campo direccional','toca el gráfico para soltar una solución');
  var S=setupCanvas(host,320);
  var cv=S.cv, ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var PRE=[
    {label:'x²−y', tex:'x^{2}-y', f:function(x,y){return x*x-y;}, aut:false},
    {label:'y(1−y)', tex:'y(1-y)', f:function(x,y){return y*(1-y);}, aut:true},
    {label:'−2xy', tex:'-2xy', f:function(x,y){return -2*x*y;}, aut:false}
  ];
  var cur=0, p0={x:0,y:1}, V=null;
  segmented(ctr,PRE.map(function(p,i){return {label:p.label,value:i};}),0,function(v){ cur=v; draw(); });
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    V=mkView(4,4,w-8,h-8,-3,3,-3,3);
    frame(ctx,V,1,1);
    var P=PRE[cur];
    clipBox(ctx,V);
    slopeField(ctx,V,P.f,16,16,cssVar('--muted'),.55);
    traceSol(ctx,V,P.f,p0.x,p0.y,cssVar('--accent'),2.6);
    dot(ctx,V,p0.x,p0.y,cssVar('--accent2'),5);
    ctx.restore();
    lbl(ctx,'x',V.X(V.x1)-8,V.Y(0)-10,cssVar('--faint'));
    lbl(ctx,'y',V.X(0)+8,V.Y(V.y1)+10,cssVar('--faint'));
    readout.innerHTML='\\(\\dfrac{dy}{dx}='+P.tex+'\\)'+(P.aut?' · <b>autónoma</b>: el campo se repite en cada columna':' · <b>no autónoma</b>: el campo cambia con \\(x\\)')+
      '<br>Condición inicial \\(y('+p0.x.toFixed(2)+')='+p0.y.toFixed(2)+'\\); pendiente ahí: \\(f='+P.f(p0.x,p0.y).toFixed(2)+'\\).';
    typeset(readout);
  }
  cv.addEventListener('pointerdown',function(e){
    if(!V) return;
    var r=cv.getBoundingClientRect();
    p0={x:V.ix(e.clientX-r.left), y:V.iy(e.clientY-r.top)};
    draw();
  });
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* 2) Falla de unicidad: infinitas soluciones de y'=x sqrt(y), y(0)=0 */
WIDGETS['no-unicidad']=function(host){
  whead(host,'Cuando la unicidad falla','y\u2032 = x\u221ay,  y(0) = 0');
  var S=setupCanvas(host,300);
  var ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var a=0.9;
  ctr.appendChild(rangeField('a',0,2.4,0.9,0.05,function(v){ a=v; draw(); }).f);
  function fam(x,a){ return x<a?0:Math.pow(x*x-a*a,2)/16; }
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    var V=mkView(4,4,w-8,h-8,-0.2,3,-0.35,3);
    frame(ctx,V,1,1);
    clipBox(ctx,V);
    /* familia de fondo */
    ctx.lineWidth=1.4; ctx.globalAlpha=.35;
    for(var k=0;k<=8;k++){
      var aa=k*0.3; ctx.strokeStyle=cssVar('--accent3'); ctx.beginPath();
      for(var i=0;i<=300;i++){ var x=V.x0+(V.x1-V.x0)*i/300, y=fam(x,aa);
        if(i===0) ctx.moveTo(V.X(x),V.Y(y)); else ctx.lineTo(V.X(x),V.Y(y)); }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    /* solucion nula */
    ctx.strokeStyle=cssVar('--ok'); ctx.lineWidth=2.6; ctx.beginPath();
    ctx.moveTo(V.X(V.x0),V.Y(0)); ctx.lineTo(V.X(V.x1),V.Y(0)); ctx.stroke();
    /* solucion destacada */
    ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=3; ctx.beginPath();
    for(var j=0;j<=400;j++){ var xx=V.x0+(V.x1-V.x0)*j/400, yy=fam(xx,a);
      if(j===0) ctx.moveTo(V.X(xx),V.Y(yy)); else ctx.lineTo(V.X(xx),V.Y(yy)); }
    ctx.stroke();
    dot(ctx,V,0,0,cssVar('--bad'),6);
    ctx.restore();
    lbl(ctx,'(0,0)',V.X(0)+10,V.Y(0)-12,cssVar('--bad'));
    readout.innerHTML='Todas estas curvas pasan por \\((0,0)\\) y todas resuelven \\(y\\,\'=x\\sqrt{y}\\). En verde \\(y\\equiv0\\); en azul '+
      '\\(y=\\dfrac{(x^{2}-a^{2})^{2}}{16}\\) para \\(x\\ge a\\) (y \\(0\\) antes), con \\(a='+a.toFixed(2)+'\\).<br>'+
      'Con \\(a=0\\) se obtiene \\(y=\\dfrac{x^{4}}{16}\\). La culpable es \\(\\dfrac{\\partial f}{\\partial y}=\\dfrac{x}{2\\sqrt{y}}\\), discontinua en \\(y=0\\).';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* 3) Linea de fase + diagrama de fase de una EDO autonoma */
WIDGETS['linea-fase']=function(host){
  whead(host,'Línea de fase y diagrama de fase','EDO autónoma  y\u2032 = f(y)');
  var S=setupCanvas(host,340);
  var ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var PRE=[
    {label:'y²−1', tex:'y^{2}-1', f:function(y){return y*y-1;}, crit:[-1,1], lo:-2.6, hi:2.6},
    {label:'y(1−y)', tex:'y(1-y)', f:function(y){return y*(1-y);}, crit:[0,1], lo:-0.9, hi:2.0},
    {label:'y(4−y²)', tex:'y(4-y^{2})', f:function(y){return y*(4-y*y);}, crit:[-2,0,2], lo:-3.4, hi:3.4}
  ];
  var cur=2;
  segmented(ctr,PRE.map(function(p,i){return {label:p.label,value:i};}),2,function(v){ cur=v; draw(); });
  function classify(P,c){
    var e=0.06, b=P.f(c-e), a=P.f(c+e);
    if(b>0&&a<0) return {t:'atractor', s:'asintóticamente estable', col:'--ok'};
    if(b<0&&a>0) return {t:'repulsor', s:'inestable', col:'--bad'};
    return {t:'semiestable', s:'semiestable', col:'--warn'};
  }
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    var P=PRE[cur], LW=58;
    var V=mkView(LW,4,w-LW-6,h-8,0,4,P.lo,P.hi);
    var PL=mkView(4,4,LW-12,h-8,0,1,P.lo,P.hi);
    frame(ctx,V,1,1);
    var f2=function(x,y){ return P.f(y); };
    clipBox(ctx,V);
    /* curvas solucion para varias condiciones iniciales */
    var n=13;
    for(var i=0;i<=n;i++){
      var y0=P.lo+(P.hi-P.lo)*i/n;
      var isCrit=P.crit.some(function(c){ return Math.abs(c-y0)<0.06; });
      if(isCrit) continue;
      traceSol(ctx,V,f2,0.4,y0,cssVar('--accent'),1.5);
    }
    /* equilibrios */
    P.crit.forEach(function(c){
      var k=classify(P,c);
      ctx.strokeStyle=cssVar(k.col); ctx.lineWidth=2.6; ctx.setLineDash([7,4]);
      ctx.beginPath(); ctx.moveTo(V.px0,V.Y(c)); ctx.lineTo(V.px0+V.pw,V.Y(c)); ctx.stroke();
      ctx.setLineDash([]);
    });
    ctx.restore();
    /* linea de fase a la izquierda */
    var lx=PL.px0+PL.pw/2;
    ctx.strokeStyle=cssVar('--muted'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(lx,PL.py0+4); ctx.lineTo(lx,PL.py0+PL.ph-4); ctx.stroke();
    var bounds=[P.lo].concat(P.crit,[P.hi]);
    for(var b=0;b<bounds.length-1;b++){
      var mid=(bounds[b]+bounds[b+1])/2, up=P.f(mid)>0;
      var my=PL.Y(mid), L=13;
      ctx.strokeStyle=up?cssVar('--accent2'):cssVar('--accent3'); ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(lx,my+(up?L:-L)); ctx.lineTo(lx,my-(up?L:-L)); ctx.stroke();
      var ty=my-(up?L:-L);
      ctx.beginPath(); ctx.moveTo(lx,ty); ctx.lineTo(lx-4.5,ty+(up?6:-6)); ctx.lineTo(lx+4.5,ty+(up?6:-6)); ctx.closePath();
      ctx.fillStyle=up?cssVar('--accent2'):cssVar('--accent3'); ctx.fill();
    }
    P.crit.forEach(function(c){
      var k=classify(P,c);
      ctx.fillStyle=cssVar(k.col); ctx.beginPath(); ctx.arc(lx,PL.Y(c),5.5,0,6.284); ctx.fill();
      lbl(ctx,String(c),lx-10,PL.Y(c),cssVar(k.col),'right');
    });
    var txt='\\(\\dfrac{dy}{dx}='+P.tex+'\\)<br>';
    P.crit.forEach(function(c){
      var k=classify(P,c);
      txt+='\\(c='+c+'\\): <b>'+k.s+'</b> ('+k.t+')<br>';
    });
    readout.innerHTML=txt+'<span style="opacity:.75">Las rectas punteadas son las soluciones de equilibrio y actúan como barreras: ninguna otra curva las cruza.</span>';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* 4) Familia de soluciones de una separable + solucion singular */
WIDGETS['familia-sep']=function(host){
  whead(host,'Familia de soluciones','y\u2032 = \u22122xy  \u2192  y = C e^(\u2212x\u00b2)');
  var S=setupCanvas(host,300);
  var ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var C=1.8;
  ctr.appendChild(rangeField('C',-3,3,1.8,0.1,function(v){ C=v; draw(); }).f);
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    var V=mkView(4,4,w-8,h-8,-2.6,2.6,-3.2,3.2);
    frame(ctx,V,1,1);
    clipBox(ctx,V);
    ctx.globalAlpha=.3; ctx.lineWidth=1.3; ctx.strokeStyle=cssVar('--accent3');
    for(var k=-6;k<=6;k++){
      if(k===0) continue;
      var cc=k*0.5; ctx.beginPath();
      for(var i=0;i<=250;i++){ var x=V.x0+(V.x1-V.x0)*i/250, y=cc*Math.exp(-x*x);
        if(i===0) ctx.moveTo(V.X(x),V.Y(y)); else ctx.lineTo(V.X(x),V.Y(y)); }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    /* solucion singular y=0 */
    ctx.strokeStyle=cssVar('--ok'); ctx.lineWidth=2.4; ctx.setLineDash([7,4]);
    ctx.beginPath(); ctx.moveTo(V.px0,V.Y(0)); ctx.lineTo(V.px0+V.pw,V.Y(0)); ctx.stroke(); ctx.setLineDash([]);
    /* solucion destacada */
    ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=3; ctx.beginPath();
    for(var j=0;j<=350;j++){ var xx=V.x0+(V.x1-V.x0)*j/350, yy=C*Math.exp(-xx*xx);
      if(j===0) ctx.moveTo(V.X(xx),V.Y(yy)); else ctx.lineTo(V.X(xx),V.Y(yy)); }
    ctx.stroke();
    dot(ctx,V,0,C,cssVar('--accent2'),5);
    ctx.restore();
    readout.innerHTML='Separando: \\(\\dfrac{dy}{y}=-2x\\,dx\\Rightarrow \\ln|y|=-x^{2}+c\\Rightarrow y=C\\,e^{-x^{2}}\\).<br>'+
      'Aquí \\(C='+C.toFixed(2)+'\\), o sea \\(y(0)='+C.toFixed(2)+'\\). La recta verde punteada es \\(y=0\\): la <b>solución singular</b> que se pierde al dividir por \\(y\\), '+
      'y que aquí se recupera admitiendo \\(C=0\\).';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* 5) Familia de soluciones de una lineal: parte particular + parte homogenea */
WIDGETS['lineal-familia']=function(host){
  whead(host,'Solución particular + homogénea','y = y_part + c/\u03bc(x)');
  var S=setupCanvas(host,300);
  var ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var PRE=[
    {label:"y'−2y/x=x³",
     sol:function(x,c){ return x*x*x*x/2+c*x*x; },
     part:function(x){ return x*x*x*x/2; },
     tex:"y'-\\dfrac{2}{x}y=x^{3}", stex:"y=\\dfrac{x^{4}}{2}+c\\,x^{2}",
     note:"La parte homogénea \\(c\\,x^{2}\\) <b>crece</b> con \\(|x|\\): las soluciones se separan.",
     x0:-2.2,x1:2.2,y0:-3.5,y1:5},
    {label:"y'+2xy=x",
     sol:function(x,c){ return 0.5+c*Math.exp(-x*x); },
     part:function(x){ return 0.5; },
     tex:"y'+2xy=x", stex:"y=\\dfrac12+c\\,e^{-x^{2}}",
     note:"La parte homogénea \\(c\\,e^{-x^{2}}\\) <b>se apaga</b>: todas las soluciones convergen a \\(y=\\tfrac12\\).",
     x0:-2.6,x1:2.6,y0:-1.6,y1:3}
  ];
  var cur=1, c=1.2;
  segmented(ctr,PRE.map(function(p,i){return {label:p.label,value:i};}),1,function(v){ cur=v; draw(); });
  ctr.appendChild(rangeField('c',-3,3,1.2,0.1,function(v){ c=v; draw(); }).f);
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    var P=PRE[cur];
    var V=mkView(4,4,w-8,h-8,P.x0,P.x1,P.y0,P.y1);
    frame(ctx,V,1,1);
    clipBox(ctx,V);
    ctx.globalAlpha=.3; ctx.lineWidth=1.3; ctx.strokeStyle=cssVar('--accent3');
    for(var k=-6;k<=6;k++){
      var cc=k*0.5; ctx.beginPath();
      for(var i=0;i<=280;i++){ var x=V.x0+(V.x1-V.x0)*i/280, y=P.sol(x,cc);
        if(i===0) ctx.moveTo(V.X(x),V.Y(y)); else ctx.lineTo(V.X(x),V.Y(y)); }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    /* solucion particular c=0 */
    ctx.strokeStyle=cssVar('--ok'); ctx.lineWidth=2.4; ctx.setLineDash([7,4]); ctx.beginPath();
    for(var m=0;m<=280;m++){ var xp=V.x0+(V.x1-V.x0)*m/280, yp=P.part(xp);
      if(m===0) ctx.moveTo(V.X(xp),V.Y(yp)); else ctx.lineTo(V.X(xp),V.Y(yp)); }
    ctx.stroke(); ctx.setLineDash([]);
    /* destacada */
    ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=3; ctx.beginPath();
    for(var j=0;j<=350;j++){ var xx=V.x0+(V.x1-V.x0)*j/350, yy=P.sol(xx,c);
      if(j===0) ctx.moveTo(V.X(xx),V.Y(yy)); else ctx.lineTo(V.X(xx),V.Y(yy)); }
    ctx.stroke();
    ctx.restore();
    readout.innerHTML='\\('+P.tex+'\\) &rarr; \\('+P.stex+'\\), con \\(c='+c.toFixed(2)+'\\).<br>'+
      'La curva verde punteada es la <b>solución particular</b> (\\(c=0\\)). '+P.note;
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* 6) Curvas de nivel de la funcion potencial de una EDO exacta */
WIDGETS['contorno-exacta']=function(host){
  whead(host,'Las soluciones son curvas de nivel','f(x,y) = 3x\u00b2y \u2212 xy\u00b3 + 2y\u00b2 = c');
  var S=setupCanvas(host,330);
  var ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var c=2;
  ctr.appendChild(rangeField('c',-12,12,2,0.5,function(v){ c=v; draw(); }).f);
  function F(x,y){ return 3*x*x*y-x*y*y*y+2*y*y; }
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    var V=mkView(4,4,w-8,h-8,-2.6,2.6,-2.6,2.6);
    frame(ctx,V,1,1);
    clipBox(ctx,V);
    ctx.globalAlpha=.32;
    for(var k=-6;k<=6;k++){ if(k===0) continue; contour(ctx,V,F,k*2,cssVar('--accent3'),1.3,90); }
    ctx.globalAlpha=1;
    contour(ctx,V,F,c,cssVar('--accent'),3,140);
    ctx.restore();
    readout.innerHTML='La EDO \\((6xy-y^{3})dx+(4y+3x^{2}-3xy^{2})dy=0\\) es exacta, y su solución general es \\(f(x,y)=c\\) con '+
      '\\(f=3x^{2}y-xy^{3}+2y^{2}\\).<br>Curva destacada: \\(c='+c.toFixed(1)+'\\). Cada valor de \\(c\\) es una curva solución distinta; '+
      'mover el deslizador es <b>moverse por la familia</b>.';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* 7) EDO homogenea: la pendiente es constante sobre cada rayo y=vx */
WIDGETS['rayos-homog']=function(host){
  whead(host,'Homogénea: pendiente constante en cada rayo','(x\u00b2 \u2212 xy + y\u00b2)dx \u2212 xy dy = 0');
  var S=setupCanvas(host,320);
  var ctx=S.ctx, size=S.size;
  var readout=el('div','readout'); host.appendChild(readout);
  var ctr=ctrlRow(host);
  var v=1.2;
  ctr.appendChild(rangeField('v = y/x',-2.5,2.5,1.2,0.05,function(t){ v=t; draw(); }).f);
  function slope(x,y){ var vv=y/x; if(!isFinite(vv)||Math.abs(vv)<1e-9) return NaN; return (1-vv+vv*vv)/vv; }
  function draw(){
    var d=size(), w=d.w, h=d.h; ctx.clearRect(0,0,w,h);
    var V=mkView(4,4,w-8,h-8,-3,3,-3,3);
    frame(ctx,V,1,1);
    clipBox(ctx,V);
    slopeField(ctx,V,slope,17,17,cssVar('--muted'),.5);
    /* rayos de fondo */
    ctx.strokeStyle=cssVar('--accent3'); ctx.globalAlpha=.35; ctx.lineWidth=1.2;
    [-2,-1,-0.5,0.5,1,2].forEach(function(vv){
      ctx.beginPath(); ctx.moveTo(V.X(-3),V.Y(-3*vv)); ctx.lineTo(V.X(3),V.Y(3*vv)); ctx.stroke();
    });
    ctx.globalAlpha=1;
    /* rayo destacado */
    ctx.strokeStyle=cssVar('--accent2'); ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(V.X(-3),V.Y(-3*v)); ctx.lineTo(V.X(3),V.Y(3*v)); ctx.stroke();
    /* marcas de pendiente sobre el rayo: todas paralelas */
    var m=(1-v+v*v)/v;
    if(isFinite(m)){
      ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=3;
      var sX=V.pw/(V.x1-V.x0), sY=V.ph/(V.y1-V.y0);
      [-2.2,-1.5,-0.8,0.8,1.5,2.2].forEach(function(t){
        var x=t, y=v*t; if(Math.abs(y)>3) return;
        var ux=1, uy=-m*sY/sX, n=Math.hypot(ux,uy); ux=ux/n*16; uy=uy/n*16;
        ctx.beginPath(); ctx.moveTo(V.X(x)-ux,V.Y(y)-uy); ctx.lineTo(V.X(x)+ux,V.Y(y)+uy); ctx.stroke();
      });
    }
    ctx.restore();
    readout.innerHTML='Despejando, \\(\\dfrac{dy}{dx}=\\dfrac{x^{2}-xy+y^{2}}{xy}=\\dfrac{1-v+v^{2}}{v}\\) con \\(v=y/x\\): '+
      '<b>depende solo de \\(v\\)</b>.<br>Sobre el rayo destacado \\(y='+v.toFixed(2)+'x\\) todas las marcas azules son <b>paralelas</b>: la pendiente vale '+
      '\\('+(isFinite(m)?m.toFixed(2):'\\infty')+'\\) en todo el rayo. Por eso \\(y=vx\\) es la sustitución natural.';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',function(){ requestAnimationFrame(draw); });
};

/* ============================================================ chrome */
$('#menuBtn').onclick=()=>{ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('open'); };
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#scrim').onclick=closeDrawer;
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); $('#themeBtn').textContent= t==='light'?'☀️':'🌙'; $('meta[name=theme-color]').setAttribute('content', t==='light'?'#eef1f8':'#0f1220'); }
let theme='dark'; try{ theme=localStorage.getItem(LS_THEME)||'dark'; }catch(e){}
applyTheme(theme);
$('#themeBtn').onclick=()=>{ theme=theme==='light'?'dark':'light'; applyTheme(theme); try{localStorage.setItem(LS_THEME,theme);}catch(e){} setTimeout(()=>{ if(window.__mjReady) typeset(contentEl); },30); };

/* ============================================================ keyboard */
document.addEventListener('keydown',(e)=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){ if(current<MODULES.length-1){ e.preventDefault(); go(current+1); } }
  else if(e.key==='ArrowLeft'){ if(current>0){ e.preventDefault(); go(current-1); } }
});

/* ============================================================ boot */
if(!MODULES.length){
  contentEl.innerHTML='<div class="card"><h2>⏳ Contenido en preparación</h2><p style="color:var(--muted)">Los datos de los módulos aún no se han inyectado en este archivo. Si ves esto, vuelve a generar el archivo final.</p></div>';
} else {
  renderNav(); renderModule();
}
