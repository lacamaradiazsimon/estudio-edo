=2\\Big[-\\frac{(x+1)\\cos2n\\pi x}{2n\\pi}\\Big]_0^1=-\\frac1{n\\pi}$$"}], "respuesta": "$$f\\sim\\frac32-\\frac1\\pi\\sum_{n=1}^\\infty\\frac{\\operatorname{sen}2n\\pi x}{n}$$ Coincide con la forma alternativa de la guía. En $x=0$ y $x=1$ converge a $\\frac32=\\frac{1+2}{2}$ (salto de la extensión).", "tiempo": "8 min", "puntaje_max": ["Identificar $p=\\frac12$ (período 1)", "Frecuencia $2n\\pi x$", "$a_0=3$ y $a_n=0$", "$b_n=-\\frac{1}{n\\pi}$ y serie final"], "errores": ["usar $p=1$ (frecuencia $n\\pi x$) y obtener otra serie que no representa la extensión periódica de período $1$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Clase 19 (ppt) · Ejemplo 1", "pregunta": "$p=2$", "tema": "t1", "enunciado": "Considere $f(x)=\\begin{cases}2&-2<x<0\\\\ x&0\\le x<2\\end{cases}$. (1) Determine el desarrollo en serie de Fourier de $f$. (2) ¿A qué valor converge la serie en $x=0$?", "estrategia": "Con $p=2$ la frecuencia es $\\frac{n\\pi x}{2}$. Como $f$ no es par ni impar, tres coeficientes; el tramo constante $2$ aporta una integral de coseno que da $0$.", "pasos": [{"titulo": "$a_0$.", "md": "$a_0=\\frac12\\Big[\\int_{-2}^02\\,dx+\\int_0^2x\\,dx\\Big]=\\frac12(4+2)=3$."}, {"titulo": "$a_n$.", "md": "$a_n=\\frac12\\Big[2\\int_{-2}^0\\cos\\tfrac{n\\pi x}{2}dx+\\int_0^2x\\cos\\tfrac{n\\pi x}{2}dx\\Big]$. La primera integral es $\\frac{\\operatorname{sen}n\\pi}{n\\pi/2}=0$; la segunda es $\\frac{4((-1)^n-1)}{n^2\\pi^2}$. Entonces $a_n=\\dfrac{2((-1)^n-1)}{n^2\\pi^2}$."}, {"titulo": "$b_n$.", "md": "$b_n=\\frac12\\Big[2\\int_{-2}^0\\operatorname{sen}\\tfrac{n\\pi x}{2}dx+\\int_0^2x\\operatorname{sen}\\tfrac{n\\pi x}{2}dx\\Big]=\\frac12\\Big[\\frac{4((-1)^n-1)}{n\\pi}-\\frac{4(-1)^n}{n\\pi}\\Big]=-\\frac{2}{n\\pi}$."}, {"titulo": "Convergencia en $x=0$.", "md": "Salto: $f(0^-)=2$, $f(0^+)=0$. Promedio $\\frac{2+0}{2}=1$."}], "respuesta": "$$f(x)\\sim\\frac32+\\sum_{n=1}^\\infty\\Big[\\frac{2((-1)^n-1)}{n^2\\pi^2}\\cos\\frac{n\\pi x}{2}-\\frac{2}{n\\pi}\\operatorname{sen}\\frac{n\\pi x}{2}\\Big],\\qquad S(0)=1$$ Chequeo: en $x=0$ los senos valen $0$ y $S(0)=\\frac32+\\sum_{n\\text{ impar}}\\frac{-4}{n^2\\pi^2}=\\frac32-\\frac{4}{\\pi^2}\\cdot\\frac{\\pi^2}{8}=1$ ✓ (con $\\sum_{n\\text{ impar}}\\frac1{n^2}=\\frac{\\pi^2}{8}$).", "tiempo": "12 min", "puntaje_max": ["Frecuencia $\\frac{n\\pi x}{2}$ con $p=2$", "$a_0$, $a_n$ y $b_n$ con las integrales partidas en los dos tramos", "Evaluar con $(-1)^n$", "Valor de convergencia en el salto: promedio"], "errores": ["dar $f(0)=0$ como valor de convergencia"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 5", "pregunta": "n°7", "tema": "t2", "enunciado": "Encuentre la serie de Fourier de $f(x)=\\begin{cases}0&-\\pi\\le x<0\\\\ x^2&0\\le x\\le\\pi\\end{cases}$. Utilice su resultado para probar que $\\dfrac{\\pi^2}{6}=1+\\dfrac{1}{2^2}+\\dfrac{1}{3^2}+\\dfrac{1}{4^2}+\\cdots$", "estrategia": "Dos partes: coeficientes (la parte larga, con $\\int_0^\\pi$ porque $f=0$ a la izquierda) y el truco numérico. Para el truco, $x=\\pi$ hace desaparecer los $b_n$ y deja $\\cos n\\pi=(-1)^n$; ojo: en $x=\\pi$ la serie converge al **promedio** $\\frac{\\pi^2}{2}$.", "pasos": [{"titulo": "$a_0$ y $a_n$.", "md": "$a_0=\\frac1\\pi\\int_0^\\pi x^2dx=\\frac{\\pi^2}{3}$; $\\;a_n=\\frac1\\pi\\int_0^\\pi x^2\\cos nx\\,dx=\\frac1\\pi\\Big[\\frac{x^2\\operatorname{sen}nx}{n}+\\frac{2x\\cos nx}{n^2}-\\frac{2\\operatorname{sen}nx}{n^3}\\Big]_0^\\pi=\\frac{2(-1)^n}{n^2}$."}, {"titulo": "$b_n$.", "md": "$b_n=\\frac1\\pi\\Big[-\\frac{x^2\\cos nx}{n}+\\frac{2x\\operatorname{sen}nx}{n^2}+\\frac{2\\cos nx}{n^3}\\Big]_0^\\pi=\\frac{(-1)^{n+1}\\pi}{n}+\\frac{2((-1)^n-1)}{\\pi n^3}$."}, {"titulo": "La serie.", "md": "$$f\\sim\\frac{\\pi^2}{6}+\\sum_{n=1}^\\infty\\Big[\\frac{2(-1)^n}{n^2}\\cos nx+b_n\\operatorname{sen}nx\\Big]$$"}, {"titulo": "Evaluar en $x=\\pi$.", "md": "Teorema: converge a $\\frac{f(\\pi^-)+f(-\\pi^+)}{2}=\\frac{\\pi^2+0}{2}=\\frac{\\pi^2}{2}$. En la serie: $\\cos n\\pi=(-1)^n$, $\\operatorname{sen}n\\pi=0$. $$\\frac{\\pi^2}{2}=\\frac{\\pi^2}{6}+2\\sum_{n=1}^\\infty\\frac1{n^2}$$"}], "respuesta": "$$\\sum_{n=1}^\\infty\\frac1{n^2}=\\frac{\\pi^2}{6}$$ (La respuesta impresa de la guía para $b_n$ trae $\\frac{2(-1)^{n+1}\\pi}{n}$: el cálculo da $\\frac{(-1)^{n+1}\\pi}{n}$; no afecta el truco.)", "tiempo": "15 min", "puntaje_max": ["$a_0=\\frac{\\pi^2}{3}$ y término $\\frac{\\pi^2}{6}$ en la serie", "$a_n$ y $b_n$ por partes (dos veces)", "Aplicar el teorema en $x=\\pi$: promedio $\\frac{\\pi^2}{2}$", "Despejar la suma"], "errores": ["usar $f(\\pi)=\\pi^2$ en lugar del promedio: saldría $\\sum\\frac{1}{n^2}=\\frac{5\\pi^2}{12}$, que es falso"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 5", "pregunta": "n°8", "tema": "t2", "enunciado": "Encuentre la serie de Fourier de $f(x)=x+\\pi$, $-\\pi<x<\\pi$. Utilice su resultado para probar que $\\dfrac\\pi4=1-\\dfrac13+\\dfrac15-\\dfrac17+\\cdots$", "estrategia": "$x+\\pi$ = impar + constante: $a_0=2\\pi$, $a_n=0$ y un solo coeficiente que calcular. Para el truco se evalúa en $x=\\frac\\pi2$ (donde $\\operatorname{sen}\\frac{n\\pi}{2}$ genera $1,0,-1,0,\\dots$), un punto de **continuidad**.", "pasos": [{"titulo": "Coeficientes.", "md": "$a_0=\\frac1\\pi\\int_{-\\pi}^{\\pi}(x+\\pi)dx=2\\pi$, $a_n=0$, $b_n=\\frac2\\pi\\int_0^\\pi x\\operatorname{sen}nx\\,dx=\\frac2\\pi\\Big[-\\frac{x\\cos nx}{n}\\Big]_0^\\pi=\\frac{2(-1)^{n+1}}{n}$."}, {"titulo": "Serie.", "md": "$x+\\pi\\sim\\pi+\\sum_{n=1}^\\infty\\frac{2(-1)^{n+1}}{n}\\operatorname{sen}nx$."}, {"titulo": "Evaluar en $x=\\frac\\pi2$.", "md": "$f(\\frac\\pi2)=\\frac{3\\pi}{2}$ (continuidad). $\\frac{3\\pi}{2}=\\pi+2\\big(1-\\frac13+\\frac15-\\cdots\\big)$."}], "respuesta": "$$\\frac\\pi4=1-\\frac13+\\frac15-\\frac17+\\cdots$$ (La respuesta impresa de la guía trae $(-1)^n$; el signo correcto es $(-1)^{n+1}$.)", "tiempo": "10 min", "puntaje_max": ["$a_0=2\\pi$ y $a_n=0$", "$b_n=\\frac{2(-1)^{n+1}}{n}$", "Evaluar en $x=\\frac\\pi2$ justificando continuidad", "Despejar $\\frac\\pi4$"], "errores": ["evaluar en $x=\\pi$ (todos los $\\operatorname{sen}n\\pi$ son $0$: no da información)"]}, {"fuente": "Prueba 2 · 5 jun", "pregunta": "P3 b)", "tema": "t3", "puntaje": "10 pts", "confianza": "pauta", "variantes": ["Guía 4 · n°2 (por definición)"], "enunciado": "Considere $f:[0,\\infty)\\to\\mathbb R$ definida por $f(t)=-1$ si $t\\in[0,1[$ y $f(t)=1$ si $t\\in[1,\\infty[$. Determine la transformada de Laplace de $f$.", "estrategia": "Función por tramos y se pide **por definición**: parte la integral en $[0,1]$ y $[1,\\infty[$ y escribe la segunda como $\\lim_{b\\to\\infty}$ (eso solo ya vale puntos).", "pasos": [{"titulo": "Separar la integral.", "md": "$$\\mathcal L\\{f\\}=\\int_0^1-e^{-st}dt+\\lim_{b\\to\\infty}\\int_1^be^{-st}dt$$"}, {"titulo": "Integrar.", "md": "$$=\\Big[\\frac{e^{-st}}{s}\\Big]_0^1+\\lim_{b\\to\\infty}\\Big[-\\frac{e^{-st}}{s}\\Big]_1^b=\\frac{e^{-s}-1}{s}+\\Big(0+\\frac{e^{-s}}{s}\\Big),\\quad s>0$$"}], "respuesta": "$$\\mathcal L\\{f\\}(s)=\\frac{2e^{-s}-1}{s},\\quad s>0$$", "tiempo": "10 min", "rubrica": [{"criterio": "Nivel 1: usa la definición, escribe dos integrales y la impropia como límite", "pts": "4"}, {"criterio": "Nivel 2: integra correctamente la primera integral", "pts": "6"}, {"criterio": "Nivel 3: integra la impropia y escribe $F(s)$", "pts": "10"}], "descuentos": ["no escribir el límite → no alcanza el Nivel 1 completo", "olvidar la condición $s>0$"]}, {"fuente": "Prueba 2 · 5 jun", "pregunta": "P3 c)", "tema": "t3", "puntaje": "10 pts", "confianza": "pauta", "enunciado": "Determine la transformada de Laplace inversa de $F(s)=\\dfrac{s+1}{s^2+3s}$.", "estrategia": "Factoriza el denominador, $s(s+3)$, descompón en fracciones parciales e invierte con la tabla: $\\mathcal L^{-1}\\{\\frac1s\\}=1$ y $\\mathcal L^{-1}\\{\\frac1{s+3}\\}=e^{-3t}$.", "pasos": [{"titulo": "Fracciones parciales.", "md": "$$\\frac{s+1}{s(s+3)}=\\frac{A}{s}+\\frac{B}{s+3}\\ \\Rightarrow\\ A=\\frac13,\\ B=\\frac23$$"}, {"titulo": "Invertir.", "md": "$$\\mathcal L^{-1}\\{F\\}=\\frac13\\mathcal L^{-1}\\Big\\{\\frac1s\\Big\\}+\\frac23\\mathcal L^{-1}\\Big\\{\\frac1{s+3}\\Big\\}$$"}], "respuesta": "$$f(t)=\\frac13+\\frac23e^{-3t}$$", "tiempo": "8 min", "rubrica": [{"criterio": "Nivel 1: descompone en fracciones parciales", "pts": "4"}, {"criterio": "Nivel 2: invierte cada fracción y escribe $f(t)$", "pts": "10"}]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°1", "tema": "t3", "enunciado": "Determine la transformada de Laplace de (c) $h(t)=\\operatorname{sen}^2(at)$ y (d) $f(t)=\\cos^2(at)$.", "estrategia": "Las transformadas de potencias de $\\operatorname{sen}$ y $\\cos$ no salen de la tabla: baja el grado con las identidades de ángulo doble antes de transformar.", "pasos": [{"titulo": "Identidades.", "md": "$\\operatorname{sen}^2at=\\frac{1-\\cos2at}{2}$ y $\\cos^2at=\\frac{1+\\cos2at}{2}$."}, {"titulo": "Transformar (linealidad).", "md": "$$\\mathcal L\\{\\operatorname{sen}^2at\\}=\\frac12\\Big(\\frac1s-\\frac{s}{s^2+4a^2}\\Big)=\\frac{2a^2}{s(s^2+4a^2)}$$ $$\\mathcal L\\{\\cos^2at\\}=\\frac12\\Big(\\frac1s+\\frac{s}{s^2+4a^2}\\Big)=\\frac{s^2+2a^2}{s(s^2+4a^2)}$$"}], "respuesta": "$$\\text{(c) }\\frac{2a^2}{s\\,(s^2+4a^2)}\\qquad\\text{(d) }\\frac{s^2+2a^2}{s\\,(s^2+4a^2)}$$ Chequeo: suman $\\mathcal L\\{1\\}=\\frac1s$.", "tiempo": "6 min", "puntaje_max": ["Usar la identidad de ángulo doble", "Aplicar linealidad y la tabla de $\\cos2at$", "Simplificar a una sola fracción"], "errores": ["escribir $\\left(\\frac{a}{s^2+a^2}\\right)^2$: la transformada no se eleva al cuadrado"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°2", "tema": "t3", "enunciado": "(a) Utilice la definición para calcular la transformada de Laplace de $f(t)=\\begin{cases}t&0\\le t<2\\\\ 1&t\\ge2\\end{cases}$", "estrategia": "Por definición: dos integrales (la segunda impropia, con límite). La primera lleva $\\int te^{-st}$, por partes.", "pasos": [{"titulo": "Separar.", "md": "$$F(s)=\\int_0^2te^{-st}dt+\\lim_{b\\to\\infty}\\int_2^be^{-st}dt$$"}, {"titulo": "Primera integral (por partes).", "md": "$$\\int_0^2te^{-st}dt=\\Big[-\\frac{te^{-st}}{s}-\\frac{e^{-st}}{s^2}\\Big]_0^2=\\frac{1}{s^2}-\\frac{2e^{-2s}}{s}-\\frac{e^{-2s}}{s^2}$$"}, {"titulo": "Segunda integral.", "md": "$\\lim_{b\\to\\infty}\\Big[-\\frac{e^{-st}}{s}\\Big]_2^b=\\dfrac{e^{-2s}}{s}$ (para $s>0$)."}], "respuesta": "$$F(s)=\\frac{1-s\\,e^{-2s}-e^{-2s}}{s^2}$$ Con escalones: $f=t-(t-2)\\mathscr U(t-2)-\\mathscr U(t-2)$ da lo mismo.", "tiempo": "10 min", "puntaje_max": ["Escribir las dos integrales y el límite", "Integración por partes correcta", "Combinar y simplificar"], "errores": ["olvidar el término $\\frac{e^{-2s}}{s}$ de la segunda integral"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°3", "tema": "t3", "enunciado": "Sea $F(s)=\\mathcal L\\{f(t)\\}$. Demuestre que, para cualquier constante $a>0$, se cumple $\\mathcal L\\{f(at)\\}=\\dfrac1aF\\Big(\\dfrac sa\\Big)$.", "estrategia": "La pista de la guía: definición de transformada + cambio de variable $u=at$.", "pasos": [{"titulo": "Definición.", "md": "$\\mathcal L\\{f(at)\\}=\\int_0^\\infty e^{-st}f(at)\\,dt$."}, {"titulo": "Cambio de variable $u=at$.", "md": "$t=\\frac ua$, $dt=\\frac{du}{a}$ y los límites no cambian ($a>0$): $$\\int_0^\\infty e^{-s\\frac ua}f(u)\\frac{du}{a}=\\frac1a\\int_0^\\infty e^{-\\frac sa u}f(u)\\,du$$"}, {"titulo": "Reconocer $F$.", "md": "La última integral es $F$ evaluada en $\\frac sa$."}], "respuesta": "$$\\mathcal L\\{f(at)\\}=\\frac1aF\\Big(\\frac sa\\Big)\\qquad\\blacksquare$$", "tiempo": "6 min", "puntaje_max": ["Escribir la definición", "Cambio de variable con el $dt=\\frac{du}{a}$", "Concluir reconociendo $F\\big(\\frac sa\\big)$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°4", "tema": "t3", "enunciado": "Determine si existe una función $f$ continua por tramos en $[0,+\\infty[$ y de orden exponencial tal que $\\mathcal L\\{f(t)\\}=\\dfrac{s}{s+4}$.", "estrategia": "Mira el comportamiento de $F(s)$ para $s\\to\\infty$: la transformada de una función continua por tramos y de orden exponencial tiende a $0$.", "pasos": [{"titulo": "Condición necesaria.", "md": "Si $|f(t)|\\le Me^{ct}$ entonces $|F(s)|\\le\\frac{M}{s-c}\\to0$ cuando $s\\to\\infty$."}, {"titulo": "Comprobar.", "md": "$\\frac{s}{s+4}\\to1\\neq0$."}], "respuesta": "**No existe.** $\\frac{s}{s+4}=1-\\frac{4}{s+4}$ correspondería a un impulso ($\\delta$) menos $4e^{-4t}$, y el impulso no es una función continua por tramos.", "tiempo": "5 min", "puntaje_max": ["Enunciar que $F(s)\\to0$", "Mostrar que $\\frac{s}{s+4}\\to1$", "Concluir que no existe"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°12", "tema": "t3", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\arctan\\dfrac1s\\Big\\}$.", "estrategia": "Arctan no está en la tabla: usa la propiedad $\\mathcal L\\{t\\,f(t)\\}=-F'(s)$ para pasar a una racional.", "pasos": [{"titulo": "Derivar.", "md": "$F(s)=\\arctan\\frac1s\\ \\Rightarrow\\ F'(s)=\\frac{1}{1+\\frac1{s^2}}\\cdot\\Big(-\\frac1{s^2}\\Big)=-\\frac{1}{s^2+1}$."}, {"titulo": "Usar $\\mathcal L\\{tf\\}=-F'$.", "md": "$\\mathcal L\\{t\\,f(t)\\}=\\frac{1}{s^2+1}\\Rightarrow t\\,f(t)=\\operatorname{sen}t$."}], "respuesta": "$$f(t)=\\frac{\\operatorname{sen}t}{t}$$", "tiempo": "8 min", "puntaje_max": ["Derivar $F(s)$ correctamente", "Relacionar con $\\mathcal L\\{t\\,f\\}=-F'$", "Despejar $f(t)$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°14", "tema": "t3", "enunciado": "Calcule $\\mathcal L\\Big\\{\\displaystyle\\int_0^te^\\tau d\\tau\\Big\\}$ y $\\mathcal L\\Big\\{t\\displaystyle\\int_0^t\\operatorname{sen}\\tau\\,d\\tau\\Big\\}$.", "estrategia": "Integral: dividir por $s$. Después, multiplicar por $t$: derivar con signo menos.", "pasos": [{"titulo": "Primera.", "md": "$\\mathcal L\\{e^\\tau\\}=\\frac1{s-1}\\Rightarrow\\mathcal L\\{\\int_0^te^\\tau d\\tau\\}=\\frac{1}{s(s-1)}$."}, {"titulo": "Segunda.", "md": "$G(s)=\\mathcal L\\{\\int_0^t\\operatorname{sen}\\tau\\,d\\tau\\}=\\frac{1}{s(s^2+1)}$ y $\\mathcal L\\{t\\,g\\}=-G'(s)=\\frac{3s^2+1}{s^2(s^2+1)^2}$ (con $G=(s^3+s)^{-1}$, $G'=-\\frac{3s^2+1}{(s^3+s)^2}$)."}], "respuesta": "$$\\frac{1}{s(s-1)}\\qquad\\text{y}\\qquad\\frac{3s^2+1}{s^2(s^2+1)^2}$$", "tiempo": "8 min", "puntaje_max": ["Dividir por $s$ en la integral", "Derivar con el signo menos", "Simplificar"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°15", "tema": "t3", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\dfrac{1}{s^3(s-1)}\\Big\\}$.", "estrategia": "Tres potencias de $s$ y un factor lineal: fracciones parciales con $\\frac As+\\frac B{s^2}+\\frac C{s^3}+\\frac D{s-1}$.", "pasos": [{"titulo": "Coeficiente $D$.", "md": "Tapando $(s-1)$ y evaluando en $s=1$: $D=\\frac{1}{1^3}=1$."}, {"titulo": "Los otros.", "md": "Para $s$ cerca de $0$: $\\frac{1}{s-1}=-(1+s+s^2+\\cdots)$, entonces $\\frac{1}{s^3(s-1)}=-\\frac{1}{s^3}-\\frac1{s^2}-\\frac1s+\\cdots$, es decir $C=B=A=-1$."}, {"titulo": "Invertir.", "md": "$-\\frac{t^2}{2}-t-1+e^t$ (recuerda $\\frac{1}{s^3}\\to\\frac{t^2}{2}$)."}], "respuesta": "$$f(t)=e^{t}-\\frac{t^2}{2}-t-1$$", "tiempo": "10 min", "puntaje_max": ["Plantear las 4 fracciones parciales", "Hallar $A$, $B$, $C$, $D$", "Invertir con $\\frac{1}{s^3}\\to\\frac{t^2}{2}$"], "errores": ["dividir mal por $n!$ al invertir $\\frac1{s^3}$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°17", "tema": "t3", "enunciado": "Pruebe que si $F(s)=\\mathcal L\\{f(t)\\}$ entonces $\\mathcal L\\Big\\{\\dfrac{f(t)}{t}\\Big\\}=\\displaystyle\\int_s^\\infty F(u)\\,du$. Luego, haciendo $s\\to0$, pruebe que $\\displaystyle\\int_0^\\infty\\frac{\\operatorname{sen}t}{t}\\,dt=\\frac\\pi2$.", "estrategia": "Expande $F(u)$ con la definición, intercambia las integrales, integra primero en $u$. Resolución completa en §3.", "pasos": [{"titulo": "Intercambiar.", "md": "$\\int_s^\\infty F(u)du=\\int_0^\\infty f(t)\\Big(\\int_s^\\infty e^{-ut}du\\Big)dt=\\int_0^\\infty\\frac{f(t)}{t}e^{-st}dt$."}, {"titulo": "Con $f=\\operatorname{sen}t$.", "md": "$\\int_s^\\infty\\frac{du}{u^2+1}=\\frac\\pi2-\\arctan s$; con $s\\to0$ el lado izquierdo tiende a $\\int_0^\\infty\\frac{\\operatorname{sen}t}{t}dt$."}], "respuesta": "$$\\int_0^\\infty\\frac{\\operatorname{sen}t}{t}\\,dt=\\frac\\pi2$$", "tiempo": "12 min", "puntaje_max": ["Escribir $F(u)$ como integral e intercambiar el orden", "Integrar $e^{-ut}$ en $[s,\\infty[$", "Aplicar a $\\operatorname{sen}t$ y tomar $s\\to0$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°11", "tema": "t4", "enunciado": "Calcule $\\mathcal L\\{t\\,e^{2t}\\operatorname{sen}(6t)\\}$.", "estrategia": "Tres factores: $\\operatorname{sen}$ (tabla), $e^{2t}$ (primer teorema, corre $s$) y $t$ (derivada con signo menos). El orden importa: primero el corrimiento y al final la derivada.", "pasos": [{"titulo": "Seno.", "md": "$\\mathcal L\\{\\operatorname{sen}6t\\}=\\frac{6}{s^2+36}$."}, {"titulo": "Traslación.", "md": "$\\mathcal L\\{e^{2t}\\operatorname{sen}6t\\}=\\frac{6}{(s-2)^2+36}$."}, {"titulo": "Multiplicar por $t$.", "md": "$-\\frac{d}{ds}\\frac{6}{(s-2)^2+36}=\\frac{12(s-2)}{\\big((s-2)^2+36\\big)^2}$."}], "respuesta": "$$\\frac{12s-24}{\\big((s-2)^2+36\\big)^2}$$", "tiempo": "8 min", "puntaje_max": ["Usar bien el primer teorema ($s\\to s-2$)", "Derivar con signo menos", "Simplificar"], "errores": ["aplicar el corrimiento con signo contrario: $s+2$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°8", "tema": "t4", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\dfrac{s}{(s+1)^2}\\Big\\}$.", "estrategia": "En el numerador aparece $s$ y el denominador es $(s+1)^2$: escribe $s=(s+1)-1$ para separar.", "pasos": [{"titulo": "Separar.", "md": "$\\frac{s}{(s+1)^2}=\\frac{1}{s+1}-\\frac{1}{(s+1)^2}$."}, {"titulo": "Invertir.", "md": "$e^{-t}-t\\,e^{-t}$ (la segunda: $\\frac1{s^2}\\to t$ con corrimiento $a=-1$)."}], "respuesta": "$$e^{-t}-t\\,e^{-t}$$", "tiempo": "5 min", "puntaje_max": ["Separar el numerador", "Invertir con el primer teorema"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°2 b)", "tema": "t5", "enunciado": "Utilice la definición para calcular la transformada de $g(t)=\\begin{cases}0&0\\le t<a\\\\ k&a\\le t<b\\\\ 0&t\\ge b\\end{cases}$", "estrategia": "Un pulso: solo sobrevive el tramo $[a,b[$. Con escalones es $k[\\mathscr U(t-a)-\\mathscr U(t-b)]$.", "pasos": [{"titulo": "Definición.", "md": "$G(s)=\\int_a^bke^{-st}dt=k\\Big[-\\frac{e^{-st}}{s}\\Big]_a^b$."}, {"titulo": "Evaluar.", "md": "$=\\frac{k\\,(e^{-as}-e^{-bs})}{s}$, coherente con $k\\Big(\\frac{e^{-as}}{s}-\\frac{e^{-bs}}{s}\\Big)$ por escalones."}], "respuesta": "$$G(s)=\\frac{k\\,(e^{-as}-e^{-bs})}{s}$$", "tiempo": "6 min", "puntaje_max": ["Reconocer que solo importa $[a,b[$", "Integrar $e^{-st}$", "Evaluar en los extremos con el signo correcto"], "errores": ["intercambiar $a$ y $b$ (queda con signo contrario)"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°2 c)", "tema": "t5", "enunciado": "Calcule la transformada de $h(t)=\\begin{cases}2t&0\\le t<1\\\\ -2t+4&1\\le t<2\\\\ 0&t\\ge2\\end{cases}$", "estrategia": "Una \"carpa\": escribe con escalones en cada cambio de pendiente. Resolución detallada en §5.", "pasos": [{"titulo": "Escalones.", "md": "$h=2t-4(t-1)\\mathscr U(t-1)+2(t-2)\\mathscr U(t-2)$."}, {"titulo": "Transformar.", "md": "$\\frac2{s^2}-\\frac{4e^{-s}}{s^2}+\\frac{2e^{-2s}}{s^2}=\\frac{2(1-e^{-s})^2}{s^2}$."}], "respuesta": "$$H(s)=\\frac{2(1-e^{-s})^2}{s^2}$$ (La respuesta impresa en la guía no coincide: este resultado vale $2$ cuando $s\\to0$, el área de la carpa.)", "tiempo": "10 min", "puntaje_max": ["Reescribir con escalones", "Segundo teorema en cada término", "Factorizar"], "errores": ["escribir $-4t\\,\\mathscr U(t-1)$ sin trasladar a $(t-1)$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°2 d)", "tema": "t5", "enunciado": "Calcule la transformada de $f(t)=\\begin{cases}\\operatorname{sen}t&0\\le t<2\\pi\\\\ 0&t\\ge2\\pi\\end{cases}$", "estrategia": "$\\operatorname{sen}t$ es $2\\pi$-periódica: $\\operatorname{sen}t=\\operatorname{sen}(t-2\\pi)$, así que apagarla en $2\\pi$ es restar su copia trasladada.", "pasos": [{"titulo": "Escalones.", "md": "$f=\\operatorname{sen}t-\\operatorname{sen}(t-2\\pi)\\mathscr U(t-2\\pi)$."}, {"titulo": "Transformar.", "md": "$\\frac{1}{s^2+1}-\\frac{e^{-2\\pi s}}{s^2+1}$."}], "respuesta": "$$F(s)=\\frac{1-e^{-2\\pi s}}{s^2+1}$$", "tiempo": "6 min", "puntaje_max": ["Notar que $\\operatorname{sen}(t-2\\pi)=\\operatorname{sen}t$", "Segundo teorema", "Resultado simplificado"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 4", "pregunta": "n°5", "tema": "t5", "enunciado": "Determine la transformada de Laplace de $f(t)=\\begin{cases}\\operatorname{sen}t&0\\le t<\\pi\\\\ 0&t\\ge\\pi\\end{cases}$", "estrategia": "Ahora $\\operatorname{sen}t=-\\operatorname{sen}(t-\\pi)$ (media vuelta), y al apagar en $\\pi$ se **suma** la copia trasladada (porque el signo menos se cancela).", "pasos": [{"titulo": "Escalones.", "md": "$f=\\operatorname{sen}t-\\operatorname{sen}t\\cdot\\mathscr U(t-\\pi)=\\operatorname{sen}t+\\operatorname{sen}(t-\\pi)\\mathscr U(t-\\pi)$."}, {"titulo": "Transformar.", "md": "$\\frac{1}{s^2+1}+\\frac{e^{-\\pi s}}{s^2+1}$."}], "respuesta": "$$F(s)=\\frac{1+e^{-\\pi s}}{s^2+1}$$", "tiempo": "6 min", "puntaje_max": ["Reescribir $\\operatorname{sen}t=-\\operatorname{sen}(t-\\pi)$", "Segundo teorema con el signo correcto"], "errores": ["obtener $1-e^{-\\pi s}$ por no reconocer el cambio de signo de $\\operatorname{sen}(t-\\pi)$"]}, {"fuente": "Prueba 2 · pauta sin fecha", "pregunta": "P5", "tema": "t6", "puntaje": "12 pts", "confianza": "pauta", "variantes": ["Guía 4 · n°9 y n°10 (mismo tipo)"], "enunciado": "Resolver el problema con valores iniciales $y''-5y'+6y=H(t-1)$, $y(0)=0$, $y'(0)=1$, donde $H$ denota la función de Heaviside.", "estrategia": "La pauta escribe $H(t-1)$ para el escalón $\\mathscr U(t-1)$. Transforma con las condiciones iniciales, despeja $Y$, separa el término con $e^{-s}$ y haz fracciones parciales a cada parte; al invertir, aplica el segundo teorema a la parte con $e^{-s}$.", "pasos": [{"titulo": "Transformar.", "md": "$$s^2Y-0\\cdot s-1-5\\big(sY-0\\big)+6Y=\\frac{e^{-s}}{s}\\ \\Rightarrow\\ (s^2-5s+6)Y=\\frac{e^{-s}}{s}+1$$"}, {"titulo": "Despejar $Y$.", "md": "$$Y=\\frac{e^{-s}}{s(s-2)(s-3)}+\\frac{1}{(s-2)(s-3)}$$"}, {"titulo": "Fracciones parciales.", "md": "$$\\frac{1}{s(s-2)(s-3)}=\\frac{1}{6s}-\\frac{1}{2(s-2)}+\\frac{1}{3(s-3)},\\qquad\\frac1{(s-2)(s-3)}=\\frac{1}{s-3}-\\frac{1}{s-2}$$"}, {"titulo": "Invertir (segundo teorema para el primero).", "md": "$\\mathcal L^{-1}\\{\\frac{1}{s(s-2)(s-3)}\\}=\\frac16-\\frac12e^{2t}+\\frac13e^{3t}$; se reemplaza $t\\to t-1$ y se multiplica por $\\mathscr U(t-1)$."}], "respuesta": "$$y(t)=\\Big(\\frac16-\\frac12e^{2(t-1)}+\\frac13e^{3(t-1)}\\Big)\\mathscr U(t-1)+e^{3t}-e^{2t}$$", "tiempo": "15 min", "rubrica": [{"criterio": "Nivel 1: aplica Laplace, con errores menores", "pts": "4"}, {"criterio": "Nivel 2: transformada correcta, errores menores en la inversa", "pts": "8"}, {"criterio": "Nivel 3: transformada directa e inversa correctas y solución presentada", "pts": "12"}], "descuentos": ["olvidar $y'(0)=1$ en $\\mathcal L\\{y''\\}$", "invertir $e^{-s}$ sin trasladar $t\\to t-1$ ni escribir $H(t-1)$"]}, {"fuente": "Prueba 2 · pauta sin fecha", "pregunta": "P4", "tema": "t6", "puntaje": "12 pts", "confianza": "pauta", "enunciado": "Resuelva la ecuación integro-diferencial dada por $y(t)=t^3+\\displaystyle\\int_0^ty(z)\\operatorname{sen}(t-z)\\,dz$.", "estrategia": "La integral es una **convolución** $y*\\operatorname{sen}$: con Laplace se vuelve /* ===== T6 · PVI homogéneo paso a paso (práctica) ===== */
GADGETS["g_pvi_numerador"] = (el, U) => {
  const box = U.el("div"), fila = U.el("div", {class: "g-row"}); el.append(fila, box);
  const cf = c => (c === 1 ? "" : c === -1 ? "-" : String(c));                                                   // coeficiente: 1 → "", −1 → "-"
  const sg = (c, t) => (c === 0 ? "" : (c > 0 ? "+" : "-") + (Math.abs(c) === 1 && t ? "" : Math.abs(c)) + t);    // término con signo
  const poly = (c1, c0) => "s^2" + sg(c1, "s") + sg(c0, "");                                                     // s² + c1·s + c0
  const lin = (c1, c0) => (c1 === 0 ? String(c0) : cf(c1) + "s" + sg(c0, ""));                                    // c1·s + c0
  const termino = (num, den, r, primero) => {                                                                     // (num/den)·e^{rt} con signo
    if (num === 0) return "";
    const neg = (num < 0) !== (den < 0), n = Math.abs(num), d = Math.abs(den), g = mcd(n, d), p = n / g, q = d / g;
    const co = q === 1 ? (p === 1 ? "" : String(p)) : `\\tfrac{${p}}{${q}}`, e = ex(r) || (co === "" ? "1" : "");
    return (neg ? "-" : primero ? "" : "+") + co + e;
  };
  function nuevo() {
    let r1, r2, y0, y1;
    do { r1 = pick([-3, -2, -1, 1, 2, 3]); r2 = pick([-3, -2, -1, 1, 2, 3]); } while (r1 === r2);
    do { y0 = randInt(-3, 3); y1 = randInt(-3, 3); } while (y0 === 0 && y1 === 0);
    const a = -(r1 + r2), b = r1 * r2, n1 = y0, n0 = y1 + a * y0, N = s => n1 * s + n0, A = N(r1) / (r1 - r2), B = N(r2) / (r2 - r1);
    const ec = "y''" + sg(a, "y'") + sg(b, "y") + "=0";
    const t1 = termino(N(r1), r1 - r2, r1, true), t2 = termino(N(r2), r2 - r1, r2, t1 === ""), solT = t1 + t2 || "0";
    box.innerHTML = "";
    box.append(U.el("div", {class: "g-out", html: `PVI: $${ec},\\quad y(0)=${y0},\\ y'(0)=${y1}$.<br>Al transformar y reemplazar las condiciones iniciales queda $(${poly(a, b)})\\,Y(s)=\\underbrace{n_1 s+n_0}_{\\text{numerador}}$.`}));
    U.numInput(box, {label: "n₁ (coef. de s) =", ok: n1, tol: 0.01, exp: `$\\mathcal L\\{y''\\}=s^2Y-s\\,y(0)-y'(0)$ aporta $s\\cdot y(0)=${y0}s$, y $\\mathcal L\\{ay'\\}=a(sY-y(0))$ no aporta términos en $s$: $n_1=${n1}$.`});
    U.numInput(box, {label: "n₀ (constante) =", ok: n0, tol: 0.01, exp: `$n_0=y'(0)+a\\,y(0)=${y1}${a >= 0 ? "+" : ""}(${a})(${y0})=${n0}$.`});
    box.append(U.el("p", {html: `Ahora $Y(s)=\\dfrac{${lin(n1, n0)}}{${fac(r1)}${fac(r2)}}=\\dfrac{A}{${fac(r1).replace(/^\((.*)\)$/, "$1")}}+\\dfrac{B}{${fac(r2).replace(/^\((.*)\)$/, "$1")}}$ (el denominador sale de factorizar $${poly(a, b)}$).`}));
    U.numInput(box, {label: "A =", ok: A, tol: 0.01, exp: `$A=\\dfrac{n_1(${r1})+n_0}{${r1}-(${r2})}=\\dfrac{${N(r1)}}{${r1 - r2}}=${fr(N(r1), r1 - r2)}$.`});
    U.numInput(box, {label: "B =", ok: B, tol: 0.01, exp: `$B=\\dfrac{n_1(${r2})+n_0}{${r2}-(${r1})}=\\dfrac{${N(r2)}}{${r2 - r1}}=${fr(N(r2), r2 - r1)}$.`});
    const out = U.el("div", {class: "g-out", style: "display:none", html: `$y(t)=${solT}$ (raíces $${r1}$ y $${r2}$).`});
    U.button(box, "Ver y(t)", () => { out.style.display = ""; U.tex(out); }); box.append(out); U.tex(box);
  }
  U.button(fila, "Otro PVI", nuevo); nuevo();
};

/* ===== T6 · respuesta a un escalón: y'' + 2ζω y' + ω² y = A·U(t − t₀) ===== */
GADGETS["g_respuesta_escalon"] = (el, U) => {
  const S = {w: 2, z: 0.3, t0: 2, A: 1}; const out = U.el("div", {class: "g-out"}), po = {xmin: 0, xmax: 20, height: 240};
  [["w", "frecuencia natural ω", 0.5, 4, 0.1], ["z", "amortiguamiento ζ", 0, 1.5, 0.05], ["t0", "instante del escalón t₀", 0, 8, 0.5], ["A", "altura A del escalón", 0.5, 3, 0.5]].forEach(([key, lab, mn, mx, st]) =>
    U.slider(el, {label: lab, min: mn, max: mx, step: st, value: S[key], onInput: v => { S[key] = v; upd(); }}));
  const plot = U.plot(el, po); el.append(out);
  function upd() {
    const {w, z, t0, A} = S, sol = rk4((t, y) => [y[1], (t >= t0 ? A : 0) - 2 * z * w * y[1] - w * w * y[0]], [0, 0], 0, 20, 0.004), yf = A / (w * w);
    let mx = 0; sol.forEach(p => { mx = Math.max(mx, p.y[0]); });
    Object.assign(po, {ymin: -0.05 * yf, ymax: Math.max(mx, yf) * 1.15 + 0.05});
    plot.draw({fns: [{f: t => interp(sol, t), c: 0}, {f: t => (t >= t0 ? yf : NaN), c: 1}], vlines: [{x: t0, label: "t₀", c: 4}]});
    const caso = z < 1 - 1e-9 ? (z === 0 ? "sin roce (oscila para siempre)" : "subamortiguado (oscila y se asienta)") : near(z, 1, 1e-9) ? "crítico" : "sobreamortiguado (sube sin oscilar)";
    out.innerHTML = `$y''+${TX(2 * z * w, 2)}\\,y'+${TX(w * w, 2)}\\,y=${TX(A, 1)}\\,\\mathscr U(t-${TX(t0, 1)})$, $y(0)=y'(0)=0$.<br>$Y(s)=\\dfrac{${TX(A, 1)}\\,e^{-${TX(t0, 1)}s}}{s\\,(s^2+${TX(2 * z * w, 2)}s+${TX(w * w, 2)})}$ — el $e^{-t_0 s}$ es lo que "enciende" la respuesta recién en $t_0$ (antes $y=0$).<br>` +
      `Régimen: <b>${caso}</b>. Valor final (línea naranja) $\\dfrac{A}{\\omega^2}=${TX(yf, 3)}$ · máximo de $y$: ${U.fmt(mx, 3)}${mx > yf * 1.001 ? ` (sobrepasa ${U.fmt((mx / yf - 1) * 100, 1)} %)` : ""}.`;
    U.tex(out);
  }
};

      const e = blk(`<p><b>Ejemplo ${n}.${++c.ej}${b.titulo ? ` — ${esc(b.titulo)}` : ""}.</b></p>${md(b.enunciado)}<div class="row" style="margin-top:8px"></div><div class="hide sol"><p><span class="serif" style="font-style:italic;font-size:1.1em">Solución.</span></p>${pasosHTML(b.pasos)}${b.respuesta ? `<div class="ans">${md(b.respuesta)}</div>` : ""}${b.lapiz ? `<div class="pen" style="margin-top:6px">${inl(b.lapiz)}</div>` : ""}<div class="qed">∎</div></div>`);
      const sol = e.querySelector(".sol"), bt = btn("Ver solución", () => { sol.classList.toggle("hide"); bt.textContent = sol.classList.contains("hide") ? "Ver solución" : "Ocultar solución"; tex(sol); });
      e.querySelector(".row").append(bt); return e;
    }
    case "gadget": {
      const L = String.fromCharCode(65 + c.lab++);
      const e = blk(`<section class="sheet gadget">${sh(`<span class="sec">LAB ${n}.${L}</span>${esc(b.titulo || "")}`, `<span class="lbl">Interactivo</span>`)}<div class="sb">${md(b.instrucciones)}<div class="g-body"></div>${b.figura ? `<p style="font-size:.9rem;color:var(--muted);margin-top:10px"><b>Figura ${n}.${++c.fig}</b> — ${inl(b.figura)}</p>` : ""}</div></section>`);
      const body = e.querySelector(".g-body");
      setTimeout(() => { try { GADGETS[b.id] ? GADGETS[b.id](body, U) : body.append("Gadget no encontrado: " + b.id); tex(body); } catch (err) { body.append("Error en el gadget: " + err.message); console.error(err); } });
      return e;
    }
    default: return blk(md(b.md || ""));
  }
}

/* ---------- autoevaluación ---------- */
function vQuiz(pre) {
  const temas = T.filter(t => Q.some(q => q.tema === t.id));
  const sel = new Set(pre?.temas || temas.map(t => t.id)); let cant = 10, modo = "mix";
  const fall = store.get("fallidas", []);
  main.append(hdr("Autoevaluación · " + Q.length + " preguntas disponibles", "Autoevaluación con diagnóstico", `Responde como en la prueba. Cada respuesta actualiza tu dominio por ${esc(UNI.toLowerCase())}; al final verás tu nota estimada y qué repasar primero.`));
  const c = node(`<section class="sheet">${sh("Configurar ronda")}<div class="sb" style="display:flex;flex-direction:column;gap:12px"></div></section>`), sb = c.querySelector(".sb");
  const grupo = (titulo, items, isOn, onPick) => { const w = node(`<div><div class="lbl" style="margin-bottom:6px">${titulo}</div><div class="row"></div></div>`), r = w.querySelector(".row");
    items.forEach(([v, l]) => { const b = node(`<button class="chip${isOn(v) ? " on" : ""}">${esc(l)}</button>`); b.onclick = () => { onPick(v); r.querySelectorAll(".chip").forEach((x, i) => x.classList.toggle("on", isOn(items[i][0]))); }; r.append(b); }); return w; };
  sb.append(grupo(UNI + "es", temas.map(t => [t.id, `§${idx(t.id)} ${t.titulo}`]), v => sel.has(v), v => sel.has(v) ? sel.delete(v) : sel.add(v)),
    grupo("Cantidad", [[5, "5"], [10, "10"], [20, "20"], [999, "Todas"]], v => v === cant, v => cant = v),
    grupo("Modo", [["mix", "Mezcladas"], ["err", `Solo las que fallé (${fall.length})`]], v => v === modo, v => modo = v),
    node(`<div class="row"></div>`));
  sb.lastChild.append(btn("Comenzar", () => {
    let pool = Q.map((q, i) => ({...q, i})).filter(q => sel.has(q.tema));
    if (modo === "err") pool = pool.filter(q => fall.includes(q.i));
    if (!pool.length) return alert("No hay preguntas con esa selección.");
    pool.sort(() => Math.random() - .5); correr(pool.slice(0, cant));
  }, true));
  main.append(c);
  const hist = store.get("hist", {});
  if (Object.keys(hist).length) main.append(hoja("Historial acumulado", hist, true));
}
function hoja(titulo, st, reset) {
  const ok = Object.values(st).reduce((a, s) => a + s.ok, 0), n = Object.values(st).reduce((a, s) => a + s.n, 0), flojos = [];
  const rows = Object.entries(st).map(([id, s]) => { const p = s.ok / s.n; if (p < 0.6) flojos.push(id);
    return `<tr><td><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</td><td class="mono" style="text-align:right;${p < 0.6 ? "color:var(--pen);font-weight:600" : ""}">${s.ok}/${s.n}</td></tr>`; }).join("");
  const c = node(`<section class="sheet">${sh(esc(titulo))}<div class="sb">
    <div class="row" style="gap:16px;align-items:baseline;margin-bottom:12px"><span class="big">${ok}<small>/${n}</small></span><span class="pen" style="font-size:1.7rem">nota estimada ${fmtN(notaCL(n ? ok / n : 0))}</span></div>
    <div class="tbl"><table><tr><th>${esc(UNI)}</th><th style="text-align:right">Correctas</th></tr>${rows}</table></div>
    <p class="lbl" style="margin-top:8px">Escala 1 a 7 con 60 % de exigencia</p></div></section>`);
  if (flojos.length) { const d = node(`<div class="ojo" style="margin-top:14px"><span class="lbl">Repasa primero</span><div class="row" style="margin-top:6px"></div></div>`);
    flojos.forEach(id => d.querySelector(".row").append(btn(`§${idx(id)} ${tituloTema(id)} →`, () => { temaActual = id; go("temas"); }))); c.querySelector(".sb").append(d); }
  if (reset) { const r = node(`<div class="row" style="margin-top:12px"></div>`); r.append(btn("Borrar historial", () => { if (confirm("¿Borrar historial?")) { store.set("hist", {}); store.set("fallidas", []); go("quiz"); } })); c.querySelector(".sb").append(r); }
  return c;
}
function correr(qs) {
  let k = 0; const ses = {}, hist = store.get("hist", {}), fall = new Set(store.get("fallidas", []));
  const show = () => {
    main.innerHTML = "";
    if (k >= qs.length) { main.append(hdr("Autoevaluación · Resultado", "Hoja de resultados", "")); main.append(hoja("Esta ronda", ses));
      const r = node(`<div class="row"></div>`); r.append(btn("Otra ronda", () => go("quiz"), true), btn("Ir a evaluaciones anteriores", () => go("evals"))); main.append(r); side(); tex(main); return; }
    const q = qs[k], dif = "●".repeat(q.dif || 1) + "○".repeat(3 - (q.dif || 1));
    const c = node(`<section class="sheet">${sh(`<span class="mono" style="font-size:.9rem">Pregunta ${k + 1} de ${qs.length} <span style="color:var(--muted);font-weight:400">· §${idx(q.tema)} · Dificultad ${dif}</span></span>`, q.pts ? `<span class="mono">(${esc(q.pts)} pts)</span>` : "")}<div class="sb"><div class="serif" style="font-size:1.35rem;line-height:1.45;margin-bottom:10px">${md(q.q)}</div><div class="ops"></div><div class="fb"></div><div class="row sp" style="margin-top:14px"><span></span></div></div></section>`);
    const fb = c.querySelector(".fb"), ops = c.querySelector(".ops"), foot = c.querySelector(".row.sp");
    const next = btn(k + 1 < qs.length ? "Siguiente pregunta →" : "Ver hoja de resultados", () => { k++; show(); }, true); next.classList.add("hide"); foot.append(next);
    const mark = ok => {
      for (const o of [ses, hist]) { o[q.tema] = o[q.tema] || {ok: 0, n: 0}; o[q.tema].n++; if (ok) o[q.tema].ok++; }
      ok ? fall.delete(q.i) : fall.add(q.i); store.set("hist", hist); store.set("fallidas", [...fall]);
      fb.innerHTML = `<div style="border-top:1px solid var(--ink);padding-top:12px;margin-top:10px"><span class="serif" style="font-style:italic;font-size:1.15rem">${ok ? "Correcto." : "Incorrecto."}</span> ${md(q.exp)}</div>`;
      next.classList.remove("hide"); side(); tex(fb);
    };
    if (q.tipo === "num") {
      const r = node(`<div class="g-row"><label>Tu respuesta</label><input type="text" inputmode="decimal" placeholder="ej. 4,2"></div>`), i = r.querySelector("input");
      const b = btn("Responder", () => { const x = U.num(i.value); if (isNaN(x)) return; b.disabled = i.disabled = true; const ok = Math.abs(x - q.ok) <= (q.tol ?? 1e-6);
        if (!ok) r.append(node(`<span class="pen">esperado: ${U.fmt(q.ok, 4)}</span>`)); mark(ok); });
      i.addEventListener("keydown", e => e.key === "Enter" && b.click()); r.append(b); ops.append(r);
    } else {
      (q.op || []).map((t, j) => ({t, j})).sort(() => Math.random() - .5).forEach((o, pos) => {
        const b = node(`<button class="opt"><span class="bub">${"abcdefgh"[pos]})</span><span class="tx">${inl(o.t)}</span><span class="tg"></span></button>`);
        b.onclick = () => { ops.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.j === q.ok) { x.classList.add("ok"); x.querySelector(".tg").textContent = "✓ correcta"; } });
          if (o.j !== q.ok) { b.classList.add("bad"); b.querySelector(".tg").textContent = "✗ tu respuesta"; } mark(o.j === q.ok); };
        b.dataset.j = o.j; ops.append(b);
      });
    }
    main.append(c); tex(main);
  };
  show();
}

/* ---------- evaluaciones anteriores ---------- */
function vEvals(pre) {
  const hechas = new Set(store.get("hechas", [])); let ft = pre?.tema || "todos", ff = "todas";
  const fuentes = [...new Set(E.map(e => e.fuente))];
  main.append(hdr(`Evaluaciones anteriores · ${E.length} preguntas${fuentes.length ? ` de ${fuentes.length} evaluaciones` : ""}`, "Banco de preguntas anteriores", "Intenta cada pregunta antes de abrir la solución. Después revisa la rúbrica: ahí está lo que separa un 5 de un 7."));
  const freq = {}; E.forEach(e => freq[e.tema] = (freq[e.tema] || 0) + 1); const mx = Math.max(1, ...Object.values(freq));
  const top = node(`<section style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end"><div><div class="lbl" style="margin-bottom:6px">Frecuencia por ${esc(UNI.toLowerCase())}</div>${Object.entries(freq).sort((a, b) => b[1] - a[1]).map(([id, n]) => `<div class="freq"><span><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</span><div class="hbar"><i style="width:${100 * n / mx}%"></i></div><span class="mono" style="text-align:right">${n}</span></div>`).join("")}</div>
    <div class="sheet" style="padding:14px 20px"><div class="lbl">Resueltas</div><div class="big" id="prog"></div></div></section>`);
  main.append(top);
  const fil = node(`<div class="row"></div>`);
  [["todos", "Todos"], ...Object.keys(freq).map(id => [id, `§${idx(id)} ${tituloTema(id)}`])].forEach(([id, l]) => { const b = node(`<button class="chip${id === ft ? " on" : ""}">${esc(l)}</button>`); b.onclick = () => { ft = id; fil.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); lista(); }; fil.append(b); });
  if (fuentes.length > 1) { const s = node(`<select aria-label="Filtrar por evaluación"><option value="todas">Todas las evaluaciones</option>${fuentes.map(f => `<option>${esc(f)}</option>`).join("")}</select>`); s.onchange = () => { ff = s.value; lista(); }; fil.append(s); }
  main.append(fil);
  const cont = node(`<div style="display:flex;flex-direction:column;gap:30px"></div>`); main.append(cont);
  const prog = () => $("#prog").innerHTML = `${hechas.size}<small>/${E.length}</small>`;
  function lista() {
    cont.innerHTML = ""; prog();
    E.map((e, i) => ({...e, i})).filter(e => (ft === "todos" || e.tema === ft) && (ff === "todas" || e.fuente === ff)).forEach(e => {
      const of = e.confianza === "pauta";
      const rub = (e.rubrica || []).length ? `<div class="tbl"><table><tr><th>Criterio de la pauta</th><th style="text-align:right">Pts</th></tr>${e.rubrica.map(r => `<tr><td>${inl(r.criterio)}</td><td class="mono" style="text-align:right">${esc(r.pts)}</td></tr>`).join("")}</table></div>`
        : (e.puntaje_max || []).length ? `<div class="lbl" style="color:var(--acc)">Lo que suma puntos</div>${md(e.puntaje_max.map(x => "- " + x).join("\n"))}` : "";
      const desc = [...(e.descuentos || []), ...(e.errores || [])];
      const panes = [
        ["I · Estrategia", (e.estrategia ? md(e.estrategia) : "") + (e.tiempo ? `<div class="pen">tiempo sugerido: ${esc(e.tiempo)}</div>` : "")],
        ["II · Solución", pasosHTML(e.pasos) + (e.respuesta ? `<div class="ans">${md(e.respuesta)}</div>` : "") + `<div class="qed">∎</div>`],
        ["III · Rúbrica de puntaje", rub + (desc.length ? `<div style="margin-top:12px"><div class="lbl" style="color:var(--pen)">Descuentos frecuentes</div>${desc.map(d => `<div class="pen">${inl(d)}</div>`).join("")}</div>` : "") + ((e.variantes || []).length ? `<p class="lbl" style="margin-top:12px">También apareció en: ${e.variantes.map(esc).join(" · ")}</p>` : "")]
      ].filter(p => p[1].replace(/<[^>]+>|∎/g, "").trim());
      const k = node(`<article class="exam"><div class="rot"><div><span class="lbl">Fuente</span>${esc(e.fuente)}${e.pregunta ? " — " + esc(e.pregunta) : ""}</div><div><span class="lbl">Puntaje</span>${esc(e.puntaje || "—")}</div><div class="${of ? "of" : "pr"}"><span class="lbl" style="color:inherit">Solución</span>${of ? "Pauta oficial" : "Propuesta"}</div></div>
        <div class="en"><div class="lbl" style="margin-bottom:6px">§${idx(e.tema)} · ${esc(tituloTema(e.tema))}</div>${md(e.enunciado)}</div><div class="tabs"></div><div class="pane"><p class="lbl">Intenta resolverla antes de abrir la solución.</p></div>
        <div class="foot"><span></span><label class="chk"><input type="checkbox"${hechas.has(e.i) ? " checked" : ""}> La resolví</label></div></article>`);
      const tabs = k.querySelector(".tabs"), pane = k.querySelector(".pane");
      panes.forEach(([l, h]) => { const b = node(`<button class="tab">${l}</button>`); b.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); pane.innerHTML = h; tex(pane); }; tabs.append(b); });
      k.querySelector("input").onchange = ev => { ev.target.checked ? hechas.add(e.i) : hechas.delete(e.i); store.set("hechas", [...hechas]); prog(); };
      cont.append(k);
    });
    if (!cont.children.length) cont.append(node(`<p class="lbl">No hay preguntas con ese filtro.</p>`));
    tex(cont);
  }
  lista();
}

go(store.get("tab", "resumen"));
})();
</script>
