--c0:var(--acc);--c1:var(--pen);--c2:#2E7D5B;--c3:#7A3FA0;--c4:#6B7280;
--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--hand:Caveat,"Segoe Print","Comic Sans MS",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--paper:#11141B;--grid:color-mix(in srgb,var(--acc-d) 9%,#11141B);--grid2:color-mix(in srgb,var(--acc-d) 17%,#11141B);--ink:#E7E9EE;--muted:#A3A9B6;--line:#2F3747;--card:#171B24;--head:#1E2431;--shadow:#0A0C11;--acc:var(--acc-d);--acc-soft:color-mix(in srgb,var(--acc-d) 16%,#171B24);--pen:var(--pen-d);--pen-soft:color-mix(in srgb,var(--pen-d) 14%,#171B24);--c2:#5BC293;--c3:#C18BE0;--c4:#9CA3AF}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
/* papel */
body.p-cuadriculado{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body.p-milimetrado{background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px,40px 40px,8px 8px,8px 8px}
body.p-puntos{background-image:radial-gradient(var(--grid2) 1.2px,transparent 1.3px);background-size:22px 22px}
body.p-rayado{background-image:linear-gradient(transparent 27px,var(--grid) 27px);background-size:100% 28px}
body.p-liso{background-image:none}
a{color:var(--acc)}
.serif{font-family:var(--serif)}.mono{font-family:var(--mono)}.pen{font-family:var(--hand);color:var(--pen);font-size:1.4rem;line-height:1.25}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.app{display:flex;min-height:100%}
/* barra lateral tipo plano */
.side{position:sticky;top:0;align-self:flex-start;width:290px;flex-shrink:0;height:100vh;height:100dvh;overflow-y:auto;padding:30px 22px calc(24px + env(safe-area-inset-bottom,0px));background:var(--side);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;color:#fff;display:flex;flex-direction:column;gap:26px}
.side .lbl{color:var(--side-muted)}
.side h1{font:600 1.45rem/1.15 var(--serif);margin:4px 0 0}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;color:var(--side-ink);text-decoration:none;font:500 .95rem var(--sans);border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{color:#fff;border-color:var(--side-line)}.nav.on{background:#fff;color:#111827}
.nav .mono{font-size:.75rem;width:46px;flex-shrink:0}
.dom{display:grid;grid-template-columns:30px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:.8rem;color:var(--side-ink);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;width:100%}
.dom .b{height:6px;background:rgba(255,255,255,.14)}.dom .b i{display:block;height:6px}
.rotulo{margin-top:auto;border-top:1px solid var(--side-line);border-left:1px solid var(--side-line);display:grid;grid-template-columns:1fr 1fr}
.rotulo div{padding:7px 9px;border-right:1px solid var(--side-line);border-bottom:1px solid var(--side-line);display:flex;flex-direction:column;gap:2px;font-size:.8rem;min-width:0}
.rotulo .w{grid-column:span 2}.rotulo .lbl{font-size:.6rem}
.side .tbtn{background:none;border:1px solid var(--side-line);color:var(--side-ink);font:500 .8rem var(--sans);min-height:40px;cursor:pointer}
.content{flex:1;min-width:0}
.mtop{display:none}
main{max-width:1120px;margin:0 auto;padding:48px 56px 80px;display:flex;flex-direction:column;gap:32px}
/* cabeceras */
.hdr{padding-bottom:22px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.hdr h2{margin:0;font:600 clamp(2rem,4.2vw,3.1rem)/1.06 var(--serif);letter-spacing:-.01em}
.hdr h2 .n{color:var(--acc);font-weight:400;margin-right:.35em}
.hdr p{margin:0;font-size:1.05rem;color:var(--muted);max-width:820px}
/* hoja: tarjeta con barra superior */
.sheet{background:var(--card);border:1px solid var(--ink)}
.sheet>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ink);background:var(--head)}
.sheet>.sh h3{margin:0;font:600 1.15rem var(--serif)}
.sheet>.sb{padding:18px 22px}
.sec{color:var(--acc);font:500 .85em var(--mono);margin-right:.6em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border:1.5px solid var(--acc)}.dots i.f{background:var(--acc)}
.eqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.eqrow .num{font:.8rem var(--mono);color:var(--muted)}.eqrow .nt{font-size:.82rem;color:var(--muted)}
.mx{overflow-x:auto;overflow-y:hidden}
p{margin:.4em 0}ul,ol{margin:.35em 0;padding-left:1.3em}li{margin:.2em 0}
code{font-family:var(--mono);font-size:.88em;background:var(--acc-soft);padding:1px 5px}
/* capítulo */
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--ink);background:var(--card);color:var(--ink);min-height:40px;padding:0 14px;font:500 .85rem var(--sans);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper)}
.chap{display:block;padding-right:270px}
.chap>.blk{margin:0 0 24px}
.chap>.blk::after{content:"";display:table;clear:both}
.nota{float:right;clear:right;width:230px;margin:0 -270px 16px 0;font-size:.88rem;color:var(--muted);border-left:1px solid var(--ink);padding-left:14px}
.nota .lbl{display:block;margin-bottom:4px}
.lapiz{float:right;clear:right;width:240px;margin:0 -275px 12px 0;transform:rotate(-2.5deg)}
.h3{margin:0 0 8px;font:600 1.5rem/1.25 var(--serif)}
.defi{background:var(--card);border:1px solid var(--ink);padding:16px 20px}
.defi .nm{font-family:var(--serif);font-style:italic;font-size:1.05em}
.formula{background:var(--card);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:14px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.formula .num{font:.9rem var(--mono);color:var(--muted)}
.ans{border:2px solid var(--acc);background:var(--card);padding:12px 16px;font-weight:500;overflow-x:auto}
.step{padding:6px 0 6px 14px;border-left:2px solid var(--line);margin:8px 0}.step b.t{font:600 .78rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);display:block}
.qed{text-align:right;font-size:1.2rem}
.ojo{border:2px solid var(--pen);background:var(--card);padding:14px 18px}.ojo .lbl{color:var(--pen)}
.code{background:#161A22;color:#E6E8EC;font:.9rem/1.55 var(--mono);padding:16px 18px;overflow-x:auto;white-space:pre;margin:0}
.code+.out{border:1px solid var(--ink);border-top:0;font:.85rem var(--mono);padding:10px 16px;white-space:pre;overflow-x:auto;background:var(--card)}
.gadget .sb{padding:22px}
.g-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}.g-row label{min-width:130px;font-size:.9rem}
.g-row input[type=range]{flex:1;min-width:150px;accent-color:var(--acc)}.g-row .v{font-family:var(--mono);min-width:64px}
.g-out{margin:10px 0;font-size:.95rem}
input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ink);padding:8px 10px;min-height:42px}
canvas{max-width:100%;display:block}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--card)}
.tbl table{border:1px solid var(--ink)}th{font:600 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--head);text-align:left;padding:9px 12px;border-bottom:1px solid var(--ink)}
td{padding:9px 12px;border-bottom:1px dashed var(--line);vertical-align:top}
.btn{border:1px solid var(--ink);background:var(--card);color:var(--ink);font:500 .92rem var(--sans);min-height:44px;padding:0 18px;cursor:pointer}
.btn:hover{background:var(--head)}.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.hide{display:none!important}
/* autoevaluación */
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font:.85rem var(--mono)}
.opt .tx{flex:1}.opt .tg{font-family:var(--hand);font-size:1.3rem;color:var(--pen)}
.opt.ok{border:2px solid var(--acc)}.opt.ok .bub{background:var(--acc);border-color:var(--acc);color:var(--card)}.opt.ok .tg{color:var(--acc)}
.opt.bad{border:2px solid var(--pen)}.opt.bad .bub{border-color:var(--pen);color:var(--pen)}
.big{font:400 3.6rem/1 var(--serif)}.big small{color:var(--muted);font-size:.6em}
.hbar{height:12px;border:1px solid var(--ink);background:var(--card)}.hbar i{display:block;height:100%;background:var(--acc);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px)}
.freq{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr) 30px;gap:14px;align-items:center;font-size:.9rem;margin:6px 0}
/* evaluaciones */
.exam{background:var(--card);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}
.exam .rot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;border-bottom:1px solid var(--ink)}
.exam .rot>div{padding:10px 18px;display:flex;flex-direction:column;gap:2px;font:.88rem var(--mono)}
.exam .rot>div+div{border-left:1px solid var(--ink)}.exam .rot .of{background:var(--acc-soft);color:var(--acc)}.exam .rot .pr{background:var(--pen-soft);color:var(--pen)}
.exam .en{padding:22px 26px 6px;font:1.18rem/1.6 var(--serif)}
.tabs{display:flex;border-bottom:1px solid var(--ink);margin:14px 26px 0;overflow-x:auto}
.tab{min-height:44px;padding:0 18px;font:500 .85rem var(--mono);cursor:pointer;margin-bottom:-1px;border:1px solid transparent;background:none;color:var(--muted);white-space:nowrap}
.tab.on{border-color:var(--ink);border-bottom-color:var(--card);background:var(--card);color:var(--ink)}
.pane{padding:18px 26px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 26px 18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}
/* responsive */
@media (max-width:1100px){.chap{padding-right:0}.nota,.lapiz{float:none;width:auto;margin:0 0 16px}.lapiz{transform:none}}
@media (max-width:900px){
.app{display:block}
.side{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-105%);transition:transform .2s;height:100%;width:min(300px,86vw);padding-top:calc(24px + env(safe-area-inset-top,0px))}
body.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--side);color:#fff}
.mtop button{background:none;border:1px solid var(--side-line);color:#fff;min-height:42px;padding:0 12px;font:500 .85rem var(--sans)}
.mtop b{font:600 1rem var(--serif);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:26px 16px 70px;gap:24px}
.grid2{grid-template-columns:minmax(0,1fr)}
.exam .rot{grid-template-columns:1fr 1fr}.exam .rot>div:first-child{grid-column:span 2;border-bottom:1px solid var(--ink)}.exam .rot>div:nth-child(2){border-left:0}
.exam .en,.pane{padding-left:16px;padding-right:16px}.tabs{margin:14px 16px 0}.foot{padding:8px 16px 16px}
.big{font-size:2.8rem}.freq{grid-template-columns:minmax(0,1fr) 90px 26px}
}
@media print{.side,.mtop,.btn,.chip,.subnav,.tabs{display:none!important}body{background:#fff!important}.chap{padding-right:0}.sheet,.exam{break-inside:avoid;box-shadow:none}}

<script>
const DATA = {"meta": {"ramo": "Ecuaciones Diferenciales (MAT-208)", "evaluacion": "Control 3", "carrera": "Ingeniería · UAI", "semestre": "2026-2", "contenidos": "Series de Fourier y convergencia · Laplace · traslación · escalón · EDO con Laplace", "fuentes": ["Clase 19 (= Clase 25 del profesor: Series de Fourier)", "Guía 4 (Laplace) y Guía 5 n°7–11 (Fourier)", "Pautas de la Prueba 2 (preguntas de Laplace y escalón)", "Resoluciones propias verificadas numéricamente"], "estilo": {"preset": "matematica", "papel": "cuadriculado", "unidad": "Capítulo"}}, "resumen": [{"tema": "t1", "ideas": ["Una función en $]-p,p[$ se arma con una constante más ondas $\\cos\\frac{n\\pi x}{p}$ y $\\operatorname{sen}\\frac{n\\pi x}{p}$; cada coeficiente mide cuánto hay de esa frecuencia.", "**Antes de integrar, mira la paridad:** par $\\Rightarrow$ solo cosenos ($b_n=0$); impar $\\Rightarrow$ solo senos ($a_0=a_n=0$).", "Si $f$ solo está en $]0,L[$ tú eliges la extensión: par (cosenos), impar (senos) o de período $L$ (completa).", "Con $n$ entero: $\\cos n\\pi=(-1)^n$ y $\\operatorname{sen}n\\pi=0$.", "Fuerza periódica sobre un resorte: se desarrolla $f$ y se propone $x_p$ con los mismos armónicos, igualando coeficientes."], "formulas": [{"tex": "f\\sim\\dfrac{a_0}{2}+\\sum_{n\\ge1}\\Big(a_n\\cos\\dfrac{n\\pi x}{p}+b_n\\operatorname{sen}\\dfrac{n\\pi x}{p}\\Big)", "nota": "serie de Fourier"}, {"tex": "a_0=\\dfrac1p\\int_{-p}^{p}f,\\quad a_n=\\dfrac1p\\int_{-p}^{p}f\\cos\\dfrac{n\\pi x}{p},\\quad b_n=\\dfrac1p\\int_{-p}^{p}f\\operatorname{sen}\\dfrac{n\\pi x}{p}", "nota": "coeficientes"}, {"tex": "\\text{par: }a_n=\\dfrac2p\\int_0^pf\\cos\\dfrac{n\\pi x}{p}\\ ;\\quad\\text{impar: }b_n=\\dfrac2p\\int_0^pf\\operatorname{sen}\\dfrac{n\\pi x}{p}", "nota": "usando paridad"}], "ojo": ["$\\frac{a_0}{2}$ en la serie, $\\frac1p$ (no $\\frac2p$) en la integral de $a_0$.", "La frecuencia es $\\frac{n\\pi x}{p}$, no $nx$ (si $p=2$: $\\cos\\frac{n\\pi x}{2}$)."]}, {"tema": "t2", "ideas": ["Si $f$ y $f'$ son continuas por tramos: la serie converge a $f(x)$ donde $f$ es continua y al **promedio** de los límites laterales en un salto.", "La serie es periódica de período $2p$: fuera de $]-p,p[$ representa la extensión periódica (reduce $x_0$ sumando o restando $2p$).", "En $x=\\pm p$: promedio de $f(p^-)$ y $f(-p^+)$, no $f(p)$.", "Para sumar series numéricas: evalúa la serie en un $x_0$ que simplifique las ondas y usa el teorema para el valor de la suma."], "formulas": [{"tex": "S(x)=\\begin{cases}f(x)&\\text{continua}\\\\ \\dfrac{f(x^+)+f(x^-)}{2}&\\text{salto}\\end{cases}", "nota": "valor de convergencia"}, {"tex": "S(\\pm p)=\\dfrac{f(p^-)+f(-p^+)}{2}", "nota": "en los extremos"}], "ojo": ["Usar $f(p)$ en $x=\\pm p$.", "Gibbs: las sumas parciales se pasan cerca del salto, pero el límite sigue siendo el promedio."]}, {"tema": "t3", "ideas": ["$\\mathcal L\\{f\\}=\\int_0^\\infty e^{-st}f(t)\\,dt$ (con $s$ en el dominio de convergencia, p. ej. $s>a$ para $e^{at}$).", "Se necesita la tabla y las propiedades: linealidad, $t\\,f\\to-F'$, integral $\\to\\frac Fs$, $\\frac ft\\to\\int_s^\\infty F$.", "Inversa: fracciones parciales; factor repetido lleva **dos** fracciones; cuadrático sin raíces: completar cuadrados.", "Por definición con tramos: separa la integral y escribe el límite de la impropia."], "formulas": [{"tex": "\\mathcal L\\{t^n\\}=\\dfrac{n!}{s^{n+1}},\\quad\\mathcal L\\{e^{at}\\}=\\dfrac1{s-a}", "nota": "potencias y exponencial"}, {"tex": "\\mathcal L\\{\\operatorname{sen}at\\}=\\dfrac{a}{s^2+a^2},\\quad\\mathcal L\\{\\cos at\\}=\\dfrac{s}{s^2+a^2}", "nota": "seno y coseno"}, {"tex": "\\mathcal L\\{t\\,f(t)\\}=-F'(s),\\quad\\mathcal L\\Big\\{\\int_0^tf\\Big\\}=\\dfrac{F(s)}{s}", "nota": "propiedades"}], "ojo": ["$\\mathcal L\\{t^n\\}$ lleva $n!$; al invertir $\\frac1{s^3}\\to\\frac{t^2}{2}$.", "$\\mathcal L\\{fg\\}\\neq F\\cdot G$; baja $\\operatorname{sen}^2$ y $\\cos^2$ con ángulo doble."]}, {"tema": "t4", "ideas": ["**Primer teorema:** $e^{at}$ multiplicando a $f$ corre $s\\to s-a$. Con $e^{-2t}$ aparece $s+2$.", "**Segundo teorema:** retrasar $a$ unidades multiplica por $e^{-as}$, pero solo si la función va **trasladada completa**: $f(t-a)\\,\\mathscr U(t-a)$.", "Inversas con cuadráticos: $(s+a)^2+k^2$; separa el numerador en $(s+a)$ + resto, y divide el resto por $k$.", "Si ves $e^{-as}F(s)$ al invertir, el resultado lleva $\\mathscr U(t-a)$."], "formulas": [{"tex": "\\mathcal L\\{e^{at}f(t)\\}=F(s-a)", "nota": "primer teorema"}, {"tex": "\\mathcal L\\{f(t-a)\\mathscr U(t-a)\\}=e^{-as}F(s)", "nota": "segundo teorema"}, {"tex": "\\mathcal L^{-1}\\Big\\{\\dfrac{s+a}{(s+a)^2+k^2}\\Big\\}=e^{-at}\\cos kt,\\ \\mathcal L^{-1}\\Big\\{\\dfrac{k}{(s+a)^2+k^2}\\Big\\}=e^{-at}\\operatorname{sen}kt", "nota": "completar cuadrados"}], "ojo": ["Signo del corrimiento: $e^{-2t}\\to s+2$.", "$\\mathcal L\\{t\\,\\mathscr U(t-1)\\}\\neq\\frac{e^{-s}}{s^2}$: antes reescribe $t=(t-1)+1$."]}, {"tema": "t5", "ideas": ["$\\mathscr U(t-a)$ vale $0$ antes de $a$ y $1$ desde $a$ (la pauta de la Prueba 2 la llama $H$).", "Regla del salto: $f=f_1+(f_2-f_1)\\,\\mathscr U(t-a)$; una ventana en $[a,b[$ es $\\mathscr U(t-a)-\\mathscr U(t-b)$.", "Para transformar $g(t)\\,\\mathscr U(t-a)$, reescribe $g(t)$ en función de $t-a$ y aplica el segundo teorema.", "Con $e^{-as}$ al invertir, siempre escribe el $\\mathscr U(t-a)$ (antes de $a$ la función vale $0$)."], "formulas": [{"tex": "\\mathcal L\\{\\mathscr U(t-a)\\}=\\dfrac{e^{-as}}{s}", "nota": "escalón"}, {"tex": "k\\,[\\mathscr U(t-a)-\\mathscr U(t-b)]\\ \\longmapsto\\ \\dfrac{k\\,(e^{-as}-e^{-bs})}{s}", "nota": "pulso"}, {"tex": "\\mathcal L\\{t\\,\\mathscr U(t-a)\\}=e^{-as}\\Big(\\dfrac1{s^2}+\\dfrac as\\Big)", "nota": "rampa retrasada"}], "ojo": ["El pulso es una **resta**; el escalón debe encenderse en el salto, no en $0$."]}, {"tema": "t6", "ideas": ["Método: (1) lado derecho con escalones, (2) transformar, (3) reemplazar $y(0)$, $y'(0)$ y despejar $Y(s)$, (4) fracciones parciales, (5) invertir (con $e^{-as}$: segundo teorema).", "Las condiciones iniciales entran solas: no hay constantes que buscar al final.", "Coeficientes con $t$: $\\mathcal L\\{t\\,y\\}=-Y'$ lleva a una EDO de primer orden en $Y(s)$.", "Integrales $\\int_0^ty(\\tau)k(t-\\tau)d\\tau$ son convoluciones: $\\mathcal L=Y\\cdot K$. Si es solo $\\int_0^ty$, es $\\frac Ys$."], "formulas": [{"tex": "\\mathcal L\\{y'\\}=sY-y(0),\\quad\\mathcal L\\{y''\\}=s^2Y-s\\,y(0)-y'(0)", "nota": "derivadas"}, {"tex": "(f*g)(t)=\\int_0^tf(\\tau)g(t-\\tau)d\\tau,\\quad\\mathcal L\\{f*g\\}=F\\cdot G", "nota": "convolución"}], "ojo": ["El término $s\\,y(0)$ en $\\mathcal L\\{y''\\}$: es $s^2Y-s\\,y(0)-y'(0)$, no $s^2Y-y(0)-y'(0)$.", "Si $Y$ lleva $e^{-as}$, hay que trasladar $t\\to t-a$ y escribir $\\mathscr U(t-a)$."]}], "temas": [{"id": "t1", "titulo": "Series de Fourier", "peso": 3, "intro": "Una función definida en $]-p,p[$ (o periódica) se escribe como una suma infinita de senos y cosenos. Todo el trabajo consiste en calcular tres cosas: $a_0$, $a_n$ y $b_n$, y la paridad de $f$ te ahorra la mitad de las integrales.", "bloques": [{"tipo": "texto", "titulo": "La idea", "md": "En Cálculo vimos que una función infinitamente derivable se escribe como serie de Taylor (potencias de $x$). Una función con saltos o esquinas no se deja, pero sí se puede armar con **ondas**: una constante, más $\\cos\\frac{n\\pi x}{p}$ y $\\operatorname{sen}\\frac{n\\pi x}{p}$ (los *armónicos*, de período $\\frac{2p}{n}$). Cada coeficiente mide **cuánto de esa frecuencia** hay en $f$, igual que descomponer un sonido en notas."}, {"tipo": "definicion", "etiqueta": "Definición", "nombre": "Serie de Fourier", "md": "La serie de Fourier de una función $f$ definida en $]-p,p[$ es la serie trigonométrica de la fórmula siguiente, con $a_0$, $a_n$ y $b_n$ dados por las tres integrales de más abajo, para $n=1,2,3,\\dots$"}, {"tipo": "formula", "tex": "f(x)\\sim\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}\\Big(a_n\\cos\\frac{n\\pi x}{p}+b_n\\operatorname{sen}\\frac{n\\pi x}{p}\\Big)", "nota": "Se usa \"$\\sim$\" porque la serie no siempre vale lo mismo que $f$ en cada punto (ver §2)."}, {"tipo": "formula", "tex": "\\begin{aligned}a_0&=\\frac1p\\int_{-p}^{p}f(x)\\,dx\\\\[4pt] a_n&=\\frac1p\\int_{-p}^{p}f(x)\\cos\\frac{n\\pi x}{p}\\,dx\\\\[4pt] b_n&=\\frac1p\\int_{-p}^{p}f(x)\\operatorname{sen}\\frac{n\\pi x}{p}\\,dx\\end{aligned}", "nota": "**Los dos \"medios\":** en la serie va $\\frac{a_0}{2}$, pero la integral de $a_0$ lleva $\\frac1p$ (no $\\frac2p$). Así $\\frac{a_0}{2}$ es simplemente el **promedio** de $f$ en el intervalo."}, {"tipo": "lapiz", "texto": "a₀/2 en la serie · 1/p en la integral · frecuencia nπx/p (no nx)"}, {"tipo": "texto", "titulo": "Paridad: la mitad del trabajo", "md": "Antes de integrar, pregúntate si $f$ es par ($f(-x)=f(x)$) o impar ($f(-x)=-f(x)$). Una integral de una función impar en un intervalo simétrico vale $0$, y la de una par se duplica: $\\int_{-p}^{p}=2\\int_0^p$. Recuerda que par·par = par, impar·impar = par y par·impar = impar. Como $\\cos$ es par y $\\operatorname{sen}$ es impar, en una $f$ **par** desaparecen los $b_n$, y en una **impar** desaparecen $a_0$ y los $a_n$."}, {"tipo": "tabla", "columnas": ["Si $f$ es…", "Se anula", "Serie", "Coeficientes"], "filas": [["**par**", "$b_n=0$", "solo cosenos", "$a_0=\\frac2p\\int_0^pf\\,dx,\\quad a_n=\\frac2p\\int_0^pf\\cos\\frac{n\\pi x}{p}\\,dx$"], ["**impar**", "$a_0=a_n=0$", "solo senos", "$b_n=\\frac2p\\int_0^pf\\operatorname{sen}\\frac{n\\pi x}{p}\\,dx$"], ["ni una ni otra", "nada", "completa", "las tres integrales en $]-p,p[$"]]}, {"tipo": "gadget", "id": "g_paridad", "titulo": "¿Par, impar o ninguna?", "instrucciones": "Clasifica la función antes de ver la respuesta. El gadget lo comprueba numéricamente y te dice qué coeficientes se anulan."}, {"tipo": "ejemplo", "titulo": "Serie de $f$ con dos tramos (Clase)", "enunciado": "Determine la serie de Fourier de $$f(x)=\\begin{cases}0&-\\pi<x<0\\\\ \\pi-x&0\\le x<\\pi\\end{cases}$$", "pasos": [{"titulo": "Datos.", "md": "$p=\\pi$. No es par ni impar, así que se calculan los tres coeficientes. Como $f=0$ en $]-\\pi,0[$, todas las integrales quedan en $[0,\\pi]$."}, {"titulo": "Coeficiente $a_0$.", "md": "$$a_0=\\frac1\\pi\\int_0^\\pi(\\pi-x)\\,dx=\\frac1\\pi\\Big[\\pi x-\\frac{x^2}{2}\\Big]_0^\\pi=\\frac1\\pi\\cdot\\frac{\\pi^2}{2}=\\frac\\pi2$$"}, {"titulo": "Coeficiente $a_n$ (por partes, $u=pi-x$).", "md": "$$a_n=\\frac1\\pi\\Big[(\\pi-x)\\frac{\\operatorname{sen}nx}{n}\\Big]_0^\\pi+\\frac{1}{n\\pi}\\int_0^\\pi\\operatorname{sen}nx\\,dx=0+\\frac{1-\\cos n\\pi}{n^2\\pi}=\\frac{1-(-1)^n}{\\pi n^2}$$ (el primer corchete vale $0$ en ambos extremos porque $\\operatorname{sen}n\\pi=\\operatorname{sen}0=0$)."}, {"titulo": "Coeficiente $b_n$ (por partes).", "md": "$$b_n=\\frac1\\pi\\Big[-(\\pi-x)\\frac{\\cos nx}{n}\\Big]_0^\\pi-\\frac{1}{n\\pi}\\int_0^\\pi\\cos nx\\,dx=\\frac1\\pi\\cdot\\frac{\\pi}{n}-0=\\frac1n$$"}, {"titulo": "Armar la serie.", "md": "Con $\\frac{a_0}{2}=\\frac\\pi4$."}], "respuesta": "$$f(x)\\sim\\frac{\\pi}{4}+\\sum_{n=1}^{\\infty}\\Big[\\frac{1-(-1)^n}{\\pi n^2}\\cos nx+\\frac1n\\operatorname{sen}nx\\Big]$$ Como $1-(-1)^n$ vale $2$ si $n$ es impar y $0$ si es par, los cosenos solo aparecen en $n$ impar.", "lapiz": "evaluar cos nπ = (−1)ⁿ y sen nπ = 0 antes de dejarlo"}, {"tipo": "ejemplo", "titulo": "Función impar: solo senos (Clase)", "enunciado": "Determine la serie de Fourier de $f(x)=x$ en $]-2,2[$.", "pasos": [{"titulo": "Paridad.", "md": "$f(x)=x$ es **impar**, entonces $a_0=a_n=0$ y solo hay senos. Aquí $p=2$."}, {"titulo": "Coeficiente $b_n$.", "md": "$$b_n=\\frac22\\int_0^2x\\operatorname{sen}\\frac{n\\pi x}{2}\\,dx=\\Big[-\\frac{x\\cos\\frac{n\\pi x}{2}}{n\\pi/2}\\Big]_0^2+\\frac{2}{n\\pi}\\int_0^2\\cos\\frac{n\\pi x}{2}\\,dx=-\\frac{4\\cos n\\pi}{n\\pi}+0$$"}], "respuesta": "$$x\\sim\\sum_{n=1}^{\\infty}\\frac{4(-1)^{n+1}}{n\\pi}\\operatorname{sen}\\frac{n\\pi x}{2}$$"}, {"tipo": "gadget", "id": "g_fourier_sumas", "titulo": "Sumas parciales: cómo se arma la función", "instrucciones": "Elige una función y sube $N$. Mira cómo la suma de pocos armónicos ya se parece a $f$, qué pasa en los saltos y cómo la serie repite $f$ fuera de $]-p,p[$.", "figura": "Línea fina: f con su extensión periódica. Curva: suma parcial S_N. Puntos: valor al que converge la serie en cada salto."}, {"tipo": "texto", "titulo": "Desarrollos en semi-intervalo", "md": "A veces $f$ solo está definida en $]0,L[$. Como la serie necesita un intervalo simétrico, **tú decides** qué valores tomar en $]-L,0[$ (tres formas típicas):\n- **Extensión par** (reflejar respecto al eje $y$): $f$ queda par, la serie es de **cosenos**.\n- **Extensión impar** (reflejar respecto al origen): $f$ queda impar, la serie es de **senos**.\n- **Período $L$** (definir $f(x)$ en $]-L,0[$ como $f(x+L)$): serie **completa**; como la función repite cada $L$, solo aparecen los armónicos $n$ pares."}, {"tipo": "formula", "tex": "\\text{cosenos: }a_0=\\frac2L\\int_0^Lf,\\ \\ a_n=\\frac2L\\int_0^Lf\\cos\\frac{n\\pi x}{L}\\,dx\\qquad\\text{senos: }b_n=\\frac2L\\int_0^Lf\\operatorname{sen}\\frac{n\\pi x}{L}\\,dx", "nota": "La serie de cosenos lleva $\\frac{a_0}{2}+\\sum a_n\\cos\\frac{n\\pi x}{L}$; la de senos, $\\sum b_n\\operatorname{sen}\\frac{n\\pi x}{L}$. Las dos representan a $f$ en $]0,L[$, pero se comportan distinto en los extremos."}, {"tipo": "ejemplo", "titulo": "$f(x)=x^2$ en $]0,\\pi[$ (Clase)", "enunciado": "Desarrolle $f(x)=x^2$, definida en $]0,\\pi[$, (1) en serie de cosenos, (2) en serie de senos y (3) en serie de Fourier (extensión $f(x+\\pi)$ en $]-\\pi,0[$).", "pasos": [{"titulo": "(1) Cosenos ($L=\\pi$).", "md": "$a_0=\\frac2\\pi\\int_0^\\pi x^2dx=\\frac{2\\pi^2}{3}$. Para $a_n$, dos veces por partes: $\\int x^2\\cos nx\\,dx=\\frac{x^2\\operatorname{sen}nx}{n}+\\frac{2x\\cos nx}{n^2}-\\frac{2\\operatorname{sen}nx}{n^3}$, que evaluada en $[0,\\pi]$ da $\\frac{2\\pi(-1)^n}{n^2}$. Entonces $$a_n=\\frac2\\pi\\cdot\\frac{2\\pi(-1)^n}{n^2}=\\frac{4(-1)^n}{n^2}.$$"}, {"titulo": "(2) Senos.", "md": "$\\int x^2\\operatorname{sen}nx\\,dx=-\\frac{x^2\\cos nx}{n}+\\frac{2x\\operatorname{sen}nx}{n^2}+\\frac{2\\cos nx}{n^3}$; entre $0$ y $\\pi$ vale $\\frac{\\pi^2(-1)^{n+1}}{n}+\\frac{2((-1)^n-1)}{n^3}$. Multiplicando por $\\frac2\\pi$: $$b_n=\\frac{2\\pi(-1)^{n+1}}{n}+\\frac{4((-1)^n-1)}{\\pi n^3}.$$"}, {"titulo": "(3) Serie de Fourier.", "md": "Con $f(x+\\pi)$ en $]-\\pi,0[$ la función repite cada $\\pi$ (es $x^2$ en cada $]k\\pi,(k+1)\\pi[$). Integrando en $]-\\pi,\\pi[$ con $p=\\pi$, los coeficientes de índice impar se cancelan y los pares son $a_{2k}=\\frac{1}{k^2}$, $b_{2k}=-\\frac{\\pi}{k}$, con $\\frac{a_0}{2}=\\frac{\\pi^2}{3}$."}], "respuesta": "$$\\text{(1) } x^2\\sim\\frac{\\pi^2}{3}+\\sum_{n=1}^{\\infty}\\frac{4(-1)^n}{n^2}\\cos nx$$ $$\\text{(2) } x^2\\sim\\sum_{n=1}^{\\infty}\\Big[\\frac{2\\pi(-1)^{n+1}}{n}+\\frac{4((-1)^n-1)}{\\pi n^3}\\Big]\\operatorname{sen}nx$$ $$\\text{(3) } f\\sim\\frac{\\pi^2}{3}+\\sum_{k=1}^{\\infty}\\Big[\\frac{\\cos2kx}{k^2}-\\frac{\\pi}{k}\\operatorname{sen}2kx\\Big]$$", "lapiz": "dos partes seguidas: u = x², luego u = x"}, {"tipo": "gadget", "id": "g_medio_rango", "titulo": "Tres extensiones de la misma función", "instrucciones": "Elige $f$ en $]0,L[$ y una extensión. Compara qué pasa en $x=0$ y en $x=L$: la extensión par de $x^2$ es continua (convergencia rápida), la impar tiene un salto en $L$ y aparece Gibbs."}, {"tipo": "texto", "titulo": "Aplicación: fuerza periódica sobre un resorte", "md": "Si una masa–resorte sin roce es empujada por una fuerza periódica $f(t)$, se desarrolla $f$ en serie de Fourier y se busca una solución particular de la misma forma: **un armónico de la fuerza produce un armónico de la respuesta**, y el coeficiente se obtiene igualando términos (como en coeficientes indeterminados, pero con infinitos términos)."}, {"tipo": "ejemplo", "titulo": "Masa–resorte forzada (Clase)", "enunciado": "Un sistema masa–resorte sin amortiguamiento, con $m=\\frac1{16}$ slug y $k=4$ lb/pie, es impulsado por una fuerza $f(t)$ de período $2$ que en $]-1,1[$ es $f(t)=t$ (extensión impar). Determine una solución particular.", "pasos": [{"titulo": "Plantear.", "md": "$$\\frac1{16}x''+4x=f(t)$$"}, {"titulo": "Serie de $f$.", "md": "Es impar con $p=1$: $b_n=2\\int_0^1t\\operatorname{sen}(n\\pi t)\\,dt=\\dfrac{2(-1)^{n+1}}{n\\pi}$, o sea $f(t)=\\sum\\dfrac{2(-1)^{n+1}}{n\\pi}\\operatorname{sen}n\\pi t$."}, {"titulo": "Proponer $x_p=\\sum B_n\\operatorname{sen}n\\pi t$.", "md": "Derivando dos veces, $x_p''=-\\sum n^2\\pi^2B_n\\operatorname{sen}n\\pi t$. Al reemplazar e igualar coeficientes de $\\operatorname{sen}n\\pi t$: $$\\Big(4-\\frac{n^2\\pi^2}{16}\\Big)B_n=\\frac{2(-1)^{n+1}}{n\\pi}\\ \\Rightarrow\\ B_n=\\frac{32(-1)^{n+1}}{n\\pi\\,(64-n^2\\pi^2)}$$"}], "respuesta": "$$x_p(t)=\\sum_{n=1}^{\\infty}\\frac{32(-1)^{n+1}}{n\\pi\\,(64-n^2\\pi^2)}\\operatorname{sen}n\\pi t$$ El denominador nunca se anula ($n\\pi=8$ no tiene solución entera), así que no hay resonancia.", "lapiz": "si f no es impar, hay cosenos: Bₙ y Aₙ por separado"}, {"tipo": "nota", "md": "El gráfico del ppt de clase muestra una sierra con amplitud $\\pi$ (es decir $f(t)=\\pi t$), pero el cálculo de la diapositiva usa $f(t)=t$. Con $f(t)=\\pi t$ cada $b_n$ y cada $B_n$ se multiplican por $\\pi$. Si te lo preguntan, mira cuál es la $f$ del enunciado."}, {"tipo": "gadget", "id": "g_resonancia_fourier", "titulo": "Resonancia con una fuerza periódica", "instrucciones": "Mueve $k$ y mira el espectro $|B_n|$ y la respuesta $x_p(t)$. Cuando $\\omega_0=\\sqrt{k/m}$ se acerca a un $n\\pi$, ese armónico domina; con $k=4$ no hay resonancia."}, {"tipo": "ojo", "items": ["Poner $a_0$ en lugar de $\\frac{a_0}{2}$ en la serie (o usar $\\frac2p$ en la integral de $a_0$ de la serie completa).", "Usar $\\cos nx$ cuando $p\\ne\\pi$: la frecuencia es $\\frac{n\\pi x}{p}$ (con $p=2$ es $\\cos\\frac{n\\pi x}{2}$).", "No aprovechar la paridad y calcular $\\int_{-p}^{p}$ completo para obtener coeficientes que eran $0$.", "Olvidar que, con $n$ entero, $\\cos n\\pi=(-1)^n$ y $\\operatorname{sen}n\\pi=0$. Al evaluar, simplifica siempre.", "En semi-intervalos, elegir la extensión equivocada: par $\\Rightarrow$ cosenos, impar $\\Rightarrow$ senos.", "Cometer errores de signo en la integración por partes: la pista es el resultado con $(-1)^n$, no con $(-1)^{n+1}$ ni al revés."]}]}, {"id": "t2", "titulo": "Teorema de convergencia de Fourier", "peso": 2, "intro": "La serie de Fourier no siempre vale lo mismo que $f$: el teorema dice **a qué número** converge en cada punto. Es una pregunta típica y barata de puntos si te sabes la regla: donde $f$ es continua converge a $f(x)$; en un salto, al **promedio** de los límites laterales.", "bloques": [{"tipo": "definicion", "etiqueta": "Teorema", "nombre": "Convergencia de la serie de Fourier", "md": "Sean $f$ y $f'$ continuas por tramos en $]-p,p[$ (continuas salvo en un número finito de puntos, y ahí solo con discontinuidades de salto). Entonces la serie de Fourier de $f$ converge a $f(x)$ en cada punto de continuidad, y en cada punto de discontinuidad converge al promedio $\\dfrac{f(x^+)+f(x^-)}{2}$, donde $f(x^+)$ y $f(x^-)$ son los límites de $f$ en $x$ por la derecha y por la izquierda."}, {"tipo": "formula", "tex": "S(x)=\\begin{cases}f(x)&\\text{si } f \\text{ es continua en } x\\\\[6pt] \\dfrac{f(x^+)+f(x^-)}{2}&\\text{si } f \\text{ tiene un salto en } x\\end{cases}", "nota": "$S(x)$ es la suma de la serie. En un salto el valor de $f(x)$ ni siquiera importa: la serie toma el punto medio del salto."}, {"tipo": "texto", "titulo": "La serie representa la extensión periódica", "md": "Aunque $f$ solo esté definida en $]-p,p[$, la serie es periódica de período $2p$: **fuera** del intervalo base representa la *extensión periódica* de $f$. Para evaluar la serie en un $x_0$ cualquiera:\n1. Lleva $x_0$ al intervalo $]-p,p[$ sumando o restando múltiplos de $2p$.\n2. Mira ahí si $f$ es continua o si hay un salto.\n3. Aplica la regla: $f(x_0)$ o el promedio."}, {"tipo": "texto", "titulo": "El caso trampa: los extremos $x=\\pm p$", "md": "En $x=\\pm p$ la extensión periódica pega el **final** de un período con el **principio** del siguiente. La serie converge a $$\\frac{f(p^-)+f(-p^+)}{2}$$ (y lo mismo en $\\pm3p,\\pm5p,\\dots$). Es el error más común: creer que en $x=p$ la serie vale $f(p)$. Ojo: si $f(p^-)=f(-p^+)$ no hay salto en el empalme y el valor es simplemente ese número."}, {"tipo": "lapiz", "texto": "extremos ±p → promedio de f(p⁻) y f(−p⁺)"}, {"tipo": "gadget", "id": "g_converge_punto", "titulo": "¿A qué converge en $x_0$?", "instrucciones": "Mira el gráfico de la extensión periódica, ubica $x_0$ y escribe el valor (puedes escribir pi/2, por ejemplo). Se revisa solo y explica por qué."}, {"tipo": "gadget", "id": "g_serie_en_punto", "titulo": "Las sumas parciales caminan hacia el promedio", "instrucciones": "Fija un punto $x_0$ y mira $S_N(x_0)$ al aumentar $N$. En un punto de continuidad tiende a $f(x_0)$; en un salto tiende al promedio, línea punteada."}, {"tipo": "ejemplo", "titulo": "Valores de convergencia (Clase)", "enunciado": "Para $f(x)=\\begin{cases}0&-\\pi<x<0\\\\ \\pi-x&0\\le x<\\pi\\end{cases}$, indique a qué converge su serie de Fourier en $x=0,\\ \\frac\\pi2,\\ \\pi,\\ \\frac{3\\pi}{2},\\ 2\\pi$.", "pasos": [{"titulo": "Extensión periódica.", "md": "Período $2\\pi$. Los límites laterales en el empalme son $f(\\pi^-)=\\pi-\\pi=0$ y $f(-\\pi^+)=0$."}, {"titulo": "$x=0$.", "md": "Salto: $f(0^-)=0$, $f(0^+)=\\pi$. Promedio $\\frac{0+\\pi}{2}=\\frac\\pi2$."}, {"titulo": "$x=\\frac\\pi2$.", "md": "$f$ es continua ahí: converge a $f(\\frac\\pi2)=\\pi-\\frac\\pi2=\\frac\\pi2$."}, {"titulo": "$x=\\pi$.", "md": "Extremo: $\\frac{f(\\pi^-)+f(-\\pi^+)}{2}=\\frac{0+0}{2}=0$ (no hay salto en el empalme, y **no** vale $f(\\pi)$)."}, {"titulo": "$x=\\frac{3\\pi}{2}$ y $x=2\\pi$.", "md": "$\\frac{3\\pi}{2}-2\\pi=-\\frac\\pi2$, donde $f=0$ y es continua. $2\\pi-2\\pi=0$: el mismo salto de $x=0$."}], "respuesta": "$$S(0)=\\tfrac\\pi2,\\quad S(\\tfrac\\pi2)=\\tfrac\\pi2,\\quad S(\\pi)=0,\\quad S(\\tfrac{3\\pi}{2})=0,\\quad S(2\\pi)=\\tfrac\\pi2$$"}, {"tipo": "texto", "titulo": "Truco: sumar series numéricas", "md": "Muchas preguntas piden \"usar la serie para probar que $\\pi/4=1-\\frac13+\\frac15-\\cdots$\". El procedimiento es siempre el mismo:\n1. Encuentra la serie de Fourier de $f$.\n2. Elige un $x_0$ que simplifique las ondas ($\\operatorname{sen}\\frac{n\\pi}{2}$, $\\cos n\\pi=(-1)^n$, $\\operatorname{sen}n\\pi=0$, …).\n3. Usa el **teorema** para saber cuánto vale la suma en $x_0$ (¡revisa si es salto!).\n4. Iguala ambos lados y despeja la suma numérica."}, {"tipo": "ejemplo", "titulo": "Serie de Leibniz para $\\pi/4$ (Clase y Guía 5 n°8)", "enunciado": "Encuentre la serie de Fourier de $f(x)=x+\\pi$ en $]-\\pi,\\pi[$ y úsela para probar que $\\dfrac\\pi4=1-\\dfrac13+\\dfrac15-\\dfrac17+\\cdots$", "pasos": [{"titulo": "Serie de $f$.", "md": "$x+\\pi$ = (impar) + (constante). $a_0=\\frac1\\pi\\int_{-\\pi}^{\\pi}(x+\\pi)dx=2\\pi$ y $a_n=0$. Para $b_n$: $$b_n=\\frac2\\pi\\int_0^\\pi x\\operatorname{sen}nx\\,dx=\\frac2\\pi\\Big[-\\frac{x\\cos nx}{n}\\Big]_0^\\pi=\\frac{2(-1)^{n+1}}{n}$$ Entonces $\\;x+\\pi\\sim\\pi+\\displaystyle\\sum_{n=1}^\\infty\\frac{2(-1)^{n+1}}{n}\\operatorname{sen}nx$."}, {"titulo": "Elegir $x_0=\\frac\\pi2$.", "md": "$f$ es continua en $\\frac\\pi2$ y la serie converge a $f(\\frac\\pi2)=\\frac{3\\pi}{2}$. Además $\\operatorname{sen}\\frac{n\\pi}{2}$ vale $1,0,-1,0,1,0,\\dots$ para $n=1,2,3,\\dots$ así que $\\frac{(-1)^{n+1}}{n}\\operatorname{sen}\\frac{n\\pi}{2}$ da $1,\\ -\\frac13,\\ \\frac15,\\ -\\frac17,\\dots$"}, {"titulo": "Igualar y despejar.", "md": "$$\\frac{3\\pi}{2}=\\pi+2\\Big(1-\\frac13+\\frac15-\\cdots\\Big)\\ \\Rightarrow\\ \\frac\\pi2=2\\Big(1-\\frac13+\\frac15-\\cdots\\Big)$$"}], "respuesta": "$$\\frac\\pi4=1-\\frac13+\\frac15-\\frac17+\\cdots$$"}, {"tipo": "nota", "md": "La respuesta impresa de la Guía 5 n°8 trae $\\frac{(-1)^n}{n}$ en lugar de $\\frac{(-1)^{n+1}}{n}$. Compruébalo: con $(-1)^n$ la serie valdría $\\frac\\pi2$ en $x=\\frac\\pi2$, pero $f(\\frac\\pi2)=\\frac{3\\pi}{2}$. Usa el signo $(-1)^{n+1}$."}, {"tipo": "ejemplo", "titulo": "Suma de $1/n^2$ (Guía 5 n°7)", "enunciado": "Sea $f(x)=\\begin{cases}0&-\\pi\\le x<0\\\\ x^2&0\\le x\\le\\pi\\end{cases}$. Encuentre su serie de Fourier y pruebe que $\\dfrac{\\pi^2}{6}=1+\\dfrac1{2^2}+\\dfrac1{3^2}+\\cdots$", "pasos": [{"titulo": "Coeficientes.", "md": "$a_0=\\frac1\\pi\\int_0^\\pi x^2dx=\\frac{\\pi^2}{3}$, $\\;a_n=\\frac1\\pi\\int_0^\\pi x^2\\cos nx\\,dx=\\frac{2(-1)^n}{n^2}$ y $b_n=\\frac{(-1)^{n+1}\\pi}{n}+\\frac{2\\left((-1)^n-1\\right)}{\\pi n^3}$. Entonces $$f\\sim\\frac{\\pi^2}{6}+\\sum_{n=1}^\\infty\\Big[\\frac{2(-1)^n}{n^2}\\cos nx+b_n\\operatorname{sen}nx\\Big]$$"}, {"titulo": "Elegir $x_0=\\pi$ (¡un extremo!).", "md": "Valor del teorema: $\\frac{f(\\pi^-)+f(-\\pi^+)}{2}=\\frac{\\pi^2+0}{2}=\\frac{\\pi^2}{2}$ (aquí **sí hay salto** en el empalme). En la serie, $\\cos n\\pi=(-1)^n$ y $\\operatorname{sen}n\\pi=0$, así que desaparecen los $b_n$."}, {"titulo": "Igualar y despejar.", "md": "$$\\frac{\\pi^2}{2}=\\frac{\\pi^2}{6}+\\sum_{n=1}^\\infty\\frac{2(-1)^n(-1)^n}{n^2}=\\frac{\\pi^2}{6}+2\\sum_{n=1}^\\infty\\frac1{n^2}\\ \\Rightarrow\\ \\sum_{n=1}^\\infty\\frac1{n^2}=\\frac{\\pi^2}{6}$$"}], "respuesta": "$$\\frac{\\pi^2}{6}=1+\\frac1{2^2}+\\frac1{3^2}+\\frac1{4^2}+\\cdots$$", "lapiz": "en x = π: el valor es (π² + 0)/2, no f(π) = π²"}, {"tipo": "nota", "md": "En la Guía 5 n°7 la respuesta impresa de $b_n$ trae $\\frac{2(-1)^{n+1}\\pi}{n}$; el cálculo da $\\frac{(-1)^{n+1}\\pi}{n}$ (sin el 2). No afecta el truco porque $\\operatorname{sen}n\\pi=0$, pero no lo copies sin verificar."}, {"tipo": "ojo", "items": ["En un salto, creer que la serie converge a $f(x_0)$ o a uno de los dos lados: converge al **promedio**.", "En $x=\\pm p$ usar $f(p)$ en lugar de $\\frac{f(p^-)+f(-p^+)}{2}$.", "Evaluar fuera de $]-p,p[$ sin reducir primero con la periodicidad ($x_0=\\frac{3\\pi}{2}$ equivale a $-\\frac\\pi2$ si $p=\\pi$).", "Olvidar las condiciones del teorema: $f$ **y** $f'$ continuas por tramos.", "Para sumar series numéricas, no verificar si $x_0$ es continuidad o salto antes de igualar.", "Pensar que Gibbs cambia el valor de convergencia: las sumas parciales se pasan cerca del salto (≈ 9 % del salto), pero el límite sigue siendo el promedio."]}]}, {"id": "t3", "titulo": "Transformada de Laplace", "peso": 3, "intro": "La transformada de Laplace convierte una función de $t$ en una función de $s$. Su gracia: **derivar se vuelve multiplicar por $s$**, así que una EDO lineal con condiciones iniciales se transforma en una ecuación algebraica. Para usarla bien necesitas tres cosas: la tabla, las propiedades y saber invertir con fracciones parciales.", "bloques": [{"tipo": "definicion", "etiqueta": "Definición", "nombre": "Transformada de Laplace", "md": "Si $f$ está definida para $t\\ge0$, su transformada de Laplace es la función $F(s)=\\mathcal L\\{f(t)\\}$ dada por la integral impropia de abajo, para los valores de $s$ en que converge."}, {"tipo": "formula", "tex": "\\mathcal L\\{f(t)\\}=F(s)=\\int_0^{\\infty}e^{-st}f(t)\\,dt=\\lim_{b\\to\\infty}\\int_0^{b}e^{-st}f(t)\\,dt", "nota": "Existe (para $s$ grande) si $f$ es **continua por tramos** en $[0,\\infty[$ y de **orden exponencial**: $|f(t)|\\le Me^{ct}$. Entonces $F(s)\\to0$ cuando $s\\to\\infty$."}, {"tipo": "lapiz", "texto": "integral impropia → escribir el límite (4 pts en la pauta)"}, {"tipo": "gadget", "id": "g_dominio_laplace", "titulo": "¿Para qué $s$ converge la integral?", "instrucciones": "Con $f(t)=e^{at}$, mueve $a$ y $s$: el integrando es $e^{-(s-a)t}$. Mira cuándo el área bajo la curva es finita."}, {"tipo": "tabla", "titulo": "Transformadas básicas", "columnas": ["$f(t)$", "$F(s)=\\mathcal L\\{f\\}$", "Válida para"], "filas": [["$1$", "$\\dfrac1s$", "$s>0$"], ["$t^n,\\ n=0,1,2,\\dots$", "$\\dfrac{n!}{s^{n+1}}$", "$s>0$"], ["$e^{at}$", "$\\dfrac1{s-a}$", "$s>a$"], ["$\\operatorname{sen}at$", "$\\dfrac{a}{s^2+a^2}$", "$s>0$"], ["$\\cos at$", "$\\dfrac{s}{s^2+a^2}$", "$s>0$"], ["$\\operatorname{senh}at$", "$\\dfrac{a}{s^2-a^2}$", "$s>|a|$"], ["$\\cosh at$", "$\\dfrac{s}{s^2-a^2}$", "$s>|a|$"]]}, {"tipo": "nota", "md": "En la pauta de la Prueba 2 venía la tabla con $t^n$, $e^{at}$, $\\cos at$ y $\\operatorname{sen}at$ (más $\\mathcal L\\{1\\}$). $\\cosh$ y $\\operatorname{senh}$ salen de $\\frac{e^{at}\\pm e^{-at}}{2}$ por linealidad; no hace falta memorizarlas."}, {"tipo": "tabla", "titulo": "Propiedades que usarás todo el tiempo", "columnas": ["Propiedad", "Fórmula", "Ejemplo"], "filas": [["Linealidad", "$\\mathcal L\\{\\alpha f+\\beta g\\}=\\alpha F+\\beta G$", "$\\mathcal L\\{4e^{3t}-6e^{-4t}\\}=\\frac{4}{s-3}-\\frac{6}{s+4}$"], ["Escalamiento ($a>0$)", "$\\mathcal L\\{f(at)\\}=\\frac1aF\\big(\\frac sa\\big)$", "$\\mathcal L\\{\\operatorname{sen}3t\\}=\\frac13\\cdot\\frac{1}{(s/3)^2+1}=\\frac{3}{s^2+9}$"], ["Multiplicar por $t$", "$\\mathcal L\\{t\\,f(t)\\}=-F'(s)$", "$\\mathcal L\\{t\\operatorname{sen}t\\}=-\\frac{d}{ds}\\frac{1}{s^2+1}=\\frac{2s}{(s^2+1)^2}$"], ["Integral", "$\\mathcal L\\big\\{\\int_0^tf(\\tau)d\\tau\\big\\}=\\frac{F(s)}{s}$", "$\\mathcal L\\big\\{\\int_0^te^\\tau d\\tau\\big\\}=\\frac{1}{s(s-1)}$"], ["Dividir por $t$", "$\\mathcal L\\big\\{\\frac{f(t)}{t}\\big\\}=\\int_s^\\infty F(u)\\,du$", "$\\mathcal L\\big\\{\\frac{\\operatorname{sen}t}{t}\\big\\}=\\arctan\\frac1s$"]]}, {"tipo": "nota", "md": "La transformada del **producto** $f\\cdot g$ no es $F\\cdot G$ (eso corresponde a la convolución, §6). Y $\\mathcal L\\{\\operatorname{sen}^2at\\}$ **no** es $\\big(\\frac{a}{s^2+a^2}\\big)^2$: se baja el cuadrado con $\\operatorname{sen}^2at=\\frac{1-\\cos2at}{2}$."}, {"tipo": "texto", "titulo": "Transformada inversa: fracciones parciales", "md": "Invertir es llevar $F(s)$ a una suma de formas de la tabla y usar linealidad: (1) factoriza el denominador, (2) descompón en fracciones parciales, (3) invierte término a término. Si el denominador tiene un cuadrático sin raíces reales, se completa el cuadrado y se usa la traslación (§4)."}, {"tipo": "tabla", "columnas": ["Factor del denominador", "Qué fracciones escribir"], "filas": [["$(s-a)$ (lineal, no repetido)", "$\\dfrac{A}{s-a}$"], ["$(s-a)^2$ (repetido)", "$\\dfrac{A}{s-a}+\\dfrac{B}{(s-a)^2}$"], ["$s^2+bs+c$ (sin raíces reales)", "$\\dfrac{As+B}{s^2+bs+c}$"]]}, {"tipo": "lapiz", "texto": "1/s³ → t²/2 (no t²): dividir por n!"}, {"tipo": "gadget", "id": "g_inversa_fracciones", "titulo": "Practica fracciones parciales", "instrucciones": "El primer ejercicio es la pregunta 3c de la Prueba 2. Calcula $A$ y $B$ en tu hoja, escríbelos y revisa; luego genera ejercicios nuevos, incluso con factor repetido."}, {"tipo": "ejemplo", "titulo": "Por definición (Guía 4 n°5)", "enunciado": "Determine la transformada de Laplace de $f(t)=\\begin{cases}\\operatorname{sen}t&0\\le t<\\pi\\\\ 0&t\\ge\\pi\\end{cases}$", "pasos": [{"titulo": "Escribir la definición.", "md": "$f$ es $0$ para $t\\ge\\pi$, así que solo sobrevive el primer tramo: $$F(s)=\\int_0^\\pi e^{-st}\\operatorname{sen}t\\,dt$$ (una integral propia, no hay límite que escribir; si el tramo final fuera distinto de $0$, sería un $\\lim_{b\\to\\infty}$)."}, {"titulo": "Primitiva.", "md": "$$\\int e^{-st}\\operatorname{sen}t\\,dt=-\\frac{e^{-st}\\,(s\\operatorname{sen}t+\\cos t)}{s^2+1}$$ (se comprueba derivando; sale integrando por partes dos veces)."}, {"titulo": "Evaluar entre $0$ y $\\pi$.", "md": "$$F(s)=\\frac{e^{-\\pi s}(0+1)}{s^2+1}-\\Big(-\\frac{1\\cdot(0+1)}{s^2+1}\\Big)=\\frac{1+e^{-\\pi s}}{s^2+1}$$"}], "respuesta": "$$\\mathcal L\\{f\\}(s)=\\frac{1+e^{-\\pi s}}{s^2+1}$$"}, {"tipo": "ejemplo", "titulo": "Inversa con cuadrático (Guía 4 n°6)", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\dfrac{1}{s^3+5s}\\Big\\}$.", "pasos": [{"titulo": "Factorizar.", "md": "$s^3+5s=s\\,(s^2+5)$, y $s^2+5$ no tiene raíces reales."}, {"titulo": "Fracciones parciales.", "md": "$$\\frac1{s(s^2+5)}=\\frac As+\\frac{Bs+C}{s^2+5}\\ \\Rightarrow\\ 1=A(s^2+5)+(Bs+C)s$$ $s=0$: $A=\\frac15$. Coeficiente de $s^2$: $A+B=0\\Rightarrow B=-\\frac15$. Coeficiente de $s$: $C=0$."}, {"titulo": "Invertir.", "md": "$$\\frac15\\cdot\\frac1s-\\frac15\\cdot\\frac{s}{s^2+5}\\ \\longmapsto\\ \\frac15-\\frac15\\cos\\sqrt5\\,t$$"}], "respuesta": "$$f(t)=\\frac15-\\frac15\\cos\\big(\\sqrt5\\,t\\big)$$"}, {"tipo": "ejemplo", "titulo": "Integral impropia de Dirichlet (Guía 4 n°17)", "enunciado": "Pruebe que si $F(s)=\\mathcal L\\{f(t)\\}$ entonces $\\mathcal L\\big\\{\\frac{f(t)}{t}\\big\\}=\\int_s^\\infty F(u)\\,du$. Haciendo $s\\to0$, pruebe que $\\displaystyle\\int_0^\\infty\\frac{\\operatorname{sen}t}{t}\\,dt=\\frac\\pi2$.", "pasos": [{"titulo": "Intercambiar integrales.", "md": "$$\\int_s^\\infty F(u)\\,du=\\int_s^\\infty\\!\\!\\int_0^\\infty e^{-ut}f(t)\\,dt\\,du=\\int_0^\\infty f(t)\\Big(\\int_s^\\infty e^{-ut}du\\Big)dt=\\int_0^\\infty f(t)\\,\\frac{e^{-st}}{t}\\,dt=\\mathcal L\\Big\\{\\frac{f(t)}{t}\\Big\\}$$"}, {"titulo": "Aplicar a $f=\\operatorname{sen}t$.", "md": "$F(u)=\\frac{1}{u^2+1}$, entonces $\\mathcal L\\{\\frac{\\operatorname{sen}t}{t}\\}=\\int_s^\\infty\\frac{du}{u^2+1}=\\frac\\pi2-\\arctan s$."}, {"titulo": "Hacer $s\\to0$.", "md": "El lado izquierdo es $\\int_0^\\infty e^{-st}\\frac{\\operatorname{sen}t}{t}dt\\to\\int_0^\\infty\\frac{\\operatorname{sen}t}{t}dt$ y el derecho tiende a $\\frac\\pi2-0$."}], "respuesta": "$$\\int_0^\\infty\\frac{\\operatorname{sen}t}{t}\\,dt=\\frac\\pi2$$"}, {"tipo": "ojo", "items": ["Olvidar el dominio: $\\mathcal L\\{e^{at}\\}=\\frac{1}{s-a}$ solo para $s>a$.", "Escribir $\\mathcal L\\{t^n\\}=\\frac{1}{s^{n+1}}$ (falta $n!$), y al invertir $\\frac1{s^3}\\to t^2$ en vez de $\\frac{t^2}{2}$.", "Pensar que $\\mathcal L\\{fg\\}=\\mathcal L\\{f\\}\\,\\mathcal L\\{g\\}$. Con $\\operatorname{sen}^2$ y $\\cos^2$ usa las identidades de ángulo doble.", "Con un factor repetido $(s-a)^2$, poner una sola fracción: lleva **dos** ($\\frac{A}{s-a}+\\frac{B}{(s-a)^2}$).", "Por definición con una integral impropia, no escribir el límite (la pauta da 4 pts solo por eso).", "Aceptar una $F(s)$ que no tiende a $0$ (como $\\frac{s}{s+4}\\to1$): no es transformada de ninguna función continua por tramos y de orden exponencial (Guía 4 n°4)."]}]}, {"id": "t4", "titulo": "Teoremas de traslación", "peso": 2, "intro": "Los teoremas de traslación dicen qué le pasa a la transformada en dos situaciones muy comunes: cuando $f(t)$ se multiplica por una exponencial $e^{at}$ (primer teorema: se corre la variable $s$) y cuando $f$ se **retrasa** en el tiempo (segundo teorema: aparece el factor $e^{-as}$).", "bloques": [{"tipo": "definicion", "etiqueta": "Teorema", "nombre": "Primer teorema de traslación", "md": "Si $F(s)=\\mathcal L\\{f(t)\\}$ y $a$ es un número real, entonces $\\mathcal L\\{e^{at}f(t)\\}=F(s-a)$. En forma inversa: $\\mathcal L^{-1}\\{F(s-a)\\}=e^{at}f(t)$."}, {"tipo": "formula", "tex": "\\mathcal L\\{e^{at}f(t)\\}=F(s-a)\\qquad\\Longleftrightarrow\\qquad\\mathcal L^{-1}\\{F(s-a)\\}=e^{at}f(t)", "nota": "Multiplicar por $e^{at}$ **corre** la gráfica de $F$ hacia la derecha $a$ unidades. Con $e^{-2t}$ (o sea $a=-2$) el corrimiento es hacia la izquierda: aparece $s+2$."}, {"tipo": "lapiz", "texto": "e^{−2t} → (s + 2)  ·  e^{3t} → (s − 3)"}, {"tipo": "gadget", "id": "g_traslacion1", "titulo": "¿Hacia dónde se corre $F(s)$?", "instrucciones": "Mueve $a$ (con $e^{-at}$) y la frecuencia $b$. La curva morada es $\\mathcal L\\{e^{-at}\\operatorname{sen}bt\\}$ y la naranja es $\\mathcal L\\{\\operatorname{sen}bt\\}$: la exponencial solo corre la transformada."}, {"tipo": "texto", "titulo": "Inversas con cuadráticos: completar cuadrados", "md": "Si el denominador es $s^2+bs+c$ sin raíces reales, se completa el cuadrado: $s^2+bs+c=(s+a)^2+k^2$ con $a=\\frac b2$. Después se separa el numerador en $(s+a)$ **más un resto**, y se usan estas dos inversas (consecuencia directa del primer teorema):"}, {"tipo": "formula", "tex": "\\mathcal L^{-1}\\Big\\{\\frac{s+a}{(s+a)^2+k^2}\\Big\\}=e^{-at}\\cos kt\\qquad\\qquad\\mathcal L^{-1}\\Big\\{\\frac{k}{(s+a)^2+k^2}\\Big\\}=e^{-at}\\operatorname{sen}kt", "nota": "El resto del numerador se **divide por $k$** para que quede el $k$ que pide el seno."}, {"tipo": "gadget", "id": "g_cuadrados", "titulo": "Completa el cuadrado", "instrucciones": "Dado $F(s)=\\frac{\\alpha s+\\beta}{s^2+2as+q}$, encuentra $a$, $k$ y los coeficientes $A$ y $B$ de $f(t)=e^{-at}(A\\cos kt+B\\operatorname{sen}kt)$."}, {"tipo": "definicion", "etiqueta": "Teorema", "nombre": "Segundo teorema de traslación", "md": "Si $F(s)=\\mathcal L\\{f(t)\\}$ y $a>0$, entonces $\\mathcal L\\{f(t-a)\\,\\mathscr U(t-a)\\}=e^{-as}F(s)$. En forma inversa: $\\mathcal L^{-1}\\{e^{-as}F(s)\\}=f(t-a)\\,\\mathscr U(t-a)$. Aquí $\\mathscr U(t-a)$ es el escalón unitario (vale $0$ antes de $a$ y $1$ desde $a$; se estudia en §5)."}, {"tipo": "formula", "tex": "\\mathcal L\\{f(t-a)\\,\\mathscr U(t-a)\\}=e^{-as}F(s)\\qquad\\Longleftrightarrow\\qquad\\mathcal L^{-1}\\{e^{-as}F(s)\\}=f(t-a)\\,\\mathscr U(t-a)", "nota": "Retrasar la señal $a$ segundos **multiplica** su transformada por $e^{-as}$. Funciona solo si la función aparece **completa y trasladada**: $f(t-a)$ (no $f(t)$) multiplicada por $\\mathscr U(t-a)$."}, {"tipo": "tabla", "titulo": "¿Cuál teorema uso?", "columnas": ["Lo que ves", "Teorema", "Qué haces"], "filas": [["$e^{at}$ multiplicando a $f(t)$", "primero", "$s\\to s-a$ en $F(s)$"], ["$(s-a)$ o $(s-a)^2+k^2$ en el denominador", "primero (inversa)", "la inversa de $F(s)$ y un factor $e^{at}$ afuera"], ["$e^{-as}$ multiplicando a $F(s)$", "segundo (inversa)", "invertir $F$ y escribir $f(t-a)\\,\\mathscr U(t-a)$"], ["$g(t)\\,\\mathscr U(t-a)$", "segundo", "reescribir $g(t)=h(t-a)$ y usar $e^{-as}H(s)$"]]}, {"tipo": "ejemplo", "titulo": "$t$ por exponencial por seno (Guía 4 n°11)", "enunciado": "Calcule $\\mathcal L\\{t\\,e^{2t}\\operatorname{sen}6t\\}$.", "pasos": [{"titulo": "Transformada del seno.", "md": "$\\mathcal L\\{\\operatorname{sen}6t\\}=\\dfrac{6}{s^2+36}$."}, {"titulo": "Primer teorema ($e^{2t}$).", "md": "$s\\to s-2$: $\\;\\mathcal L\\{e^{2t}\\operatorname{sen}6t\\}=\\dfrac{6}{(s-2)^2+36}$."}, {"titulo": "Multiplicar por $t$.", "md": "$\\mathcal L\\{t\\,g(t)\\}=-G'(s)$: $$-\\frac{d}{ds}\\frac{6}{(s-2)^2+36}=\\frac{6\\cdot2(s-2)}{\\big((s-2)^2+36\\big)^2}$$"}], "respuesta": "$$\\mathcal L\\{t\\,e^{2t}\\operatorname{sen}6t\\}=\\frac{12s-24}{\\big((s-2)^2+36\\big)^2}$$"}, {"tipo": "ejemplo", "titulo": "Inversa con $(s+1)^2$ (Guía 4 n°8)", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\dfrac{s}{(s+1)^2}\\Big\\}$.", "pasos": [{"titulo": "Separar el numerador.", "md": "$s=(s+1)-1$, entonces $$\\frac{s}{(s+1)^2}=\\frac{1}{s+1}-\\frac{1}{(s+1)^2}$$"}, {"titulo": "Invertir cada término.", "md": "$\\mathcal L^{-1}\\{\\frac1{s+1}\\}=e^{-t}$. Para $\\frac1{(s+1)^2}$: es $\\frac{1}{s^2}$ corrido ($a=-1$), y $\\mathcal L^{-1}\\{\\frac1{s^2}\\}=t$, así que da $t\\,e^{-t}$."}], "respuesta": "$$f(t)=e^{-t}-t\\,e^{-t}$$"}, {"tipo": "ejemplo", "titulo": "Completar cuadrados", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\dfrac{s+3}{s^2+4s+13}\\Big\\}$.", "pasos": [{"titulo": "Completar el cuadrado.", "md": "$s^2+4s+13=(s+2)^2+9$, entonces $a=2$ y $k=3$."}, {"titulo": "Separar el numerador.", "md": "$s+3=(s+2)+1$. Luego $$\\frac{s+3}{(s+2)^2+9}=\\frac{s+2}{(s+2)^2+9}+\\frac13\\cdot\\frac{3}{(s+2)^2+9}$$ (el resto $1$ se divide por $k=3$)."}, {"titulo": "Invertir.", "md": "Coseno con $e^{-2t}$ y seno con $e^{-2t}$."}], "respuesta": "$$f(t)=e^{-2t}\\Big(\\cos3t+\\frac13\\operatorname{sen}3t\\Big)$$"}, {"tipo": "ojo", "items": ["Signo del corrimiento: $e^{-2t}$ da $s+2$, y $s-3$ viene de $e^{3t}$.", "Aplicar el segundo teorema a $f(t)$ sin trasladarla: $\\mathcal L\\{t\\,\\mathscr U(t-1)\\}\\neq\\frac{e^{-s}}{s^2}$. Primero reescribe $t=(t-1)+1$.", "Al invertir $e^{-as}F(s)$, olvidar el $\\mathscr U(t-a)$: sin él la función no \"se enciende\" en $t=a$.", "Completar cuadrados y no dividir el resto del numerador por $k$ (el seno necesita el $k$ arriba).", "Confundir el primer y el segundo teorema: uno corre $s$ (aparece $s-a$), el otro multiplica por $e^{-as}$."]}]}, {"id": "t5", "titulo": "Función escalón unitario (Heaviside)", "peso": 2, "intro": "Las funciones por tramos (las de la Guía 4 y de la Prueba 2) se escriben con escalones, y los escalones se transforman casi gratis con el segundo teorema de traslación. Dominar este tema es lo que convierte una función por tramos en una fórmula única que se puede transformar.", "bloques": [{"tipo": "definicion", "etiqueta": "Definición", "nombre": "Escalón unitario o de Heaviside", "md": "Para $a\\ge0$, $\\mathscr U(t-a)=\\begin{cases}0&t<a\\\\ 1&t\\ge a\\end{cases}$. Es un **interruptor** que se enciende en $t=a$. En la pauta de la Prueba 2 se escribe $H(t-a)$: es la misma función."}, {"tipo": "formula", "tex": "\\mathcal L\\{\\mathscr U(t-a)\\}=\\int_a^\\infty e^{-st}\\,dt=\\frac{e^{-as}}{s},\\qquad s>0", "nota": "El caso $a=0$ da $\\mathcal L\\{1\\}=\\frac1s$. Por eso un $\\mathscr U(t-a)$ **solo** se transforma en $\\frac{e^{-as}}{s}$."}, {"tipo": "texto", "titulo": "Armar una función por tramos", "md": "**Regla del salto:** parte con el primer tramo, y en cada punto donde la función cambia suma *\"lo que cambia\"* multiplicado por un escalón que se enciende ahí:\n$$f(t)=\\begin{cases}f_1(t)&0\\le t<a\\\\ f_2(t)&t\\ge a\\end{cases}\\ \\Longrightarrow\\ f(t)=f_1(t)+\\big[f_2(t)-f_1(t)\\big]\\,\\mathscr U(t-a)$$\nSi $f$ vale $g(t)$ solo entre $a$ y $b$ y $0$ fuera, se usa la **ventana** $\\mathscr U(t-a)-\\mathscr U(t-b)$, que vale $1$ en $[a,b[$: $f(t)=g(t)\\big[\\mathscr U(t-a)-\\mathscr U(t-b)\\big]$."}, {"tipo": "gadget", "id": "g_escalon_tramos", "titulo": "Arma la función con escalones y transfórmala", "instrucciones": "Elige una forma y mueve $a$, $b$, $k$. El gadget muestra la función por tramos, su expresión con $\\mathscr U$ y su transformada (comprobada contra una integral numérica en $s=1{,}5$). La carpa es la Guía 4 n°2c."}, {"tipo": "texto", "titulo": "Transformar: reescribe todo en términos de $(t-a)$", "md": "Para usar $\\mathcal L\\{f(t-a)\\mathscr U(t-a)\\}=e^{-as}F(s)$ la parte que acompaña al escalón debe depender de $t-a$. Si aparece $g(t)\\,\\mathscr U(t-a)$, escribe $g(t)=g\\big((t-a)+a\\big)$ y desarma:"}, {"tipo": "tabla", "columnas": ["Término", "Reescribe", "Transformada"], "filas": [["$\\mathscr U(t-a)$", "ya está", "$\\dfrac{e^{-as}}{s}$"], ["$t\\,\\mathscr U(t-a)$", "$\\big[(t-a)+a\\big]\\mathscr U(t-a)$", "$e^{-as}\\Big(\\dfrac1{s^2}+\\dfrac as\\Big)$"], ["$t^2\\,\\mathscr U(t-1)$", "$\\big[(t-1)^2+2(t-1)+1\\big]\\mathscr U(t-1)$", "$e^{-s}\\Big(\\dfrac{2}{s^3}+\\dfrac{2}{s^2}+\\dfrac1s\\Big)$"], ["$\\operatorname{sen}t\\,\\mathscr U(t-\\pi)$", "$-\\operatorname{sen}(t-\\pi)\\,\\mathscr U(t-\\pi)$", "$-\\dfrac{e^{-\\pi s}}{s^2+1}$"], ["$e^{t}\\,\\mathscr U(t-3)$", "$e^{3}\\,e^{t-3}\\,\\mathscr U(t-3)$", "$\\dfrac{e^{3}\\,e^{-3s}}{s-1}$"]]}, {"tipo": "gadget", "id": "g_escalon_trasladar", "titulo": "Trasladar la función completa vs. solo taparla", "instrucciones": "El segundo teorema trabaja con $g(t-a)\\mathscr U(t-a)$ (la función completa desplazada, curva morada). Si en cambio tienes $g(t)\\mathscr U(t-a)$ (se corta el comienzo, curva naranja) la transformada es distinta. Compara ambos valores."}, {"tipo": "ejemplo", "titulo": "La carpa (Guía 4 n°2c)", "enunciado": "Calcule la transformada de $h(t)=\\begin{cases}2t&0\\le t<1\\\\ -2t+4&1\\le t<2\\\\ 0&t\\ge2\\end{cases}$", "pasos": [{"titulo": "Escribir con escalones.", "md": "Primer tramo $2t$. En $t=1$ la pendiente pasa de $2$ a $-2$: se suma $-4(t-1)\\,\\mathscr U(t-1)$. En $t=2$ la función se apaga (pendiente de $-2$ a $0$): se suma $2(t-2)\\,\\mathscr U(t-2)$. $$h(t)=2t-4(t-1)\\mathscr U(t-1)+2(t-2)\\mathscr U(t-2)$$ Comprobación en $t\\ge2$: $2t-4t+4+2t-4=0$ ✓."}, {"titulo": "Cada término ya viene trasladado.", "md": "Con $\\mathcal L\\{t\\}=\\frac1{s^2}$ y el segundo teorema: $$H(s)=\\frac{2}{s^2}-\\frac{4e^{-s}}{s^2}+\\frac{2e^{-2s}}{s^2}$$"}, {"titulo": "Factorizar.", "md": "$2-4e^{-s}+2e^{-2s}=2\\big(1-e^{-s}\\big)^2$."}], "respuesta": "$$H(s)=\\frac{2\\,(1-e^{-s})^2}{s^2}$$ Chequeo: cuando $s\\to0$ vale $2$, que es el área de la carpa (base $2$, altura $2$)."}, {"tipo": "nota", "md": "La respuesta impresa de la Guía 4 n°2c ($-\\frac{4s}{3}+\\frac{(-2s-2)e^{-s}}{s^2}+\\frac{2}{s^2}$) no coincide con este cálculo: no tiene el factor $e^{-2s}$ y diverge para $s\\to0$. Si te toca este ejercicio, confía en el desarrollo y en el chequeo del área."}, {"tipo": "ejemplo", "titulo": "El mismo ejercicio de la Prueba 2 con escalones", "enunciado": "En la Prueba 2 (5 de junio) se pidió, por definición, la transformada de $f(t)=-1$ si $t\\in[0,1[$ y $f(t)=1$ si $t\\ge1$. Resuélvela con escalones.", "pasos": [{"titulo": "Escribir con escalones.", "md": "Parte en $-1$; en $t=1$ el valor cambia de $-1$ a $1$ (sube $2$): $$f(t)=-1+2\\,\\mathscr U(t-1)$$"}, {"titulo": "Transformar.", "md": "$$F(s)=-\\frac1s+2\\cdot\\frac{e^{-s}}{s}$$"}], "respuesta": "$$F(s)=\\frac{2e^{-s}-1}{s},\\quad s>0$$ Es el mismo resultado de la pauta, sin integral impropia. Pero si el enunciado dice **\"por definición\"**, hay que usar la integral con el límite."}, {"tipo": "ejemplo", "titulo": "Inversa con $e^{-as}$", "enunciado": "Calcule $\\mathcal L^{-1}\\Big\\{\\dfrac{e^{-2s}}{s(s+1)}\\Big\\}$.", "pasos": [{"titulo": "Aislar la $F(s)$ que acompaña a $e^{-2s}$.", "md": "$F(s)=\\dfrac{1}{s(s+1)}=\\dfrac1s-\\dfrac1{s+1}\\ \\Rightarrow\\ f(t)=1-e^{-t}$."}, {"titulo": "Segundo teorema ($a=2$).", "md": "$\\mathcal L^{-1}\\{e^{-2s}F(s)\\}=f(t-2)\\,\\mathscr U(t-2)$, es decir, se reemplaza $t$ por $t-2$ **en toda** la $f$."}], "respuesta": "$$\\Big(1-e^{-(t-2)}\\Big)\\,\\mathscr U(t-2)$$ Vale $0$ para $t<2$."}, {"tipo": "ojo", "items": ["Usar $\\mathscr U(t)$ en lugar de $\\mathscr U(t-a)$: el escalón debe encenderse en el punto del salto.", "\"$k$ en $[a,b[$\" es $k\\,\\mathscr U(t-a)-k\\,\\mathscr U(t-b)$ (se **resta** el que apaga), no una suma.", "Trasladar solo una parte: $t\\,\\mathscr U(t-1)\\neq(t-1)\\,\\mathscr U(t-1)$. Hay que reescribir $t=(t-1)+1$.", "Creer que $H$ y $\\mathscr U$ son cosas distintas: son el mismo escalón (cambia la notación según la pauta).", "Escribir el resultado de una inversa sin el escalón: antes de $t=a$ la función vale $0$."]}]}, {"id": "t6", "titulo": "Solución de EDO mediante transformada de Laplace", "peso": 3, "intro": "Aquí se junta todo: se transforma la EDO, se reemplazan las condiciones iniciales, se despeja $Y(s)$ y se invierte con fracciones parciales y los teoremas de traslación. Con condiciones iniciales y lados derechos por tramos (escalones) es el método más corto, y es lo que más puntaje reparte (P4 y P5 de la Prueba 2: 12 puntos cada una).", "bloques": [{"tipo": "formula", "tex": "\\mathcal L\\{y'\\}=sY(s)-y(0),\\qquad\\mathcal L\\{y''\\}=s^2Y(s)-s\\,y(0)-y'(0)", "nota": "En general $\\mathcal L\\{y^{(n)}\\}=s^nY-s^{n-1}y(0)-\\cdots-y^{(n-1)}(0)$. Las condiciones iniciales **entran solas** en la ecuación: por eso no hay que buscar constantes al final."}, {"tipo": "texto", "titulo": "Método en cinco pasos", "md": "1. **Escribe el lado derecho** con escalones si es por tramos.\n2. **Transforma** ambos lados con $\\mathcal L\\{y'\\}$, $\\mathcal L\\{y''\\}$ y la tabla.\n3. **Reemplaza** $y(0)$ e $y'(0)$ y **despeja** $Y(s)$: queda $Y(s)=\\dfrac{\\text{numerador}}{\\text{polinomio característico}}+\\dots$\n4. **Descompón** en fracciones parciales (o completa cuadrados).\n5. **Invierte** término a término; si hay $e^{-as}$, aplica el segundo teorema y escribe $\\mathscr U(t-a)$."}, {"tipo": "lapiz", "texto": "L{y''} = s²Y − s·y(0) − y'(0): los dos términos de condiciones"}, {"tipo": "gadget", "id": "g_pvi_numerador", "titulo": "El PVI homogéneo, paso a paso", "instrucciones": "Genera un PVI $y''+ay'+by=0$ con raíces enteras. Calcula el numerador que dejan las condiciones iniciales, luego $A$ y $B$ de las fracciones parciales. Es el 80 % del trabajo de cada pregunta de este tipo."}, {"tipo": "ejemplo", "titulo": "Lado derecho por tramos (Guía 4 n°9)", "enunciado": "Resuelva $y'+2y=f(t)$, $y(0)=0$, donde $f(t)=\\begin{cases}t&0\\le t<1\\\\ 0&t\\ge1\\end{cases}$", "pasos": [{"titulo": "Escribir $f$ con escalones.", "md": "$f(t)=t-t\\,\\mathscr U(t-1)=t-(t-1)\\mathscr U(t-1)-\\mathscr U(t-1)$."}, {"titulo": "Transformar y despejar.", "md": "$$(s+2)Y=\\frac1{s^2}-e^{-s}\\Big(\\frac1{s^2}+\\frac1s\\Big)\\ \\Rightarrow\\ Y=\\frac{1}{s^2(s+2)}-e^{-s}\\Big[\\frac{1}{s^2(s+2)}+\\frac{1}{s(s+2)}\\Big]$$"}, {"titulo": "Fracciones parciales.", "md": "$$\\frac1{s^2(s+2)}=-\\frac{1}{4s}+\\frac{1}{2s^2}+\\frac{1}{4(s+2)},\\qquad\\frac1{s(s+2)}=\\frac1{2s}-\\frac{1}{2(s+2)}$$"}, {"titulo": "Invertir.", "md": "$g(t)=\\mathcal L^{-1}\\{\\frac1{s^2(s+2)}\\}=-\\frac14+\\frac t2+\\frac14e^{-2t}$ y $h(t)=\\mathcal L^{-1}\\{\\frac1{s(s+2)}\\}=\\frac12-\\frac12e^{-2t}$. Con el segundo teorema: $y=g(t)-\\big[g(t-1)+h(t-1)\\big]\\mathscr U(t-1)$, donde $g(t-1)+h(t-1)=\\frac14+\\frac{t-1}{2}-\\frac14e^{-2(t-1)}$."}], "respuesta": "$$y(t)=-\\frac14+\\frac t2+\\frac14e^{-2t}-\\Big[\\frac14+\\frac{t-1}{2}-\\frac14e^{-2(t-1)}\\Big]\\mathscr U(t-1)$$", "lapiz": "el escalón multiplica TODA la parte trasladada"}, {"tipo": "ejemplo", "titulo": "Un pulso como fuerza (Guía 4 n°10)", "enunciado": "Resuelva $y''+y=f(t)$, $y(0)=0$, $y'(0)=1$, con $f(t)=\\begin{cases}0&0\\le t<\\pi\\\\ 1&\\pi\\le t<2\\pi\\\\ 0&t\\ge2\\pi\\end{cases}$", "pasos": [{"titulo": "Escalones.", "md": "$f(t)=\\mathscr U(t-\\pi)-\\mathscr U(t-2\\pi)$."}, {"titulo": "Transformar con condiciones iniciales.", "md": "$$s^2Y-0\\cdot s-1+Y=\\frac{e^{-\\pi s}-e^{-2\\pi s}}{s}\\ \\Rightarrow\\ Y=\\frac1{s^2+1}+\\big(e^{-\\pi s}-e^{-2\\pi s}\\big)\\frac{1}{s(s^2+1)}$$"}, {"titulo": "Fracciones parciales.", "md": "$$\\frac1{s(s^2+1)}=\\frac1s-\\frac{s}{s^2+1}\\ \\Rightarrow\\ \\mathcal L^{-1}=1-\\cos t$$"}, {"titulo": "Segundo teorema.", "md": "Con $a=\\pi$ y $a=2\\pi$: $(1-\\cos(t-\\pi))\\mathscr U(t-\\pi)$ y $(1-\\cos(t-2\\pi))\\mathscr U(t-2\\pi)$."}], "respuesta": "$$y(t)=\\operatorname{sen}t+\\big(1-\\cos(t-\\pi)\\big)\\mathscr U(t-\\pi)-\\big(1-\\cos(t-2\\pi)\\big)\\mathscr U(t-2\\pi)$$ Para $t\\ge2\\pi$: $\\cos(t-\\pi)=-\\cos t$ y $\\cos(t-2\\pi)=\\cos t$, así que $y=\\operatorname{sen}t+(1+\\cos t)-(1-\\cos t)=\\operatorname{sen}t+2\\cos t$."}, {"tipo": "gadget", "id": "g_respuesta_escalon", "titulo": "Respuesta de un sistema a un escalón", "instrucciones": "Mueve $\\omega$, $\\zeta$ y el instante $t_0$ del escalón en $y''+2\\zeta\\omega y'+\\omega^2y=A\\,\\mathscr U(t-t_0)$. Mira cómo el factor $e^{-t_0s}$ de $Y(s)$ solo \"enciende\" la respuesta en $t_0$, y cómo el valor final es $A/\\omega^2$."}, {"tipo": "texto", "titulo": "Coeficientes variables: $t\\,y$ y $t\\,y''$", "md": "Si la EDO tiene un coeficiente **lineal en $t$**, se usa $\\mathcal L\\{t\\,g(t)\\}=-G'(s)$. El resultado es una EDO de **primer orden en $Y(s)$** (se resuelve con factor integrante) y se invierte al final. Este caso aparece en la Guía 4 n°13. Con coeficientes polinomiales de mayor grado el método deja de ser cómodo."}, {"tipo": "ejemplo", "titulo": "$t\\,y''-y'=2t^2$ (Guía 4 n°13)", "enunciado": "Use la transformada de Laplace para reducir $t\\,y''-y'=2t^2$, $y(0)=0$, a una EDO lineal de primer orden en $Y(s)$ y resuélvala.", "pasos": [{"titulo": "Transformar cada término.", "md": "$\\mathcal L\\{t\\,y''\\}=-\\frac{d}{ds}\\big(s^2Y-s\\,y(0)-y'(0)\\big)=-\\big(2sY+s^2Y'\\big)$ (con $y(0)=0$; $y'(0)$ es constante y se va al derivar). $\\mathcal L\\{y'\\}=sY$. $\\mathcal L\\{2t^2\\}=\\frac{4}{s^3}$."}, {"titulo": "Juntar: EDO en $Y$.", "md": "$$-s^2Y'-2sY-sY=\\frac4{s^3}\\ \\Rightarrow\\ Y'+\\frac3sY=-\\frac{4}{s^5}$$"}, {"titulo": "Factor integrante $s^3$.", "md": "$(s^3Y)'=-\\dfrac4{s^2}\\ \\Rightarrow\\ s^3Y=\\dfrac4s+C\\ \\Rightarrow\\ Y=\\dfrac4{s^4}+\\dfrac{C}{s^3}$."}, {"titulo": "Invertir.", "md": "$\\mathcal L^{-1}\\{\\frac4{s^4}\\}=\\frac{4t^3}{3!}=\\frac23t^3$ y $\\mathcal L^{-1}\\{\\frac C{s^3}\\}=\\frac C2t^2$."}], "respuesta": "$$y(t)=\\frac23t^3+C_1t^2$$ Queda una constante libre: $y(0)=0$ no basta (en $t=0$ el coeficiente de $y''$ se anula y la EDO es singular)."}, {"tipo": "texto", "titulo": "Ecuaciones integrales y convolución", "md": "Cuando aparece $\\int_0^ty(\\tau)\\,k(t-\\tau)\\,d\\tau$ es una **convolución** $(y*k)(t)$, y su transformada es un producto: $\\mathcal L\\{y*k\\}=Y(s)\\,K(s)$. Si en cambio la integral es solo $\\int_0^ty(\\tau)\\,d\\tau$, su transformada es $\\frac{Y(s)}{s}$."}, {"tipo": "formula", "tex": "(f*g)(t)=\\int_0^tf(\\tau)\\,g(t-\\tau)\\,d\\tau,\\qquad\\mathcal L\\{f*g\\}=F(s)\\,G(s)", "nota": "El producto $F\\cdot G$ es la transformada de la **convolución**, no del producto $f\\cdot g$."}, {"tipo": "ejemplo", "titulo": "Integro-diferencial (Guía 4 n°16)", "enunciado": "Resuelva $y'(t)=1-\\operatorname{sen}t-\\displaystyle\\int_0^ty(\\tau)\\,d\\tau$, con $y(0)=0$.", "pasos": [{"titulo": "Transformar.", "md": "$$sY-0=\\frac1s-\\frac{1}{s^2+1}-\\frac{Y}{s}$$"}, {"titulo": "Despejar $Y$.", "md": "$$Y\\Big(s+\\frac1s\\Big)=\\frac1s-\\frac{1}{s^2+1}\\ \\Rightarrow\\ \\frac{s^2+1}{s}\\,Y=\\frac{s^2-s+1}{s(s^2+1)}\\ \\Rightarrow\\ Y=\\frac{s^2-s+1}{(s^2+1)^2}=\\frac1{s^2+1}-\\frac{s}{(s^2+1)^2}$$"}, {"titulo": "Invertir.", "md": "$\\mathcal L^{-1}\\{\\frac1{s^2+1}\\}=\\operatorname{sen}t$ y $\\mathcal L^{-1}\\{\\frac{s}{(s^2+1)^2}\\}=\\frac12t\\operatorname{sen}t$ (porque $\\mathcal L\\{t\\operatorname{sen}t\\}=\\frac{2s}{(s^2+1)^2}$)."}], "respuesta": "$$y(t)=\\operatorname{sen}t-\\frac12\\,t\\operatorname{sen}t$$"}, {"tipo": "ojo", "items": ["Olvidar $y(0)$ o $y'(0)$ al transformar $y'$ e $y''$, o equivocar el signo: $s^2Y-s\\,y(0)-y'(0)$.", "Despejar mal $Y(s)$: el polinomio $s^2+as+b$ multiplica a $Y$ y el resto pasa al otro lado.", "Con $e^{-as}$ en $Y(s)$, invertir como si fuera una constante: hay que aplicar el segundo teorema y escribir $\\mathscr U(t-a)$.", "Transformar el lado derecho por tramos sin escribirlo antes con escalones.", "Confundir convolución con producto: $\\mathcal L\\{y*k\\}=Y\\,K$, y $\\int_0^ty\\,d\\tau$ lleva $\\frac Ys$.", "Fracciones parciales con factor repetido (como $s^2$ en $s^2(s+2)$): hay que poner $\\frac{A}{s}+\\frac{B}{s^2}$."]}]}], "quiz": [{"tema": "t1", "dif": 1, "q": "En la serie de Fourier de $f$ en $]-p,p[$, el término constante es $\\frac{a_0}{2}$. ¿Cómo se calcula $a_0$?", "op": ["$a_0=\\dfrac1p\\displaystyle\\int_{-p}^{p}f(x)\\,dx$", "$a_0=\\dfrac2p\\displaystyle\\int_{-p}^{p}f(x)\\,dx$", "$a_0=\\dfrac{1}{2p}\\displaystyle\\int_{-p}^{p}f(x)\\,dx$", "$a_0=\\displaystyle\\int_{-p}^{p}f(x)\\,dx$"], "ok": 0, "exp": "Con $\\frac1p$ en la integral, $\\frac{a_0}{2}=\\frac1{2p}\\int_{-p}^{p}f$ es el promedio de $f$. El error tentador es usar $\\frac2p$ (eso corresponde a la integral en $[0,p]$ de una función par) o $\\frac{1}{2p}$ y luego dividir otra vez por 2."}, {"tema": "t1", "dif": 1, "q": "$f(x)=x^3-x$ en $]-\\pi,\\pi[$. ¿Qué coeficientes de su serie de Fourier son cero?", "op": ["$a_0$ y todos los $a_n$", "todos los $b_n$", "ninguno", "solo $a_0$"], "ok": 0, "exp": "$x^3-x$ es **impar**: la integral de $f(x)\\cos nx$ (impar) en un intervalo simétrico es $0$, así que $a_0=a_n=0$ y la serie es solo de senos. Los $b_n$ no se anulan (son los que quedan)."}, {"tema": "t1", "dif": 1, "q": "$f(x)=x\\,\\operatorname{sen}x$ en $]-p,p[$. Su serie de Fourier tiene…", "op": ["solo constante y cosenos", "solo senos", "senos y cosenos, hay que calcular los tres coeficientes", "solo constante"], "ok": 0, "exp": "$x$ es impar y $\\operatorname{sen}x$ es impar, luego el producto es **par**: $b_n=0$ y solo hay $\\frac{a_0}{2}$ y cosenos. Tienta decir \"tiene seno\" porque la fórmula de $f$ contiene $\\operatorname{sen}$, pero lo que importa es la paridad de $f$."}, {"tema": "t1", "dif": 1, "q": "Si $n$ es un entero, ¿cuánto valen $\\cos n\\pi$ y $\\operatorname{sen}n\\pi$?", "op": ["$(-1)^n$ y $0$", "$1$ y $0$", "$(-1)^n$ y $(-1)^n$", "$0$ y $(-1)^n$"], "ok": 0, "exp": "$\\cos n\\pi$ alterna $-1,1,-1,\\dots$, o sea $(-1)^n$, y $\\operatorname{sen}n\\pi=0$ siempre. Es la simplificación que convierte el resultado en una fórmula en $n$."}, {"tema": "t1", "dif": 2, "tipo": "num", "q": "Serie de Fourier de $f(x)=x$ en $]-\\pi,\\pi[$, que es $\\sum b_n\\operatorname{sen}nx$ con $b_n=\\frac{2(-1)^{n+1}}{n}$. ¿Cuánto vale $b_3$? (3 decimales, con coma)", "ok": 0.6667, "tol": 0.01, "exp": "$b_3=\\frac{2(-1)^{4}}{3}=\\frac23\\approx0{,}667$. Si dio $-\\frac23$ se equivocó el signo: $(-1)^{n+1}$ es positivo para $n$ impar."}, {"tema": "t1", "dif": 2, "tipo": "num", "q": "Para $f(x)=\\begin{cases}0&-\\pi<x<0\\\\ \\pi-x&0\\le x<\\pi\\end{cases}$ se obtiene $a_n=\\frac{1-(-1)^n}{\\pi n^2}$. ¿Cuánto vale $a_3$? (con coma)", "ok": 0.0707, "tol": 0.002, "exp": "$a_3=\\frac{1-(-1)^3}{9\\pi}=\\frac{2}{9\\pi}\\approx0{,}0707$. Para $n$ par ($a_2$, $a_4$…) el numerador $1-(-1)^n$ se anula."}, {"tema": "t1", "dif": 2, "tipo": "num", "q": "Serie de Fourier de $f(x)=|x|$ en $]-\\pi,\\pi[$. ¿Cuánto vale $a_0$? (con coma)", "ok": 3.1416, "tol": 0.01, "exp": "$|x|$ es par: $a_0=\\frac2\\pi\\int_0^\\pi x\\,dx=\\frac2\\pi\\cdot\\frac{\\pi^2}{2}=\\pi$. Ojo: la constante de la serie es $\\frac{a_0}{2}=\\frac\\pi2$, el promedio de $|x|$."}, {"tema": "t1", "dif": 2, "q": "$f$ está definida solo en $]0,L[$ y se extiende de forma **impar** a $]-L,0[$. La serie resultante es…", "op": ["de senos, con $b_n=\\dfrac2L\\displaystyle\\int_0^Lf(x)\\operatorname{sen}\\frac{n\\pi x}{L}\\,dx$", "de cosenos, con $a_n=\\dfrac2L\\displaystyle\\int_0^Lf(x)\\cos\\frac{n\\pi x}{L}\\,dx$", "completa, con $a_n\\neq0$ y $b_n\\neq0$ en general", "de senos, con $b_n=\\dfrac1L\\displaystyle\\int_0^Lf(x)\\operatorname{sen}\\frac{n\\pi x}{L}\\,dx$"], "ok": 0, "exp": "La extensión impar anula $a_0$ y los $a_n$; la integral de $f\\operatorname{sen}$ se duplica sobre $[0,L]$, de ahí el $\\frac2L$. El $\\frac1L$ de la cuarta opción olvida ese duplicado."}, {"tema": "t1", "dif": 3, "tipo": "num", "q": "Serie de cosenos de $f(x)=x^2$ en $]0,\\pi[$: $\\frac{\\pi^2}{3}+\\sum\\frac{4(-1)^n}{n^2}\\cos nx$. ¿Cuánto vale el coeficiente $a_2$? (con coma)", "ok": 1, "tol": 0.01, "exp": "$a_2=\\frac{4(-1)^2}{2^2}=1$. Los coeficientes de índice par son positivos y los impares negativos ($a_1=-4$)."}, {"tema": "t1", "dif": 3, "q": "Se desarrolla $f(x)=x^2$ en $]0,\\pi[$ con la extensión $f(x+\\pi)$ en $]-\\pi,0[$ (la función queda de período $\\pi$). Al calcular la serie de Fourier con $p=\\pi$, ¿qué armónicos aparecen?", "op": ["solo los de índice par ($\\cos2kx$, $\\operatorname{sen}2kx$)", "solo los de índice impar", "todos, sin restricción", "solo senos"], "ok": 0, "exp": "Una función de período $\\pi$ solo se puede armar con ondas de período $\\pi$, $\\frac\\pi2$,…: $\\cos2kx$ y $\\operatorname{sen}2kx$. Los coeficientes de índice impar salen $0$ al integrar en $]-\\pi,\\pi[$."}, {"tema": "t1", "dif": 3, "q": "En $\\frac1{16}x''+4x=\\sum b_n\\operatorname{sen}n\\pi t$ se propone $x_p=\\sum B_n\\operatorname{sen}n\\pi t$. ¿Cuánto es $B_n$ en términos de $b_n$?", "op": ["$B_n=\\dfrac{b_n}{4-\\frac{n^2\\pi^2}{16}}$", "$B_n=\\dfrac{b_n}{4+\\frac{n^2\\pi^2}{16}}$", "$B_n=b_n\\Big(4-\\dfrac{n^2\\pi^2}{16}\\Big)$", "$B_n=\\dfrac{b_n}{4-n\\pi}$"], "ok": 0, "exp": "$x_p''=-\\sum n^2\\pi^2B_n\\operatorname{sen}n\\pi t$. Al reemplazar: $\\big(-\\frac{n^2\\pi^2}{16}+4\\big)B_n=b_n$. La segunda opción cambia el signo de $x''$ y la tercera multiplica en vez de dividir."}, {"tema": "t1", "dif": 3, "q": "En el sistema $\\frac1{16}x''+4x=f(t)$ con $f$ de período $2$, ¿hay resonancia con algún armónico $\\operatorname{sen}n\\pi t$?", "op": ["No: $\\omega_0=\\sqrt{k/m}=8$ no es un múltiplo entero de $\\pi$", "Sí, con $n=8$", "Sí, con $n=2$ l extremo: $f(2^-)=2$ y $f(-2^+)=2$. Como son iguales, no hay salto en el empalme y converge a $2$. Si hubiera promediado $f(2)$ con $0$ habría obtenido $1$."}, {"tema": "t2", "dif": 2, "q": "Al aumentar $N$, cerca de un salto las sumas parciales $S_N$ de una serie de Fourier…", "op": ["se pasan del valor de $f$ en cerca de un $9\\,\\%$ del salto, y ese sobrepaso no desaparece (Gibbs)", "convergen uniformemente a $f$", "se alejan de $f$ y la serie diverge", "coinciden exactamente con $f$ en el salto"], "ok": 0, "exp": "Es el fenómeno de Gibbs: el sobrepaso se angosta pero su altura no baja. No contradice el teorema (que habla de convergencia en cada punto, no uniforme) ni cambia el valor al que converge la serie."}, {"tema": "t3", "dif": 1, "tipo": "num", "q": "Calcula $\\mathcal L\\{t^3\\}$ evaluada en $s=2$. (con coma)", "ok": 0.375, "tol": 0.005, "exp": "$\\mathcal L\\{t^3\\}=\\frac{3!}{s^4}=\\frac{6}{16}=0{,}375$. Sin el $n!$ habría salido $\\frac1{16}$."}, {"tema": "t3", "dif": 1, "q": "$\\mathcal L\\{\\cos3t\\}=$", "op": ["$\\dfrac{s}{s^2+9}$", "$\\dfrac{3}{s^2+9}$", "$\\dfrac{s}{s^2+3}$", "$\\dfrac{s}{s^2-9}$"], "ok": 0, "exp": "$\\mathcal L\\{\\cos at\\}=\\frac{s}{s^2+a^2}$ con $a=3$. $\\frac{3}{s^2+9}$ es la del seno; $\\frac{s}{s^2-9}$ es la de $\\cosh3t$."}, {"tema": "t3", "dif": 1, "q": "La integral que define $\\mathcal L\\{e^{2t}\\}$ converge cuando…", "op": ["$s>2$", "$s>0$", "$s<2$", "para todo $s$"], "ok": 0, "exp": "El integrando es $e^{-(s-2)t}$: decae solo si $s-2>0$. Entonces $\\mathcal L\\{e^{2t}\\}=\\frac1{s-2}$ para $s>2$."}, {"tema": "t3", "dif": 2, "q": "$\\mathcal L^{-1}\\Big\\{\\dfrac{1}{s^3}\\Big\\}=$", "op": ["$\\dfrac{t^2}{2}$", "$t^2$", "$\\dfrac{t^3}{3}$", "$2t^2$"], "ok": 0, "exp": "$\\mathcal L\\{t^2\\}=\\frac{2}{s^3}$, entonces $\\frac{1}{s^3}$ es la transformada de $\\frac{t^2}{2}$ (se divide por $n!=2$)."}, {"tema": "t3", "dif": 2, "tipo": "num", "q": "$F(s)=\\dfrac{s+1}{s^2+3s}=\\dfrac As+\\dfrac B{s+3}$ (Prueba 2, 5 de junio). ¿Cuánto vale $B$? (con coma)", "ok": 0.6667, "tol": 0.01, "exp": "$B$ se obtiene tapando $(s+3)$ y evaluando en $s=-3$: $\\frac{-3+1}{-3}=\\frac23$. Y $A=\\frac13$, entonces $f(t)=\\frac13+\\frac23e^{-3t}$."}, {"tema": "t3", "dif": 2, "q": "$\\mathcal L\\{\\operatorname{sen}^2t\\}=$", "op": ["$\\dfrac{2}{s(s^2+4)}$", "$\\dfrac{1}{(s^2+1)^2}$", "$\\dfrac{1}{s^2+1}$", "$\\dfrac{2}{s^2+4}$"], "ok": 0, "exp": "$\\operatorname{sen}^2t=\\frac{1-\\cos2t}{2}$, luego $\\frac12\\big(\\frac1s-\\frac{s}{s^2+4}\\big)=\\frac{2}{s(s^2+4)}$. $\\frac{1}{(s^2+1)^2}$ es el error de elevar la transformada al cuadrado."}, {"tema": "t3", "dif": 2, "q": "¿Existe una $f$ continua por tramos y de orden exponencial con $\\mathcal L\\{f\\}=\\dfrac{s}{s+4}$?", "op": ["No: $F(s)\\to1\\neq0$ cuando $s\\to\\infty$", "Sí: $f(t)=e^{-4t}$", "Sí: $f(t)=\\cos4t$", "No: porque el denominador tiene una raíz negativa"], "ok": 0, "exp": "Si $f$ es de orden exponencial, $F(s)\\to0$ cuando $s\\to\\infty$. Aquí $\\frac{s}{s+4}\\to1$. Tienta $e^{-4t}$ porque tiene el $s+4$, pero $\\mathcal L\\{e^{-4t}\\}=\\frac{1}{s+4}$."}, {"tema": "t3", "dif": 2, "tipo": "num", "q": "Calcula $\\mathcal L\\{t\\operatorname{sen}t\\}$ en $s=1$. (con coma)", "ok": 0.5, "tol": 0.005, "exp": "$\\mathcal L\\{t\\operatorname{sen}t\\}=-\\frac{d}{ds}\\frac{1}{s^2+1}=\\frac{2s}{(s^2+1)^2}$; en $s=1$: $\\frac{2}{4}=0{,}5$."}, {"tema": "t3", "dif": 3, "q": "La descomposición correcta de $F(s)=\\dfrac{3s+2}{(s-1)^2}$ es…", "op": ["$\\dfrac{3}{s-1}+\\dfrac{5}{(s-1)^2}$", "$\\dfrac{A}{s-1}$ con una sola fracción", "$\\dfrac{3}{s-1}+\\dfrac{2}{(s-1)^2}$", "$\\dfrac{5}{s-1}+\\dfrac{3}{(s-1)^2}$"], "ok": 0, "exp": "$3s+2=A(s-1)+B$: coeficiente de $s$, $A=3$; en $s=1$, $B=5$. Con factor repetido hay dos fracciones. La tercera opción olvida que el numerador original es $3(s-1)+5$."}, {"tema": "t3", "dif": 3, "tipo": "num", "q": "Por definición: $f(t)=2$ para $0\\le t<3$ y $f(t)=0$ para $t\\ge3$. Evalúa $F(s)$ en $s=1$. (con coma)", "ok": 1.900 n°9", "tema": "t1", "enunciado": "Encuentre el desarrollo en serie de Fourier de $f(x)=|x|$, $-\\pi<x<\\pi$.", "estrategia": "$|x|$ es **par**: solo $a_0$ y cosenos, con integrales en $[0,\\pi]$ duplicadas. Es la pregunta \"de entrada\" de paridad.", "pasos": [{"titulo": "Paridad.", "md": "$f$ par y $p=\\pi$: $b_n=0$, $a_0=\\frac2\\pi\\int_0^\\pi x\\,dx=\\pi$."}, {"titulo": "Coeficiente $a_n$ (por partes).", "md": "$$a_n=\\frac2\\pi\\int_0^\\pi x\\cos nx\\,dx=\\frac2\\pi\\Big[\\frac{x\\operatorname{sen}nx}{n}+\\frac{\\cos nx}{n^2}\\Big]_0^\\pi=\\frac2\\pi\\cdot\\frac{(-1)^n-1}{n^2}$$"}, {"titulo": "Escribir la serie.", "md": "Como $(-1)^n-1=-2$ para $n$ impar y $0$ para $n$ par, solo sobreviven los impares."}], "respuesta": "$$|x|\\sim\\frac\\pi2+\\frac2\\pi\\sum_{n=1}^\\infty\\frac{(-1)^n-1}{n^2}\\cos nx=\\frac\\pi2-\\frac4\\pi\\sum_{k=1}^\\infty\\frac{\\cos(2k-1)x}{(2k-1)^2}$$ Bonus: en $x=0$ ($f$ continua), $0=\\frac\\pi2-\\frac4\\pi\\sum\\frac1{(2k-1)^2}$, de donde $\\sum_{k\\ge1}\\frac1{(2k-1)^2}=\\frac{\\pi^2}{8}$.", "tiempo": "8 min", "puntaje_max": ["Reconocer que es par y que $b_n=0$", "$a_0=\\pi$ y $\\frac{a_0}{2}=\\frac\\pi2$ en la serie", "Integración por partes de $x\\cos nx$ bien hecha", "Evaluar con $\\cos n\\pi=(-1)^n$ y $\\operatorname{sen}n\\pi=0$"], "errores": ["escribir $a_0$ en lugar de $\\frac{a_0}{2}$ en la serie", "la respuesta impresa en la guía trae $\\cos(n\\pi)$: debe ser $\\cos(nx)$"]}, {"confianza": "propuesta", "puntaje": "—", "fuente": "Guía 5", "pregunta": "n°10", "tema": "t1", "enunciado": "Encuentre la serie de cosenos o senos de $f(x)=\\begin{cases}1&0<x<\\frac12\\\\ 0&\\frac12\\le x<1\\end{cases}$ (el enunciado de la guía trae un \"$-0<x<\\frac12$\", que es $0<x<\\frac12$).", "estrategia": "Hay que dar **ambas** (coseno y seno): $L=1$ y los coeficientes son $\\frac2L\\int_0^{1/2}$, porque $f=0$ en el resto. Se simplifica con $\\operatorname{sen}\\frac{n\\pi}{2}$ y $\\cos\\frac{n\\pi}{2}$.", "pasos": [{"titulo": "Cosenos.", "md":
